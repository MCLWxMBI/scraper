name: Anthropic OIDC token exchange

on:
  workflow_dispatch:
    inputs:
      audience:
        description: OIDC audience expected by the federation rule (blank uses GitHub's default)
        required: false
        type: string

permissions:
  id-token: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint GitHub OIDC token and exchange with Anthropic
        shell: bash
        env:
          OIDC_AUDIENCE: ${{ inputs.audience }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          for name in ANTHROPIC_ORGANIZATION_ID ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Missing required configuration: $name" >&2
              exit 1
            fi
          done

          oidc_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [[ -n "$OIDC_AUDIENCE" ]]; then
            audience=$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')
            oidc_url="${oidc_url}&audience=${audience}"
          fi

          JWT=$(curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$JWT"

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(jq -n \
            --arg assertion "$JWT" \
            --arg federation_rule_id "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg organization_id "$ANTHROPIC_ORGANIZATION_ID" \
            --arg service_account_id "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg workspace_id "$ANTHROPIC_WORKSPACE_ID" \
            '{
              grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $assertion,
              federation_rule_id: $federation_rule_id,
              organization_id: $organization_id,
              service_account_id: $service_account_id,
              workspace_id: $workspace_id
            }' | curl --silent --show-error --max-time 60 \
              https://api.anthropic.com/v1/oauth/token \
              -H 'content-type: application/json' \
              --data-binary @- \
              --output "$response_file" \
              --write-out '%{http_code}')

          # Redact token fields, including any nested fields, before logging.
          jq 'walk(if type == "object" then
            with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)
            else . end)' "$response_file"

          if [[ "$status" != 2?? ]]; then
            echo "::error::Anthropic token exchange failed (HTTP $status)."
            exit 1
          fi
          jq -e '.access_token | type == "string" and length > 0' "$response_file" > /dev/null
