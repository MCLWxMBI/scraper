;created_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2028,&quot;tag_id&quot;:52,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94274,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2028,&quot;uuid&quot;:&quot;5c9848ed-8fc6-4456-9eb2-4ac56e0cc24e&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Land&quot;,&quot;file_name&quot;:&quot;land_a4b8.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:519232,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59973},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92009,&quot;created_at&quot;:&quot;2026-08-28T05:14:34.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-28T05:14:35.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94274\/land_a4b8.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1969,&quot;vid&quot;:361067,&quot;title&quot;:&quot;Draft Marnoo, St Arnaud, and Stawell Planning Scheme Amendment C72ngra&quot;,&quot;slug&quot;:&quot;marnoo-starnaud-stawell-flood-studies&quot;,&quot;summary&quot;:&quot;We&#039;re seeking feedback about proposed updates to flood mapping and planning controls for Marnoo, St Arnaud and Stawell.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The purpose of this consultation is to seek views on the draft Planning Scheme Amendment C72ngra, which proposes to implement new flood related planning controls into the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/Northern%20Grampians\/ordinance?f.Scheme%7CplanningSchemeName=\&quot; target=\&quot;_blank\&quot;&gt;Northern Grampians Planning Scheme&lt;\/a&gt; to identify flood risk in St Arnaud, Stawell and Marnoo based on the findings of the St. Arnaud Flood Investigation (Water Technology, 2022), Marnoo Flood Study (Water Technology 2023) and Stawell Flood Study (Water Technology 2024).&lt;\/p&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, approve and adopt draft Planning Scheme Amendment C72ngra to the Northern Grampians Planning Scheme under section 20(4) of the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/planning-and-environment-act-1987\/166\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Planning and Environment Act&lt;\/em&gt; 1987&lt;\/a&gt;. The draft amendment applies to land within the townships of St. Arnaud, Stawell and Marnoo.&lt;\/p&gt;&lt;p&gt;This consultation is being undertaken under section 20(5) of the &lt;em&gt;Planning and Environment Act &lt;\/em&gt;1987.&lt;\/p&gt;&lt;p&gt;You are invited to provide feedback on the draft flood maps and proposed planning controls. We are particularly interested in local knowledge, flood history and information that may help improve the accuracy of the mapping or planning controls.&lt;\/p&gt;&lt;p&gt;The consultation cannot change the underlying flood risk. Flood mapping and planning controls must be based on the best available technical flood modelling and evidence.&lt;\/p&gt;&lt;p&gt;Feedback about funding decisions and emergency response arrangements are not part of this consultation.&lt;\/p&gt;&lt;p&gt;You can find more information on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/our-programs\/floodplain-management\&quot; target=\&quot;_blank\&quot;&gt;DEECA Floodplain Management &lt;\/a&gt;webpage.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.nccma.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;North Central&lt;\/a&gt; and &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/wcma.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Wimmera&lt;\/a&gt; Catchment Management Authorities (CMAs) are consulting with owners and occupiers of flood prone land affected by draft Planning Scheme Amendment C72ngra.&amp;nbsp; The Minister for Planning has consented to the consultation process.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;After the consultation is completed, the CMAs will request the Minister to intervene under s20(4) of the &lt;em&gt;Planning and Environment Act &lt;\/em&gt;1987 to prepare, approve and adopt Draft Planning Scheme Amendment C72ngra to the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/Northern%20Grampians\/ordinance?f.Scheme%7CplanningSchemeName=\&quot; target=\&quot;_blank\&quot;&gt;Northern Grampians Planning Scheme&lt;\/a&gt;.&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;The draft amendment implements flood controls, specifically the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/Victoria%20Planning%20Provisions\/ordinance\/44.04\&quot; target=\&quot;_blank\&quot;&gt;Land Subject to Inundation Overlay (LSIO)&lt;\/a&gt;, the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/Victoria%20Planning%20Provisions\/ordinance\/44.03\&quot; target=\&quot;_blank\&quot;&gt;Floodway Overlay (FO)&lt;\/a&gt; and the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/Victoria%20Planning%20Provisions\/ordinance\/44.05\&quot; target=\&quot;_blank\&quot;&gt;Special Building Overlay (SBO)&lt;\/a&gt; on low-lying land that is liable to flooding from riverine flooding and stormwater.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTAzVDAyOjE0OjE0LjM5OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Use the maps to zoom in and find where your address or site is located in relation to the flood planning overlay map boundaries.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Flood Planning Overlay Maps&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOC0wNVQwNDoyMjozNi4wNTNa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;4&quot;, ;title&quot;:&quot;Planning maps&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0wMlQwNjo1MDoyNy42ODFa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:8,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDNUMDI6MTQ6MDYuNTUyWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Marnoo Flood Study&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48273&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDNUMDI6MTM6NTkuNTQwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:10,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;St Arnaud Flood Study&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48274&quot;,&quot;48271&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDNUMDI6MTM6NDkuOTY1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:11,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Stawell Flood Study&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48275&quot;,&quot;48272&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;accordion&quot;,&quot;title&quot;:&quot;Flood Studies&quot;}}],&quot;settings&quot;:{&quot;type&quot;:&quot;accordion&quot;,&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTIwVDA3OjQ4OjE3LjM4NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Victorian Government is seeking community feedback on this draft planning scheme amendment.&lt;\/p&gt;&lt;p&gt;This consultation will include drop-in sessions, direct letters to owners and occupiers, online information, media releases, posters in affected townships and onsite visits to help resolve relevant submissions.&lt;\/p&gt;&lt;p&gt;Following consultation, CMAs will review community feedback and provide recommendations on the draft planning scheme amendment for consideration by the Department of Transport and Planning and the Minister for Planning.&lt;\/p&gt;&lt;p&gt;Before making a decision, the Minister for Planning must be satisfied that the views of affected landowners, occupiers and relevant agencies have been considered in accordance with section 20(4) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--bordered\&quot;&gt;&lt;h5&gt;More Information&amp;nbsp;&lt;\/h5&gt;&lt;p&gt;If you would like to discuss this consultation further, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:floodamendment@nccma.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;floodamendment@nccma.vic.gov.au&lt;\/a&gt; (using the reference Amendment C72ngra) or call +61 3 5440 1801.&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Consultation&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTIwVDIzOjUzOjM0Ljg2N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;\/h3&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;You can &lt;strong&gt;make a submission&lt;\/strong&gt; and\/or &lt;strong&gt;attend a drop in session&lt;\/strong&gt; (details below).&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/marnoo-starnaud-stawell-flood-studies\/survey\/6727\&quot; target=\&quot;_blank\&quot;&gt;Upload a submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Submissions will close at 11:59pm on Tuesday 6 October 2026&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;ZXZlbnRzOjIwMjYtMDgtMjBUMjM6NTM6NDUuNDUzWg==&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Drop in sessions&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;1036&quot;,&quot;1035&quot;,&quot;1034&quot;,&quot;1037&quot;],&quot;limit&quot;:2}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTI1VDAzOjE2OjMxLjIwM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;If you provide a submission to this application that includes your correct contact details, you will be informed once a decision has been made.&lt;\/p&gt;&lt;p&gt;A copy of the decision will be made available at &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/planning-schemes.app.planning.vic.gov.au\/All%20schemes\/amendments\&quot; target=\&quot;_blank\&quot;&gt;planning.vic.gov.au\/amendments&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;All feedback received during the consultation will be treated as a submission to the planning consultation process and will be reviewed and considered by the project team, alongside technical assessments. Where appropriate, the flood study outputs and mapping will be refined to reflect local knowledge and improve accuracy.&lt;\/p&gt;&lt;p&gt;A summary of consultation findings, including key themes and responses, will be prepared and made available to the community.&lt;\/p&gt;&lt;p&gt;Finalised consultation and feedback will then inform future floodplain management and planning processes.&lt;\/p&gt;&lt;p&gt;A consultation summary will be published on this page late 2026.&lt;\/p&gt;&lt;p&gt;To receive email updates, click on &lt;strong&gt;+ Follow&lt;\/strong&gt; at the top of this page.&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--secondary\&quot;&gt;&lt;p&gt;Victoria has a history of floods, and we know many Victorians have been affected, both directly and indirectly.&lt;\/p&gt;&lt;p&gt;We understand that disasters have a devastating impact on many lives. You don\u2019t have to go through it alone.&lt;\/p&gt;&lt;p&gt;For support, please visit the Victorian Government\u2019s &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vic.gov.au\/recovery-services-wellbeing-and-support\&quot; target=\&quot;_blank\&quot;&gt;recovery services, wellbeing and support page&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTA1VDA0OjIyOjQ2LjY0OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;calloutbox calloutbox--bordered\&quot;&gt;&lt;h3&gt;Accessibility&lt;\/h3&gt;&lt;p&gt;The Victorian Government is committed to providing a website that is accessible to the widest possible audience, regardless of technology or ability. &lt;\/p&gt;&lt;p&gt;If you are unable to access any of the content on this page, you can:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;email &lt;a class=\&quot;engage-link\&quot; title=\&quot;customer.service@deeca.vic.gov.au\&quot; href=\&quot;mailto:customer.service@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;customer.service@deeca.vic.gov.au&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:136186\&quot; target=\&quot;_blank\&quot;&gt;136 186&lt;\/a&gt; for alternative accessible formats&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.accesshub.gov.au\/about-the-nrs\&quot; target=\&quot;_blank\&quot;&gt;National Relay Service&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:133677\&quot; target=\&quot;_blank\&quot;&gt;133 677&lt;\/a&gt; if you are deaf or have a hearing or speech impairment&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131450\&quot; target=\&quot;_blank\&quot;&gt;131 450&lt;\/a&gt; if you need help with translating and interpreting&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;a href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot; class=\&quot;image-link\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/68658\/cs-1436-deecas-community-charter-engage-vic-banner-v1_a420.png\&quot; alt=\&quot;DEECA Community charter. Our promise: be available, involve and listen, take action. \&quot; data-href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot;&gt;&lt;\/a&gt;&lt;p&gt;&lt;\/p&gt;&lt;a href=\&quot;https:\/\/www.deeca.vic.gov.au\/aboriginalselfdetermination\/self-determination-reform-strategy\&quot; class=\&quot;image-link\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/73758\/acknowledgement-of-country-engage-vic-v1-868-x-132_eb13.png\&quot; alt=\&quot;Purple banner with Aboriginal artwork to right hand side. Text on banner is an Acknowledgement of Country that reads &amp;quot;We acknowledge Victorian Traditional Owners and their Elders past and present as the original custodians of Victoria&#039;s land and waters and commit to genuinely partnering with them and Victoria&#039;s Aboriginal community to progress their aspirations\&quot; data-href=\&quot;https:\/\/www.deeca.vic.gov.au\/aboriginalselfdetermination\/self-determination-reform-strategy\&quot;&gt;&lt;\/a&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-10-06T23:59:00&quot;,&quot;region_id&quot;:10,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type& _at&quot;:null,&quot;project_id&quot;:1969,&quot;created_by_id&quot;:1130,&quot;modified_by_id&quot;:1130,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/marnoo-starnaud-stawell-flood-studies\/timeline\/37287&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1969,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:49,&quot;title&quot;:&quot;Water&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1969,&quot;tag_id&quot;:49,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:4,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-energy-environment-and-climate-action&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;description&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;12&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-31T03:09:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--12&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:92964,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1969,&quot;uuid&quot;:&quot;69f9f8c2-d526-49b6-b1fa-1c52df992dc4&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;StArnaud_flood_2&quot;,&quot;file_name&quot;:&quot;starnaud-flood-2_5a90.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:6743338,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:1130},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:90741,&quot;created_at&quot;:&quot;2026-07-15T04:48:07.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-15T04:48:09.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92964\/starnaud-flood-2_5a90.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2026,&quot;vid&quot;:361035,&quot;title&quot;:&quot;Advanced Composting Technologies of Australasia PTY LTD (APP051292)&quot;,&quot;slug&quot;:&quot;advanced-composting-technologies-of-australasia-pty-ltd-app051292&quot;,&quot;summary&quot;:&quot;EPA has received a development licence application. We are seeking comments from anyone who may be affected by the proposal.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;&lt;strong&gt;Applicant&lt;\/strong&gt;: Advanced Composting Technologies of Australasia Pty Ltd&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity site&lt;\/strong&gt;: 1000 Mount Rothwell Road, Balliang VIC 3340&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Application number&lt;\/strong&gt;: APP051292&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity codes&lt;\/strong&gt;: &lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;A01 (Reportable priority waste management))&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A04 (Industrial wastewater treatment)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A07a (Organic waste processing\u2014 large)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;What does the application propose?&lt;\/h3&gt;&lt;p&gt;Advanced Composting Technologies of Australasia Pty Ltd (ACTA) proposes to establish a composting facility at 1000 Mount Rothwell Road, Balliang VIC 3340.&lt;\/p&gt;&lt;p&gt;The facility will process a total of 68,600 cubic meters of waste each year comprising of the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Green organics&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Poultry mortalities and manure&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Grease trap&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Poultry, Abattoir and Food waste.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;These wastes will be treated using a proprietary organic activator and open windrow composting. The facility will process these wastes into a pasteurised end product.&lt;\/p&gt;&lt;p&gt;The proposed development activities includes:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Construction of a composting pad&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Construction of wastewater treatment and storage system&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The full application can be found in the \u2018Supporting documents\u2019 section of this page.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTMxVDIzOjAzOjQyLjYwM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;EPA invites anyone who feels they may be affected by the proposed development activities to make a submission. You must make your submission using the form on this page.&lt;\/p&gt;&lt;p&gt;Notice of this application and submission period was published on 4 September 2026 in the Geelong Advertiser.&lt;\/p&gt;&lt;p&gt;EPA will consider submissions made before 11:59 pm, 28 September 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period open&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOC0yN1QwNTo1ODoyMC4xNjFa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDgtMzFUMjM6MDM6NDYuMTk2Wg==&quot;,&quot;type&quot;:&quot;documents& l_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[],&quot;team&quot;:{&quot;id&quot;:13,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Environment Protection Authority&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;environment-protection-authority&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Environment Protection Authority&quot;,&quot;description&quot;:&quot;&lt;p&gt;Environment Protection Authority Victoria (EPA) is Victoria\u2019s&amp;nbsp;environmental regulator.&lt;\/p&gt;&lt;p&gt;For details about the current Development Licence Applications please visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/epa-development-licence-applications\&quot; target=\&quot;_blank\&quot;&gt;EPA Development Licence Applications&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94257,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2026,&quot;uuid&quot;:&quot;a93d5d62-9e83-49e6-a1de-e38b67aca2a9&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;ACTA&quot;,&quot;file_name&quot;:&quot;acta_3d46.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:596623,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91993,&quot;created_at&quot;:&quot;2026-08-27T06:49:04.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-27T06:49:05.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94257\/acta_3d46.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1235,&quot;vid&quot;:360938,&quot;title&quot;:&quot;\u200b\u200bVictorian Energy Upgrades - Large Energy User Access Initiative\u200b&quot;,&quot;slug&quot;:&quot;large-energy-user-access-initiative&quot;,&quot;summary&quot;:&quot;\u200b\u200bHave your say on the proposed Large Energy User (LEU) Access Initiative \u200b&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&amp;nbsp;&lt;\/h2&gt;&lt;p&gt;The Department of Energy, Environment and Climate Action (DEECA) is seeking feedback on proposed changes to the opt-in period for scheduled activity premises (SAPs) under the Victorian Energy Upgrades (VEU) program. The Large Energy User (LEU) Access Initiative is proposing an extension to the opt-in period for SAPs which are currently exempt from participating in and paying the costs of the VEU program. The proposed extension is intended to provide SAPs, particularly those SAPs which are large energy users, with additional time to undertake upgrades before paying VEU program costs, while supporting emission reductions and investment in energy efficiency.&lt;\/p&gt;&lt;p&gt;The survey seeks feedback on the LEU Access Initiative, which is a targeted reform that can be implemented efficiently to support large businesses in accessing VEU program incentives for upgrades. This involves a minor regulatory amendment to extend the opt-in period for SAPs who voluntarily participate in the program, so they can benefit from energy upgrades well before incurring program costs. Broader regulatory or legislative change is out of scope for this project.&lt;\/p&gt;&lt;p&gt;Visit the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.energy.vic.gov.au\/victorian-energy-upgrades\&quot;&gt;Victorian Energy Upgrades program website&lt;\/a&gt; for more information.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTAzVDAxOjM4OjAyLjY0OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;10&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;Please read the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48191\&quot;&gt;consultation paper&lt;\/a&gt; outlining the proposed changes to the opt-in period for SAPs under the VEU program and provide your feedback via the survey or a written submission:&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/large-energy-user-access-initiative\/survey\/5472\&quot; target=\&quot;_blank\&quot;&gt;Complete the survey&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/large-energy-user-access-initiative\/survey\/5473\&quot; target=\&quot;_blank\&quot;&gt;Upload a written submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Other ways to make a submission:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;email &lt;a class=\&quot;Hyperlink SCXW57964585 BCX8\&quot; href=\&quot;mailto:energy.upgrades@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;energy.upgrades@deeca.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;send a hard copy submission to:&amp;nbsp;Victorian Energy Upgrades Branch. Department of Energy, Environment and Climate Action. PO Box 500, East Melbourne, VIC, 8002&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;This consultation closes at 11:59pm Friday 2 October 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;h4&gt;Webinar&lt;\/h4&gt;&lt;p&gt;An information webinar has been scheduled at 1:30pm on Thursday 17 September 2026 to explain the proposed changes.&lt;\/p&gt;&lt;p&gt;There will be an opportunity to ask questions via a Q&amp;amp;A session. If you would like to submit your questions prior to the webinar, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:energy.upgrades@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;energy.upgrades@deeca.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/events.teams.microsoft.com\/event\/b9857d33-7827-41cb-87cd-1b2768bf8d20@e8bdd6f7-fc18-4e48-a554-7f547927223b?source=copyLinkLegacyShareLinkDialog\&quot; target=\&quot;_blank\&quot;&gt;Sign up for the webinar&lt;\/a&gt;&lt;\/p&gt;&lt;h5&gt;&lt;strong&gt;Privacy&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;The webinar may be recorded, and a transcript created, for the purpose of administering our programs. If you don\u2019t wish to be recorded but have a contribution, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:energy.upgrades@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;energy.upgrades@deeca.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDNUMDE6MzM6NDUuMjcxWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;select_531&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48191&quot;,&quot;48190&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA3LTIxVDA1OjM2Oj :59:12.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1235,&quot;tag_id&quot;:52,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:4,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-energy-environment-and-climate-action&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;description&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;12&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-31T03:09:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--12&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:75612,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1235,&quot;uuid&quot;:&quot;4f9ab8bb-a60b-4a91-bf68-c6dffd67bca9&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;factory-6991799_1920&quot;,&quot;file_name&quot;:&quot;factory-6991799-1920_039e.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:763329,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:55206},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:74215,&quot;created_at&quot;:&quot;2024-12-06T00:51:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-12-06T00:51:31.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/75612\/factory-6991799-1920_039e.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1757,&quot;vid&quot;:365783,&quot;title&quot;:&quot;Draft Corangamite Regional Waterway Strategy 2026-2036&quot;,&quot;slug&quot;:&quot;corangamite-regional-waterway-strategy&quot;,&quot;summary&quot;:&quot;Have your say on \u200bmanagement of the Corangamite catchment\u2019s waterways over the coming ten years&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;If you are a resident or business owner in the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/ccma.vic.gov.au\/strategies-plans\/the-corangamite-regional-waterway-strategy-is-being-renewed\/\&quot; target=\&quot;_blank\&quot;&gt;Corangamite region&lt;\/a&gt;, or you care about the waterways that span Ballarat to the Otway Coast, the Western District Lakes across to Corio Bay, Bellarine Peninsula to the twelve Apostles, we invite your feedback on the new draft Corangamite Regional Waterway Strategy (RWS).&lt;\/p&gt;&lt;p&gt;The Corangamite RWS sets a shared vision, outcomes and priorities for protecting and improving the health of our rivers, wetlands and estuaries over the next ten years, in turn supporting the environmental, cultural, social and economic values they provide.&lt;\/p&gt;&lt;p&gt;The RWS helps guide existing programs of investment in waterway health, and identifies the priority areas for new investment, to have the greatest positive long-term impact.&lt;\/p&gt;&lt;p&gt;This draft is framed by guidelines developed by the State Government and complements the Victorian Waterway Management Strategy, putting that Statewide framework into a local context. For more information on the broader Statewide context, see: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/waterways\/regional-waterway-management\&quot; target=\&quot;_blank\&quot;&gt;Regional waterway management&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;This draft has been shaped by:&lt;\/p&gt;&lt;ol&gt;&lt;li&gt;&lt;p&gt;Reviewing implementation of the previous Regional Waterway Strategy, reflecting on what worked and what needs more work;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Assessing the current state of waterway values \u2013 and the threats to those values \u2013 using all available data and research to understand our \u2018baseline\u2019 for building the new Strategy;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Engagement with Traditional Owners, agency partners and key community group representatives on the most urgent and important regional issues and opportunities in waterway management (including review of all \u2018live\u2019 strategies and plans related to waterway management);&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Conducting 11 workshops across the region with local agency partners and community groups to explore how the Regional Outcomes would be applied to specific waterways and waterway systems, and to identify priority actions for each;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Full strategy draft developed and shared with Traditional Owners, agency partners and key community group representatives for feedback.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ol&gt;&lt;h5&gt;At this stage of the process, we ARE seeking further community and stakeholder feedback on:&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Identification of the regional threats to waterway health and opportunities for waterway management \u2013 has anything that could impact management of our waterways (positively or negatively) not been accounted for?&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Summary of the current values and threats for each of the eleven Waterway Systems\u200b \u2013 are there any local factors impacting waterway health that have not been captured but need to be taken into consideration in setting our outcomes and priorities?&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The draft Regional Outcomes, and the priorities for each Waterway System \u2013 is anything missing, could the focus be tightened, are there other management approaches that need to be considered?&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The implementation approach \u2013 noting it will be a \u2018living\u2019 document over the coming years, does the Implementation Plan give enough detail on how and where activities need to happen while allowing us to adaptively manage implementation as funding opportunities arise, new threats emerge, or our context changes in other ways?&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h5&gt;At this stage of the process, we are NOT seeking further feedback on:&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;The principles underpinning development and implementation of the RWS&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The 50-year Vision&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Any Outcomes or Priorities related to Traditional Owners or cultural values&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The Monitoring and Evaluation approach&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:3,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTMwVDA3OjUwOjEyLjg4NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;Feedback can be shared in two ways \u2013 either by completing the survey options below, or by emailing &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:communications@ccma.vic.gov.au\&quot;&gt;communications@ccma.vic.gov.au&lt;\/a&gt; directly.&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/corangamite-regional-waterway-strategy\/survey\/5911\&quot; target=\&quot;_blank\&quot;&gt;Complete the survey&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/corangamite-regional-waterway-strategy\/survey\/5912\&quot; target=\&quot;_blank\&quot;&gt;Upload a submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;The survey closes at 11:59pm on Sunday 4 October 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOC0xOVQwNjowMTo1Mi4yNDda&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:5,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDRUMDU6NTQ6MDUuNDYwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Draft implementation plan and strategy&quot;,&quot;select_58&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;47738&quot;,&quot;48090&quot;,&quot;48279&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDgtMTlUMDY6MDE6NTcuOTA5Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;System report cards&quot;,&quot;images&quot;:[],&quot;select_301&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;47720&quot;,&quot;47719&quot;,&quot;47718&quot;,&quot;47717&quot;,&quot;47716&quot;,&quot;47715&quot;,&quot;47714&quot;,&quot;47737&quot;,&quot;47713&quot;,&quot;47712&quot;,&quot;47711&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTI4VDA0OjQyOjA4LjgwMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;A summary of all feedback received through this stage of consultation will be posted to this web page within two weeks of consultation closing, including our response to that feedback where appropriate. We will also directly email a response to feedback from anyone who requests direct follow-up (link in the Survey below or email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:communications@ccma.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;communications@ccma.vic.gov.au&lt;\/a&gt;).&lt;\/p&gt;&lt;p&gt;All feedback that is accepted will be updated in the Strategy document that will be then submitted to the Water Minister for approval. &amp;nbsp;&lt;\/p&gt;&lt;p&gt;To receive email updates, click on &lt;strong&gt;+ Follow&lt;\/strong&gt; at the top of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTE3VDA0OjU0OjMyLjk0MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--bordered\&quot;&gt;&lt;h3&gt;Accessibility&lt;\/h3&gt;&lt;p&gt;The Victorian Government is committed to providing a website that is accessible to the widest possible audience, regardless of technology or ability.&lt;\/p&gt;&lt;p&gt;If you are unable to access any of the content on this page, you can:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;email &lt;a class=\&quot;engage-link\&quot; title=\&quot;customer.service@deeca.vic.gov.au\&quot; href=\&quot;mailto:customer.service@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;customer.service@deeca.vic.gov.au&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:136186\&quot; target=\&quot;_blank\&quot;&gt;136 186&lt;\/a&gt; for alternative accessible formats&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.accesshub.gov.au\/about-the-nrs\&quot; target=\&quot;_blank\&quot;&gt;National Relay Service&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:133677\&quot; target=\&quot;_blank\&quot;&gt;133 677&lt;\/a&gt; if you are deaf or have a hearing or speech impairment&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131450\&quot; target=\&quot;_blank\&quot;&gt;131 450&lt;\/a&gt; if you need help with translating and interpreting&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;& engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;12&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-31T03:09:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--12&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:93250,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1757,&quot;uuid&quot;:&quot;2764d7b5-82c6-4fa8-81c8-9d9ffa5097ee&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;CRWS&quot;,&quot;file_name&quot;:&quot;crws_f1dc.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:117222,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:47605},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91021,&quot;created_at&quot;:&quot;2026-08-05T03:12:41.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T03:12:42.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/93250\/crws_f1dc.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2022,&quot;vid&quot;:360418,&quot;title&quot;:&quot;Westernport Water \u2013 Cowes Wastewater Treatment Plant (APP052303)&quot;,&quot;slug&quot;:&quot;westernport-water-cowes-wastewater-treatment-plant-cwwtp-app052303&quot;,&quot;summary&quot;:&quot;EPA has received a development licence application. We are seeking comments from anyone who may be affected by the proposal.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;&lt;strong&gt;Applicant&lt;\/strong&gt;: Westernport Region Water Corporation&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity site&lt;\/strong&gt;: Cowes Wastewater Treatment Plant, 261 Pyramid Rock Road, Cowes VIC 3922&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Application number&lt;\/strong&gt;: APP052303&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity code&lt;\/strong&gt;: A03 \u2013 Sewage Treatment&lt;\/p&gt;&lt;h3&gt;What does the application propose?&lt;\/h3&gt;&lt;p&gt;EPA has received a development licence application from Westernport Region Water Corporation. The application is for the upgrade of the Cowes Wastewater Treatment Plant. The upgraded facility will be capable of treating up to 13ML\/d.&lt;\/p&gt;&lt;p&gt;The proposal includes:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;an upgraded inlet works&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;an influent buffering lagoon&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;modification of bioreactor 2&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;enhanced clarification&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;repurposing the digester to a treated effluent storage&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a new sludge dewatering facility&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;chemical dosing systems&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;aeration blowers&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a standby generator&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The facility treats sewage from San Remo and Phillip Island. Treated wastewater will be discharged via the existing ocean outfall or reused as recycled water.&lt;\/p&gt;&lt;p&gt;The full application can be found in the \u2018Supporting documents\u2019&amp;nbsp;section of this page.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTMxVDAzOjE3OjMwLjcyNFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;EPA invites anyone who feels they may be affected by the proposed development activities to make a submission. You must make your submission using the form on this page.&lt;\/p&gt;&lt;p&gt;Notice of this application and submission period was published on 2 September 2026 in the Phillip Island &amp;amp; San Remo Advertiser.&lt;\/p&gt;&lt;p&gt;EPA will consider submissions made before 11:59 pm, 30 September 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period open&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOC0yN1QwNTowMjo0OC42NTVa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDgtMjdUMjM6MDE6MzcuMzE2Wg==&quot;,&quot;type&quot;:&quot;documents&quot; quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94256,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2022,&quot;uuid&quot;:&quot;9f1e72cd-e780-425f-a8aa-a9a3ce796b98&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;CWWTP EV IMAGE 20 08 26 Large&quot;,&quot;file_name&quot;:&quot;cwwtp-ev-image-20-08-26-large_9728.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:3595982,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91992,&quot;created_at&quot;:&quot;2026-08-27T05:48:09.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-27T05:48:10.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94256\/cwwtp-ev-image-20-08-26-large_9728.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1998,&quot;vid&quot;:363501,&quot;title&quot;:&quot;Yarra Valley Quarry Extension Project&quot;,&quot;slug&quot;:&quot;wa375-yarra-valley-quarry-extension-project&quot;,&quot;summary&quot;:&quot;Have your say on potential impacts to Matters of National Environmental Significance detailed in the Yarra Valley Quarry Extension Environment Report&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;Public comment is invited on the Yarra Valley Quarry Extension Project\u2019s Environment Report.&lt;\/p&gt;&lt;p&gt;The Victorian Minister for Planning determined under the&amp;nbsp;&lt;em&gt;Environment Effects Act 1978&lt;\/em&gt;&amp;nbsp;(EE Act) that the proponent must prepare an Environment Report for the project.&lt;\/p&gt;&lt;p&gt;Regional Quarries Riviera Pty Ltd and Dandy Premix Quarries Pty Ltd propose to extend their existing quarry, which is located at 130 McMahons Road, Launching Place, VIC 3139. The Project will consist of extending the existing 23.3 hectare quarry pit to 48.06 hectares enabling the extraction depth to be increased from 155 metres to 285 meters deep.&lt;\/p&gt;&lt;p&gt;The proposed quarry expansion would deliver 50 million tonne of hard rock (Hornfels) aggregates, and crushed rock construction materials to Greater Melbourne and Yarra Valley construction industry projects over an anticipated &amp;gt;80-year life-cycle.&lt;\/p&gt;&lt;p&gt;The Project (proposed action) was determined to be a \u2018controlled action\u2019 under the&amp;nbsp;&lt;em&gt;Environment Protection and Biodiversity Conservation Act 1999&lt;\/em&gt;&amp;nbsp;(EPBC Act) by the Commonwealth Minister for the Environment and Water\u2019s delegate, as the project has the potential to have a significant impact on matters of national environmental significance (MNES). The Environment Report serves as an accredited assessment under the EPBC Act Bilateral (Assessment) Agreement between the Victorian and Commonwealth Governments. .&lt;\/p&gt;&lt;p&gt;The Environment Report describes the Yarra Valley Quarry Extension project and assesses the likely environmental effects, in particular on native vegetation, biodiversity values, waterways, and groundwater-dependent ecosystems. The Environment Report also examines feasible alternatives and mitigation measures that could avoid or minimise the project\u2019s impacts.&lt;\/p&gt;&lt;p&gt;The Environment Report and supporting documents are available to view and download below.&lt;\/p&gt;&lt;h3&gt;Making a submission on the Environment Report&lt;\/h3&gt;&lt;p&gt;You are invited to make a submission on the Environment Report during this time as part of the project\u2019s assessment process under the EPBC Act. Please use the online submission form below to provide a written submission or upload your submission.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Public submissions must be received by 11:59pm on 16 September 2026.&amp;nbsp;&lt;\/strong&gt;Submissions will be provided to the proponent to finalise the Environment Report, summarising and responding to matters raised in public submissions.&lt;\/p&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;Have your say by completing a submission online in the survey form or uploading your submission.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;number_63&quot;:&quot;2&quot;,&quot;select_61&quot;:&quot;all&quot;,&quot;select_62&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOC0zMFQyMzoxNzoyNy40NDla&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:3,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDgtMzFUMjM6MzU6MjcuNDYzWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:3,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Environment Report&quot;,&quot;images&quot;:[],&quot;select_441&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;47852&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:
