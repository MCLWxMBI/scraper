ref=\&quot;https:\/\/engage.vic.gov.au\/epa-development-licence-applications\&quot; target=\&quot;_blank\&quot;&gt;EPA Development Licence Applications&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:95561,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2035,&quot;uuid&quot;:&quot;bd023109-d019-47df-a723-2a2ace616d31&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;banner&quot;,&quot;file_name&quot;:&quot;banner_0aab.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:131599,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:93270,&quot;created_at&quot;:&quot;2026-09-30T01:25:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-30T01:25:20.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/95561\/banner_0aab.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2037,&quot;vid&quot;:364309,&quot;title&quot;:&quot;Implementing Victoria\u2019s mandatory building and pest inspection scheme&quot;,&quot;slug&quot;:&quot;implementing-victorias-mandatory-building-and-pest-inspection-scheme&quot;,&quot;summary&quot;:&quot;Have your say on Victoria\u2019s proposed mandatory building and pest inspection scheme. Share your feedback to help shape the design and implementation of the reform&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Victorian Government is consulting on a proposed mandatory pre-purchase building and pest inspection scheme. Under the proposed reform, people selling their residential property would arrange and pay for a building and pest inspection before a property is sold. The report would then be made available to interested buyers.&lt;\/p&gt;&lt;h3&gt;Why we\u2019re consulting&lt;\/h3&gt;&lt;p&gt;Victoria does not currently regulate pre-purchase building and pest inspections.&lt;\/p&gt;&lt;p&gt;This can lead to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;inconsistent quality across reports&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;buyers having low confidence in inspections and,&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;increased costs for buyers who may have to pay for multiple reports across different properties.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;We are asking for your help to design a scheme that is practical, trusted and effective.&lt;\/p&gt;&lt;h3&gt;We want to hear from you&lt;\/h3&gt;&lt;p&gt;We are seeking feedback on key aspects of the proposed scheme, including:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;the scope and timing of inspections&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the quality, consistency and content of reports&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;how to manage integrity risks and conflicts of interest&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;industry capability, oversight and compliance&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;implementation, transition and consumer awareness&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE1VDIzOjQ5OjExLjEzM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;There are two ways you can provide your feedback:&lt;\/p&gt;&lt;p&gt;1.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/implementing-victorias-mandatory-building-and-pest-inspection-scheme\/survey\/6827\&quot; target=\&quot;_blank\&quot;&gt;Complete the survey&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;2.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/implementing-victorias-mandatory-building-and-pest-inspection-scheme\/survey\/6828\&quot; target=\&quot;_blank\&quot;&gt;Complete and upload your written submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;We may contact you if we require further details on the feedback you provided. If you are happy to be contacted, please include your name and contact details as part of your submission. You can also provide your feedback anonymously.&lt;\/p&gt;&lt;p&gt;Consultation will &lt;strong&gt;close at 11.59pm on Friday, 30 October 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMjFUMDQ6MzQ6MzUuODMzWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Document library&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48683&quot;,&quot;48682&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE1VDA1OjMwOjU1LjMzOFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Your feedback will be considered by the Department of Government Services. It may inform the design of the proposed scheme, future legislation and the regulatory framework needed to support it.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE2VDAzOjMyOjEwLjA5Nlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;How to make a submission and participate in the survey&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;All references to &#039;us&#039; or &#039;we&#039; on this page are references to the Building and Pest Inspections project team within the Department of Government Services (DGS).&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You are not required to provide any personal information to make a submission to this consultation or provide a response to the survey. All fields on the submission form relating to personal information are optional.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You do not need to provide contact information. If you do provide this information, you can still opt for your submission to remain anonymous.&amp;nbsp;If you do provide your email address, we may use it to provide you consolidated feedback on the submissions we receive or seek clarification on your submission.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You have three choices in how we will treat your submission:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;publish anonymously&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;publish with your name and\/or organisation&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;do not publish (confidential submission).&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Submissions may be published on Engage Victoria unless you have chosen to make a confidential submission.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Please do not provide the following types of information in your submission and\/or survey responses:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;information that would identify a third party (for example, the name of another person),&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;sensitive information (for example your race, ethnic origin or political opinions),&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;information about your personal finances.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;How your submission and survey responses will be used&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The submissions and survey responses you provide will help to inform the design of Victoria\u2019s mandatory pre-purchase inspection scheme and the future legislative and regulatory framework needed to support it.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Privacy collection statement&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We are committed to protecting the personal information you provide in accordance with the principles of the Victorian privacy laws. Submissions may also be subject to Freedom of Information and other laws.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Your contact details are collected for the purpose of this consultation, and to help us understand your responses. All personal information will be redacted before publication, unless you consent to publication of your name and\/or organisation. We will not publish other types of personal information, such as your email address.&lt;\/p&gt;&lt;p&gt;Submissions should not include any information which may identify third parties. We may redact or not publish submissions that identify third parties, or that are regarded as defamatory or discriminatory.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You may contact the Building and Pest Inspections project team within the DGS at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:regulationpolicyconsultation@dgs.vic.gov.au\&quot;&gt;regulationpolicyconsultation@dgs.vic.gov.au&lt;\/a&gt; if you have any further questions about your submission or survey responses and how your information will be handled.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Privacy Collection Notice&quot;}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTIxVDAxOjAwOjU3LjAyNVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}}],&quot;date_end&quot;:&quot;2026-10-30T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;regulationpolicyconsultation@dgs.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&qu &quot;:56,&quot;user_id&quot;:5,&quot;name&quot;:&quot;Department of Government Services&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-government-services&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Government Services&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Department of Government Services&#039; goal is to improve the experience Victorians have when they interact and do business with Government.&lt;\/p&gt;&lt;p&gt;We bring important day-to-day services together in one department to make things easy and seamless for Victorians and businesses. We&#039;re working to connect and digitise our systems and platforms across state and local government as well as streamlining our corporate and procurement services.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:null,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1917,&quot;created_at&quot;:&quot;2023-01-02T23:41:24.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-08-26T23:23:32.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-government-services&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--default&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:95211,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2037,&quot;uuid&quot;:&quot;4493ce53-5b2b-4f93-9d92-269268112c95&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;CAV260146_Mandatory-building-and-pest-inspections_Engage-Vic&quot;,&quot;file_name&quot;:&quot;cav260146-mandatory-building-and-pest-inspections-engage-vic_bdb6.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:555945,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:20430},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92925,&quot;created_at&quot;:&quot;2026-09-21T00:16:15.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-21T00:16:16.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/95211\/cav260146-mandatory-building-and-pest-inspections-engage-vic_bdb6.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2020,&quot;vid&quot;:364121,&quot;title&quot;:&quot;Statement of Regulatory Approach \u2013 Port of Melbourne Pricing Order&quot;,&quot;slug&quot;:&quot;statement-of-regulatory-approach-port-of-melbourne-pricing-order-amendment&quot;,&quot;summary&quot;:&quot;The Essential Services Commission is updating its Statement of Regulatory Approach following recent amendments to the Port of Melbourne\u2019s Pricing Order.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Essential Services Commission is updating its Statement of Regulatory Approach following recent Port of Melbourne Pricing Order amendments.&lt;\/p&gt;&lt;p&gt;The amendments set out a new role for the Essential Services Commission in assessing upfront (ex-ante) project proposals from the Port of Melbourne for major projects. The proposals must be related to a project with at least $500 million of capital expenditure.&lt;\/p&gt;&lt;p&gt;For accepted applications related to the Port Capacity Enhancement Program, the amendments also enable the Port to raise prices above the tariffs adjustment limit to recover the costs of the project.&lt;\/p&gt;&lt;p&gt;We have updated the Statement of Regulatory Approach to explain:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how we will assess whether the expenditure for strategic project applications is prudent and efficient&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the requirements of an application from the Port, including engagement and information requirements&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;how we will monitor accepted applications as part of our 5-yearly inquiries into the Port\u2019s compliance with the Pricing Order.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;We have published a consultation paper which explains our approach to updating the statement and highlights key changes. These changes reflect our proposed approach to our new ex-ante review role. We will consider all feedback and submissions we receive during this consultation process, before publishing our final version of the statement.&lt;\/p&gt;&lt;p&gt;Please note that the changes are not related and do not affect the 5-yearly compliance inquiry that is currently underway. Following the completion of the compliance inquiry, we will conduct a broader review of the statement and make further changes as necessary. We are also not seeking views on the merits, prudency or efficiency of the Port Capacity Enhancement Program at this time.&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h3&gt;About the Port of Melbourne&lt;\/h3&gt;&lt;p&gt;The Port of Melbourne services international and domestic shipping lines carrying cargo in containers and general cargo to and from Melbourne through the Port Phillip Bay.&lt;\/p&gt;&lt;p&gt;The Port Management Act 1995 specifies the prescribed services the port provides and that we regulate. The pricing order made under that Act sets out the requirements for the port when setting prices for prescribed services, such as:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how to calculate prices&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the extent prices can change between years&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;when the port needs to apply to us for variations.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;You can provide feedback to us about our draft Statement of Regulatory Approach on this page by:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;providing general comments or answering our survey questions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;uploading a submission document(s).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Submissions are open until 5pm 12 October 2026. We will consider all feedback and publish a final Statement of Regulatory Approach before the end of the year.&lt;\/p&gt;&lt;p&gt;You can upload your submission below or send it to us via the below contact details:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Email:&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:ports@esc.vic.gov.au\&quot;&gt;ports@esc.vic.gov.au&lt;\/a&gt; &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Mail: Essential Services Commission,&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.google.com.au\/maps?q=Level%208,%20570%20Burke%20Street,%20Melbourne%20Victoria%203000\&quot;&gt;Level 8, 570 Bourke Street, Melbourne Victoria 3000&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can also call us on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:03 9032 1300\&quot;&gt;03 9032 1300&lt;\/a&gt; to discuss your options.&lt;\/p&gt;&lt;p&gt;If English is not your first language, please contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;0\&quot;&gt;TIS National&lt;\/a&gt; on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131 450\&quot;&gt;131 450&lt;\/a&gt; to make your submission using an interpreter.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTE3VDAxOjEwOjMzLjkxOVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE3VDAxOjEwOjM2LjQ2Nlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Next steps&lt;\/h3&gt;&lt;p&gt;&lt;em&gt;What will be done with the feedback? What are the next steps in the process?&lt;\/em&gt;&lt;\/p&gt;&lt;p&gt;We will use your feedback and submissions to inform our final version of the Statement of Regulatory Approach.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZXZlbnRzOjIwMjYtMDktMTdUMDE6MTA6NDEuODk4Wg==&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;dXBkYXRlczoyMDI2LTA5LTE3VDAxOjEwOjQ0Ljg0MFo=&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMTdUMDE6MTA6NDYuOTQxWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;cGFnZXM6MjAyNi0wOS0xN1QwMToxMDo0OC44MjRa&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}}],&quot;date_en .vic.gov.au\/project\/statement-of-regulatory-approach-port-of-melbourne-pricing-order-amendment\/timeline\/37606&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:47,&quot;title&quot;:&quot;Transport&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2020,&quot;tag_id&quot;:47,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:12,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Essential Services Commission&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;essential-services-commission&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Essential Services Commission&quot;,&quot;description&quot;:&quot;&lt;p&gt;We promote the long-term interests of Victorian consumers with respect to the price, quality and reliability of essential services.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2274,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-02-11T02:31:43.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/essential-services-commission&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94186,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2020,&quot;uuid&quot;:&quot;9ade38d3-9715-48a7-bd71-ce2ab42822e7&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;AdobeStock_130098187 (Port of Melbourne)&quot;,&quot;file_name&quot;:&quot;adobestock-130098187-port-of-melbourne_8d00.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2387436,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:61368},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91923,&quot;created_at&quot;:&quot;2026-08-26T02:04:44.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-26T02:04:46.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94186\/adobestock-130098187-port-of-melbourne_8d00.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2001,&quot;vid&quot;:364950,&quot;title&quot;:&quot;Hazelwood Rehabilitation Project Inquiry and Advisory Committee&quot;,&quot;slug&quot;:&quot;Hazelwood-Rehabilitation-Project-IAC&quot;,&quot;summary&quot;:&quot;An Inquiry and Advisory Committee is collecting submissions to consider the environmental effects of the proposed Hazelwood Rehabilitation Project.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;The Minister for Planning (the Minister) will appoint a joint Inquiry and Advisory Committee (IAC) to consider and advise on the environmental effects of the proposed works for the Hazelwood Rehabilitation Project (the Project). The IAC is an independent group of experts tasked with this assessment.&lt;\/p&gt;&lt;p&gt;The IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;review the Environment Effects Statement (EES) and draft Planning Scheme Amendment (PSA) C159latr to the Latrobe Planning Scheme and public submissions;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;hold a public hearing to hear from the Proponent and submitters who want to speak to their written submission; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide advice to the Minister about the environmental effects of the Project and the draft PSA.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The IAC\u2019s Terms of Reference can be viewed under \u201cdocuments\u201d below.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Inquiry and Advisory Committee members&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC is made up of the following members:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Sarah Carlisle (Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Penelope Smith (Deputy Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Peter Bettess&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Deb Neumann&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Jack Krohn&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&amp;nbsp;You can learn more about the members by reading their &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48360\&quot; target=\&quot;_blank\&quot;&gt;biographies&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjAxOjMxLjg5M1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;The Proposal&lt;\/strong&gt;&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;The Proposal&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Hazelwood Rehabilitation Project (the Project) proposes to rehabilitate the former Hazelwood Mine and Power Station to a safe, stable, sustainable and non-polluting site that enables productive future uses. The former Hazelwood Power Station and Mine is located in the Latrobe Valley, immediately south of the township of Morwell, approximately 150 kilometres east of Melbourne.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&amp;nbsp;The key components of the project include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Filling the mine void to create a lake using predominately groundwater, surface water and any other approved water sources to a relative level (RL) of +45 metres Australian Height Datum (AHD) with a depth of up to 120 metres and covering an area of 1,145 hectares&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Earthworks to rehabilitate, stabilise and reshape landforms, primarily upper mine batters where they are above the level of the future pit lake, to geotechnically stable landforms with adequate stabilising vegetation and drainage&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Decommissioning, draining and rehabilitation of the Hazelwood Cooling Pond (HCP) to be suitable for alternative uses and restoration of the natural alignment of Eel Hole Creek&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Decommissioning remaining redundant infrastructure, such as roads, car parks, buildings, fire protection pipelines and infrastructure above RL +45m AHD and pumphouses on the Hazelwood Cooling Pond; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Construction and operation of infrastructure necessary to maintain lake depth and water quality, including an option for occasional flood flows from the Morwell River.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The project proposes a target mine filling period of between 10 and 20 years.&lt;\/p&gt;&lt;p&gt;The Proponent is ENGIE Hazelwood.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;View the proposal&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;You may view and download the exhibited EES, including the draft PSA, and other related documents on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.hazelwoodrehabilitation.com.au\/engie\/hazelwood\&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;The public notice has more information about where you can see hard copies of the EES in person, as well as collect a USB information pack.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjAyOjM0LjEwNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Public Exhibition&lt;\/strong&gt;&lt;\/h3&gt;&lt;p&gt;The Project will be open for public exhibition for 30 business days between &lt;strong&gt;Monday 21 September 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Monday 2 November 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You are invited to make a written submission to the IAC during this time. Please use the online submission form below to submit your written submission.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;If you want to participate and speak at the IAC\u2019s Hearing, you must make a written submission and indicate on the submission form that you want to be heard. The IAC will consider all written submissions when preparing its advice, in accordance with the scope of the IAC\u2019s Terms of Reference, whether or not a submitter chooses to speak.&lt;\/p&gt;&lt;p&gt;If you make a submission, you will be notified about the timing and location of the Hearing after the exhibition period has closed.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjA2OjMwLjc2MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Directions Hearing&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC will hold a Directions Hearing at &lt;strong&gt;10:00am on Thursday 26 November 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and make arrangements for the Hearing and its site inspection&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;will issue directions about how the IAC process will be conducted, including timeframes for circulating further written submissions and expert statements (if any).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Parties will have an opportunity to raise procedural issues and ask questions about the IAC process.&lt;\/p&gt;&lt;p&gt;More information about the Directions Hearing will be published here once the details are confirmed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Hearing&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Hearing will commence in the &lt;strong&gt;week beginning Monday 1 February 2027&lt;\/strong&gt;. Depending on how many submitters ask to speak, the Hearing may run for four to six weeks. A timetable for the Hearing will be published after the Directions Hearing.&lt;\/p&gt;&lt;p&gt;The purpose of the Hearing is to give people an opportunity to speak about the issues raised in their written submissions. The Proponent (ENGIE Hazelwood) will also have the opportunity to speak and present expert evidence at the Hearing. The Hearing is open to the public, so anyone can watch.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Report&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC must prepare a report for the Minister for Planning.&lt;\/p&gt;&lt;p&gt;In accordance with the Terms of Reference, the IAC must submit its report to the Minister for Planning within 40 business days after the last day of its proceedings. The report will include the IAC\u2019s advice and recommendations about the environmental effects of the Project and the draft PSA.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the IAC\u2019s report to inform the Minister\u2019s Assessment of the environmental effects of the project under the &lt;em&gt;Environment Effects Act 1978. &lt;\/em&gt;This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the IAC report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Inquiry and Advisory Committee Process&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjA5OjAxLjA3NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;8&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Have your say - make a submission&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;You can make a written submission on the EES, including the draft PSA, between &lt;strong&gt;Monday 21 September 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Monday 2 November 2026&lt;\/strong&gt; by completing the online form below.&lt;\/p&gt;&lt;p&gt;If you want to speak at the Hearing, tick the box when completing the form.&lt;\/p&gt;&lt;p&gt;You only need to make one submission to share all your views on the EES and draft PSA.&lt;\/p&gt;&lt;p&gt;Please refer to the IAC\u2019s Terms of Reference for information about the scope of its role.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission or would like to submit a hard copy, contact Planning Panels Victoria on 136 186 (select option 6) or email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy and Intellectual Property&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Your written submission will be a public document. To make a written submission, you must read the Privacy Collection Statement and click \u2018agree\u2019 where indicated on the online form.&lt;\/p&gt;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48362\&quot; target=\&quot;_blank\&quot;&gt;Privacy Collection Statement&lt;\/a&gt; explains how we will use your submission and any other information you provide to the IAC, which includes putting it online and providing it to the Proponent, other parties to the Hearing and to the organisations and government agencies specified in the Terms of Reference.&lt;\/p&gt;&lt;p&gt;You should not include any personal information in your written submission that could identify you or other people unless you (or they) are happy for that information to be made publicly available. Examples are email addresses, phone numbers or photos of people (particularly children). You should also not include any material authored by another person unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTA5VDA1OjI0OjM1LjM1MVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Online submission form&quot;,&quot;select_68&quot;:&quot;custom&quot;,&quot;select_198&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6815&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjEwOjE5LjA4NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;9&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Click the \u2018Start survey\u2019 button to make your submission.&lt;\/strong&gt;&lt;\/h3&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMjRUMDQ6NTg6MDkuNjE1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48360&quot;,&quot;48361&quot;,&quot;48362&quot;,&quot;48806&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA1OjE5OjAzLjc1N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;10&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h5&gt;&lt;strong&gt;Making a submission&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to lodge my written submission online?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes, please use the online form to make your written submission. You can type (or copy and paste) directly into the form or upload a file as an attachment. Accepted file types include PDF, DOC, DOCX, TXT, RTF, PNG, GIF, JPG, and JPEG.&lt;\/p&gt;&lt;p&gt;Each file must be under 20MB, and the total of all files uploaded to the form must be under 40MB.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a hard copy submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Online submissions are strongly preferred. However, if you unable to submit online, you can send a hard copy.&lt;\/p&gt;&lt;p&gt;A hard copy written submission must be accompanied by a completed \u2018Submission Coversheet\u2019 which you can request from Planning Panels Victoria through the Customer Call Centre&lt;em&gt; &lt;\/em&gt;on 136 186 (select option 6) or by emailing &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;. The Submission Coversheet includes important information we need to process your submission, to enable you to participate in the IAC process if you want to be heard, and privacy information.&lt;\/p&gt;&lt;p&gt;Make sure your submission and Submission Coversheet arrive before the exhibition period ends (11:59pm on Monday 2 November 2026).&lt;\/p&gt;&lt;p&gt;Please do not email your written submission directly to Planning Panels Victoria or any other party such as the Minister for Planning, the Department of Transport and Planning (DTP) Impact Assessment Unit, or the Proponent.&amp;nbsp; If you do, it may not be considered by the IAC.&amp;nbsp; Please use the online submission form, or if this is not possible, send a hard copy with a completed coversheet to Planning Panels Victoria.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to make separate submissions on the EES and draft PSA?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;All submissions will be treated as a submission to all the exhibited documents (the EES and draft PSA).&amp;nbsp; You don\u2019t need to make a separate submission on each document. You should include all your views about the project and its effects in one single submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;I might want legal support in making a submission or to help me during the IAC process. What resources are available to me?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;It is not a requirement to have legal support to make your submission or participate in the IAC process, however you may choose to engage a lawyer to assist you.&lt;\/p&gt;&lt;p&gt;Foley\u2019s List barristers is offering a Legal Assistance Service that offers low-cost or no-cost legal support to eligible submitters in Planning Panel Victoria hearings.\u202f Available to individuals and community groups, the service offers legal advice and representation to help participants navigate PPV processes (subject to barrister availability).&amp;nbsp; Assistance ranges from preliminary advice to full representation, with fees reduced or waived.&amp;nbsp;&amp;nbsp; \u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;To participate, submitters must meet eligibility criteria.&amp;nbsp; More information about the Service and eligibility criteria is available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planningpanels.vic.gov.au\/guides-and-resources\/legal-assistance-service\&quot; target=\&quot;_blank\&quot;&gt;PPV website&lt;\/a&gt;, including who you need to contact at Foley\u2019s List to apply for assistance.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a submission on behalf of a group or organisation?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Organisations, residents, or groups of individual submitters with similar issues are encouraged to provide a single joint written submission.&lt;\/p&gt;&lt;p&gt;Correspondence to organisations and residents\u2019 groups will be directed to the nominated contact person for that group.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a petition?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Petitions will be treated as a single submission, and correspondence will only be sent to the person who organised the petition.&amp;nbsp; If the organiser is not clear, it will be the first name to appear on the petition.&lt;\/p&gt;&lt;p&gt;If you want to be contacted individually about the IAC process or want to be heard at the Hearing, you will need to make your own individual written submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a pro-forma submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Submissions that have substantially the same content will be treated as pro forma submissions, and pro forma submitters who want to be heard at the Hearing will be heard as a group.&amp;nbsp; If you want to be heard as an individual, you should make your own individual written submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;How will I know if my written submission was received?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;After you click \u2018Submit\u2019, you\u2019ll see a message confirming it was lodged.&lt;\/p&gt;&lt;p&gt;If you want a copy of your submission, enter your email address and click \u2018Send me a copy\u2019. Check your spam \/ junk folder if it doesn\u2019t arrive.&lt;\/p&gt;&lt;p&gt;If you don\u2019t receive the confirmation email, contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I request to make my submission confidential?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In some circumstances, you may not want your name or certain information to be published online. As detailed in the Terms of Reference and Privacy Collection Statement, the IAC can hear submissions or accept material on a confidential basis, provided this would be fair to the Proponent and other parties to the Hearing.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you want your name withheld, or to provide your submission or material confidentially, you must request permission from the IAC Chair in writing through PPV and provide reasons why the IAC should treat your submissions or material confidentially.&amp;nbsp; Please contact PPV at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt; with these requests.&lt;\/p&gt;&lt;p&gt;Even where confidentiality is granted, confidential submissions will still need to be shared with the Proponent, and other relevant organisations and government agencies identified in the Terms of Reference to ensure issues raised can be appropriately considered and addressed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;What happens to my submission?&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Will my submission be made public?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. All submissions are public documents and will be published on the Engage Victoria website, unless the IAC Chair has agreed to accept your submission on a confidential basis.&lt;\/p&gt;&lt;p&gt;Your name, submission and other material you provide will be published online. Personal details like your address and phone number will be removed, but you should ensure you don\u2019t include these in the main part of your submission (only include your details in the online form or cover sheet).&lt;\/p&gt;&lt;p&gt;Please read the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48362\&quot; target=\&quot;_blank\&quot;&gt;Privacy Collection Statement&lt;\/a&gt; before making your submission. Don&#039;t include information that identifies other people unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;Speaking at the Hearing&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I have to make a submission if I want to speak at the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. To speak at the Hearing, you must make a written submission during the exhibition period.&lt;\/p&gt;&lt;p&gt;You will need to tick the box on the online form to say you want to be heard. You\u2019ll also need to tell us:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how long you want to speak about the issues in your written submission&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;who will represent you (you may represent yourself or have someone else speak for you)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;if you will call any experts in support of your submission.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you request to be heard by the IAC, you will become a &#039;party&#039; to the IAC process. You will be given a timeslot to present in the Hearing timetable and advised of the arrangements for the IAC process before the Directions Hearing, Hearing and through any directions issued by the IAC.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What if I do not want to speak at the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;That\u2019s fine. You don\u2019t need to speak to your written submission for it to be considered by the IAC.&lt;\/p&gt;&lt;p&gt;If you do not want to be heard by the IAC, you will not be a party to the IAC process. You will receive correspondence from the IAC acknowledging your submission. However, you will not receive any further correspondence about the IAC process and may not be able to submit additional information to the IAC.&lt;\/p&gt;&lt;p&gt;You can still follow the process by checking this webpage&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE0VDAxOjM5OjE0LjA5Nlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;11&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;For questions about making a submission, the Inquiry and Advisory Committee process or Hearing, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Planning Panels Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186 (select option 6)&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Hazelwood Rehabilitation Project, the Environment Effects Statement (EES) and draft PSA, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;ENGIE Hazelwood&lt;\/p&gt;&lt;p&gt;\u260e Phone: (03) 5135 5000&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:hazelwood.au@engie.com\&quot;&gt;hazelwood.au@engie.com&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/urldefense.com\/v3\/__https:\/www.hazelwoodrehabilitation.com.au\/__;!!C5rN6bSF!FBIKdnPF4_rIedMTZGiSm6jrYAl30s40oeJ8rk4Xsga1GZmtPKuibwk8PvaJUZSGRRJ5adOdvZK_E9Uaxka9qVhV8OZVPHHc$\&quot;&gt;https:\/\/www.hazelwoodrehabilitation.com.au&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Minister&#039;s Assessment and EES process contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Impact Assessment Unit, Department of Transport and Planning&lt;\/p&gt;&lt;p&gt;\u260e Phone: (03) &amp;nbsp;8572 7980&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assessment@transport.vic.gov.au\&quot;&gt;environment.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&quot;,&quot;title&quot;:&quot;Contacts&quot;}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;number_86&quot;:&quot;2&quot;,&quot;select_84&quot;:&quot;all&quot;,&quot;select_85&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;number_91&quot;:&quot;8&quot;,&quot;select_89&quot;:&quot;all&quot;,&quot;select_90&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}}],&quot;date_end&quot;:&quot;2026-11-02T23:59:00&quot;,&quot;region_id&quot;:3,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Planning Panels Victoria&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;136 186 (select option 6)&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;office@planningpanels.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-07-07T01:40:28.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-24T04:59:32.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5507,&quot;team_id&quot;:21,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:45790,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/Hazelwood-Rehabilitation-Project-IAC&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-theme__default&quot;,&quot;static_map&quot;:null,&quot;status_label&quot;:&quot;Published&quot;,&quot;subscribe_form_schema&quot;:{&quot;subscribe&quot;:{&quot;title&quot;:&quot;Follow&quot;,&quot;description&quot;:&quot;Enter your email below for updates about the &lt;strong&gt;Hazelwood Rehabilitation Project Inquiry and Advisory Committee&lt;\/strong&gt; project&quot;,&quot;button_text&quot;:&quot;Follow this project&quot;},&quot;unsubscribe&quot;:{&quot;title&quot;:&quot;You are following&quot;,&quot;description&quot;:&quot;Click the unfollow button to stop receiving updates about the &lt;strong&gt;Hazelwood Rehabilitation Project Inquiry and Advisory Committee&lt;\/strong&gt; project.&quot;,&quot;button_text&quot;:&quot;Unfollow&quot;,&quot;footer_text&quot;:&quot;You can manage the projects you&#039;re following anytime by visiting &lt;a href=https:\/\/engage.vic.gov.au\/profile\/subscriptions&gt;Subscriptions&lt;\/a&gt; under your profile&quot;}},&quot;consult_status&quot;:{&quot;id&quot;:1,&quot;name&quot;:&quot;open&quot;,&quot;label&quot;:&quot;Open for feedback&quot;},&quot;show_table_of_contents&quot;:false,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;image&quot;:{&quot;id&quot;:94737,&quot;name&quot;:&quot;ENGIE Hazelwood EES Engage Vic Image&quot;,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94737\/engie-hazelwood-ees-engage-vic-image_33ca.jpg&quot;,&quot;ext&quot;:&quot;jpg&quot;,&quot;size&quot;:&quot;283.33 KB&quot;,&quot;thumb&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94737\/conversions\/engie-hazelwood-ees-engage-vic-image_33ca-thumb.jpg&quot;,&quot;hero&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94737\/conversions\/engie-hazelwood-ees-engage-vic-image_33ca-hero.jpg&quot;,&quot;full&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94737\/conversions\/engie-hazelwood-ees-engage-vic-image_33ca-full.jpg&quot;},&quot;public_stages&quot;:[{&quot;id&quot;:37465,&quot;vid&quot;:361808,&quot;title&quot;:&quot;Exhibition Stage: Submissions&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Hazelwood Rehabilitation Project EES is on public exhibition for 30 business days.&lt;\/p&gt;&lt;p&gt;During this time, members of the public are invited to make a written submission on the EES and draft PSA. Submissions help the Inquiry and Advisory Committee (IAC) understand how the Project may affect people, communities, and the environment.&lt;\/p&gt;&lt;p&gt;Submissions must be made in writing. To make a submission, use the online submission form under the Participate tab.&lt;\/p&gt;&lt;p&gt;You must make a written submission if you want to participate in the IAC Hearing.&amp;nbsp;The IAC will consider all submissions, whether or not a submitter chooses to speak at the Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:1,&quot;date_start&quot;:&quot;Monday 21 September 2026&quot;,&quot;date_end&quot;:&quot;11:59pm on Monday 2 November 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-07-07T01:40:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-09T05:26:05.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2001,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:58870,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Hazelwood-Rehabilitation-Project-IAC\/timeline\/37465&quot;,&quot;summary&quot;:&quot;The Hazelwood Rehabilitation Project EES is on public exhibition for...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37636,&quot;vid&quot;:361559,&quot;title&quot;:&quot;Hearing Stage: Directions Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Inquiry and Advisory Committee (IAC) will hold a Directions Hearing on &lt;strong&gt;Thursday 26 November 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and make arrangements for the Hearing and its site inspection&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;will issue directions about how the IAC process will be conducted, including timeframes for circulating further written submissions and expert statements (if any).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Parties will have an opportunity to raise procedural issues and ask questions about the IAC process.&lt;\/p&gt;&lt;p&gt;The Directions Hearing helps make sure everyone is prepared and understands what to expect during the process and at the main Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:2,&quot;date_start&quot;:&quot;Thursday 26 November 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-09-08T05:36:01.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-08T05:36:01.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2001,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:58870,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Hazelwood-Rehabilitation-Project-IAC\/timeline\/37636&quot;,&quot;summary&quot;:&quot;The Inquiry and Advisory Committee (IAC) will hold a Directions...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37637,&quot;vid&quot;:361560,&quot;title&quot;:&quot;Hearing Stage: Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Hearing will commence in the &lt;strong&gt;week beginning Monday 1 February 2027&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for four to six weeks.&lt;\/p&gt;&lt;p&gt;The Hearing gives the Proponent and submitters who asked to be heard a chance to speak about the issues raised in their written submissions.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Week beginning Monday 1 February 2027&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-09-08T05:36:58.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-08T05:36:58.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2001,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:58870,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Hazelwood-Rehabilitation-Project-IAC\/timeline\/37637&quot;,&quot;summary&quot;:&quot;The Hearing will commence in the week beginning Monday 1...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37638,&quot;vid&quot;:361963,&quot;title&quot;:&quot;Report Stage: Report and next steps&quot;,&quot;description&quot;:&quot;&lt;p&gt;Once the Hearing ends, the Inquiry and Advisory Committee (IAC) must prepare a report for the Minister for Planning. This report will include the IAC\u2019s advice and recommendations about the environmental effects of the Project and the draft PSA in accordance with the scope of the IAC\u2019s Terms of Reference.&lt;\/p&gt;&lt;p&gt;The IAC\u2019s report is to focus on the \u2018Key Environmental Matters\u2019 and address \u2018Other Environmental Matters\u2019 at a high level.&lt;\/p&gt;&lt;p&gt;Under the Terms of Reference, the Inquiry and Advisory Committee must submit its report within 40 business days of the last day of its proceedings.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the IAC\u2019s report to inform the Minister\u2019s Assessment of the environmental effects of the project under the&amp;nbsp;&lt;em&gt;Environment Effects Act 1978.&amp;nbsp;&lt;\/em&gt;This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the IAC report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:4,&quot;date_start&quot;:&quot;April - May 2027&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-09-08T05:38:51.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-10T00:33:49.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2001,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:58870,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Hazelwood-Rehabilitation-Project-IAC\/timeline\/37638&quot;,&quot;summary&quot;:&quot;Once the Hearing ends, the Inquiry and Advisory Committee (IAC)...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:34,&quot;title&quot;:&quot;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2001,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:43,& elwood-ees-engage-vic-image_33ca.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:290126,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:58870},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92465,&quot;created_at&quot;:&quot;2026-09-08T05:25:08.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-08T05:25:08.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94737\/engie-hazelwood-ees-engage-vic-image_33ca.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2033,&quot;vid&quot;:364729,&quot;title&quot;:&quot;Draft Maribyrnong Planning Scheme Amendment C192mari&quot;,&quot;slug&quot;:&quot;draft-maribyrnong-planning-scheme-amendment-c192mari&quot;,&quot;summary&quot;:&quot;Have your say on the Maribyrnong Planning Scheme Amendment C192mari and draft planning permit application PA2604457 for 291 Maribyrnong Road and Thompson Reserve.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, approve and adopt Draft Planning Scheme Amendment C192mari to the Maribyrnong Planning Scheme under section 20(4) of the Planning and Environment Act 1987 (the Act). The draft amendment applies to land at 291 Gordon Street, Maribyrnong.&lt;\/p&gt;&lt;p&gt;Consultation is being undertaken under section 20(5) of the Act.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The project land is 4.8 hectares in size and is located within an urban renewal precinct, forming part of the former Australian Defence Industries site operated by the Commonwealth Government. The land is located adjacent to Highpoint Shopping Centre, Maribyrnong College, Thompson Reserve, Pipemakers Park and Frog\u2019s Hollow Wetlands.&lt;\/p&gt;&lt;p&gt;The land is currently designated as Open Space and Recreation and Landscaped Landfill in the Riverside Physical Framework Plan No.1 (1992), which applies to the land under the current zone (Comprehensive Development Zone \u2013 Schedule 3).&lt;\/p&gt;&lt;p&gt;The land is also landlocked with no formal road access. The process for use of Crown land (Thompson Reserve), which is currently reserved for \u2018Open Space and Recreation\u2019, for road access will be considered concurrently, but does not form part of this amendment application.&lt;\/p&gt;&lt;p&gt;Environmental Audit EPA CARMS 22064-17 was completed for the site on 14 January 2019. The Audit determined that the subject site is suitable for sensitive uses, subject to engineering works and ongoing environmental maintenance, management and monitoring.&lt;\/p&gt;&lt;p&gt;The Environmental Audit is available in three parts. Access each part below:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/drapubcdnprd.azureedge.net\/ibis\/attachments\/envaudit\/53X\/0008005044\/22064-17_A.pdf\&quot; target=\&quot;_blank\&quot;&gt;Part A&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/drapubcdnprd.azureedge.net\/ibis\/attachments\/envaudit\/53X\/0008005044\/22064-17_B.pdf\&quot; target=\&quot;_blank\&quot;&gt;Part B&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/aus01.safelinks.protection.outlook.com\/?url=https%3A%2F%2Fdrapubcdnprd.azureedge.net%2Fibis%2Fattachments%2Fenvaudit%2F53X%2F0008005044%2F22064-17_C.pdf&amp;amp;data=05%7C02%7Cprashanth.reddy%40transport.vic.gov.au%7Caeabed45898f462da98f08df177c2131%7C5094c7a70748466e941e72882c3097ba%7C0%7C0%7C639255494108588139%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;amp;sdata=ZXFAoNZiU9WEeSKq7FuEpv3xSMCXQrdZa9CBk0%2BJNIA%3D&amp;amp;reserved=0\&quot; target=\&quot;_blank\&quot;&gt;Part C&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;What the Draft Amendment does&lt;\/h3&gt;&lt;p&gt;Draft Amendment C192mari proposes to make the following changes to the Maribyrnong Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Rezone the land at 291 Gordon Street, Maribyrnong from Schedule 3 to Clause 37.02 Comprehensive Development Zone (CDZ3) to Schedule 4 to Clause 37.02 Comprehensive Development Zone (CDZ4).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend Schedule 3 to Clause 37.02 Comprehensive Development Zone (CDZ3) so the Riverside Physical Framework Plan No.1 (1992) no longer applies to the land at 291 Gordon Street, Maribyrnong and removes the requirement for a Landfill Agreement.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 72.04 (Incorporated documents) to include the new incorporated document titled \u2018291 Gordon Street Comprehensive Development Plan, August 2026\u2019 to inform the key land use and development outcomes for the land.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The amendment will remove the outdated purpose of the land as landscaped landfill and open space and recreation, as currently designated in the Riverside Physical Framework Plan No.1 (1992), to facilitate the medium density residential development of the land, and the creation of vehicle access to the subject site through Thompson Reserve (Crown land) to Gordon Street.&lt;\/p&gt;&lt;p&gt;The amendment will also facilitate a 15 per cent affordable housing contribution and future vehicle access to Jack\u2019s Magazine.&lt;\/p&gt;&lt;p&gt;A new access road is proposed through Thompson Reserve (Crown land) to provide access to Gordon Street, which is subject to separate approval by Maribyrnong City Council.&lt;\/p&gt;&lt;h3&gt;What the Draft Planning Permit does&lt;\/h3&gt;&lt;p&gt;A draft planning permit has been prepared under section 96A of the Act for the proposed use and redevelopment of 291 Gordon Street, Maribyrnong for 232 three storey dwellings, removal of vegetation and creation of access to Gordon Street through Thompson Reserve.&lt;\/p&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before deciding whether to proceed with the proposed Draft Amendment and planning permit for the land, the Minister for Planning is undertaking consultation under section 20(5) of the Act to understand the views of interested and affected parties.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister may decide to refer this matter to the Priority Projects Standing Advisory Committee for further advice before deciding about whether to prepare, adopt and approve the draft amendment and draft planning permit. If you make a submission, you will be informed if the matter is referred to the Priority Projects Standing Advisory Committee, and when a decision is made.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Development Assessment, Department of Transport and Planning on email at development.assessment@transport.vic.gov.au&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTA4VDA0OjQ0OjA1LjczMVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest ev
