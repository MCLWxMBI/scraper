quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94719,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2033,&quot;uuid&quot;:&quot;497bc71e-899b-4366-a579-703ce46e85e3&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Maribyrnong&quot;,&quot;file_name&quot;:&quot;maribyrnong_57db.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:648953,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59973},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92447,&quot;created_at&quot;:&quot;2026-09-08T02:46:49.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-08T02:46:50.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94719\/maribyrnong_57db.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2034,&quot;vid&quot;:365820,&quot;title&quot;:&quot;Draft Melton Planning Scheme Amendment C255melt&quot;,&quot;slug&quot;:&quot;draft-melton-psa-c255melt&quot;,&quot;summary&quot;:&quot;Have your say on the proposed rezoning of 100, 106 and 220 Riding Boundary Road Ravenhall from a farming to an industrial zone.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, adopt and approve a draft planning scheme Amendment C255melt to the Melton Planning Scheme under section 20(4) of the Planning and Environment Act 1987. The draft amendment applies to land at 100, 106 and 220 Riding Boundary Road, Ravenhall.&lt;\/p&gt;&lt;p&gt;The draft amendment seeks to rezone the land from Farming Zone to Industrial 1 Zone to facilitate the use and development of the land for industrial purposes. The amendment also proposes to apply the Development Plan Overlay (DPO) across the land to provide the necessary infrastructure to support the future development of the land.&lt;\/p&gt;&lt;p&gt;Consultation is being undertaken under section 20(5) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The Minister for Planning has been requested by proUrban on behalf of Dexus RBR Ravenhall Pty Ltd to rezone the land bounded by Christies Road, Riding Boundary Road, Western Freeway and Regional Railway Line being:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;100 Riding Boundary Road, Ravenhall, (Lot G on Plan of Subdivision 630147E)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;106 Riding Boundary Road, Ravenhall, (Lot 1 on PS713306)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;220 Riding Boundary Road, Ravenhall, (Lot 1 on PS803978)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;from Farming Zone to Industrial 1 Zone to allow for future industrial development to occur on the land.&lt;\/p&gt;&lt;p&gt;The amendment also proposes to apply the Development Plan Overlay across the land for the purpose of providing the necessary infrastructure to support the future development on the land.&lt;\/p&gt;&lt;p&gt;The documentation provided by proUrban includes a number of specialist reports addressing planning, ecology, drainage, traffic and cultural heritage matters.&lt;\/p&gt;&lt;p&gt;The amendment proposes to rezone land for industrial and employment purposes. If developed for industrial uses, the land has the potential to accommodate a range of businesses and employment activities in the future.&lt;\/p&gt;&lt;p&gt;The amendment is informed by State and local planning policies and strategic planning frameworks that seek to ensure an adequate supply of land for employment and industrial purposes. This includes the 10-Year Plan for Melbourne&#039;s Greenfields and the 10-Year Plan for Industrial Land, which identify the need to plan for future employment and industrial land requirements as Melbourne continues to grow.&lt;\/p&gt;&lt;p&gt;The amendment area is also identified in several strategic planning documents, including Plan for Victoria (2025), the Western Growth Corridor Plan (2012) and the Melbourne Industrial and Commercial Land Use Plan (2020), as part of a broader area intended to accommodate future employment-generating development.&lt;\/p&gt;&lt;p&gt;The amendment would facilitate the implementation of these strategic planning directions by providing for the future development of employment land in accordance with the planning framework applying to the area.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;Draft Amendment C255melt seeks to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Rezone the land from the Farming Zone (FZ) to the Industrial 1 Zone (IN1Z)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Apply the Development Plan Overlay (DPO) to the subject land&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 66.04 Referral of Permit Applications under Local Provisions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 66.06 Notice of Permit Applications under Local Provisions.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision on whether to proceed with the draft amendment, the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of affected landowners, occupiers and relevant agencies including the Melton City Council.&lt;\/p&gt;&lt;p&gt;All responses received during the consultation period will be considered by the Minister for Planning before a decision on the amendment is made.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Metropolitan Development Services, Department of Transport and Planning at metro.planningservices@transport.vic.gov.au&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTA5VDAwOjE1OjQ1Ljk2NVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;number_640&quot;:&quot;2&quot;,&quot;select_638&quot;:&quot;all&quot;,&quot;select_639&quot;:&quot;oldest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;number_650&quot;:&quot;2&quot;,&quot;select_648&quot;:&quot;all&quot;,&quot;select_649&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quo 2,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59973},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92468,&quot;created_at&quot;:&quot;2026-09-08T23:13:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-08T23:13:11.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94740\/melton_15ce.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2010,&quot;vid&quot;:364563,&quot;title&quot;:&quot;Casey Bus Consultation&quot;,&quot;slug&quot;:&quot;casey-bus&quot;,&quot;summary&quot;:&quot;Have your say and help shape our plans for better buses in your local area&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;h3&gt;We&#039;ve developed plans to improve bus services across Casey, including Cranbourne, Clyde, Berwick, Botanic Ridge, Junction Village, Tooradin, Warneet and surrounding areas, to support growing communities.&lt;\/h3&gt;&lt;p&gt;We want to hear from locals, visitors and commuters. Your feedback will help us deliver a better bus network that meets local travel needs.&lt;\/p&gt;&lt;p&gt;We\u2019re proposing changes to bus routes 795, 796, 836, 846, 888, 897, 899, and introducing new Route 896.&lt;\/p&gt;&lt;p&gt;We\u2019re proposing to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;extend and realign bus routes&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;introduce Route 896 Lynbrook Station - Casey Fields via Merinda Park and Cranbourne stations&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;add more frequent buses and improve connections across the network.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;These changes would:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;provide faster, more direct and frequent bus services&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;improve public transport access for more than 130,000 people&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;bring buses to new estates in parts of Cranbourne East and Clyde for the first time&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;make it easier to connect to trains, jobs, education, health services and shopping.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;This project is funded by the Growth Area Infrastructure Contributions (GAIC) Program.&lt;\/p&gt;&lt;p&gt;This work is part of Victoria\u2019s Bus Plan, which aims to increase the number of people who choose to take the bus by delivering simple, safe and reliable journeys.&lt;\/p&gt;&lt;h2&gt;Proposed changes&lt;\/h2&gt;&lt;p&gt;The maps below show the current bus network and the proposed bus network. You can slide the arrows to compare the changes.&lt;\/p&gt;&lt;p&gt;The coloured routes are proposed to change.&lt;\/p&gt;&lt;p&gt;The grey routes are currently not proposed to change. To provide feedback on the broader public transport network in your area, we encourage you to visit the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/transport.vic.gov.au\/contact-us\/public-transport-enquiries\&quot; target=\&quot;_blank\&quot;&gt;Transport Victoria&amp;nbsp;public transport enquiries and feedback page&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aW1hZ2VfY29tcGFyaXNvbl9zbGlkZXI6MjAyNi0wOS0xNlQwNTo1MDozNy41Mzha&quot;,&quot;type&quot;:&quot;image_comparison_slider&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[{&quot;alt&quot;:&quot;Map showing the current existing bus network in the City of Casey including Narre Warren, Cranbourne, Berwick, Beaconsfield, Casey Fields, Clyde, Botanic Ridge, Cannons Creek, Junction Village, Warneet, Blind Bight, and Tooradin. The map shows seven routes (routes 795, 796, 836, 846, 888, 897 and 899) travel paths. It also shows the current bus network not proposed to change.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/95000\/conversions\/dtpc0020-casey-bus-consultation-network-5000x5000-slider-existing-2_674a-thumb.jpg&quot;,&quot;name&quot;:&quot;dtpc0020-casey-bus-consultation-network-5000x5000-slider-existing-2_674a.png&quot;,&quot;media_id&quot;:95000}],&quot;label&quot;:&quot;Left map - current bus network&quot;},{&quot;alt&quot;:&quot;Map showing the proposed bus network in the City of Casey, including Narre Warren, Cranbourne, Berwick, Beaconsfield, Casey Fields, Clyde, Botanic Ridge, Cannons Creek, Junction Village, Warneet, Blind Bight, and Tooradin. The map shows six routes (routes 795, 796, 846, 888, and 897, and new Route 896) new travel paths. It also shows the current bus network not proposed to change.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/95001\/conversions\/dtpc0020-casey-bus-consultation-network-5000x5000-slider-proposed-2_63c0-thumb.jpg&quot;,&quot;name&quot;:&quot;dtpc0020-casey-bus-consultation-network-5000x5000-slider-proposed-2_63c0.png&quot;,&quot;media_id&quot;:95001}],&quot;label&quot;:&quot;Right map - proposed bus network&quot;}],&quot;caption&quot;:null,&quot;display&quot;:&quot;0-0&quot;,&quot;position&quot;:&quot;50&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE2VDA1OjQ4OjIzLjI3OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;You\u2019ll see the map enlargements under the summary of proposed changes below.&lt;\/p&gt;&lt;h4&gt;Summary of proposed changes:&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 795 Warneet - Cranbourne Station&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 795 is proposed to change its route path and be renamed.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 795 would travel via Riverwood Drive in Junction Village and eastern Botanic Ridge instead of South Gippsland Highway and a section of Craig Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Routes 795 and 796 would follow the same route through Junction Village and Devon Meadows, giving residents more services and better travel options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The changes would bring more bus services to residents of the Acacia, Greenwood and Octave estates.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 795 would continue to run between Warneet and Cranbourne Station but would no longer travel to Tooradin or Cannons Creek.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 795 would no longer travel to Tooradin. Route 796 would serve Tooradin residents instead.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 795 would no longer travel to Cannons Creek. This section of the route is currently used by fewer passengers than other parts of the network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The savings from no longer running to Cannons Creek would be reinvested into routes 795 and 796, helping to improve services in Warneet and Tooradin where the demand is higher.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 795 would be renamed Route 795 Warneet - Cranbourne Station via Junction Village.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;We\u2019re proposing to improve the frequency of peak-hour and daytime weekday services.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94992\/dtpc0020-casey-bus-consultation-a1p-map-routes-795-796-existing_b372.png\&quot; alt=\&quot;Map showing the current routes 795 and 795 travel paths in Cranbourne, Botanic Ridge, Junction Village, Devon Meadows, Cannons Creek, Warneet and Tooradin. It also shows the current bus network not proposed to change. \&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94993\/dtpc0020-casey-bus-consultation-a1p-map-routes-795-796-proposed-1_06b9.png\&quot; alt=\&quot;Map showing the current routes 795 and 795 travel paths in Cranbourne, Botanic Ridge, Junction Village, Devon Meadows, Cannons Creek, Warneet and Tooradin. Route 795 is proposed to be removed from Cannons Creek and still travel to Warneet. Route 796 is proposed to travel to Tooradin. It also shows the current bus network not proposed to change. \&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 796 Cranbourne Station - Clyde&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 796 is proposed to change its route path, be extended and renamed.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 796 would no longer travel to Clyde via Berwick-Cranbourne Road and Clyde-Five Ways Road. Instead, routes 888, 896 and 897 would serve sections of this area.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 796 would extend by 8.5 km along South Gippsland Highway to Tooradin, giving residents a more frequent and direct journey to Junction Village and Cranbourne.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 796 would travel through eastern Botanic Ridge via Riverwood Drive, replacing most of its current path on Craig Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Routes 795 and 796 would follow the same route through Junction Village and Devon Meadows, giving residents more services and better travel options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The changes would bring more bus services to residents of the Acacia, Greenwood and Octave estates.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 796 would be renamed Route 796 Tooradin - Cranbourne Station via Junction Village to reflect its new destination.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;We\u2019re proposing to improve the frequency of peak-hour and daytime weekday services.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94994\/dtpc0020-casey-bus-consultation-a1p-map-routes-795-796-existing_4d68.png\&quot; alt=\&quot;Map showing the current routes 795 and 795 travel paths in Cranbourne, Botanic Ridge, Junction Village, Devon Meadows, Cannons Creek, Warneet and Tooradin. It also shows the current bus network not proposed to change. \&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94995\/dtpc0020-casey-bus-consultation-a1p-map-routes-795-796-proposed-1_c996.png\&quot; alt=\&quot;Map showing the current routes 795 and 795 travel paths in Cranbourne, Botanic Ridge, Junction Village, Devon Meadows, Cannons Creek, Warneet and Tooradin. Route 795 is proposed to be removed from Cannons Creek and still travel to Warneet. Route 796 is proposed to travel to Tooradin. It also shows the current bus network not proposed to change. \&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 836 Berwick Station \u2013 Eden Rise SC via Bridgewater Estate&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 836 is proposed to be removed and replaced with an extended Route 846.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 836 currently duplicates other routes, follows an indirect path and has low patronage. The upgraded Route 846 would provide more frequent services, follow a more direct route and reduce duplication.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Some bus stops via Ridgemont Drive, Meadowlands Way, Skyline Way, Wurundjeri Boulevard, Jembecca Drive, Rivera Drive and Soldier Road would be removed to help create a simpler and more efficient bus network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;While some passengers may need to walk further, most residents would remain within 100 to 500 metres of Route 831 stops on Soldiers Road and Steeton Way, Route 846 stops on Wurundjeri Boulevard, Bridgewater Boulevard and O\u2019Shea Road, a Route 888 stop on Clyde Road or a Route 889 stop on Grices Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Residents would continue to have access to upgraded routes 846 and 888, as well as routes 831, 835, 889, 926 and 928.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;These changes would provide more direct connections and public transport options for residents living in the area.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route paths&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94887\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-existing_3603.png\&quot; alt=\&quot;Map showing the current routes 836, 846, 888 and 899 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route paths&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94888\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-proposed_b983.png\&quot; alt=\&quot;Map showing the proposed routes 846 and 888 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change. Routes 836 and 899 are removed in the proposed network and replaced with Route 846. Residents can also catch nearby existing routes. \&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 846 Berwick Station - Eden Rise SC via Bryn Mawr Bvd&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 846 is proposed to change its route path, be extended and renamed.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The route would follow a more direct path, providing faster travel for passengers.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 846 would extend by 2 km along Honour Avenue and Mountainview Boulevard in Clyde North.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Extending Route 846 would give some residents of the Berwick Waters and Waterfront, Aspen on Clyde, Waterside at Berwick Waters, Mondous Island, The Boulevard, Honour Village and New Bloom estates access to bus services for the first time.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Removing routes 836 and 899 would allow us to invest more in Route 846, giving passengers a more frequent and reliable service. The change would reduce duplication between routes and create a simpler network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Some bus stops via Marsh Grove, Cresthaven Boulevard and Moondarra Drive would be removed to help create a simpler and more efficient bus network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;While some passengers may need to walk further, most residents would remain within 100 to 500 metres of a Route 835 stop on Greaves Road or a Route 888 stop on Clyde Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 846 would be renamed Route 846 The Avenue Village SC - Berwick Station via Honour Avenue to reflect its new destination.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;We\u2019re proposing to improve the frequency of peak-hour and daytime weekday services.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94889\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-existing_cbba.png\&quot; alt=\&quot;Map showing the current routes 836, 846, 888 and 899 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94890\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-proposed_84d4.png\&quot; alt=\&quot;Map showing the proposed routes 846 and 888 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change. Routes 836 and 899 are removed in the proposed network and replaced with Route 846. Residents can also catch nearby existing routes. \&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 888 Clyde \u2013 Berwick Station&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 888 is proposed to be extended.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The route would extend by 2 km along Clyde-Five Ways Road to Railway Road and Oroya Grove in Clyde, replacing a current section of Route 796 on Clyde-Five Ways Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Extending Route 888 would improve access to public transport for people in Clyde between Ballarto Road and Patterson Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Extending Route 888 would also give residents of the Belmond on Clyde Estate access to bus services for the first time.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The route would continue providing connections to key destinations, including train station, schools, shopping centres and medical centres.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 888 name would remain as Route 888 Clyde - Berwick Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;We\u2019re proposing to improve the frequency of peak-hour and daytime weekday services.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94943\/dtpc0020-casey-bus-consultation-a1p-map-route-888-existing_7e28.png\&quot; alt=\&quot;Map showing the current route 888 travel paths in Berwick, Clyde and Cranbourne. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94944\/dtpc0020-casey-bus-consultation-a1p-map-route-888-proposed_837f.png\&quot; alt=\&quot;Map showing the proposed route 888 travel path in Berwick, Clyde and Cranbourne. Route 888 is proposed to be extended to Clyde North, replacing a current section of Route 796 on Clyde-Five Ways Road. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed new Route 896 Lynbrook Station \u2013 Casey Fields via Merinda Park and Cranbourne stations&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;New Route 896 would connect Lynbrook, Merinda Park and Cranbourne stations, via Lyndhurst Boulevard.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 896 would travel to Casey Fields, giving residents of the Mayfield, Parks Edge, Pavillion and Sapphire estates access to bus services for the first time.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The new route would replace a section of Route 897 between Lynbrook and Cranbourne Station. Buses would travel via Lyndhurst Boulevard instead of Melington Drive and Freshwater Boulevard in Lyndhurst, improving access for residential areas on both sides of Lyndhurst Boulevard.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 896 would provide direct access to Merinda Park Station, giving residents of Lyndhurst and Cranbourne West a new connection to the rail network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 896 would have a frequency of every 30 minutes on daytime peaks, and every 40 to 60 minutes all other times.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94945\/dtpc0020-casey-bus-consultation-796-897-new-896-proposed_a852.png\&quot; alt=\&quot;Map showing the proposed route 896 travel path in Cranbourne West, Cranbourne and Clyde. Route 896 travels to Casey Fields, giving residents of the Mayfield, Parks Edge, Pavillion and Sapphire estates access to bus services for the first time. The new route would replace a section of Route 897 between Lynbrook and Cranbourne Station. The map also shows the current bus network not proposed to change.\&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 897 Clyde North \u2013 Lynbrook Station via Cranbourne Park SC&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 897 is proposed to change its route path, be extended and be renamed.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 897 would extend by 2.5 km along Riverland Road in Clyde, giving residents of the Bella and Evergreen estates access to bus services for the first time.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 897 would continue travelling between Cranbourne Station and Clyde via Patterson Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 897 would no longer travel between Lyndhurst and Cranbourne Station, and instead new Route 896 would serve the section.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 897 would be renamed Route 897 Cranbourne Station - Clyde via Riverland Road to reflect its new destinations.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 897 frequency would be similar to the current timetable, with services running every 20 minutes seven days a week.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94946\/dtpc0020-casey-bus-consultation-a1p-map-route-897-existing_baa1.png\&quot; alt=\&quot;Map showing the current route 897 travel paths in Cranbourne West, Cranbourne and Clyde. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route path&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94947\/dtpc0020-casey-bus-consultation-a1p-map-route-897-proposed_2c8f.png\&quot; alt=\&quot;Map showing the proposed route 897 travel path in Cranbourne West, Cranbourne and Clyde. Route 897 is proposed to be extended along Patterson Road in Clyde North, giving residents access to public transport for the first time. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Proposed changes to Route 899 The Avenue Village SC - Berwick&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Route 899 is proposed to be removed and replaced with an extended Route 846&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Route 899 currently duplicates other routes and has low patronage. The upgraded Route 846 would provide more frequent services and reduce duplication between routes, creating a simpler network&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;No existing Route 899 bus stops would be removed, passengers will continue to be served by extended Route 846, Route 888, or other local bus routes in Clyde North and Berwick.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;These changes would provide more direct connections and public transport options for residents living in the area.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Current route paths&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94891\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-existing_55a5.png\&quot; alt=\&quot;Map showing the current routes 836, 846, 888 and 899 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change.\&quot;&gt;&lt;p&gt;&lt;strong&gt;Proposed route paths&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94892\/dtpc0020-casey-bus-consultation-836-846-899-in-berwick-proposed_bb61.png\&quot; alt=\&quot;Map showing the proposed routes 846 and 888 travel paths in Berwick and Cranbourne North. It also shows the current bus network not proposed to change. Routes 836 and 899 are removed in the proposed network and replaced with Route 846. Residents can also catch nearby existing routes. \&quot;&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTExVDA2OjI2OjQ3LjU2OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;Complete the survey &lt;\/strong&gt;\u2013 This helps us understand your experience using the local bus network, or why you don\u2019t use buses and your feedback on the proposed changes.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Chat to us in person at a pop-up session near you &lt;\/strong&gt;\u2013 find out more about the project, our team can help answer your questions or help you complete the survey. There is no set program so you can drop by at any time during the session.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Ask us a question &lt;\/strong&gt;\u2013&lt;strong&gt; &lt;\/strong&gt;Our Frequently Asked Questions cover most general queries, it\u2019s the fastest way to find what you need. If you can\u2019t find your answer there, please submit your question below and a member of our team will be in touch soon.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;How to participate&quot;}},{&quot;id&quot;:&quot;cGFydGlj /project\/casey-bus\/timeline\/37598&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37599,&quot;vid&quot;:359306,&quot;title&quot;:&quot;Report back and next steps&quot;,&quot;description&quot;:null,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:null,&quot;date_end&quot;:&quot;Early 2027&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-08-26T03:54:57.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-26T03:56:43.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2010,&quot;created_by_id&quot;:48971,&quot;modified_by_id&quot;:48971,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/casey-bus\/timeline\/37599&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2010,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:47,&quot;title&quot;:&quot;Transport&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2010,&quot;tag_id&quot;:47,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94837,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2010,&quot;uuid&quot;:&quot;e9704674-a5f7-4dfa-8b82-4a2df03bf723&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;DTPC0020_Casey Bus Consultation_Website_Campaign_2500x900px_v1_FA (1)&quot;,&quot;file_name&quot;:&quot;dtpc0020-casey-bus-consultation-website-campaign-2500x900px-v1-fa-1_344f.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:1649571,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:48971},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92558,&quot;created_at&quot;:&quot;2026-09-11T01:25:22.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-11T01:25:24.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94837\/dtpc0020-casey-bus-consultation-website-campaign-2500x900px-v1-fa-1_344f.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2019,&quot;vid&quot;:365272,&quot;title&quot;:&quot;Registration and licensing of carpenters&quot;,&quot;slug&quot;:&quot;registration-and-licensing-of-carpenters&quot;,&quot;summary&quot;:&quot;Help shape a new trades registration and licensing scheme&quot;,&quot;description&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--secondary\&quot;&gt;&lt;p&gt;The Department of Transport and Planning is consulting on proposed changes that would require building trades to hold a registration or licence, starting with carpenters. The proposed framework could be expanded to other priority building trades in the future.&lt;\/p&gt;&lt;p&gt;These changes are intended to improve the quality of work, enhance consumer protections and support better outcomes for consumers and industry.&lt;\/p&gt;&lt;\/div&gt;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;Of Victoria\u2019s three largest trades, carpenters, plumbers and electricians, only carpenters remain unregulated. This means subcontractors and employees can physically carry out carpentry work regardless of whether they have any qualifications or experience.&lt;\/p&gt;&lt;p&gt;Introducing registration and licensing for carpenters would bring around 20,000 tradespeople into the regulatory framework for the first time. This would ensure all major building trades are subject to minimum standards and can be held accountable for the compliance of their work.&lt;\/p&gt;&lt;p&gt;Implementation should recognise existing skills and experience, maintain workforce capacity, minimise unnecessary red tape, and improve consumer protection.&lt;\/p&gt;&lt;p&gt;A registration and licensing scheme aims to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Ensure individuals undertaking restricted work have the necessary qualifications, skills and experience.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Improve incentives for skills development and workforce capability, including the completion of apprenticeships.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Promote consistency between requirements for trade contractors and building trade employees.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Strengthen accountability for non-compliant building work through appropriate disciplinary processes.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Reduce the incidence of non-compliant building work across the industry.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Have your say&lt;\/h3&gt;&lt;p&gt;The Department of Transport and Planning is seeking feedback on a consultation paper exploring how the trades registration and licensing framework should operate in Victoria.&lt;\/p&gt;&lt;p&gt;Feedback received through this consultation process will inform the implementation of trades registration and licensing for carpentry in the first instance, and other priority trades in future.&lt;\/p&gt;&lt;p&gt;We want to hear from carpenters, builders, peak bodies, other building practitioners and consumers to understand priorities and help shape the scheme.&lt;\/p&gt;&lt;h3&gt;Participate&lt;\/h3&gt;&lt;p&gt;We invite you to have your say on the consultation paper via our online survey or written submission. We welcome responses from individuals or organisations.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTExVDA0OjI2OjQ1LjI2OVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6818&quot;,&quot;6817&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMTFUMDE6MDc6NDIuMzE1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48403&quot;,&quot;48402&quot;,&quot;48401&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTExVDA1OjUyOjE1LjkwMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Accessibility&lt;\/strong&gt;&lt;\/h4&gt;&lt;p&gt;If you would like to receive these documents in an alternative format, please email building.policy@transport.vic.gov.au, or telephone the National Relay Service on 133 677 (www.relayservice.com.au).&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;cGFnZXM6MjAyNi0wOS0wMlQwMDozMjoyMi43MjVa&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0wOVQwMTo1Mzo1MS4xMDla&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:4,&quot;children&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTEwVDA1OjA4OjA4LjMzNVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;As part of the Department of Transport and Planning\u2019s reforms to deliver safe and quality buildings for consumers, a new registration and licensing scheme for carpenters has been proposed.&lt;\/p&gt;&lt;p&gt;Currently, not all tradespeople involved in a project require a registration to perform building work \u2013 generally only the builder needs to be registered. The proposed changes would mean that subcontractors and employees who physically carry out carpentry work would also require a registration or licence with the Building and Plumbing Commission. Registration and licensing would provide assurance that carpenters have adequate qualifications, skills and experience to carry out carpentry work and enhance accountability for the quality and compliance of their work.&lt;\/p&gt;&lt;p&gt;A start date for carpentry registration and licensing is yet to be decided. We welcome any views on transitional considerations such as when new requirements should commence.&lt;\/p&gt;&lt;p&gt;Before any new regulations are introduced, a Regulatory Impact Statement and exposure draft of regulations will be released for formal public consultation in accordance with the requirements of the Subordinate Legislation Act 1994. To subscribe to updates on these reforms, click the \u201cfollow\u201d button at the top of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;1.\tWhat is changing and when?&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAxOjU2OjI1LjcwMFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Department of Transport and Planning is seeking views from Victorians on a possible implementation approach for carpentry registration and licensing. The consultation paper discusses key issues and questions on four key themes:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;The objectives of registration and licensing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;How to apply a risk-based approach&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;How to transition the existing carpentry workforce into registration and licensing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Implementation and operational readiness.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you would like to have your say, please make a submission or complete the survey on this page. The Department will use submissions and survey responses to inform the development of the new registration and licensing scheme for carpentry tradespeople.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;2.\tWhat is this consultation about?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAxOjU3OjAwLjcwOFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;If implemented, the new scheme would require subcontractors who undertake regulated carpentry work to hold a subcontractor registration. To be eligible for registration, subcontractors would have to meet minimum qualification and experience requirements, be a fit and proper person and meet certain financial probity requirements.&lt;\/p&gt;&lt;p&gt;Unregistered subcontractors would no longer be permitted to undertake regulated carpentry work.&lt;\/p&gt;&lt;p&gt;Alternative suggestions regarding the application of registration requirements to carpentry subcontractors are welcome as part of this consultation.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;3.\tHow would the changes impact carpentry subcontractors?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAxOjU3OjM2LjUxMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;If implemented, the new scheme would require carpenters who are employed by a registered builder or subcontractor to hold an employee licence in order to undertake carpentry work. To be eligible for an employee licence, carpenters would have to meet minimum qualification and experience requirements. No fit and proper person test or financial probity requirements would apply to carpentry employees.&lt;\/p&gt;&lt;p&gt;Unlicensed employees would no longer be permitted to undertake regulated carpentry work.&lt;\/p&gt;&lt;p&gt;Alternative suggestions regarding the application of licensing requirements to employee carpenters are welcome as part of this consultation.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;4.\tHow would the changes impact employee carpenters?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjAyOjM4LjYxNFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Consumers will benefit from being able to access qualified, experienced carpenters with confidence that they are competent to perform the work and can be held accountable for that work. The changes aim to reduce non-compliant carpentry work, resulting in less instances of costly rectification work, a more efficient carpentry workforce and better builds.&lt;\/p&gt;&lt;p&gt;Consumers and builders will benefit by having appropriately qualified people carrying out carpentry work who can be held to account under a disciplinary process in the event they carry out non-compliant work.  &lt;\/p&gt;&lt;p&gt;Before hiring a carpenter, consumers and builders will be able to check the trade\u2019s registration or licence status and any disciplinary history on a public register. This will make it easier for consumers and builders alike to identify competent and qualified trades.  &lt;\/p&gt;&quot;,&quot;title&quot;:&quot;5.\tHow would the changes impact consumers?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjAzOjA3LjgxNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The introduction of subcontractor registration and employee licensing for carpentry work would not change the existing arrangements for registration and accountability of registered builders. Builders whose registration already authorises the carrying out of carpentry work will not be required to obtain an additional registration under the proposed trade registration and licensing scheme to carry out work they are already authorised to perform. However, registered builders will be required to ensure only appropriately registered or licensed carpenters are working on their projects.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;6.\tHow would the changes impact registered builders?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjAzOjM2LjY3OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;No, registration and licensing requirements will not apply to apprentices. Carpentry apprentices will not require a licence or registration provided the carpentry work they carry out is done in the course of their carpentry apprenticeship and on behalf of their employer. Once an apprentice successfully completes their carpentry apprenticeship, they will need to apply for a registration or licence if they wish to carry out regulated carpentry work.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;7.\tWould the changes apply to carpentry apprentices?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjA0OjA5LjA0NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;If implemented, a registration would be available for subcontractors and a licence would be available for employees. Either option would authorise a carpenter to physically perform regulated carpentry work, but only registration would also authorise certain business functions (for example, to subcontract for building work). Because of the broader scope of a registration, additional requirements would apply including a fit and proper person test and financial probity criteria.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;8.\tWhat is the difference between a registration and a licence?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjA0OjU3LjM3NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;A decision has not yet been made as to what carpentry work should be regulated. One option is that only carpentry work with a mandatory building standard under the National Construction Code or the Building Regulations 2018 would be regulated and restricted to registered or licensed carpenters. This would include the following types of carpentry:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Framing;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Door and windows;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Cladding; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Formwork and falsework.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;This proposed scope of regulated carpentry work would apply to all applicable building classes (under the National Construction Code) across the domestic and commercial sectors, regardless of the value of the work.&lt;\/p&gt;&lt;p&gt;Alternative suggestions regarding the scope of carpentry work which should be regulated are welcome as part of this consultation.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;9.\tWhat carpentry work will be regulated?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjA1OjI1LjIyNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Carpentry work is prioritised as the first trade due to its complexity and the significant risk of defects and non-compliance. Subcontractors and employees who physically carry out carpentry work are not currently required to hold an individual registration or licence. There are no minimum qualification or experience requirements for this work, providing limited assurance that carpenters have the skills and competence required to perform it safely and to standard. This also limits direct regulatory accountability and the information available to consumers and builders about a carpenter&#039;s competence and regulatory history.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;10.\tWhy is carpentry work prioritised for registration and licensing?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAyOjA2OjEzLjc3Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;In addition to the consultation paper, the Department of Transport and Planning has published a reference document containing analysis undertaken in 2024 to inform the preparation of a Regulatory Impact Statement for the introduction of carpentry registration and licensing. The analysis was not released at that time as work was paused to allow for other priority reforms, including the establishment of the Building and Plumbing Commission. &lt;\/p&gt;&lt;p&gt;The 2024 impact analysis is published for historical reference only. It is provided to assist stakeholders in understanding a point in time record of the policy analysis undertaken up to 2024 and to support informed feedback on the issues outlined in the consultation paper. The proposals and analysis in the document do not represent current Victorian Government policy and have not been updated to reflect the current regulatory system following recent reforms. &lt;\/p&gt;&lt;p&gt;Feedback received through this consultation process will inform potential proposals for regulatory change in the future. If this occurs, the Government will release an up-to-date Regulatory Impact Statement for public consultation in accordance with the requirements of the &lt;em&gt;Subordinate Legislation Act 1994&lt;\/em&gt;.  &lt;\/p&gt;&quot;,&quot;title&quot;:&quot;11.\tWhat is the 2024 impact analysis?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTI5VDA0OjExOjQ1Ljk2M1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;In addition to carpentry, the Government has identified waterproofing and welding as priorities for registration and licensing in a future stage. The consideration of these trades is supported by $16 million in funding in the 2026\/27 Victorian State Budget.&lt;\/p&gt;&lt;p&gt;The addition of any further trades will be subject to future funding and decisions of Government.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;12. Will there be other trades registered beyond carpentry?&quot;}}],&quot;settings&quot;:{&quot;type&quot;:&quot;accordion&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDAxOjUyOjA3LjA3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:3,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Next Steps&lt;\/h3&gt;&lt;p&gt;Your feedback will play an important role in shaping the development of a new registration and licensing scheme for trades, starting with carpenters.  &lt;\/p&gt;&lt;p&gt;Implementation of any changes will be staged and supported by ongoing engagement with industry and the community. Before introducing new regulations to implement the scheme, the Department will develop and release a formal Regulatory Impact Statement and draft regulations for public consultation. &lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-10-11T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;building.policy@transport.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&
