;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2019,&quot;tag_id&quot;:39,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:40,&quot;title&quot;:&quot;Jobs&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2019,&quot;tag_id&quot;:40,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94498,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2019,&quot;uuid&quot;:&quot;c2d6612e-05c4-487d-9a7e-439382375dad&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;carpenters Image&quot;,&quot;file_name&quot;:&quot;carpenters-image_c6dd.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:53469,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59973},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92232,&quot;created_at&quot;:&quot;2026-09-02T00:28:32.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-02T00:28:33.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94498\/carpenters-image_c6dd.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1967,&quot;vid&quot;:362033,&quot;title&quot;:&quot;Montmorency to Eltham Shared Use Path&quot;,&quot;slug&quot;:&quot;montmorency-to-eltham-shared-use-path&quot;,&quot;summary&quot;:&quot;Help inform planning for a new shared use path from Montmorency to Eltham.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The new shared use path between Montmorency Station and Alistair Knox Park in Eltham will connect to over 600km of biking and walking routes across Melbourne.&lt;\/p&gt;&lt;p&gt;It will directly link to Greensborough via Montmorency and to the Diamond Creek Trail in Eltham.&lt;\/p&gt;&lt;p&gt;We\u2019ve released the proposed route of the shared user path and now want the community to have its say on parts of the design.&lt;\/p&gt;&lt;p&gt;The path will be delivered in 2 sections:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Section 1: Montmorency Station to Petrie Park&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Section 2: Petrie Park to Alistair Knox Park&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Building a shared use path within this area is complex due to the proximity to the Hurstbridge rail corridor and infrastructure, environmentally sensitive areas, multiple road crossings, steep grades and the presence of both underground and overhead services.&lt;\/p&gt;&lt;p&gt;To minimise any impacts, the new shared use path will be located along the southern side of the Hurstbridge rail line and behind property boundary fences.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Map: Proposed shared use path route from Montmorency Station to Alistair Knox Park.&lt;\/strong&gt;&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94738\/montmorency-to-eltham-sup-alignment-map-aug-2026_9d3c.png\&quot; alt=\&quot;Map with a line that indicates the location of the proposed shared use path from Montmorency Station to Alistair Knox Park.   The line begins from the Montmorency train station and follows along the southern side of the rail line beside Binns Street and crosses Mountain View Road into Petrie Park. There is grey hashed shading over Petrie Park to indicate that the shared use path alignment through Petrie Park is still to be determined. The line continues along the southern side of the rail line from Petrie Park to Sherbourne Road via Stephens Street. It crosses Sherbourne Road near the Rattray Road intersection before continuing along the southern side of the rail line to connect to an existing path in Alistair Knox Park.\&quot;&gt;&lt;h3&gt;&lt;\/h3&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTEwVDAxOjI0OjUwLjEyM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Section 1: Montmorency Station to Petrie Park&lt;\/strong&gt;&lt;\/h4&gt;&lt;p&gt;We will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Widen the existing footpath on the northern side of Binns Street to a shared use path.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Build a crossing for bike riders and pedestrians on Mountain View Road.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Build a shared use path in Petrie Park.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Further investigations are underway to determine the route of the shared use path through Petrie Park.&lt;\/p&gt;&lt;h4&gt;&lt;strong&gt;Have your say: Binns Street&lt;\/strong&gt;&lt;\/h4&gt;&lt;p&gt;To build the new shared use path, we are considering three design options for Binns Street:&lt;\/p&gt;&lt;ol&gt;&lt;li&gt;&lt;p&gt;Making Binns Street one-way for westbound traffic, which would retain most on-street parking.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Making Binns Street one-way for eastbound traffic, which would retain most on-street parking.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Maintaining two-way traffic which would require several on-street parking spaces to be removed.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ol&gt;&quot;,&quot;title&quot;:&quot;About the project&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aW1hZ2VfZ2FsbGVyeToyMDI2LTA5LTEwVDAxOjQ2OjIwLjIzNlo=&quot;,&quot;type&quot;:&quot;image_gallery&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;ratio&quot;:&quot;16_9&quot;,&quot;title&quot;:&quot;Binns Street option images&quot;,&quot;images&quot;:[{&quot;alt&quot;:&quot;Map showing Option 1 for the shared use path along Binns Street, making Binns Street one-way for westbound traffic, which would retain most on-street parking.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/94799\/conversions\/dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-1-1490px-fa-4484-thumb.jpg&quot;,&quot;name&quot;:&quot;dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-1-1490px-fa-4484.png&quot;,&quot;media_id&quot;:94799}],&quot;caption&quot;:&quot;Option 1&quot;},{&quot;alt&quot;:&quot;Map showing Option 2 for the shared use path along Binns Street, making Binns Street one-way for westbound traffic, which would retain most on-street parking.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/94800\/conversions\/dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-2-1490px-fa-d29a-thumb.jpg&quot;,&quot;name&quot;:&quot;dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-2-1490px-fa-d29a.png&quot;,&quot;media_id&quot;:94800}],&quot;caption&quot;:&quot;Option 2&quot;},{&quot;alt&quot;:&quot;Map showing Option 3 for the shared use path along Binns Street, making Binns Street two-way traffic which would require several on-street parking spaces to be removed.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/94801\/conversions\/dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-3-1490px-fa-8e3f-thumb.jpg&quot;,&quot;name&quot;:&quot;dtp1878-montmorency-to-eltham-shared-user-path-a4l-map-option-3-1490px-fa-8e3f.png&quot;,&quot;media_id&quot;:94801}],&quot;caption&quot;:&quot;Option 3&quot;}],&quot;display&quot;:&quot;gallery&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTEwVDAxOjMzOjEzLjQyM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Click on the map images to enlarge.&lt;\/p&gt;&lt;p&gt;See the table below for an overview of the proposed changes for each design option.&lt;\/p&gt;&lt;table role=\&quot;none\&quot; class=\&quot;engage-table\&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Treatment&lt;\/strong&gt;&lt;\/p&gt;&lt;\/th&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Option 1: One-way on Binns Street (westbound direction only)&lt;\/strong&gt;&lt;\/p&gt;&lt;\/th&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Option 2: One-way on Binns Street (eastbound direction only)&lt;\/strong&gt;&lt;\/p&gt;&lt;\/th&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Option 3: Two-way traffic maintained&lt;\/strong&gt;&lt;\/p&gt;&lt;\/th&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Shared use path&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Off-road path with a minimum 2.5m width&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Off-road path with a minimum 2.5m width&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Off-road path with a minimum 2.5m width&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Direction of traffic&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Westbound &lt;\/strong&gt;traffic only on Binns Street between Were Street and Mountain View Road.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;p&gt;Towards Were Street and the Montmorency shops.&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Eastbound &lt;\/strong&gt;traffic only on Binns Street between Were Street and Mountain View Road.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;p&gt;Towards Mountain View Road.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;&lt;strong&gt;Two-way traffic&lt;\/strong&gt; maintained on Binns Street between Were Street and Mountain View Road.&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Traffic lane width&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Minimum 3.3m width for one-way traffic&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Minimum 3.3m width for one-way traffic&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Minimum 4m width for two-way traffic&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Traffic calming measures being considered&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;40 km\/h speed limit&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Raised safety platforms&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;One-way only&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;40 km\/h speed limit&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Raised safety platforms&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;One-way only&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;40 km\/h speed limit&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Raised safety platforms&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicles will need to give way and take turns to pass in some sections due to a reduction in the road width.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Estimated street parking impacted (final number to be confirmed when designs are completed)&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;21 parking spots retained of 26 parking spots&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;(5 parking spots removed)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;21 parking spots retained of 26 parking spots&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;(5 parking spots removed)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;13 parking spots retained of 26 parking spots&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;(13 parking spots removed)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;176\&quot;&gt;&lt;p&gt;&lt;strong&gt;Environment&lt;\/strong&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;No trees to be removed on Binns Street. Some tree pruning required.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;No impact on the habitat of the protected Eltham Copper Butterfly.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;No trees to be removed on Binns Street. Some tree pruning required.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;No impact on the habitat of the protected Eltham Copper Butterfly.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;No trees to be removed on Binns Street. Some tree pruning required.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;No impact on the habitat of the protected Eltham Copper Butterfly..&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;\/tbody&gt;&lt;\/table&gt;&lt;h4&gt;&lt;strong&gt;Section 2: Petrie Park to Alistair Knox Park&lt;\/strong&gt;&lt;\/h4&gt;&lt;p&gt;The proposed route of the shared use path from Petrie Park to Alistair Knox Park in Eltham will be along the southern side of the rail line behind property boundary fences.&lt;\/p&gt;&lt;p&gt;The path will follow the southern side of the rail line from Petrie Park to Stephens Street. From there, it will connect to Sherbourne Road via a dedicated crossing point and a shared use path along a section of Stephens Street.&lt;\/p&gt;&lt;p&gt;To improve safety for pedestrians and bike riders crossing Sherbourne Road, we\u2019ll replace the existing Sherbourne Road and Rattray roundabout with new traffic lights and crossings. Due to site constraints including utility services, rail assets and steep grades, we cannot build a shared use path at the bridge on Sherbourne Road.&lt;\/p&gt;&lt;p&gt;We\u2019ll continue the shared use path along the southern side of the rail line from Sherbourne Road to Alistair Knox Park and build a new crossing for pedestrians and bike riders at Silver Street.&lt;\/p&gt;&lt;p&gt;Site investigations and planning activities are continuing to further develop the designs for section 2 of the new shared use path.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDA4OjI2OjA0LjQ4MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The project is in the planning and detailed design stages. We\u2019re seeking your feedback on three potential design options for Binns Street and invite you to share your thoughts on the proposed shared use path from Montmorency to Eltham.&lt;\/p&gt;&lt;p&gt;The survey will take approximately 10 minutes to complete.&lt;\/p&gt;&lt;p&gt;The survey is open from Thursday 10 September and will close at 11.59 pm on Thursday 1 October.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;How to participate&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTA4VDA2OjQxOjUzLjY3Mlo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6603&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA3OjIzOjU1Ljc0MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Feedback received will be used to inform planning and shape the designs for the new shared use path at Binns Street. Further investigations and detailed design work will be undertaken to finalise the path design. &lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDA4OjI3OjM4LjE5Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;For more information or to stay up to date with this project, visit the Montmorency to Eltham Shared Use Path page on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/transport.vic.gov.au\/news-and-resources\/projects-hub\/greater-melbourne\/montmorency-to-eltham-shared-use-path\&quot; target=\&quot;_blank\&quot;&gt;Transport Victoria website&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;More information&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA4VDA2OjQ5OjQ1LjkwM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Background&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;What types of investigations have you completed to date?&lt;\/strong&gt;&amp;nbsp;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;We have completed a range of investigations including but not limited to environmental impact assessments, safety assessments and audits, and design feasibility investigations. &amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;How wide will the shared use path be?&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The width of the shared use path will vary depending on the location and the site constraints. The path will be at least 2.5m wide.&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Why is the shared use path on the southern side of the rail line?&lt;\/strong&gt;&amp;nbsp;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;During early planning, we investigated shared use path alignment options on both the north and south sides of the Hurstbridge rail line. The southern side is preferred because it provides more accessible gradients, reduces environmental impacts and minimises impacts and disruptions to rail infrastructure and services.&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Why do you need to remove parking on Binns Street?&lt;\/strong&gt;&amp;nbsp;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Widening the existing footpath on the northern side of Binns Street to a shared use path will take space from the road to ensure that there is no impact on the protected Eltham Cooper Butterfly located north of the existing road reserve.&lt;strong&gt;&amp;nbsp;&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h3&gt;Environment&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Will there be any impacts on trees?&lt;\/strong&gt;&amp;nbsp;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;We understand how important the local environment is to the community, including endemic trees and wildlife such as the protected Matted Flax-lily and Eltham Copper Butterfly.&lt;\/p&gt;&lt;p&gt;In planning the project, we are carefully considering safety, environmental impacts \u2014 including local flora and fauna \u2014 accessibility, cultural heritage and site conditions.&lt;\/p&gt;&lt;p&gt;Early assessments have identified tree removal will be required along the 2.5 km shared use path alignment including Petrie Park, Stephens Street and Alistair Knox Park. This includes a mix of indigenous and planted native and exotic species, including some environmental weeds. Retaining trees and vegetation is a priority for the project, and strict environmental approvals and performance requirements are in place. Native vegetation that is impacted as part of the project will be offset in accordance with relevant approvals.&lt;\/p&gt;&lt;p&gt;To help minimise environmental impacts, we have identified trees and areas of environmental significance, and we are exploring design and construction approaches to retain as much vegetation as possible.&lt;\/p&gt;&lt;p&gt;We are assessing around 150 trees that may need to be removed across the alignment, subject to further design and investigation works. We will provide detailed information about vegetation removal in each section as designs are finalised.&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Will you be replanting or landscaping as part of these works?&lt;\/strong&gt;&amp;nbsp;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Landscaping and replanting will be undertaken as part of the project to create habitat and replace canopy cover and amenity screening. More information will be shared as planning and design progress.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Frequently asked questions&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;number_125&quot;:&quot;2&quot;,&quot;select_123&quot;:&quot;all&quot;,&quot;select_124&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;images&quot;:[],&quot;number_120&quot;:&quot;8&quot;,&quot;number_775&quot;:&quot;8&quot;,&quot;select_118&quot;:&quot;all&quot;,&quot;select_119&quot;:&quot;latest&quot;,&quot;select_773&quot;:&quot;all&quot;,&quot;select_774&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}}],&quot;date_end&quot;:&quot;2026-10-01T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1967,&quot;tag_id&quot;:47,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94791,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1967,&quot;uuid&quot;:&quot;2e004b83-1c91-45e5-8be8-876ee654e6fe&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Active-Transport-Bendigo-Seniors-Cyclists-Park-4361-2022&quot;,&quot;file_name&quot;:&quot;active-transport-bendigo-seniors-cyclists-park-4361-2022_5e98.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:3359282,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:39560},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92515,&quot;created_at&quot;:&quot;2026-09-10T01:11:23.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-10T01:11:25.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94791\/active-transport-bendigo-seniors-cyclists-park-4361-2022_5e98.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1098,&quot;vid&quot;:361161,&quot;title&quot;:&quot;Bunyip North Quarry Inquiry and Advisory Committee&quot;,&quot;slug&quot;:&quot;Bunyip-North-Quarry-IAC&quot;,&quot;summary&quot;:&quot;An Inquiry and Advisory Committee is collecting submissions to consider the environmental effects of the proposed Bunyip North Quarry Project.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;The Minister for Planning (the Minister) will appoint a joint Inquiry and Advisory Committee (IAC) to consider and advise on the environmental effects of the proposed works for the Bunyip North Quarry Project (the Project). The IAC is an independent group of experts tasked with this assessment.&lt;\/p&gt;&lt;p&gt;The IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;review the Environment Effects Statement (EES), draft Planning Scheme Amendment C261card to the Cardinia Planning Scheme (draft PSA), the Environment Protection Authority (EPA) development licence application and public submissions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;hold a public hearing to hear from the Proponent and submitters who want to speak to their written submission&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide advice to the Minister about the environmental effects of the Project and the draft PSA; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide recommendations to inform the EPA\u2019s consideration of the development licence application under the &lt;em&gt;Environment Protection Act 2017.&lt;\/em&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The IAC will follow &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48289 \&quot; target=\&quot;_blank\&quot;&gt;Terms of Reference&lt;\/a&gt; approved by the Minister. The Terms of Reference will set out the IAC\u2019s scope (including what it can and can\u2019t consider). The Terms of Reference can be found in the Document section at the bottom of this page.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Inquiry and Advisory Committee members&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The appointment of the Inquiry and Advisory Committee (IAC) is in progress. The names of the IAC members will be published here following their appointment.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjA4OjQ3LjY0MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;The Proposal&lt;\/strong&gt;&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;The Proposal&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Bunyip North Quarry Project (the Project) involves the proposed development of:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;a granite (rock) quarry on a 220-hectare greenfield site in Bunyip North, within the municipality of Cardinia, Victoria; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;associated extraction, processing and ancillary infrastructure to support quarrying operations.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The project site is located approximately two kilometres south of Bunyip State Park and one kilometre east of Mount Cannibal Reserve. It is bound by Sanders Road to the north, private agricultural land to the south-east, and private property on Wollondilly Road and Wallaby Court to the west, with the site boundary extending south-east to Bunyip-Tonimbuk Road.&lt;\/p&gt;&lt;p&gt;The key components of the project include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;an open cut granite quarry pit with a maximum pit footprint of approximately 70 hectares and a maximum depth of approximately 140 metres below natural surface&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;extraction of approximately 120 million tonnes of granite aggregate product over the Project\u2019s anticipated 75-year lifetime;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;quarrying and hard rock crushing infrastructure, including primary, secondary and tertiary crushing and screening for processing extracted aggregate&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;processing capacity of up to 2 million tonnes per annum&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;overburden stockpile areas and associated water management infrastructure; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;permanent and temporary ancillary infrastructure to support extraction and processing operations.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The Proponent is Heidelberg Materials Australia Pty Ltd.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;View the proposal&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;You may view and download the exhibited EES, draft PSA, EPA development licence application and other related documents on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.heidelbergmaterials.com.au\/en\/community-information\/bunyip-north-quarry\&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48290 \&quot; target=\&quot;_blank\&quot;&gt;public notice&lt;\/a&gt; has more information about where you can see hard copies of the EES in person, as well as collect a USB information pack.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjE0OjEwLjYzOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Public Exhibition&lt;\/strong&gt;&lt;\/h3&gt;&lt;p&gt;The Project will be on public exhibition for 30 business days between &lt;strong&gt;Monday 7 September 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Tuesday 20 October 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You are invited to make a submission to the IAC during this time. Please use the online submission form below to submit your written submission.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;If you want to participate and speak at the IAC\u2019s Hearing, you must make a written submission and indicate on the submission form that you want to be heard. The IAC will consider all written submissions when preparing its advice in accordance with its Terms of Reference, whether or not a submitter chooses to speak.&lt;\/p&gt;&lt;p&gt;If you make a submission, you will be notified about the timing and location of the Hearing after the exhibition period has closed.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjEzOjAwLjI3NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Directions Hearing&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC will hold a Directions Hearing at &lt;strong&gt;10:00am on Wednesday 4 November 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and make arrangements for the Hearing and its site inspection&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;will issue directions about how the IAC process will be conducted, including timeframes for circulating further written submissions and expert statements (if any).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Parties will have an opportunity to raise procedural issues and ask questions about the IAC process.&lt;\/p&gt;&lt;p&gt;More information about the Directions Hearing will be published here once the details are confirmed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Hearing&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Hearing will commence in the &lt;strong&gt;week beginning Monday 30 November 2026&lt;\/strong&gt;. Depending on how many submitters ask to speak, the Hearing may run for three to four weeks. A timetable for the Hearing will be published after the Directions Hearing.&lt;\/p&gt;&lt;p&gt;Note if the Hearing is not concluded prior to Christmas, the IAC will not sit between Wednesday 23 December 2026 and Friday 15 January 2027 (inclusive).&lt;\/p&gt;&lt;p&gt;The purpose of the Hearing is to give people an opportunity to speak about the issues raised in their written submissions. The Proponent (Heidelberg Materials Australia Pty Ltd) will also have the opportunity to speak and present expert evidence at the hearing. The Hearing is open to the public, so anyone can watch.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Report&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC must prepare a report for the Minister for Planning. This report will include the IAC\u2019s advice and recommendations about the environmental effects of the Project and the draft PSA in accordance with the scope of the IAC\u2019s Terms of Reference. It will also provide recommendations to inform the EPA\u2019s consideration of the development licence application.&lt;\/p&gt;&lt;p&gt;The&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48289  \&quot; target=\&quot;_blank\&quot;&gt; Terms of Reference&lt;\/a&gt; require the IAC to submit its report to the Minister for Planning and the EPA within 30 business dates from the last day of its proceedings, unless the report writing period falls over the Christmas \u2013 New Year period in which case 40 business days will apply.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the IAC\u2019s report to inform the Minister\u2019s Assessment of the environmental effects of the project under the&amp;nbsp;&lt;em&gt;Environment Effects Act 1978.&amp;nbsp;&lt;\/em&gt;This Assessment will be considered by statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the IAC report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Inquiry and Advisory Committee Process&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjE0OjA5LjcyMlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Have your say - make a submission&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;You can make a written submission between &lt;strong&gt;Monday 7 September 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Tuesday 20 October 2026&lt;\/strong&gt; by completing the online form below.&lt;\/p&gt;&lt;p&gt;If you want to speak at the Hearing, tick the box when completing the form.&lt;\/p&gt;&lt;p&gt;You only need to make one submission to share all your views on the EES, draft PSA and EPA development licence application.&lt;\/p&gt;&lt;p&gt;Please refer to the IAC\u2019s&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48289  \&quot; target=\&quot;_blank\&quot;&gt; Terms of Reference &lt;\/a&gt;for information about the scope of its role.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission or would like to submit a hard copy, contact Planning Panels Victoria on 136 186 (select option 6) or email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy and Intellectual Property&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Your written submission will be a public document. To make a written submission, you must read the Privacy Collection Statement and click \u2018agree\u2019 where indicated on the online form.&lt;\/p&gt;&lt;p&gt;The Privacy Collection Statement explains how we will use your submission and any other information you provide to the IAC, which includes putting it online and providing it to the Proponent, other parties to the Hearing and to the organisations and government agencies specified in the Terms of Reference.&lt;\/p&gt;&lt;p&gt;You should not include any personal information in your written submission that could identify you or other people unless you (or they) are happy for that information to be made publicly available. Examples are email addresses, phone numbers or photos of people (particularly children). You should also not include any material authored by another person unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA4LTI3VDA0OjM0OjE0LjI4N1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Online submission form&quot;,&quot;images&quot;:[],&quot;select_284&quot;:&quot;custom&quot;,&quot;select_343&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;4732&quot;],&quot;limit&quot;:2}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjE0OjEyLjk4NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:10,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Click the \u2018Start survey\u2019 button to make your submission.&lt;\/strong&gt;&lt;\/h3&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMDZUMTQ6MDQ6NDUuMjA1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48056&quot;,&quot;48057&quot;,&quot;48288&quot;,&quot;48289&quot;,&quot;48290&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA2VDE0OjE0OjU3LjA1N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h5&gt;&lt;strong&gt;Making a submission&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to lodge my written submission online?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes, please use the online form to make your written submission. You can type (or copy and paste) directly into the form or upload a file as an attachment. Accepted file types include PDF, DOC, DOCX, TXT, RTF, PNG, GIF, JPG, and JPEG.&lt;\/p&gt;&lt;p&gt;Each file must be under 20MB, and the total of all files uploaded to the form must be under 40MB.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a hard copy submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Online submissions are strongly preferred. However, if you unable to submit online, you can send a hard copy.&lt;\/p&gt;&lt;p&gt;A hard copy written submission must be accompanied by a completed \u2018Submission Coversheet\u2019 which you can request from Planning Panels Victoria through the Customer Call Centre&lt;em&gt; &lt;\/em&gt;on 136 186 (select option 6) or by emailing &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;. The Submission Coversheet includes important information we need to process your submission, to enable you to participate in the IAC process if you want to be heard, and privacy information.&lt;\/p&gt;&lt;p&gt;Make sure your submission and Submission Coversheet arrive before the exhibition period ends (11:59pm on Tuesday 20 October 2026).&lt;\/p&gt;&lt;p&gt;Please do not email your written submission directly to Planning Panels Victoria or any other party such as the Minister for Planning, the Department of Transport and Planning (DTP) Impact Assessment Unit, the EPA or the Proponent.&amp;nbsp; If you do, it may not be considered by the IAC.&amp;nbsp; Please use the online submission form, or if this is not possible, send a hard copy with a completed coversheet to Planning Panels Victoria.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to make separate submissions on the EES, draft PSA and EPA development licence application?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;All submissions will be treated as a submission to all the exhibited documents (the EES, draft PSA and EPA development licence application).&amp;nbsp; You don\u2019t need to make a separate submission on each document. You should include all your views about the project and its effects in one single submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;I might want legal support in making a submission or to help me during the IAC process. What resources are available to me?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;It is not a requirement to have legal support to make your submission or participate in the IAC process, however you may choose to engage a lawyer to assist you.&lt;\/p&gt;&lt;p&gt;Foley\u2019s List barristers is offering a Legal Assistance Service that offers low-cost or no-cost legal support to eligible submitters in Planning Panel Victoria hearings.\u202f Available to individuals and community groups, the service offers legal advice and representation to help participants navigate PPV processes (subject to barrister availability).&amp;nbsp; Assistance ranges from preliminary advice to full representation, with fees reduced or waived.&amp;nbsp;&amp;nbsp; \u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;To participate, submitters must meet eligibility criteria.&amp;nbsp; More information about the Service and eligibility criteria is available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planningpanels.vic.gov.au\/guides-and-resources\/legal-assistance-service\&quot; target=\&quot;_blank\&quot;&gt;PPV website&lt;\/a&gt;, including who you need to contact at Foley\u2019s List to apply for assistance.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a submission on behalf of a group or organisation?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Organisations, residents, or groups of individual submitters with similar issues are encouraged to provide a single joint submission.&lt;\/p&gt;&lt;p&gt;Correspondence to organisations and residents\u2019 groups will be directed to the nominated contact person for that group.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a petition?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Petitions will be treated as a single submission, and correspondence will only be sent to the person who organised the petition.&amp;nbsp; If the organiser is not clear, it will be the first name to appear on the petition.&lt;\/p&gt;&lt;p&gt;If you want to be contacted individually about the IAC process or want to be heard at the Hearing, you will need to make your own individual written submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a pro-forma submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Submissions that have substantially the same content will be treated as pro forma submissions, and pro forma submitters who want to be heard at the Hearing will be heard as a group.&amp;nbsp; If you want to be heard as an individual, you should make your own individual written submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;How will I know if my written submission was received?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;After you click \u2018Submit\u2019, you\u2019ll see a message confirming it was lodged.&lt;\/p&gt;&lt;p&gt;If you want a copy of your submission, enter your email address and click \u2018Send me a copy\u2019. Check your spam \/ junk folder if it doesn\u2019t arrive.&lt;\/p&gt;&lt;p&gt;If you don\u2019t receive the confirmation email, contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I request to make my submission confidential?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In some circumstances, you may not want your name or certain information to be published online. As detailed in the Terms of Reference and Privacy Collection Statement, the IAC can hear submissions or accept material on a confidential basis, provided this would be fair to the Proponent and other parties to the Hearing.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you want your name withheld, or to provide your submission or material confidentially, you must request permission from the IAC Chair in writing through PPV and provide reasons why the IAC should treat your submissions or material confidentially.&amp;nbsp; Please contact PPV at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt; with these requests.&lt;\/p&gt;&lt;p&gt;Even where confidentiality is granted, confidential submissions will still need to be shared with the Proponent, and other relevant organisations and government agencies identified in the Terms of Reference to ensure issues raised can be appropriately considered and addressed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;What happens to my submission?&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Will my submission be made public?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. All submissions are public documents and will be published on the Engage Victoria website.&lt;\/p&gt;&lt;p&gt;Your name, submission and other material you provide will be published online unless you ask PPV not to. Personal details like your address and phone number will be removed, but you should ensure you don\u2019t include these in the main part of your submission (only include your details in the online form or cover sheet).&lt;\/p&gt;&lt;p&gt;Please read the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48056\&quot; target=\&quot;_blank\&quot;&gt;Privacy Collection Statement&lt;\/a&gt; before making your submission. Don&#039;t include information that identifies other people unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;Speaking at the Hearing&lt;\/strong&gt;&lt;\/h5&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I have to make a submission if I want to speak at the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. To speak at the Hearing, you must make a written submission during the exhibition period.&lt;\/p&gt;&lt;p&gt;You will need to tick the box on the online form to say you want to be heard. You\u2019ll also need to tell us:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how long you want to speak about the issues in your written submission&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;who will represent you (you may represent yourself or have someone else speak for you)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;if you will call any experts in support of your submission.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you request to be heard by the IAC, you will become a &#039;party&#039; to the IAC process. You will be given a timeslot to present in the Hearing timetable and advised of the arrangements for the IAC process before the Directions Hearing, Hearing and through any directions issued by the IAC.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What if I do not want to speak at the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;That\u2019s fine. You don\u2019t need to speak to your written submission for it to be considered by the IAC.&lt;\/p&gt;&lt;p&gt;If you do not want to be heard by the IAC, you will not be a party to the IAC process. You will receive correspondence from the IAC acknowledging your submission. However, you will not receive any further correspondence about the IAC process and may not be able to submit additional information to the IAC.&lt;\/p&gt;&lt;p&gt;You can still follow the process by checking this webpage&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTMxVDA5OjQ0OjE0LjcxN1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;For questions about making a submission, the Inquiry and Advisory Committee process or Hearing, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Planning Panels Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186 (select option 6)&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Bunyip North Quarry Project, the Environment Effects Statement (EES), draft PSA and EPA development licence application, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Heidelberg Materials Australia Pty Ltd&lt;\/p&gt;&lt;p&gt;\u260e Phone: (03) 9274 3700&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:community.bunyipnorth@aus.heidelbergmaterials.com\&quot;&gt;community.bunyipnorth@aus.heidelbergmaterials.com&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.heidelbergmaterials.com.au\/en\/community-information\/bunyip-north-quarry\&quot;&gt;https:\/\/www.heidelbergmaterials.com.au\/en\/community-information\/bunyip-north-quarry&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Minister&#039;s Assessment and EES process contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Impact Assessment Unit, Department of Transport and Planning&lt;\/p&gt;&lt;p&gt;\u260e Phone: (03) &amp;nbsp;8572 7980&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assessment@transport.vic.gov.au\&quot;&gt;environment.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the EPA development licence application contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Permissioning Licensing, EPA Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 1300 372 842&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:permissions@epa.vic.gov.au\&quot;&gt;permissions@epa.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Contacts&quot;}},{&quot;id&quot;:&quot;dXBkYXRlczoyMDI2LTA4LTI0VDA0OjAyOjMyLjk5NFo=&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;number_64&quot;:&quot;2&quot;,&quot;select_62&quot;:&quot;all&quot;,&quot;select_63&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;cGFnZXM6MjAyNi0wOC0yN1QwNDozMzoyNC4xMzBa&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}}],&quot;date_end&quot;:&quot;2026-10-20T23:59:00&quot;,&quot;region_id&quot;:3,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Planning Panels Victoria&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;136 186 (select option 6)&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;office@planningpanels.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2022-05-25T04:28:43.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-06T14:17:25.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5465,&quot;team_id&quot;:21,&quot;created_by_id&quot;:20430,&quot;modified_by_id&quot;:19525,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/Bunyip-North-Quarry-IAC&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-theme__default&quot;,&quot;static_map&quot;:null,&quot;status_label&quot;:&quot;Published&quot;,&quot;subscribe_form_schema&quot;:{&quot;subscribe&quot;:{&quot;title&quot;:&quot;Follow&quot;,&quot;description&quot;:&quot;Enter your email below for updates about the &lt;strong&gt;Bunyip North Quarry Inquiry and Advisory Committee&lt;\/strong&gt; project&quot;,&quot;button_text&quot;:&quot;Follow this project&quot;},&quot;unsubscribe&quot;:{&quot;title&quot;:&quot;You are following&quot;,&quot;description&quot;:&quot;Click the unfollow button to stop receiving updates about the &lt;strong&gt;Bunyip North Quarry Inquiry and Advisory Committee&lt;\/strong&gt; project.&quot;,&quot;button_text&quot;:&quot;Unfollow&quot;,&quot;footer_text&quot;:&quot;You can manage the projects you&#039;re following anytime by visiting &lt;a href=https:\/\/engage.vic.gov.au\/profile\/subscriptions&gt;Subscriptions&lt;\/a&gt; under your profile&quot;}},&quot;consult_status&quot;:{&quot;id&quot;:1,&quot;name&quot;:&quot;open&quot;,&quot;label&quot;:&quot;Open for feedback&quot;},&quot;show_table_of_contents&quot;:false,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;image&quot;:{&quot;id&quot;:94051,&quot;name&quot;:&quot;BNQ Pic 1 - Cropped&quot;,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94051\/bnq-pic-1-cropped_300a.jpg&quot;,&quot;ext&quot;:&quot;jpg&quot;,&quot;size&quot;:&quot;1.47 MB&quot;,&quot;thumb&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94051\/conversions\/bnq-pic-1-cropped_300a-thumb.jpg&quot;,&quot;hero&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94051\/conversions\/bnq-pic-1-cropped_300a-hero.jpg&quot;,&quot;full&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94051\/conversions\/bnq-pic-1-cropped_300a-full.jpg&quot;},&quot;public_stages&quot;:[{&quot;id&quot;:32492,&quot;vid&quot;:360126,&quot;title&quot;:&quot;Exhibition Stage: Submissions&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Bunyip North Quarry Project EES is on public exhibition for 30 business days.&lt;\/p&gt;&lt;p&gt;During this time, members of the public are invited to make a written submission on the EES, draft PSA and EPA development licence application. Submissions help the Inquiry and Advisory Committee (IAC) understand how the Project may affect people, communities, and the environment.&lt;\/p&gt;&lt;p&gt;Submissions must be made in writing. To make a submission, use the online submission form under the Participate tab.&lt;\/p&gt;&lt;p&gt;You must make a written submission if you want to participate in the IAC Hearing.&amp;nbsp;The IAC will consider all submissions, whether or not a submitter chooses to speak at the Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:1,&quot;date_start&quot;:&quot;Monday 7 September 2026&quot;,&quot;date_end&quot;:&quot;11:59pm Tuesday 20 October 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2022-05-25T04:28:44.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-31T09:48:00.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1098,&quot;created_by_id&quot;:20430,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Bunyip-North-Quarry-IAC\/timeline\/32492&quot;,&quot;summary&quot;:&quot;The Bunyip North Quarry Project EES is on public exhibition...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37584,&quot;vid&quot;:360127,&quot;title&quot;:&quot;Hearing Stage: Directions Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Inquiry and Advisory Committee (IAC) will hold a Directions Hearings at &lt;strong&gt;10:00am on Wednesday 4 November 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and make arrangements for the Hearing and its site inspection&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;will issue directions about how the IAC process will be conducted, including timeframes for circulating further written submissions and expert statements (if any).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Parties will have an opportunity to raise procedural issues and ask questions about the IAC process.&lt;\/p&gt;&lt;p&gt;The Directions Hearing helps make sure everyone is prepared and understands what to expect during the process and at the main Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:2,&quot;date_start&quot;:&quot;Wednesday 4 November 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-08-24T04:48:24.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-31T09:49:36.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1098,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Bunyip-North-Quarry-IAC\/timeline\/37584&quot;,&quot;summary&quot;:&quot;The Inquiry and Advisory Committee (IAC) will hold a Directions...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37585,&quot;vid&quot;:360128,&quot;title&quot;:&quot;Hearing Stage: Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Hearing will commence in the &lt;strong&gt;week beginning Monday 30 November 2026&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for three to four weeks.&lt;\/p&gt;&lt;p&gt;The Hearing gives the Proponent and submitters who asked to be heard a chance to speak about the issues raised in their written submissions.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Week beginning Monday 30 November 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-08-24T04:49:08.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-31T09:50:16.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1098,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Bunyip-North-Quarry-IAC\/timeline\/37585&quot;,&quot;summary&quot;:&quot;The Hearing will commence in the week beginning Monday 30...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37586,&quot;vid&quot;:361162,&quot;title&quot;:&quot;Report Stage: Report and next steps&quot;,&quot;description&quot;:&quot;&lt;p&gt;Once the Hearing ends, the Inquiry and Advisory Committee (IAC) must prepare a report for the Minister for Planning. This report will include the IAC\u2019s advice and recommendations about the environmental effects of the Project and the draft Planning Scheme Amendment in accordance with its Terms of Reference. It will also provide recommendations to inform the Environment Protection Authority\u2019s (EPA) consideration of the development licence application.&lt;\/p&gt;&lt;p&gt;The&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/48289%20%20\&quot; target=\&quot;_blank\&quot;&gt; Terms of Reference&lt;\/a&gt; require the IAC to submit its report to the Minister for Planning and the EPA within 30 business dates from the last day of its proceedings, unless the report writing period falls over the Christmas \u2013 New Year period in which case 40 business days will apply.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the IAC\u2019s report to inform the Minister\u2019s Assessment of the environmental effects of the project under the&amp;nbsp;&lt;em&gt;Environment Effects Act 1978.&amp;nbsp;&lt;\/em&gt;This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the IAC report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:4,&quot;date_start&quot;:&quot;February - March 2027&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-08-24T04:49:50.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-06T14:17:25.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1098,&quot;created_by_id&quot;:58870,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Bunyip-North-Quarry-IAC\/timeline\/37586&quot;,&quot;summary&quot;:&quot;Once the Hearing ends, the Inquiry and Advisory Committee (IAC)...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:34,&quot;title&quot;:&quot;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1098,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1098,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94051,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1098,&quot;uuid&quot;:&quot;497c272e-8adb-4b2b-b025-3d86ac506a54&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;BNQ Pic 1 - Cropped&quot;,&quot;file_name&quot;:&quot;bnq-pic-1-cropped_300a.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:1545448,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:58870},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91789,&quot;created_at&quot;:&quot;2026-08-24T04:10:45.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-24T04:10:47.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94051\/bnq-pic-1-cropped_300a.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2028,&quot;vid&quot;:361080,&quot;title&quot;:&quot;Draft Moyne Planning Scheme  Amendment C84moyn&quot;,&quot;slug&quot;:&quot;draft-moyne-planning-scheme-amendment-c84moyn&quot;,&quot;summary&quot;:&quot;Have your say on the draft  Moyne Planning Scheme  Amendment C84moyn&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, adopt and approve Draft Moyne Planning Scheme Amendment C84moyn at Connewarren Lane, Mortlake. Consultation is being undertaken under section 20(5) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;h3&gt;What the amendment does&lt;\/h3&gt;&lt;p&gt;The amendment applies the Specific Controls Overlay (SCO) to the land described above, introduces an incorporated document into the Moyne Planning Scheme, and varies a restrictive covenant. The incorporated document titled &#039;&lt;em&gt;Connewarren Battery Energy Storage System &amp;#40;BESS&amp;#41; Incorporated Document, July 2026&lt;\/em&gt;&#039; facilitates the use and development of land for a utility installation (battery energy storage system).&lt;\/p&gt;&lt;p&gt;Specifically, the amendment makes the following changes to the Moyne Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 45.12 (Specific Controls Overlay) to introduce the SCO5 and the incorporated document titled \u2018Connewarren Battery Energy Storage System &amp;#40;BESS&amp;#41; Incorporated Document, July 2026\u2019.as applying to the site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend Section 1.0 of Schedule to Clause 52.02 (Easements, Restrictions and Reserves) to insert:&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;table role=\&quot;none\&quot; class=\&quot;MsoTableGridLight\&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Land&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Easement or restriction&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Requirement&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Connewarren Lane, Mortlake, 3272 (Lots 1, 3, and 4 on Title Plan 311787H).&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Restrictive covenant contained in instrument AH178323W&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot;&gt;&lt;p&gt;Vary the restriction so that after the words:&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;\u201c\u2026to be used otherwise than for the purposes of\u201d (in section 2.1(a) of the restrictive covenant), insert the words:&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;\u201ctransmission, distribution and storage of power, (including any associated buildings and works)\u201d&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;\/tbody&gt;&lt;\/table&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 72.03 (What does this Planning Scheme consist of?) to include planning scheme map 13SCO.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 72.04 (Documents Incorporated in this Planning Scheme) to introduce the incorporated document titled \u2018Connewarren Battery Energy Storage System &amp;#40;BESS&amp;#41; Incorporated Document, July 2026\u2019.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Insert a new Planning Scheme Map 13 SCO into the Moyne Planning Scheme.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to proceed with the proposed Draft Amendment the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of affected parties.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact the Energy and Infrastructure Assessment team, Department of Transport and Planning by email at energyandinfrastructure@transport.vic.gov.au&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide a submission using the survey form below&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA4LTMwVDIyOjUzOjExLjY1MFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&qu
