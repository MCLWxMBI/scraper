uot;matomo&quot;:{&quot;url&quot;:&quot;https:\/\/engage-victoria.analytics.stack.host\/&quot;,&quot;site_id&quot;:&quot;5&quot;},&quot;strings&quot;:{&quot;loginFormErrorMessage&quot;:&quot;Due to platform improvements you may need to &lt;a href=\&quot;\/forgot-password\&quot;&gt;reset your password&lt;\/a&gt;&quot;},&quot;previewMode&quot;:{&quot;isPreview&quot;:false,&quot;versionId&quot;:-1},&quot;session&quot;:false,&quot;DistrictSurveyEmbed&quot;:{&quot;domain&quot;:&quot;https:\/\/engagevictoria.districtengage.com&quot;,&quot;footer_survey&quot;:{&quot;code&quot;:&quot;&lt;a href=\&quot;\/surveys\/secure_form\/survey\/csat-survey-engage-victoria\&quot; data-embed-url=\&quot;[DOMAIN]\/embed\/survey\/csat-survey-engage-victoria\&quot; class=\&quot;district-embed\&quot; data-width=\&quot;100%\&quot; data-height=\&quot;100%\&quot; target=\&quot;_blank\&quot;&gt;CSAT Survey Engage Victoria&lt;\/a&gt;&lt;script async src=\&quot;[DOMAIN]\/js\/embed.js\&quot; charset=\&quot;utf-8\&quot;&gt;&lt;\/script&gt;&quot;,&quot;enabled&quot;:true}},&quot;FrontendBanner&quot;:{&quot;html&quot;:&quot;&quot;,&quot;include_on_routes&quot;:[],&quot;css_class&quot;:&quot;uk-alert uk-alert-warning&quot;}},&quot;metatags&quot;:{&quot;title&quot;:&quot;Engage Victoria&quot;,&quot;meta&quot;:[{&quot;name&quot;:&quot;description&quot;,&quot;content&quot;:&quot;Engagement platform&quot;},{&quot;property&quot;:&quot;og:site_name&quot;,&quot;content&quot;:&quot;Engage Victoria&quot;},{&quot;property&quot;:&quot;og:locale&quot;,&quot;content&quot;:&quot;en_AU&quot;},{&quot;property&quot;:&quot;og:type&quot;,&quot;content&quot;:&quot;website&quot;},{&quot;name&quot;:&quot;generator&quot;,&quot;content&quot;:&quot;District Engage&quot;},{&quot;name&quot;:&quot;twitter:card&quot;,&quot;content&quot;:&quot;summary&quot;},{&quot;name&quot;:&quot;msapplication-TileColor&quot;,&quot;content&quot;:&quot;#dddddd&quot;},{&quot;name&quot;:&quot;theme-color&quot;,&quot;content&quot;:&quot;#ffffff&quot;}],&quot;links&quot;:[{&quot;rel&quot;:&quot;apple-touch-icon&quot;,&quot;sizes&quot;:&quot;120x120&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/apple-touch-icon.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;32x32&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-32x32.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;16x16&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-16x16.png&quot;},{&quot;rel&quot;:&quot;manifest&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/site.webmanifest&quot;,&quot;crossorigin&quot;:&quot;use-credentials&quot;},{&quot;rel&quot;:&quot;mask-icon&quot;,&quot;color&quot;:&quot;#008099&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/safari-pinned-tab.svg&quot;}]},&quot;messages&quot;:[],&quot;lang&quot;:&quot;en&quot;,&quot;meta&quot;:{&quot;current_page&quot;:1,&quot;data&quot;:[{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0yNFQwNTo1ODoyOC41MDJa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:6,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMjRUMDU6NTk6MDguMDU1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Development Plan&quot;,&quot;relationship&quot;:{&quot; ;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:95375,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2042,&quot;uuid&quot;:&quot;569cee7f-2abc-4059-8d26-fc9ea9714acb&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Press&quot;,&quot;file_name&quot;:&quot;press_ee33.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2867202,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59973},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:93086,&quot;created_at&quot;:&quot;2026-09-24T03:01:18.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-24T03:01:19.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/95375\/press_ee33.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2016,&quot;vid&quot;:365420,&quot;title&quot;:&quot;Morwell FlexGen Pty Ltd (APP050881)&quot;,&quot;slug&quot;:&quot;morwell-flexgen-pty-ltd-peaking-generation-facility-mpgf&quot;,&quot;summary&quot;:&quot;EPA and DTP have received applications for a peaking power generation facility from Morwell FlexGen Pty Ltd.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Joint publication of notices&lt;\/h2&gt;&lt;p&gt;Morwell FlexGen Pty Ltd proposes to develop a peaking power generation facility. This page relates to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;a development licence application submitted with Environment Protection Authority (EPA) Victoria, and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a planning permit application submitted with the Department of Transport and Planning (DTP)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Notice of these applications is being jointly published under section 70(b) of &lt;em&gt;the Environment Protection Act 2017&lt;\/em&gt;.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTI4VDAzOjIzOjAwLjUwN1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Overview&lt;\/h3&gt;&lt;p&gt;Applicant: Morwell FlexGen Pty Ltd&lt;\/p&gt;&lt;p&gt;Activity site: 454 Commercial Road, Morwell, 3840&lt;\/p&gt;&lt;p&gt;Application number: APP050881&lt;\/p&gt;&lt;p&gt;Activity code: K01 (Power generation)&lt;\/p&gt;&lt;h3&gt;What does the application propose?&lt;\/h3&gt;&lt;p&gt;EPA has received a development licence application from Morwell FlexGen Pty Ltd. The application is for a new peaking generation facility at 454 Commercial Road, Morwell VIC 3840.&lt;\/p&gt;&lt;p&gt;The peaking generation facility will be able to generate up to 20.5 megawatts (MW) of electricity. It will only operate when:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;electricity demand is high,&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the electricity network is under stress, or &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;severe weather affects power supply. &lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The facility will help keep electricity available when it is needed most. It is expected to operate on average 200 hours per year and up to 1,200 hours each year in peak use.  &lt;\/p&gt;&lt;p&gt;The proposed development includes:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Ten (10) power generators, each capable of producing about 2 megawatts (MW) of electricity;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Site transformers;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A Switchroom and Control Room Building;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A Site Maintenance Store;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Two (2) 70,000 Litre (L) self-bunded Diesel Fuel Storage Tanks;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A Firefighting Water Storage Tank (as per Country Fire Authority requirements)&amp;nbsp;and Septic Tank; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Appropriate parking and traffic arrangements.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The full application can be found in the \u2018Development licence application supporting documents\u2019&amp;nbsp;section of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Development licence application&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0yOFQwMzoyNDowNi45ODha&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:7,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMjRUMDM6MjI6MzMuNTMwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Development licence application&quot;,&quot;select_60&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48711&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMjRUMDM6MjI6NTkuMDAzWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Appendices&quot;,&quot;select_63&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48702&quot;,&quot;48703&quot;,&quot;48704&quot;,&quot;48705&quot;,&quot;48701&quot;,&quot;48707&quot;,&quot;48708&quot;,&quot;48709&quot;,&quot;48710&quot;,&quot;48706&quot;,&quot;48712&quot;,&quot;48713&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;accordion&quot;,&quot;title&quot;:&quot;Development licence supporting documents&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTI4VDAzOjIzOjUwLjIzNVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Overview&lt;\/h3&gt;&lt;p&gt;Applicant: &amp;nbsp;Morwell FlexGen Pty Ltd&lt;\/p&gt;&lt;p&gt;Subject site: 454 Commercial Road, Morwell, 3840&lt;\/p&gt;&lt;p&gt;Application number: PA2604443&lt;\/p&gt;&lt;p&gt;The planning permit application is for the use and development of an energy generation facility.&lt;\/p&gt;&lt;p&gt;The supporting documentation and details of the planning application can be accessed &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planning.vic.gov.au\/planning-approvals\/ministerial-permits-register\/ministerial-permits\/d4964a1c-265b-f111-bec6-7ced8d342c18\&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Planning permit application&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTI4VDAzOjIzOjM2LjAzNVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Notification of this submission period was published on 30 September 2026 in the Latrobe Valley Express.&lt;\/p&gt;&lt;h4&gt;Development licence application&lt;\/h4&gt;&lt;p&gt;EPA invites anyone who feels they may be affected by the proposed development activities to submit their comments by the survey at the bottom of this page.&lt;\/p&gt;&lt;p&gt;Public comments on the development licence application submitted before 11:59pm, 26 October 2026 will be considered.&lt;\/p&gt;&lt;h4&gt;Planning permit application&lt;\/h4&gt;&lt;p&gt;Any person who may be affected by the granting of the permit may object or make other submissions to the responsible authority (Minister for Planning) at either:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Post: PO Box 500, East Melbourne VIC 8002&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Email:&amp;nbsp;energyandinfrastructure@transport.vic.gov.au&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;The responsible authority will not decide on the planning permit application before&lt;strong&gt; &lt;\/strong&gt;28 October 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period open&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTAzVDAxOjI2OjQzLjA3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;For our translation service, please:&lt;\/p&gt;&lt;ol&gt;&lt;li&gt;&lt;p&gt;call Translating and Interpreting Service (TIS National) on 131 450&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;tell them the development licence application number and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;ask them to call EPA Victoria on 1300 372 842.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ol&gt;&quot;,&quot;title&quot;:&quot;Translation and interpreting service&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDAzOjIzOjQ0LjQxNFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;dXBkYXRlczoyMDI2LTA5LTI4VDAzOjI0OjA0LjQ5OFo=&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}}],&quot;date_end&quot;:&quot;2026-10-26T23:59:00&quot;,&quot;region_id&quot;:3,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;1300372842&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot e&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2016,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:13,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Environment Protection Authority&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;environment-protection-authority&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Environment Protection Authority&quot;,&quot;description&quot;:&quot;&lt;p&gt;Environment Protection Authority Victoria (EPA) is Victoria\u2019s&amp;nbsp;environmental regulator.&lt;\/p&gt;&lt;p&gt;For details about the current Development Licence Applications please visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/epa-development-licence-applications\&quot; target=\&quot;_blank\&quot;&gt;EPA Development Licence Applications&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94930,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2016,&quot;uuid&quot;:&quot;8fd0a5f9-11fb-46b4-8942-12f9297601fc&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;EPA Engage Vic Banner Photo - 454 Commercial Rd, Morwell&quot;,&quot;file_name&quot;:&quot;epa-engage-vic-banner-photo-454-commercial-rd-morwell_1fd3.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:145271,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92646,&quot;created_at&quot;:&quot;2026-09-14T02:17:47.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-14T02:17:48.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94930\/epa-engage-vic-banner-photo-454-commercial-rd-morwell_1fd3.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2031,&quot;vid&quot;:364721,&quot;title&quot;:&quot;Alpine Resorts Planning Scheme Amendment C30alpr&quot;,&quot;slug&quot;:&quot;psa-c30alpr&quot;,&quot;summary&quot;:&quot;Have your say on Alpine Resorts Planning Scheme Amendment C30alpr proposing changes to Victoria&#039;s six alpine resorts.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning has prepared Alpine Resorts Planning Scheme Amendment C30alpr, which implements the recommendations from the Alpine Resorts Planning Scheme Review (2021) and Alpine Resorts Planning Scheme Review Addendum (2026). These reviews were completed by the former Department of Environment, Land, Water and Planning in 2021 and the Department of Transport and Planning in 2026 in accordance with the requirements of Section 12B of the Planning and Environment Act 1987 (the PE Act).&lt;\/p&gt;&lt;h3&gt;What the amendment does&lt;\/h3&gt;&lt;p&gt;Section 12B of the PE Act requires a planning authority to carry out regular reviews of its planning scheme to enhance that scheme\u2019s effectiveness and efficiency in achieving the objectives of planning in Victoria and the objectives of the planning framework established by the PE Act.&lt;\/p&gt;&lt;p&gt;Amendment C30alpr aims to ensure that local planning policies and schedules are up to date and implement recent strategic work undertaken within the alpine resorts. Specifically, the amendment addresses the following key issues:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;The need to rationalise local planning policy and ensure local schedules are updated with relevant policy content.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The appropriateness of the continued use of the Comprehensive Development Zone (CDZ).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The need to update the application of the Environmental Significance Overlays, particularly as it relates to Mountain Pygmy Possum habitat across approximately 4.9 hectares of land in Mt Buller Village.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The need to update the Design and Development Overlay to remove duplication, improve guidance and incorporate provisions from the CDZ.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The need to update Framework Plans and correct mapping anomalies.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The need to identify future projects in Clause 74.02 Further Strategic Work.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to adopt the proposed Amendment the Minister for Planning is undertaking consultation under Section 19 of the PE Act to understand the views of relevant parties.&lt;\/p&gt;&lt;p&gt;Interested parties are invited to read the available resources on this page prior to making a submission.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact the Regional Planning Hub, Department of Transport and Planning on email at regional.planning.hub@transport.vic.gov.au&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTIzVDIzOjI1OjA2Ljg0M1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0xN1QyMjowNDozNy43MjVa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:6,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMTdUMjI6MDY6MTguNzM4Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Planning Scheme Amendment documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48551&quot;,&quot;48553&quot;,&quot;48554&quot;,&quot;48555&quot;,&quot;48564&quot;,&quot;48565&quot;,&quot;48566&quot;,&quot;48558&quot;,&quot;48559&quot;,&quot;48560&quot;,&quot;48561&quot;,&quot;48562&quot;,&quot;48563&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMThUMDA6MDk6MjEuNjI4Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Supporting documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48556&quot;,&quot;48557&quot;,&quot;48580&quot;,&quot;48572&quot;,&quot;48573&quot;,&quot;48571&quot;,&quot;48570&quot;,&quot;48569&quot;,&quot;48567&quot;,&quot;48568&quot;,&quot;48574&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:&quot;Documents&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTIyVDIzOjQ4OjAwLjAwNlo=&quot;,&quot;type&quot;:&quot;h name&quot;:&quot;c30alpr-picture2_081a.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:782069,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:62044},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92670,&quot;created_at&quot;:&quot;2026-09-15T00:37:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-15T00:37:22.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94954\/c30alpr-picture2_081a.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2015,&quot;vid&quot;:364855,&quot;title&quot;:&quot;Scientific Advisory Committee - Pregnant Bent-grass&quot;,&quot;slug&quot;:&quot;scientific-advisory-committee-pregnant-bent-grass&quot;,&quot;summary&quot;:&quot;Have your say on the Scientific Advisory Committee\u2019s preliminary recommendation to add the Pregnant Bent-Grass to the FFG Act Threatened List.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Scientific Advisory Committee has received a nomination to add Pregnant Bent-grass (&lt;em&gt;Deyeuxia gravida&lt;\/em&gt;)&amp;nbsp;to the&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/flora-and-fauna-guarantee-act-1988\/050\&quot;&gt;&lt;em&gt;Flora and Fauna Guarantee Act 1988&lt;\/em&gt;&lt;\/a&gt;&amp;nbsp;(FFG Act) Threatened List.&lt;\/p&gt;&lt;p&gt;The Scientific Advisory Committee has made a preliminary recommendation to list Pregnant Bent-grass as a threatened species under the FFG Act. Preliminary recommendations inform the public of the Scientific Advisory Committee\u2019s assessment of nominations.&lt;\/p&gt;&lt;p&gt;This preliminary recommendation is now open for public comment.&lt;\/p&gt;&lt;p&gt;Note that recommendations can only be based on nature conservation matters.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Image&lt;\/strong&gt;: Pregnant Bent-grass habitat at Cordover Swamp. Credit: David Pitts&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTI0VDAzOjMwOjM5LjgzMlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;Please upload a submission to share your comments about the Scientific Advisory Committee\u2019s preliminary recommendation to add Pregnant Bent-grass (Deyeuxia gravida) to the Flora and Fauna Guarantee Act Threatened List.  &lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/scientific-advisory-committee-pregnant-bent-grass\/survey\/6766\&quot; target=\&quot;_blank\&quot;&gt;Upload a written submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;The survey closes at 11:59pm on Monday 26 October, 2026&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;4&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTEwVDAyOjA5OjI1LjEzOFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Scientific Advisory Committee will review submissions and then write a final recommendation report.&lt;\/p&gt;&lt;p&gt;The final recommendation will be considered by the Minister for Environment and the Minister for Agriculture, who will make a joint decision on the nomination.&lt;\/p&gt;&lt;p&gt;The final recommendation report and Ministers\u2019 notice of decision will be available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.environment.vic.gov.au\/conserving-threatened-species\/scientific-advisory-committee\&quot; target=\&quot;_blank\&quot;&gt;Scientific Advisory Committee webpage.&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;To receive email updates, click on &lt;strong&gt;+ Follow&lt;\/strong&gt; at the top of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDA3OjQyOjIyLjA1N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.environment.vic.gov.au\/conserving-threatened-species\/scientific-advisory-committee\&quot; target=\&quot;_blank\&quot;&gt;Scientific Advisory Committee&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.environment.vic.gov.au\/conserving-threatened-species\/threatened-list\&quot; target=\&quot;_blank\&quot;&gt;Victoria&#039;s Threatened List and Processes List&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;title&quot;:&quot;Links&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTA5VDA3OjMxOjEwLjgxN1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Privacy&lt;\/h3&gt;&lt;p&gt;The Department of Energy, Environment, and Climate Action (DEECA) is committed to protecting personal information provided by you&amp;nbsp;in accordance with&amp;nbsp;the&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/ovic.vic.gov.au\/privacy\/for-the-public\/your-privacy-rights\/\&quot; target=\&quot;_blank\&quot;&gt;privacy&amp;nbsp;principles&lt;\/a&gt; in the&amp;nbsp;&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/privacy-and-data-protection-act-2014\/033\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Privacy and Data Protection Act 2014 (Vic)&lt;\/em&gt;&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;For more information about how DEECA collects, uses, discloses and manages personal information, please refer to DEECA&#039;s Privacy Statement at &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/privacy\&quot;&gt;https:\/\/www.deeca.vic.gov.au\/privacy&lt;\/a&gt;.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy collection statement&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Department of Energy, Environment, and Climate Action (DEECA) is committed to protecting personal information provided by you&amp;nbsp;in accordance with&amp;nbsp;the&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/ovic.vic.gov.au\/privacy\/for-the-public\/your-privacy-rights\/\&quot; target=\&quot;_blank\&quot;&gt;privacy&amp;nbsp;principles&lt;\/a&gt; in the&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/privacy-and-data-protection-act-2014\/033\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Privacy and Data Protection Act 2014 (Vic)&lt;\/em&gt;&lt;\/a&gt;.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The information you provide will be considered by the Scientific Advisory Committee&amp;nbsp;as&amp;nbsp;part of the assessment process.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Your submission, including any personal information you choose to provide, may be shared with Scientific Advisory Committee members and authorised DEECA staff supporting the Scientific Advisory Committee for the purpose of assessing submissions and developing recommendations under the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/flora-and-fauna-guarantee-act-1988\/050\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Flora and Fauna Guarantee Act 1988&lt;\/em&gt;&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;If you provide contact details, DEECA may contact you to clarify your submission or provide updates relevant to the consultation. Your personal information will not be published.&lt;\/p&gt;&lt;p&gt;The provision of personal information is optional, and you may remain anonymous. If you do not wish to be&amp;nbsp;identified, please ensure there is no information in your submission that could&amp;nbsp;identify&amp;nbsp;you or other individuals.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You can request access to, and corrections to, the information you have provided to the Scientific Advisory Committee by contacting the Scientific Advisory Committee Secretariat at&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:sac.secretariat@deeca.vic.gov.au\&quot;&gt;sac.secretariat@deeca.vic.gov.au&lt;\/a&gt;.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;For more information about how DEECA collects, uses, discloses and manages personal information, please refer to DEECA&#039;s Privacy Statement at &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/privacy\&quot;&gt;https:\/\/www.deeca.vic.gov.au\/privacy&lt;\/a&gt;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h3&gt;Accessibility&lt;\/h3&gt;&lt;p&gt;The Victorian Government is committed to providing a website that is accessible to the widest possible audience, regardless of technology or ability.&lt;\/p&gt;&lt;p&gt;If you are unable to access any of the content on this page, you can:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;email &lt;a class=\&quot;engage-link\&quot; title=\&quot;customer.service@deeca.vic.gov.au\&quot; href=\&quot;mailto:customer.service@deeca.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;customer.service@deeca.vic.gov.au&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:136186\&quot; target=\&quot;_blank\&quot;&gt;136 186&lt;\/a&gt; for alternative accessible formats&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.accesshub.gov.au\/about-the-nrs\&quot; target=\&quot;_blank\&quot;&gt;National Relay Service&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:133677\&quot; target=\&quot;_blank\&quot;&gt;133 677&lt;\/a&gt; if you are deaf or have a hearing or speech impairment&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; or call &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131450\&quot; target=\&quot;_blank\&quot;&gt;131 450&lt;\/a&gt; if you need help with translating and interpreting&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/93506\/image_249e.png\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/93509\/image_e76b.png\&quot;&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-10-26T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;department&quot;,&quot;value&quot;:&quot;Department of Energy, Environment and Climate Action&quot;},{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Scientific Advisory Committee&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;136 186&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;sac.secretariat@deeca.vic.gov.au&quot;},{&quot;type&quot;:&quot d&quot;:34,&quot;title&quot;:&quot;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2015,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:4,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-energy-environment-and-climate-action&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;description&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;12&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-31T03:09:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--12&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94644,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2015,&quot;uuid&quot;:&quot;7f1f0719-3ac9-4b82-a5ea-d90f0fd809a6&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Deyeuxia gravida habitat at Cordover Swamp credit David Pitts&quot;,&quot;file_name&quot;:&quot;deyeuxia-gravida-habitat-at-cordover-swamp-credit-david-pitts_ef65.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:6484228,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:48840},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92372,&quot;created_at&quot;:&quot;2026-09-07T07:15:16.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-07T07:15:19.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94644\/deyeuxia-gravida-habitat-at-cordover-swamp-credit-david-pitts_ef65.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2004,&quot;vid&quot;:364670,&quot;title&quot;:&quot;SRL East train stabling facility Urban Design and Landscape Plan&quot;,&quot;slug&quot;:&quot;srl-east-train-stabling-facility-urban-design-and-landscape-plan&quot;,&quot;summary&quot;:&quot;Help us shape the design and landscaping for the Suburban Rail Loop (SRL) East train stabling facility.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Train stabling facility urban design and landscape plan&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/h2&gt;&lt;p&gt;The train stabling facility will be built north of Kingston Road, Heatherton. The facility is being built near the start of the line to allow SRL\u2019s fleet of high-tech trains to begin services efficiently each day and provide a turn-up-and-go network for passengers.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;SRL trains will be parked at the train stabling facility when they are not in operation. While they are at the facility they will be cleaned, maintained and prepared for the next day.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;Have your say&amp;nbsp;&lt;\/h3&gt;&lt;p&gt;An urban design and landscape plan is required for the train stabling facility. The plan shows the proposed design and landscaping for&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;The train stabling facility including the rail line, and eastern tunnel entrance and western tunnel entrances&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Kingston Walk Linear Reserve enhancements&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Henry Street Linear Reserve enhancements&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;A new shared user path for pedestrians and cyclists, and landscaping on the northern side of Kingston Road, next to the train stabling facility.&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;As part of the design, we will plant more than 1,000 trees and 121,000sqm of new vegetation. This will soften the visual presence of the train stabling facility and ensure buildings are carefully integrated with landscaping.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Additionally, we will work with Kingston City Council to upgrade the Henry Street playground and are looking at additional opportunities to create open space around the train stabling facility. We will keep the community updated on these plans as designs progress.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Construction of train stabling facility buildings is expected to begin in 2027.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Community feedback will help inform the final train stabling facility urban design and landscape plan which will be provided to the Minister for Planning for assessment.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;Proposed train stabling facility design and landscaping&lt;strong&gt;&amp;nbsp;&lt;\/strong&gt;&amp;nbsp;&lt;\/h3&gt;&lt;h4&gt;&lt;\/h4&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/95331\/260923-udlp-site-plan_9cb1.png\&quot; alt=\&quot;Image show map location and opportunities for consultation\&quot;&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTIyVDAxOjAyOjU4LjMxN1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;The train stabling facility&amp;nbsp;&amp;nbsp;&lt;\/h4&gt;&lt;p&gt;SRL trains will come to the surface at the train stabling facility, where they will be stored, maintained and cleaned while not in service.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The facility has been designed with a strong focus on thoughtful and quality landscaping and greenery. Buildings are proposed to be pale eucalyptus green to integrate with surrounding plants and vegetation. The eastern and western tunnel entrances will include a metal curved screen to cover operational equipment and have been designed in keeping with the movement of trains in and out of the tunnels.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;h4&gt;Kingston Walk Linear Reserve and Henry Street Linear Reserve &amp;nbsp;&lt;\/h4&gt;&lt;p&gt;We are enhancing Kingston Walk Linear Reserve and Henry Street Linear Reserve. We want to ensure the community can continue to enjoy these reserves during construction and operation of the SRL East network.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Proposed enhancements include&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Improved and widened shared user paths&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Planting new trees&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Park furniture and rest spots along the linear reserves.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The existing fence through the middle of Kingston Walk Linear Reserve and adjoining gates will be removed. This will improve the community\u2019s access to the reserve.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;These enhancements will provide better connectivity for pedestrians and cyclists, soften the visual presence of the train stabling facility, and improve biodiversity, habitat and greenery.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We want to hear from you about other enhancements you would like to see in these linear reserves. This feedback will help to inform the detailed design of these open spaces.&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;h4&gt;Kingston Road, Heatherton&amp;nbsp; &amp;nbsp;&lt;\/h4&gt;&lt;p&gt;A new shared user path for pedestrians and cyclists, and landscaping will be created on the northern side of Kingston Road, next to the train stabling facility. The path will improve connectivity for pedestrians and cyclists to the enhanced linear reserves, Henry Street playground and Kingston Road bus stops.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;Community and stakeholder consultation&lt;\/h3&gt;&lt;p&gt;We are asking stakeholders and the community for feedback on the urban design and landscape plan for the SRL train stabling facility and adjacent linear parklands and road reserves.&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The plan has been developed in consultation with the SRL East Urban Design Advisory Panel, an independent panel with experts in architecture, urban design and landscape architecture. The panel will provide advice to the Minister for Planning on the compliance of the design with the SRL East Urban Design Strategy. This will support the Minister for Planning\u2019s assessment of the plan. &amp;nbsp;&lt;\/p&gt;&lt;p&gt;Feedback will be used to inform the final plan which will also be provided to the Minister for Planning for assessment.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We will provide a summary report of feedback and how it has been considered in the design.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;h4&gt;Artist impressions only: The train stabling facility urban design and landscape plan&lt;\/h4&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aW1hZ2VfZ2FsbGVyeToyMDI2LTA5LTIyVDA0OjU5OjQzLjQ3Nlo=&quot;,&quot;type&quot;:&quot;image_gallery&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;ratio&quot;:&quot;16_9&quot;,&quot;title&quot;:&quot;&quot;,&quot;images&quot;:[{&quot;alt&quot;:&quot;Concept only: View from Kingston Walk linear Reserve and Kingston Road looking east towards the western tunnel entrance.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/95089\/conversions\/udlp-western-tunnel-entrance-98ce-thumb.jpg&quot;,&quot;name&quot;:&quot;udlp-western-tunnel-entrance-98ce.jpg&quot;,&quot;media_id&quot;:95089}],&quot;caption&quot;:&quot;Concept only: View from Kingston Walk linear reserve and Kingston Road looking east towards the western tunnel entrance.&quot;},{&quot;alt&quot;:&quot;Concept only: Kingston Road shared user path, looking west.&quot;,&quot;image&quot;:[{&quo ot;id&quot;:37651,&quot;vid&quot;:364672,&quot;title&quot;:&quot;Construction of train stabling facility begins&quot;,&quot;description&quot;:null,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;2027&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-09-10T05:04:25.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-23T22:27:02.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2004,&quot;created_by_id&quot;:60919,&quot;modified_by_id&quot;:59622,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/srl-east-train-stabling-facility-urban-design-and-landscape-plan\/timeline\/37651&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37652,&quot;vid&quot;:364674,&quot;title&quot;:&quot;SRL East taking passengers&quot;,&quot;description&quot;:null,&quot;status&quot;:1,&quot;weight&quot;:4,&quot;date_start&quot;:&quot;2035&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-09-10T05:04:49.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-23T22:27:29.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2004,&quot;created_by_id&quot;:60919,&quot;modified_by_id&quot;:59622,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/srl-east-train-stabling-facility-urban-design-and-landscape-plan\/timeline\/37652&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:42,&quot;title&quot;:&quot;Local government&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:2004,&quot;tag_id&quot;:42,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:40,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Suburban Rail Loop&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;suburban-rail-loop&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;default&quot;,&quot;slogan&quot;:&quot;More transport, more homes, more jobs&quot;,&quot;description&quot;:&quot;&lt;p&gt;Suburban Rail Loop East (SRL East) from Cheltenham to Box Hill will connect major employment, health, education and retail destinations in Melbourne\u2019s east and south east. The line will slash travel times, connect people travelling on the Gippsland corridor and building it will create up to 8000 direct local jobs.&lt;br&gt;&lt;br&gt;SRL East involves delivering:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Twin 26-kilometre rail tunnels&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Six new underground stations, including 4 with interchanges to existing stations at Cheltenham, Clayton, Glen Waverley and Box Hill, as well as new stations at Monash and Burwood&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A transport super hub at Clayton for regional passengers&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A train stabling facility and power supply substation at Heatherton&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;An emergency support facility at Mount Waverley, including an intervention and ventilation facility and backup control centre&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A power supply substation at Burwood&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A dedicated fleet of new high-tech trains.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Since mid-2019, we\u2019ve engaged with over 20,000 people via online and face to face consultation activities, collecting more than 260,000 pieces of community feedback.&lt;br&gt;&lt;br&gt;Your feedback is an important part of planning, developing and delivering SRL East.&lt;br&gt;&lt;br&gt;More information about what we have heard to date is available in &lt;a class=\&quot;engage-link\&quot; href=\&quot;\&quot; target=\&quot;_blank\&quot;&gt;our engagement reports&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;4&quot;,&quot;type&quot;:&quot;campaign&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1770,&quot;created_at&quot;:&quot;2021-12-14T02:10:21.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-23T00:50:55.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/suburban-rail-loop&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__default&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--4&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94982,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2004,&quot;uuid&quot;:&quot;0efc0a8f-c37f-4f46-8466-1d5e6bd56da5&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;LWA---UDLP-Henry-St-Linear-Reserve-Kingston-Walk-Linear-Reserve-Looking-East&quot;,&quot;file_name&quot;:&quot;lwa-udlp-henry-st-linear-reserve-kingston-walk-linear-reserve-looking-east_5077.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:7623966,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:60919},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:92697,&quot;created_at&quot;:&quot;2026-09-16T03:14:56.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-16T03:14:59.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94982\/lwa-udlp-henry-st-linear-reserve-kingston-walk-linear-reserve-looking-east_5077.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2038,&quot;vid&quot;:364546,&quot;title&quot;:&quot;Draft Greater Bendigo Planning Scheme Amendment C303gben&quot;,&quot;slug&quot;:&quot;draft-psa-c303gben&quot;,&quot;summary&quot;:&quot;Have your say on the draft Greater Bendigo Planning Scheme Amendment C303gben for the redevelopment of 2-20 Chum Street, Golden Square.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to intervene under section 20(4) of the Planning and Environment Act 1987 to prepare, adopt and approve Draft Amendment C303gben to the Greater Bendigo Planning Scheme to facilitate the redevelopment of land at 2-20 Chum Street, Golden Square for mixed use residential and commercial development, generally up to four storeys in height. Consultation is being undertaken under section 20(5) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The draft Amendment request has been made by the landowner, Ophir Holdings Pty Ltd, to facilitate the redevelopment of the land at 2-20 Chum Street, Golden Square, as part of Tranche 1 of the Unlocking Strategic Sites pathway.&lt;\/p&gt;&lt;h3&gt;What the amendment does&lt;\/h3&gt;&lt;p&gt;The draft amendment proposes to amend the Greater Bendigo Planning Scheme by rezoning the land at 2-20 Chum Street, Golden Square, from Special Use Zone 3 (Television or Radio Station) to Mixed Use Zone, Schedule 4, applying a new Schedule 35 to the Development Plan Overlay to the land, and applying the Environmental Audit Overlay to the land.&lt;\/p&gt;&lt;p&gt;The following amendments are proposed to the Greater Bendigo Planning Scheme:&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Planning scheme maps&lt;\/strong&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amends Planning Scheme Map No. 18 to rezone the land at 2-20 Chum Street, Golden Square, from Special Use Zone 3 (Television or Radio Station) to Mixed Use Zone, Schedule 4.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends Planning Scheme Map No. 18DPO to apply a new Development Plan Overlay, Schedule 35 (DPO35) to the land at 2-20 Chum Street, Golden Square.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends Planning Scheme Map No. 18EAO to apply the Environmental Audit Overlay (EAO) to the land at 2-20 Chum Street, Golden Square.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Planning scheme ordinance&lt;\/strong&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Inserts a new Schedule 4 to Clause 32.04, Mixed Use Zone (MUZ4) into the Greater Bendigo Planning Scheme.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Inserts a new Schedule 35 to Clause 43.04, Development Plan Overlay (DPO35) into the Greater Bendigo Planning Scheme.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to proceed with the proposed Draft Amendment the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of any affected parties.&lt;\/p&gt;&lt;h3&gt;More Information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Regional Planning Services, Department of Transport and Planning on email at regional.planningservices@transport.vic.gov.au&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTE2VDAyOjE0OjI2LjQ2NVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relat scription_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTExVDAxOjAxOjI2LjQ1MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;This planning study focuses on the state road network in Warragul and Drouin, managed by the Department of Transport and Planning.&lt;\/p&gt;&lt;p&gt;You can find out which Victorian freeways and arterial roads in Warragul\/Drouin are managed by the Department of Transport and Planning and are relevant to this study via this &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/experience.arcgis.com\/experience\/068ac885fc3f47d4aecfea22c22c4e54\&quot; target=\&quot;_blank\&quot;&gt;interactive map of DTP managed roads&lt;\/a&gt;. These roads are also highlighted within the interactive map survey.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;What is a state road?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTIxVDAzOjUyOjA2Ljg0OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;There are two surveys currently open for feedback which you can find in the \u2018Participate\u2019 section below:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Interactive map survey: &lt;\/strong&gt;drop a pin on the map and tell us about an issue or concern at that location.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Transport usage survey: &lt;\/strong&gt;tell us about how you use the transport network and your experiences in Warragul and Drouin.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can also chat to us in person at one of our upcoming pop-up sessions in Warragul and Drouin (see details below). Drop by to speak with our team, ask questions, and find out more about the project.&lt;\/p&gt;&lt;p&gt;Submissions to both surveys close on Friday 30 October 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;How to participate&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTExVDA2OjQ2OjE3LjQyNFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZXZlbnRzOjIwMjYtMDktMTFUMDY6MjQ6NDMuMDk4Wg==&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;5&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA4LTMwVDIzOjIwOjA1LjY5Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;In 2018, we undertook traffic studies and asked the community for feedback on Warragul and Drouin\u2019s road network, which identified the need for a more comprehensive review.&lt;\/p&gt;&lt;p&gt;This work will build on earlier feedback and help identify long-term improvements to support Warragul and Drouin\u2019s growing transport needs.&lt;\/p&gt;&lt;p&gt;This project is jointly funded by the Commonwealth and Victorian Governments.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Background&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTIyVDA1OjExOjI2LjYyM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;This feedback, along with data from traffic counts, traffic modelling, road safety analysis and population forecasts, will help inform planning for long-ter te&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:94049,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:2021,&quot;uuid&quot;:&quot;17d9f4e7-c485-4088-bbd8-6a3dd2fdb8c4&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Drouin_aerial web size&quot;,&quot;file_name&quot;:&quot;drouin-aerial-web-size_e8ee.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2550117,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:41865},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:91787,&quot;created_at&quot;:&quot;2026-08-24T03:24:05.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-24T03:24:09.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/94049\/drouin-aerial-web-size_e8ee.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:2035,&quot;vid&quot;:365863,&quot;title&quot;:&quot;GVW - Broadford Wastewater Management Facility (APP051949)&quot;,&quot;slug&quot;:&quot;goulburn-valley-water-broadford-wastewater-management-facility-app051949&quot;,&quot;summary&quot;:&quot;EPA has received a development licence application. We are seeking comments from anyone who may be affected by the proposal.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;&lt;strong&gt;Applicant&lt;\/strong&gt;:&lt;em&gt; &lt;\/em&gt;Goulburn Valley Water&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity site&lt;\/strong&gt;: 77\u2013297 Kennys Lane, Broadford, Victoria 3658&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Application number&lt;\/strong&gt;:&lt;em&gt; &lt;\/em&gt;APP051949&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Activity code&lt;\/strong&gt;: A03 Sewage Treatment&lt;\/p&gt;&lt;h2&gt;What does the application propose?&lt;\/h2&gt;&lt;p&gt;EPA has received a development licence application from Goulburn Valley Water (GVW). The proposal is to release up to 200 ML of Class C recycled water into Sunday Creek. These releases would only occur during winter and spring between 2026 and 2029.&lt;\/p&gt;&lt;p&gt;The discharge to Sunday Creek is a temporary measure. It is to enable the upgrade of the Broadford Wastewater Management Facility. The upgrade will expand the facility&#039;s recycled water irrigation system. It will increase the irrigation area to approximately 110 hectares.&lt;\/p&gt;&lt;p&gt;During the upgrade, there will not be enough land to irrigate all the recycled water from the facility. This is why the release is needed. GVW will stop the temporary release to Sunday Creek once it finishes the upgrade works.&lt;\/p&gt;&lt;p&gt;The full application can be found in the \u2018Supporting documents\u2019&amp;nbsp;section of this page.&amp;nbsp;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA5LTE3VDIzOjE3OjE2Ljg2N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;EPA invites anyone who feels they may be affected by the proposed development activities to make a submission. You must make your submission using the form on this page.&lt;\/p&gt;&lt;p&gt;Notice of this application and submission period was published on 22 September 2026 in the Kilmore North Central Review.&lt;\/p&gt;&lt;p&gt;EPA will consider submissions made before 11:59 pm, 19 October 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period opens&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wOS0xN1QyMjo0MjozOC43MTJa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMTdUMjM6MTc6MjEuMDUwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Development licence application&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48485&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDktMTdUMjM6MTc6MjQuMTkxWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Appendices&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;48484&quot;,&quot;48486&quot;,&quot;48487&quot;,&quot;48488&quot;,&quot;48489&quot;,&quot;48490&quot;],&quot;limit&quot;:&quot;200&quot;}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;accordion&quot;,&quot;title&quot;:&quot;Supporting documents&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTEwLTAxVDAwOjU0OjMwLjA4NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;For our translation service, please:&lt;\/p&gt;&lt;p&gt;1.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; call Translating and Interpreting Service (TIS National) on 131 450&lt;\/p&gt;&lt;p&gt;2.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; tell them the development licence applica
