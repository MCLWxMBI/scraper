roperty&quot;:&quot;og:title&quot;,&quot;content&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;},{&quot;name&quot;:&quot;description&quot;,&quot;content&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;},{&quot;property&quot;:&quot;og:description&quot;,&quot;content&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;},{&quot;property&quot;:&quot;og:url&quot;,&quot;content&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan&quot;},{&quot;property&quot;:&quot;og:image&quot;,&quot;content&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/95375\/conversions\/press_ee33-hero.jpg&quot;}],&quot;links&quot;:[{&quot;rel&quot;:&quot;apple-touch-icon&quot;,&quot;sizes&quot;:&quot;120x120&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/apple-touch-icon.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;32x32&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-32x32.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;16x16&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-16x16.png&quot;},{&quot;rel&quot;:&quot;manifest&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/site.webmanifest&quot;,&quot;crossorigin&quot;:&quot;use-credentials&quot;},{&quot;rel&quot;:&quot;mask-icon&quot;,&quot;color&quot;:&quot;#008099&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/safari-pinned-tab.svg&quot;}]},&quot;messages&quot;:[],&quot;lang&quot;:&quot;en&quot;,&quot;model&quot;:{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;li agables_id&quot;:2042,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;region&quot;:null,&quot;hotspots&quot;:[],&quot;maps&quot;:[]},&quot;related&quot;:{&quot;current_page&quot;:1,&quot;data&quot;:[{&quot;id&quot;:28,&quot;vid&quot;:333816,&quot;title&quot;:&quot;\u200b2026-2030 Alpine Resorts Strategic Plan\u200b&quot;,&quot;slug&quot;:&quot;alpine-resorts-strategic-plan-2025&quot;,&quot;summary&quot;:&quot;Have your say on the future of Victoria&#039;s alpine sector.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Alpine Resorts Strategic Plan is the key strategic tool guiding Victoria\u2019s alpine sector. It outlines the sector\u2019s vision and long-term strategic objectives, articulates challenges and opportunities, and identifies strategic priorities for Victoria&#039;s alpine resorts.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The current 2020-2025 Alpine Resorts Strategic Plan has now ended and over the past several months stakeholders have come together to develop a new plan. Alpine Resorts Victoria is now finalising this strategic plan for 2026 \u2013 2030 and encouraging all stakeholders to take the opportunity to have their say in the plan\u2019s development through online engagement.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Contributions from previous in-person workshops, and online engagement, along with the findings from the review of the 2020-2025 Alpine Resorts Strategic Plan and consideration of other relevant data, has been used to write the new strategic plan. The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/44738\&quot; target=\&quot;_blank\&quot;&gt;draft 2026-2030 Alpine Resorts Strategic Plan&lt;\/a&gt; is now available to review and provide feedback on below. &lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:5,&quot;meta_tags&quot;:null,&quot; XA6MjAyNS0wMy0xOFQwMjozMjoxNC40MDNa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTAyLTIzVDAzOjQxOjE3LjExNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy collection statement&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Department of Energy, Environment, and Climate Action (ALPINE RESORTS VICTORIA) is committed to protecting personal information provided by you in accordance with the privacy principles in the Privacy and Data Protection Act 2014 (Vic).\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;This information will be used to understand the complete perspective of stakeholder experience in the alpine sector, developing a better Alpine Resorts Strategic Plan and improve outcomes for the Victorian alpine sector.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Your contact details will not be used in any other capacity other than to contextualise your feedback and provide valued data input into the Alpine Resorts Strategic Plan.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The information you provide will not be made available to any other organisation other than Alpine Resorts Victoria. Should you not wish to provide ARV with your name and email address, you are welcome to submit your feedback anonymously. There will be no penalty imposed for users who submit anonymously.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You may access the information you have supplied to Alpine Resorts Victoria by contacting: &amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;br&gt;Head of Governance &amp;amp; Risk&amp;nbsp;&lt;br&gt;Alpine Resorts Victoria&amp;nbsp;&lt;br&gt;0499 111 403&amp;nbsp;&lt;br&gt;&lt;a c t;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:28,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:45,&quot;title&quot;:&quot;Sport and recreation&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:28,&quot;tag_id&quot;:45,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:4,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-energy-environment-and-climate-action&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;description&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;12&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-31T03:09:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--12&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;region&quot;:{&quot;id&quot;:9,&quot;name&quot;:&quot;Ovens Murray&quot;,&quot;location_geo&quot;:null,&quot;created_at&quot;:&quot;2021-12-14T02:10:21.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-12-14T02:10:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/region&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;region&quot;,&quot;model_type_label&quot;:&quot;Region&quot;},&quot;images&quot;:[{&quot;id&quot;:80332,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:28,&quot;uuid&quot;:&quot;3b0c2075-7644-49b4-86c1-35a66f0959c7&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;FallsCreek-Snow-TNE22-JDfinals-4&quot;,&quot;file_name&quot;:&quot;fallscreek-snow-tne22-jdfinals-4_21a6.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:9115201,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:39948},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:78640,&quot;created_at&quot;:&quot;2025-05-30T00:59:32.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-05-30T00:59:36.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/80332\/fallscreek-snow-tne22-jdfinals-4_21a6.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:242,&quot;vid&quot;:249319,&quot;title&quot;:&quot;Minimum feed-in tariff review 2020-21&quot;,&quot;slug&quot;:&quot;minimum-feed-tariff&quot;,&quot;summary&quot;:&quot;The Essential Services Commission reviewed the rates retailers should pay for electricity generated and supplied to the grid by households \/ small businesses for 2020-21.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Essential Services Commission sets the minimum feed-in tariffs, or rates, that energy companies pay customers who feed energy back into the grid through sources such as solar panels.&lt;\/p&gt;&lt;p&gt;The commission reviewed the rates that should apply in 2020-21 from December 2019 to February 2020. The commission&#039;s &lt;a href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/prices-tariffs-and-benchmarks\/minimum-feed-tariff\/minimum-feed-tariff-review-2020-21#tabs-container1\&quot;&gt;final decision&lt;\/a&gt; was released on 25 February 2020. &lt;\/p&gt;&lt;p&gt;&lt;strong&gt;&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:4,&quot;current_stage&quot;:4,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA1OjMzOjM2LjE3MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:1,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;oembed-wrapper\&quot;&gt;&lt;iframe src=\&quot;https:\/\/www.youtube-nocookie.com\/embed\/Gb-821bFZsc\&quot;  title=\&quot;The renewable energy feed-in tariff explained\&quot;  frameborder=\&quot;0\&quot;  allow=\&quot;accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\&quot;  allowfullscreen=\&quot;0\&quot;&gt;&lt;\/iframe&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;The renewable energy feed-in tariff explained&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA1OjMzOjQ3LjQ0M1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:2,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;In our final decision, we noted that from 1 July 2020, retailers will continue to be able to offer solar system owners a single rate feed-in tariff, a time-varying feed-in tariff or both.\u200b&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Minimum single rate feed-in tariff rates&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The minimum single rate feed-in tariff to apply from 1 July 2020 is 10.2 cents per kilowatt hour&lt;\/p&gt;&lt;p&gt;The single rate feed-in tariff applies regardless of the time of day or day of the week&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Minimum time-varying feed-in tariff rates&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The minimum time-varying feed-in tariff rate to apply from 1 July 2020 is between 9.1 cents and 12.5 cents per kilowatt hour&lt;\/p&gt;&lt;p&gt;Under the time-varying feed-in tariff, customers will be credited between 9.1 cents and 12.5 cents per kilowatt hour of electricity exported, depending on the time of day and day of week&lt;\/p&gt;&lt;p&gt;The table below shows how the time-varying feed-in tariff rate changes by time of the day and day of the week.&lt;\/p&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Period&lt;\/strong&gt;&lt;\/td&gt;&lt;td&gt;&lt;strong&gt;Weekday&lt;\/strong&gt;&lt;\/td&gt;&lt;td&gt;&lt;strong&gt;Weekend&lt;\/strong&gt;&lt;\/td&gt;&lt;td&gt;&lt;strong&gt;Rate: cents per kilowatt hour (c\/kWh)&lt;\/strong&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td&gt;Off peak&lt;\/td&gt;&lt;td&gt;10pm to 7am&lt;\/td&gt;&lt;td&gt;10pm to 7am&lt;\/td&gt;&lt;td&gt;9.1 c\/kWh&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td&gt;Shoulder&lt;\/td&gt;&lt;td&gt;7am to 3pm, 9pm to 10pm&lt;\/td&gt;&lt;td&gt;7am to 10pm&lt;\/td&gt;&lt;td&gt;9.8 c\/kWh&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td&gt;Peak&lt;\/td&gt;&lt;td&gt;3pm to 9pm&lt;\/td&gt;&lt;td&gt;n\/a&lt;\/td&gt;&lt;td&gt;12.5 c\/kWh&lt;\/td&gt;&lt;\/tr&gt;&lt;\/tbody&gt;&lt;\/table&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Key facts from our final decision&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA1OjM0OjA4LjU3NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:3,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The commission released its draft decision on 3 December 2019 and proposed to make energy retailers offer both a time-varying as well as a single rate feed-in tariff from 1 July 2020 depending on what best suits the customer&#039;s circumstances.&lt;\/p&gt;&lt;p&gt;The commission sought feedback on its draft decision until 17 January 2020 through Engage Victoria.&lt;\/p&gt;&lt;p&gt;The commission&#039;s final decision was released on 25 February 2020.&lt;\/p&gt;&lt;h3&gt;What we did with your feedback&lt;\/h3&gt;&lt;p&gt;We received &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/prices-tariffs-and-benchmarks\/minimum-feed-tariff\/minimum-feed-tariff-review-2020-21#toc--submissions-on-the-draft-decision\&quot; target=\&quot;_blank\&quot;&gt;99 submissions&lt;\/a&gt; to the draft decision. The commission has kept time-varying tariffs optional after &lt;a class=\&quot;engage-link\&quot; title=\&quot;Minimum feed-in tariff review 2020-21\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/prices-tariffs-and-benchmarks\/minimum-feed-tariff\/minimum-feed-tariff-review-2020-21\&quot;&gt;new research&lt;\/a&gt; following feedback received during the consultation period showed that making them mandatory at this time would have limited benefits.&lt;\/p&gt;&lt;h4&gt;Consultation on this project has now closed.&lt;\/h4&gt;&quot;,&quot;title&quot;:&quot;How we engaged&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA1OjM1OjUwLjk4N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:4,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;Documents&lt;\/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/FDP%20-%20Minimum%20feed-in%20tariff%202020-21%20-%20Final%20decision%20-%2020200110_1.pdf\&quot; target=\&quot;_blank\&quot;&gt;Minimum electricity feed-in tariff to apply from 1 July 2020: Final Decision (PDF, 533.24KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Minimum%20electricity%20feed-in%20tariff%20to%20apply%20from%201%20July%202020%20-%20Draft%20decision_1.pdf\&quot; target=\&quot;_blank\&quot;&gt;Minimum electricity feed-in tariffs to apply from 1 July 2020: Draft Decision (PDF, 504.56KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;div class=\&quot;linkblock linkblock\&quot;&gt;&lt;h4&gt;Web pages&lt;\/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/electricity-and-gas-tariffs-and-benchmarks\/minimum-feed-tariff\&quot;&gt;Our role: minimum feed-in tariffs&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/prices-tariffs-and-benchmarks\/minimum-feed-tariff\/minimum-feed-tariff-review-2020-21\&quot;&gt;Minimum feed-in tariff review 2020-21&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Useful links&quot;}},{&quot;id&quot;:&quot;html:61fba1f98826c&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:3,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Join the conversation with the Essential Services Commission on &lt;a href=\&quot;https:\/\/twitter.com\/EssentialVic\&quot; target=\&quot;_blank\&quot;&gt;Twitter&lt;\/a&gt; and &lt;a href=\&quot;https:\/\/www.linkedin.com\/company\/essential-services-commission\/\&quot; target=\&quot;_blank\&quot;&gt;LinkedIn&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Social media&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA1OjM2OjE2LjEwM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;As part of making a submission, we need you to provide personal information, such as your name, email address, and postcode. We will use this information to send you updates about this review.&lt;\/p&gt;&lt;p&gt;It is our policy to publish all submissions to reviews on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/\&quot;&gt;Essential Services Commission&lt;\/a&gt; website. You can request anonymity by selecting the relevant tickbox.&lt;\/p&gt;&lt;p&gt;When we publish a submission, we also include some details about the submitter (your name, not your address). We treat all submissions as public information unless the submitter has asked us to.&lt;\/p&gt;&lt;p&gt;We may also collect personal information when you email us with a query. Aside from any exceptions in relevant privacy legislation, we will not use or disclose the information you provide for any purpose other than to progress and respond to your query.&lt;\/p&gt;&lt;p&gt;You have the right to access personal information we hold about you. You can also request that we correct your personal information in our records at no charge.&lt;\/p&gt;&lt;p&gt;Read more information about our &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/about-us\/our-submission-policy\&quot;&gt;submissions policy&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Privacy statement&quot;}}],&quot;date_end&quot;:&quot;2020-02-28T17:00:00&quot;,&quot;region_id&quot;:10,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Essential Services Commission&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;03 9032 1300&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;fitreview@esc.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:[],&quot;visibility_restricted&quot;:false,&quot;password&quot;:&quot;&quot;,&quot;created_at&quot;:&quot;2021-11-23T23:53:37.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-09-16T06:22:25.000000Z&quot;,&quot;seed_id&quot;:2091,&quot;seed_type&quot;:&quot;collection&quot;,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5907,&quot;team_id&quot;:12,&quot;created_by_id&quot;:1556,&quot;modified_by_id&quot;:10193,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/minimum-feed-tariff&quot;,&quot;model_type&quot;:&quot;pr &quot;updated_at&quot;:&quot;2022-02-11T02:31:43.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/essential-services-commission&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;region&quot;:{&quot;id&quot;:10,&quot;name&quot;:&quot;Wimmera Southern Mallee&quot;,&quot;location_geo&quot;:null,&quot;created_at&quot;:&quot;2021-12-14T02:10:21.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-12-14T02:10:21.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/region&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;region&quot;,&quot;model_type_label&quot;:&quot;Region&quot;},&quot;images&quot;:[{&quot;id&quot;:6984,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:242,&quot;uuid&quot;:&quot;06a7b2de-047b-4e2a-b8fe-08e3f8ae8ac2&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;2f5fec9a5397d9bd7e40daebd0d9ede1&quot;,&quot;file_name&quot;:&quot;AdobeStock_26232669.jpeg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:14823118,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:[],&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:6984,&quot;created_at&quot;:&quot;2021-12-14T03:34:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-12-14T03:34:21.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/6984\/AdobeStock_26232669.jpeg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:340,&quot;vid&quot;:248115,&quot;title&quot;:&quot;Electricity Distribution Code review&quot;,&quot;slug&quot;:&quot;electricity-distribution-code-review&quot;,&quot;summary&quot;:&quot;The Essential Services Commission reviewed the Electricity Distribution Code to ensure the safety, efficiency and reliability of distribution of electricity in Victoria.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Essential Services Commission reviewed the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/codes-guidelines-and-policies\/electricity-distribution-code\&quot; target=\&quot;_blank\&quot;&gt;Electricity Distribution Code&lt;\/a&gt;, which sets out the requirements for the distribution of electricity in Victoria from April 2019 to November 2020.&lt;\/p&gt;&lt;p&gt;The commission consulted on proposed changes to the Electricity Distribution Code to strengthen the protections for customers relating to planned outages and the guaranteed service level scheme for customers who receive poor service from their distributor. &lt;\/p&gt;&lt;p&gt;&lt;strong&gt;The commission released its final decision for customer service standards on 16 November 2020. Changes to the Electricity Distribution Code will be phased in over six months starting on 1 January 2021.&lt;\/strong&gt;&lt;\/p&gt;&lt;h2&gt;What we did&lt;\/h2&gt;&lt;h4&gt;Final decision: technical standards (April 2020)&lt;\/h4&gt;&lt;p&gt;The commission released its draft decision on the changes to the technical standards in the Electricity Distribution Code on 3 December 2019 and consulted on them until 20 January 2019. The commission released its &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/codes-guidelines-and-policies\/electricity-distribution-code\/electricity-distribution-code-review-2019?_ga=2.175725218.125317150.1586134891-163261342.1578268075\&quot;&gt;final decision&lt;\/a&gt; on the code&#039;s technical standards on 3 April 2020.&lt;\/p&gt;&lt;h4&gt;Final decision: customer service standards (November 2020)&lt;\/h4&gt;&lt;p&gt;The commission released its &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/codes-guidelines-and-policies\/electricity-distribution-code\/electricity-distribution-code-review-2019#toc--draft-decision-customer-service-standards\&quot;&gt;draft decision&lt;\/a&gt; on the customer service standards of the Electricity Distribution Code and &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/codes-guidelines-and-policies\/electricity-distribution-code\/electricity-distribution-code-review-2019\/customer-protections-electricity-distribution-code-2019-review#toc--stakeholder-consultation-resources\&quot;&gt;consulted&lt;\/a&gt; on the proposed reforms until 2 July 2020. You can read about the engagement process in our engagement summary report. The commission\u2019s final decision was released on 16 November 2020. The commission\u2019s final decision introduces a range of new obligations for retailers and distributors.&lt;\/p&gt;&lt;h2&gt;Key facts about the customer service standards final decision&lt;\/h2&gt;&lt;p&gt;In developing this package of reforms, the commission sought to enhance and improve customers\u2019 experiences with both their retailer and distributor. The commission has done this by focusing on:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;ensuring customer preferences are embedded in the new framework&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;implementing reforms that promote the long-term interests of customers, including those who might be experiencing vulnerability such as life support customers.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The reforms in the final decision also address key issues raised by stakeholders including:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;ensuring electricity retailers provide customer contact details, including electronic details, to distributors in a timely way&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;modernising the communication channels distributors can use to notify customers about planned outages by focusing on customer preferences, while protecting life support customers&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;giving distributors and customers flexibility to interrupt supply at short notice, subject to explicit informed consent and record keeping obligations&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;ensuring customers are notified when planned outages are cancelled in many circumstances&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;modernising and updating our guaranteed service level scheme in line with community expectations.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:4,&quot;current_stage&quot;:14,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjItMDItMTFUMDc6MTQ6MzAuMDY1Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:1,&quot;settings&quot;:{&quot;title&quot;:&quot;Read our final decision and engagement summary&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[8633,8634,8635,8636],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA3OjE0OjQ2LjE3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:2,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;linkblock linkblock\&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Electricity%20Distribution%20Code%20review%20-%20customer%20service%20standards%20-%20draft%20decision%20-%207%20May%202020%20-%20FINAL.pdf\&quot;&gt;Electricity Distributions Code review - customer service draft decision (PDF, 942.25KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Electricity%20Distribution%20Code%20customer%20service%20standards%20draft%20decision%20key%20feedback%20-%20stakeholder%20webinar%20slides%20FINAL.pdf\&quot;&gt;Electricity Distribution Code customer service standards draft decision webinar slides - 25 June 2020 (PDF, 108.36KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/electricity-distribution-code-review-issues-paper-20190813_1.pdf\&quot;&gt;Electricity Distribution Code Review: Issues Paper, August 2019 (PDF, 964.27KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Electricity%20Distribution%20Code%20review%20-%20Approach%20paper_2.pdf\&quot;&gt;Electricity Distribution Code Review: Approach Paper, April 2019 (PDF, 437.21KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Electricity%20Distribution%20Code%20version%2011.pdf\&quot;&gt;Current version of the Electricity Distribution Code (Version 11), 3 April 2020 (PDF, 834.76KB)&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Relevant documents&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDIyLTAyLTExVDA3OjE0OjUyLjg2OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:3,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Essential Services Commission is an independent regulator that promotes the long-term interests of Victorian consumers with respect to the price, quality and reliability of essential services. The commission regulates certain Victorian energy businesses (including electricity generators, transmission companies, distributors and retailers) through a combination of legislatio &quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=7&quot;,&quot;label&quot;:&quot;7&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=8&quot;,&quot;label&quot;:&quot;8&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=9&quot;,&quot;label&quot;:&quot;9&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=10&quot;,&quot;label&quot;:&quot;10&quot;,&quot;active&quot;:false},{&quot;url&quot;:null,&quot;label&quot;:&quot;...&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=107&quot;,&quot;label&quot;:&quot;107&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=108&quot;,&quot;label&quot;:&quot;108&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=2&quot;,&quot;label&quot;:&quot;Next &gt;&quot;,&quot;active&quot;:false}],&quot;next_page_url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline?page=2&quot;,&quot;path&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/draft-preston-market-precinct-development-plan\/timeline&quot;,&quot;per_page&quot;:3,&quot;prev_page_url&quot;:null,&quot;to&quot;:3,&quot;total&quot;:323},&quot;layout&quot;:[{&quot;id&quot;:&quot;description&quot;,&quot;component&quot;:&quot;engage-block-project-body&quot;,&quot;props&quot;:{&quot;model&quot;:{&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false}},&quot;display&quot;:true,&quot;weight&quot;:0},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;weight&quot;:0,&quot;component&quot;:&quot;engage-block-project-surveys&quot;,&quot;props&quot;:{&quot;model&quot;:{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt; &quot;:&quot;Please provide your response to the draft Preston Market Development Plan is required&quot;,&quot;max&quot;:&quot;Your response to Please provide your response to the draft Preston Market Development Plan must not contain more than 10000 characters.&quot;}},{&quot;help&quot;:&quot;Allowed file types are pdf, doc, docx, txt, xls, xlsx, rtf, png, gif, jpg, mp3, m4a&quot;,&quot;name&quot;:&quot;dXBsb2FkOjIwMjUtMDEtMjFUMjM6NTk6NDEuNDI0Wg==&quot;,&quot;type&quot;:&quot;file&quot;,&quot;label&quot;:&quot;Please upload any supporting documents for your submission here&quot;,&quot;schema&quot;:[],&quot;multiple&quot;:true,&quot;conditions&quot;:[],&quot;validation&quot;:&quot;mime:application\/pdf,application\/msword,application\/vnd.openxmlformats-officedocument.wordprocessingml.document,text\/plain,application\/vnd.ms-excel,application\/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application\/rtf,image\/png,image\/gif,image\/jpeg,audio\/mpeg,audio\/x-m4a&quot;,&quot;conditions_boolean&quot;:&quot;and&quot;,&quot;options&quot;:[],&quot;validation-messages&quot;:{&quot;required&quot;:&quot;Please upload any supporting documents for your submission here is required&quot;,&quot;mime&quot;:&quot;Please upload any supporting documents for your submission here is an invalid file type, allowed types are pdf, doc, docx, txt, xls, xlsx, rtf, png, gif, jpg, mp3, m4a, jpeg&quot;}},{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;Collection Notice&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;This Privacy Collection Notice relates to all submissions collected by Priority Projects for the draft Preston Market Development Plan&lt;\/p&gt;&lt;p&gt;Development Assessment is part of the Department of Transport and Planning (DTP). Submissions will be managed in accordance with the Department\u2019s Information Privacy Policy. The Department\u2019s Information Privacy Policy is online at&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vic.gov.au\/department-transport-and-planning\&quot; target=\&quot;_blank\&quot;&gt;www.dtp.vic.gov.au&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Use of your submission&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Your submission has been collected by Development Assessment, Department of Transport and Planning for the purpose of informing the Minister for Planning about the draft Preston Market Development Plan.&lt;em&gt; &lt;\/em&gt;Natural justice to participants and transparency are important parts of this process. Priority Projects may do the following with your submission:&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Provide a copy of your submission to the Minister for Planning, Darebin City Council and the proponent and a de-identified copy of your submission to other Government departments or agencies and other parties (submitters) to the proposal, if requested.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide a copy of your personal contact details to the Development Assessment, Department of Transport and Planning for notification of Ministerial decisions.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide a copy of your submission to an advisory committee established under section 151 of the Planning and Environment Act 1987 and Planning Panels Victoria.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide a copy of your submission to an independent expert as directed by the Minister for Planning to provide advice on the proposal.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide a copy of your personal contact details to Planning Panels Victoria if needed for notification of Ministerial decisions.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;If a public hearing is to be held, display a copy of your submission as part of the hearing.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;After the matter has been decided&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Your original submission and any additional material provided will be held by Development Assessment, Department of Transport and Planning for two years. All additional copies of the submission and other material held will be securely destroyed.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Should the matter be referred by the Minister for Planning to an advisory committee, your original submission and any additional material provided will be held at Planning Panels Victoria for two years and then sent to the Public Records Office of Victoria. All additional copies of the submission and other material held by Planning Panels Victoria will be securely destroyed.\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you have any concerns in respect to the way your personal information or submission will be used, please contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:development.assessment@transport.vic.gov.au\&quot;&gt;Development Assessment&lt;\/a&gt;&amp;nbsp;.&lt;\/p&gt;&quot;,&quot;name&quot;:&quot;aHRtbDoyMDI1LTAxLTIyVDAwOjAwOjM5LjQxOVo=&quot;,&quot;type&quot;:&quot;content&quot;,&quot;schema&quot;:[],&quot;conditions&quot;:[],&quot;validation&quot;:&quot;&quot;,&quot;conditions_boolean&quot;:&quot;and&quot;,&quot;label&quot;:&quot;&quot;,&quot;options&quot;:[],&quot;validation-messages&quot;:{&quot;required&quot;:&quot; is required&quot;}},{&quot;help&quot;:null,&quot;name&quot;:&quot;cmFkaW9zOjIwMjUtMDgtMTNUMDU6NTg6NDQuNDA1Wg==&quot;,&quot;type&quot;:&quot;radio&quot;,&quot;label&quot;:&quot;I have read and understand the DTP Privacy Collection Notice&quot;,&quot;schema&quot;:[],&quot;options&quot;:[{&quot;value&quot;:&quot;Yes&quot;,&quot;label&quot;:&quot;Yes&quot;}],&quot;conditions&quot;:[],&quot;validation&quot;:&quot;required&quot;,&quot;conditions_boolean&quot;:&quot;and&quot;,&quot;validation-messages&quot;:{&quot;required&quot;:&quot;I have read and understand the DTP Privacy Collection Notice is required&quot;},&quot;error-behavior&quot;:&quot;value&quot;}],&quot;data&quot;:{&quot;lang&quot;:null,&quot;settings&quot;:[]},&quot;created_at&quot;:&quot;2026-09-28T23:30:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-09-30T23:00:01.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;project_id&quot;:2042,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:1,&quot;allow_multiple_submissions&quot;:false,&quot;submissions_count&quot;:10,&quot;url&quot;:&quot;\/project\/draft-preston-market-precinct-development-plan\/survey\/6854&quot;,&quot;summary&quot;:&quot;Thank you for taking the time to complete a submission.&quot;,&quot;model_type&quot;:&quot;survey&quot;,&quot;model_type_label&quot;:&quot;Form&quot;,&quot;cta_text&quot;:&quot;Start survey&quot;,&quot;type_group&quot;:&quot;secure&quot;,&quot;completion_time&quot;:5,&quot;form_results_summary&quot;:[],&quot;status_label&quot;:&quot;Published&quot;,&quot;open&quot;:true,&quot;has_comments&quot;:&quot;2&quot;,&quot;component_name&quot;:&quot;engage-block-survey-secure&quot;,&quot;submission_type_label&quot;:&quot;submission&quot;,&quot;response_label&quot;:&quot;Our response&quot;,&quot;results_view&quot;:&quot;default&quot;,&quot;lang&quot;:null,&quot;matomo_form_name&quot;:&quot;ev-survey-6854&quot;}],&quot;first_page_url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;from&quot;:1,&quot;last_page&quot;:1,&quot;last_page_url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;links&quot;:[{&quot;url&quot;:null,&quot;label&quot;:&quot;&lt; Previous&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;label&quot;:&quot;1&quot;,&quot;active&quot;:true},{&quot;url&quot;:null,&quot;label&quot;:&quot;Next &gt;&quot;,&quot;active&quot;:false}],&quot;next_page_url&quot;:null,&quot;path&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan&quot;,&quot;per_page&quot;:&quot;2&quot;,&quot;prev_page_url&quot;:null,&quot;to&quot;:1,&quot;total&quot;:1}},&quot;display&quot;:true,&quot;title&quot;:&quot;&quot;},{&quot;id&quot;:&quot;2&quot;,&quot;weight&quot;:1,&quot;component&quot;:&quot;engage-block-project-meetings&quot;,&quot;props&quot;:{&quot;model&quot;:{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2 oject&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-theme__default&quot;,&quot;static_map&quot;:null,&quot;status_label&quot;:&quot;Published&quot;,&quot;subscribe_form_schema&quot;:{&quot;subscribe&quot;:{&quot;title&quot;:&quot;Follow&quot;,&quot;description&quot;:&quot;Enter your email below for updates about the &lt;strong&gt;Consultation on the draft Preston Market Development Plan&lt;\/strong&gt; project&quot;,&quot;button_text&quot;:&quot;Follow this project&quot;},&quot;unsubscribe&quot;:{&quot;title&quot;:&quot;You are following&quot;,&quot;description&quot;:&quot;Click the unfollow button to stop receiving updates about the &lt;strong&gt;Consultation on the draft Preston Market Development Plan&lt;\/strong&gt; project.&quot;,&quot;button_text&quot;:&quot;Unfollow&quot;,&quot;footer_text&quot;:&quot;You can manage the projects you&#039;re following anytime by visiting &lt;a href=https:\/\/engage.vic.gov.au\/profile\/subscriptions&gt;Subscriptions&lt;\/a&gt; under your profile&quot;}},&quot;consult_status&quot;:{&quot;id&quot;:1,&quot;name&quot;:&quot;open&quot;,&quot;label&quot;:&quot;Open for feedback&quot;},&quot;show_table_of_contents&quot;:false},&quot;updates&quot;:{&quot;current_page&quot;:1,&quot;data&quot;:[],&quot;first_page_url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;from&quot;:null,&quot;last_page&quot;:1,&quot;last_page_url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;links&quot;:[{&quot;url&quot;:null,&quot;label&quot;:&quot;&lt; Previous&quot;,&quot;active&quot;:false},{&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan?page=1&quot;,&quot;label&quot;:&quot;1&quot;,&quot;active&quot;:true},{&quot;url&quot;:null,&quot;label&quot;:&quot;Next &gt;&quot;,&quot;active&quot;:false}],&quot;next_page_url&quot;:null,&quot;path&quot;:&quot;https:\/\/engage.vic.gov.au\/draft-preston-market-precinct-development-plan&quot;,&quot;per_page&quot;:&quot;2&quot;,&quot;prev_page_url&quot;:null,&quot;to&quot;:null,&quot;total&quot;:0}},&quot;display&quot;:false,&quot;title&quot;:&quot;Latest updates&quot;},{&quot;id&quot;:&quot;5&quot;,&quot;weight&quot;:3,&quot;component&quot;:&quot;engage-block-project-pages&quot;,&quot;props&quot;:{&quot;model&quot;:{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&qu ter for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&qu :&quot;engage-block-project-documents&quot;,&quot;props&quot;:{&quot;model&quot;:{&quot;id&quot;:2042,&quot;vid&quot;:365797,&quot;title&quot;:&quot;Consultation on the draft Preston Market Development Plan&quot;,&quot;slug&quot;:&quot;draft-preston-market-precinct-development-plan&quot;,&quot;summary&quot;:&quot;Have your say about the proposed Preston Market Precinct Development Plan (Application No. DP2604666)&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to approve the draft Preston Market Precinct Development Plan, 4 September 2026 (the Development Plan) for the Preston Market site under the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme. Consultation is being undertaken to inform the community of the proposed development plan.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;What is a development plan?&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;A development plan is a master plan for the site that sets out directions for land use and development outcomes on a given site.&lt;\/p&gt;&lt;p&gt;It is prepared by a proponent and must meet the requirements set out in the relevant Development Plan Overlay.&lt;\/p&gt;&lt;p&gt;Once a development plan has been prepared to the satisfaction of the Minister for Planning, a planning permit application under any provision of the planning scheme is exempt from the usual notice requirements and third-party review. Planning permits granted must be generally in accordance with the development plan.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;Planning Scheme Amendment C182dare was approved and gazetted by the then Minister for Planning on 7 August 2023. The amendment inserted Schedule 14 to the Development Plan Overlay to the site, requiring a subsequent planning process for the approval of a Development Plan to guide future land use and development outcomes on the site. The amendment also nominated the Minister for Planning as the Responsible Authority for the land, amongst other things.&lt;\/p&gt;&lt;p&gt;The applicant is seeking that the Minister for Planning approve the proposed Development Plan under the DPO14, known as the Preston Market Precinct Development Plan.&lt;\/p&gt;&lt;h3&gt;The proposal&lt;\/h3&gt;&lt;p&gt;The proposed Development Plan responds to the Development Plan Overlay Schedule 14 (Preston Market Precinct) of the Darebin Planning Scheme, providing the following:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Retention of approx. 81% of the existing market footprint and 77% of the space frame roof.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provision of new market space to complement the retained market, with a total of 15,328 sqm of market floor space proposed (there is currently 12,700sqm of market floor space).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Direction for the protection, restoration, and adaptive re-use of key heritage elements including the spaceframe roof structure, pedestrian axis\u2019, key shop front features, and murals.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 14,000sqm new speciality retail and commercial floor space (in addition to the market).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 900 new apartments across 8 towers ranging in height from 8-16 storeys surrounding the market.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;10% of dwellings will be provided as affordable housing options.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Approx. 1250 car parks across the site (market, retail, and residential).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Market Continuity Plan to maintain operations during staged development of the broader site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Public realm contributions including a new 2700sqm public park along Murray Road and a 1000sqm public park interfacing with the Preston Railway Station.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A podium level featuring communal open, play and recreational space.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Vehicle accessways, infrastructure, and pedestrian pathways.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;On-site stormwater and flooding management direction.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Environmental values and principles to guide landscaping and tree retention across public open space, the podium level, and the internal pedestrian\/street network.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sustainability initiatives.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to approve the proposed Development Plan, the Minister for Planning is undertaking consultation to inform the community of the proposal.&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister will make a decision on whether to approve or refuse the Development Plan application.&lt;\/p&gt;&lt;p&gt;If the Minister decides to approve the proposed Development Plan, the Development Plan will set the vision, framework and expectations for the future subdivision and planning permit applications.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide or upload a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA5LTI4VDIzOjM4OjUzLjUzM1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;al
