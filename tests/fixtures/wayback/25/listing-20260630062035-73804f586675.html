,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:91984,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1980,&quot;uuid&quot;:&quot;37488420-898c-4618-a45e-549c9dc736b2&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;BLUQphoto1foreview&quot;,&quot;file_name&quot;:&quot;bluqphoto1foreview_f4bc.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2306416,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:89787,&quot;created_at&quot;:&quot;2026-06-03T05:14:24.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-03T05:14:27.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91984\/bluqphoto1foreview_f4bc.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1908,&quot;vid&quot;:349514,&quot;title&quot;:&quot;Victoria\u2019s draft Adaptation Action Plans 2027-31&quot;,&quot;slug&quot;:&quot;adaptation-action-plans&quot;,&quot;summary&quot;:&quot;Have your say on Victoria\u2019s draft Adaptation Action Plans 2027-31&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Victorian Government is preparing Adaptation Action Plans 2027\u201331 for 8 statewide systems that are vulnerable to the impacts of climate change or vital to building Victoria\u2019s climate resilience. The Adaptation Action Plans 2027-31 are to be prepared by the 31 October 2026 in line with the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/climate-change-act-2017\/011\&quot; target=\&quot;_blank\&quot;&gt;Climate Action Act 2017.&lt;\/a&gt;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;While Victoria has strong emissions reduction targets, the state is&amp;nbsp;also&amp;nbsp;taking&amp;nbsp;action to build&amp;nbsp;our resilience to unavoidable climate impacts from hazards such as heat,&amp;nbsp;flood&amp;nbsp;and fire.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The plans will build on the strong foundations set in the first Adaptation Action Plans 2022-26 and outline actions that the Victorian Government will take over the next five years to continue to strengthen the state\u2019s resilience.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The draft plans are guided by the adaptation priorities in &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-climate-change-strategy\&quot;&gt;Victoria\u2019s Climate Change Strategy 2026-30&lt;\/a&gt;, which are shaped by &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/climate-change-strategy\&quot; target=\&quot;_blank\&quot;&gt;public consultation in 2025&lt;\/a&gt;. They are also informed by findings from recent inquiries such as the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.parliament.vic.gov.au\/climateresilience\&quot;&gt;Parliamentary Inquiry into Climate Resilience&lt;\/a&gt; and the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.parliament.vic.gov.au\/floodinquiry\&quot;&gt;Parliamentary Inquiry into the 2022 Flood Event in Victoria.&lt;\/a&gt;&lt;br&gt;&lt;br&gt;&lt;strong&gt;You are invited to provide feedback on the 8 draft Adaptation Action Plans 2027-31 to inform the final plans.&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE3VDA1OjIzOjAwLjYxOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;Share your feedback by completing the online survey or uploading a written submission.&lt;\/p&gt;&lt;p&gt;You are encouraged to read the draft plans before providing your comments.&lt;br&gt;&lt;br&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/adaptation-action-plans\/survey\/6595\&quot; target=\&quot;_blank\&quot;&gt;Take the survey&lt;\/a&gt;&lt;br&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/adaptation-action-plans\/survey\/6699\&quot; target=\&quot;_blank\&quot;&gt;Make a submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Closes 11:59pm, Wednesday 15 July 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE3VDA0OjQ3OjM3LjgyMlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Adaptation Action Plans 2027\u201331 are being prepared for 8 statewide systems:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Built Environment:&lt;\/strong&gt; cities, towns and regional areas, and&amp;nbsp;how people use and interact with services, infrastructure, buildings, natural and cultural features, and public places.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Education and Training: &lt;\/strong&gt;the services and assets primarily engaged in the planning, development, provision and support of education and training, including future workplace skills and needs.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Energy:&lt;\/strong&gt; the generation, production, transmission, storage and distribution of energy\u202f(electricity, gas and liquid fuels)\u202fand how people\u202fuse and rely on energy as an essential service.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Health and Human Services: &lt;\/strong&gt;the services and assets primarily engaged in protecting human health from disease resulting from or associated with communicable disease, food,\u202fwater\u202for the environment; and\u202fthe services and assets which provide human physical and mental health care, social\u202fsupport\u202fand\u202fassistance.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Natural Environment: &lt;\/strong&gt;land-based ecosystems such as grasslands and forests;&amp;nbsp;aquatic ecosystems such as rivers,\u202festuaries\u202fand wetlands;\u202fand&amp;nbsp;coastal and marine ecosystems such as mangroves and sea-grass meadows.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Primary Production: &lt;\/strong&gt;agriculture,&amp;nbsp;plantation forestry,&amp;nbsp;productive fisheries, and&amp;nbsp;the infrastructure, workforce and communities supporting them.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Transport: &lt;\/strong&gt;infrastructure, services, and operations that enable the movement of people and goods.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Water Cycle: &lt;\/strong&gt;water supply, sewerage,\u202fdrainage\u202fand flood management services.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91948\/8-systems_821f.png\&quot; alt=\&quot;A colourful graphic showing a connected landscape with the eight statewide systems. In the foreground, buildings, a bus, a train, a school and a hospital illustrate the built environment, transport, education, and health services. In the midground, farms, crops, livestock, solar panels and a wind turbine represent primary production and energy. In the background, rolling hills, waterways and wildlife represent the natural environment and water cycle.\&quot;&gt;&quot;,&quot;title&quot;:&quot;The eight systems&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0xN1QwNDo0ODoxNy41NTZa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:6,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTdUMDU6MDA6NTkuMzcyWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Draft plans&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46890&quot;,&quot;46887&quot;,&quot;46885&quot;,&quot;46883&quot;,&quot;46881&quot;,&quot;46879&quot;,&quot;46877&quot;,&quot;46875&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTdUMDU6MDE6MjcuMTU0Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Draft plans (accessible versions)&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46889&quot;,&quot;46886&quot;,&quot;46884&quot;,&quot;46882&quot;,&quot;46880&quot;,&quot;46878&quot;,&quot;46876&quot;,&quot;46862&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE3VDA0OjQ3OjUwLjU1MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Once the consultation period is complete, your feedback will be considered in the finalisation of Victoria\u2019s Adaptation Action Plans 2027-31.&lt;\/p&gt;&lt;p&gt;A summary of the feedback received will be published on this page by the time the final Adaptation Action Plans 2027-31 are released.&lt;\/p&gt;&lt;p&gt;The final plans are expected to be released in 2027.&lt;\/p&gt;&lt;p&gt;To receive email updates, click on &lt;strong&gt;+ Follow&lt;\/strong&gt; on the right side of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0wMlQwMzozNDo1My4xOTha&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:6,&quot;children&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAzVDAwOjI5OjIwLjQ3NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Victoria\u2019s Adaptation Action Plans 2027-31 respond to the adaptation priorities outlined in &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-climate-change-strategy\&quot; target=\&quot;_blank\&quot;&gt;Victoria\u2019s Climate Change Strategy 2026-30&lt;\/a&gt;  and are underpinned by the Victorian Government\u2019s commitment to support self-determination for Traditional Owners, to care for Country and culture in a changing climate and to benefit from the transition. We acknowledge Statewide Treaty and the establishment of the First Peoples Assembly of Gellung Warl as the democratically elected representative body for First Peoples in Victoria, and will engage with the Assembly in the finalisation of the Plans.&lt;\/p&gt;&lt;h4&gt;The adaptation priorities include:&lt;\/h4&gt;&lt;h5&gt;Helping households with the cost of living and lowering costs for business&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Focus on the most at-risk individuals and communities and support them to reduce their vulnerability and exposure to climate impacts&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide information and advice to households and communities to manage climate risks and seize opportunities&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h5&gt;Putting jobs and workers first in the transition&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Focus on the most at-risk critical industry sectors and workforces and support them to reduce their vulnerability and exposure to climate impacts&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Provide information and advice to industries and businesses to manage climate risks and seize opportunities to build a climate resilient economy&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h5&gt;Building for the future&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Focus on the most at-risk assets and services and implement risk mitigation strategies, including feasible opportunities to build back better or support managed transition&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Ensure planning, design, location and procurement standards for new assets and services seek to minimise climate risks&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h5&gt;Protecting kids, families and communities&lt;\/h5&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Support emergency management and preparedness for more frequent and intense climate-related events&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Focus on climate-related risks to Victoria\u2019s natural environment and implement strategies to maximise biodiversity conservation and support ecosystem services&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Support nature-based solutions that connect Victorians to the natural environment, reduce emissions and build climate resilience&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;title&quot;:&quot;Background&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAyVDAzOjM3OjI3LjE2OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;table role=\&quot;none\&quot; class=\&quot;engage-table\&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;Term&lt;\/p&gt;&lt;\/th&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;Definition&lt;\/p&gt;&lt;\/th&gt;&lt;th colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;Source&lt;\/p&gt;&lt;\/th&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Adaptation\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;Any process of adjusting to actual or expected climate and its effects that\u2014 (a) in human systems,\u202fseeks\u202fto moderate or avoid harm or exploit beneficial opportunities;\u202fand\u202f(b) in natural systems, may be\u202ffacilitated\u202fby human intervention.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/climate-change-act-2017\/011\&quot; target=\&quot;_blank\&quot;&gt;The Climate Action Act\u202f2017&amp;nbsp;&lt;\/a&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Adaptation Action Plans\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;The Victorian Government\u2019s plans for 7 systems in the &lt;em&gt;Climate Action Act 2017&lt;\/em&gt; plus energy to ensure Victoria\u2019s climate resilience, now and in the future. The systems are: built environment, education and training, energy, health and human services, natural environment, primary production,\u202ftransport\u202fand water cycle systems.&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;DEECA, &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/climate-change-act-2017\/011\&quot; target=\&quot;_blank\&quot;&gt;The Climate Action Act\u202f2017&amp;nbsp;&lt;\/a&gt;\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Climate change\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;Changes in the state of the climate, including an increase in the occurrence of extreme weather events, long-term changes in weather patterns and sea-level rise, attributed directly or indirectly to human activity.\u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-changing-climate\/Victorias-Climate-Science-Report-2024.pdf\&quot; target=\&quot;_blank\&quot;&gt;Victoria\u2019s Climate Science Report 2024&lt;\/a&gt;\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Climate Change Strategy\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;A 5-year plan that outlines the Government of Victoria\u2019s priorities in relation to\u2014 (a) adaptation; and (b) the reduction of greenhouse gas emissions; and (c) planning for the State&#039;s transition to meet the challenges of climate change and to capitalise on the opportunities created by climate change.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/climate-change-act-2017\/011\&quot; target=\&quot;_blank\&quot;&gt;The Climate Action Act\u202f2017&amp;nbsp;&lt;\/a&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Climate hazard\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;A natural or human-caused event or condition that may cause damage and loss\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-changing-climate\/Victorias-Climate-Science-Report-2024.pdf\&quot; target=\&quot;_blank\&quot;&gt;Victoria\u2019s Climate Science Report 2024&lt;\/a&gt;\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Climate risk\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;The potential negative effects of a climate hazard, including environmental,\u202fsocietal\u202fand financial impacts, which includes consequences on lives, livelihoods, health and wellbeing,\u202fecosystems\u202fand species, economic, infrastructure, services, social and cultural assets.\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.ipcc.ch\/report\/ar6\/wg2\/\&quot; target=\&quot;_blank\&quot;&gt;IPCC AR6&lt;\/a&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Extreme weather\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;A weather event that is rare at a particular place and time of year. Examples of extreme weather events are heatwaves, bushfires, storms,\u202ffloods\u202fand droughts.\u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-changing-climate\/Victorias-Climate-Science-Report-2024.pdf\&quot; target=\&quot;_blank\&quot;&gt;Victoria\u2019s Climate Science Report 2024&lt;\/a&gt;, &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.ipcc.ch\/report\/ar6\/wg2\/\&quot; target=\&quot;_blank\&quot;&gt;IPCC AR6&lt;\/a&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;tr&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;158\&quot;&gt;&lt;p&gt;&lt;strong&gt;Resilience\u202f\u202f&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;614\&quot;&gt;&lt;p&gt;The ability of a system, community or society exposed to climate hazards to resist, absorb, accommodate, adapt to,\u202ftransform\u202fand recover from the effects of a hazard in\u202fa timely\u202fand efficient manner, including through the preservation and restoration of its essential basic structures and functions through risk management.\u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;\/td&gt;&lt;td colspan=\&quot;1\&quot; rowspan=\&quot;1\&quot; colwidth=\&quot;193\&quot;&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.climatechange.vic.gov.au\/victorias-climate-change-strategy\&quot; target=\&quot;_blank\&quot;&gt;Victoria\u2019s Climate Change Strategy 2026-2030\u202f\u202f&amp;nbsp;&lt;\/a&gt;&lt;\/p&gt;&lt;\/td&gt;&lt;\/tr&gt;&lt;\/tbody&gt;&lt;\/table&gt;&quot;,&quot;title&quot;:&quot;Glossary&quot;}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA0VDIzOjEyOjA0Ljk3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--bordered\&quot;&gt;&lt;h3&gt;Accessibility&lt;\/h3&gt;&lt;p&gt;The Victorian Government is committed to providing a website that is accessible to the widest possible audience, regardless of technology or ability. This page may not meet our minimum WCAG 2.2 AA Accessibility standards.&lt;\/p&gt;&lt;p&gt;If you are unable to access any of the content on this page, you can:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;email &lt;a class=\&quot;engage-link\&quot; title=\&quot;customer.service@deeca.vic.gov.au\&quot; href=\&quot;mailto:customer.service@deeca.vic.gov.au\&quot;&gt;customer.service@deeca.vic.gov.au&lt;\/a&gt; or call 136 186 for alternative accessible formats&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.accesshub.gov.au\/about-the-nrs\&quot; target=\&quot;_blank\&quot;&gt;National Relay Service&lt;\/a&gt; or call 133 677 if you are deaf or have a hearing or speech impairment&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; or call 131 450 if you need help with translating and interpreting&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&lt;a href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot; class=\&quot;image-link\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92008\/community-charter_d0b5.png\&quot; alt=\&quot;DEECA Community charter. Our promise: be available, involve and listen, take action.\&quot; data-href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot;&gt;&lt;\/a&gt;&lt;p&gt;&lt;\/p&gt;&lt; quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1908,&quot;tag_id&quot;:49,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:52,&quot;title&quot;:&quot;Energy&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1908,&quot;tag_id&quot;:52,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:4,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-energy-environment-and-climate-action&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Energy, Environment and Climate Action&quot;,&quot;description&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.deeca.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Department of Energy, Environment and Climate Action&lt;\/a&gt; supports thriving, productive and sustainable communities, environments and industries.&lt;\/p&gt;&lt;p&gt;We bring together Victoria\u2019s energy, environment, water, agriculture, forestry, resources, climate action, and emergency management functions into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-01T23:19:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89390,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1908,&quot;uuid&quot;:&quot;65c51e6a-0057-4a0d-8e0d-a9eb7b68f072&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;crop_DELWP_SuburbanParks2022_0458&quot;,&quot;file_name&quot;:&quot;crop-delwp-suburbanparks2022-0458_8159.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2969608,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59918},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:87243,&quot;created_at&quot;:&quot;2026-04-29T04:37:26.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-29T04:37:28.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89390\/crop-delwp-suburbanparks2022-0458_8159.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1984,&quot;vid&quot;:350192,&quot;title&quot;:&quot;Draft Darebin Planning Scheme Amendment C234dare&quot;,&quot;slug&quot;:&quot;draft-planning-scheme-amendment-to-the-darebin-planning-scheme-c234dare&quot;,&quot;summary&quot;:&quot;Have your say on proposed changes to the Darebin Planning Scheme and the combined 96A draft planning permit.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The purpose of this consultation is to seek views on the Draft Planning Scheme Amendment to the Darebin Planning Scheme. The amendment seeks to rezone land at 235\u2013239 Separation Street, Northcote from Industrial 3 Zone to Mixed Use Zone, apply the Environmental Audit Overlay, and facilitate the use and development of the land for an 8-storey (25.6m) mixed-use building comprising 256 dwellings, 351 square metres of ground floor retail space, and a two-storey basement, including the removal of 27 canopy trees and provision of a 24\/7 publicly accessible pedestrian link. The project is a combined Section 96A planning scheme amendment and Clause 53.23 (Category 1) planning permit application (PA2604366), which also delivers 3 per cent affordable housing (8 dwellings) to be gifted to a registered housing provider.&lt;\/p&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, adopt and approve a draft amendment to the Darebin Planning Scheme at 235-239 Separation Street, Northcote.&lt;\/p&gt;&lt;p&gt;Consultation is being undertaken under section 20(5) of the&amp;nbsp;Planning and Environment Act 1987.&amp;nbsp;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aW1hZ2VfZ2FsbGVyeToyMDI2LTA2LTA1VDAzOjE3OjQ0LjI5OFo=&quot;,&quot;type&quot;:&quot;image_gallery&quot;,&quot;weight&quot;:2,&quot;children&quot;:[],&quot;settings&quot;:{&quot;ratio&quot;:&quot;16_9&quot;,&quot;title&quot;:&quot;&quot;,&quot;images&quot;:[{&quot;alt&quot;:&quot;Render illustrating what the proposed development will look like&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/92019\/conversions\/c234dare2-c904-thumb.jpg&quot;,&quot;name&quot;:&quot;c234dare2-c904.png&quot;,&quot;media_id&quot;:92019}],&quot;caption&quot;:&quot;Render of proposed development&quot;},{&quot;alt&quot;:&quot;Aerial combined photo, overlayed with a map, that shows the location of the draft amendment.&quot;,&quot;image&quot;:[{&quot;url&quot;:&quot;\/storage\/media\/92020\/conversions\/c234dare3-dc06-thumb.jpg&quot;,&quot;name&quot;:&quot;c234dare3-dc06.png&quot;,&quot;media_id&quot;:92020}],&quot;caption&quot;:&quot;Location of draft planning scheme amendment&quot;}],&quot;display&quot;:&quot;slideshow&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA1VDAzOjIyOjMyLjg3NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:3,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The amendment has been requested to facilitate the redevelopment of 235\u2013239 Separation Street, Northcote, transitioning the site from an existing industrial use to a mixed-use development informed by supporting technical investigations. The proposal seeks to rezone the land from the Industrial 3 Zone to the Mixed Use Zone and to apply an Environmental Audit Overlay, enabling an 8-storey development comprising 256 dwellings, ground-floor retail, and associated infrastructure. The proposal also includes a public pedestrian through-link and the provision of affordable housing, contributing to changes in land use within an established area with access to services and public transport.&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;The amendment facilitates the redevelopment of the site for residential and commercial purposes.&lt;\/p&gt;&lt;p&gt;The amendment proposes to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amend Planning Scheme Map 14_ZN to apply the Mixed Use Zone Schedule 1 (Clause 32.04) to the entirety of the site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend Planning Scheme Map 14_EAO to apply the Environmental Audit Overlay (Clause 45.03) to the entirety of the site.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;What the draft planning permit does&lt;\/h3&gt;&lt;p&gt;The planning permit application seeks approval for the construction of an eight-storey mixed-use development comprising approximately 256 dwellings and 351sqm of ground-floor retail space. &lt;\/p&gt;&lt;p&gt;The proposal requires a permit for the following: &lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Clause 32.04-2 (Mixed Use Zone \u2013 Schedule 1) - Use of land for a food and drinks premises with a leasable floor area that exceeds 150sqm.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Clause 32.04-7 - Construct two or more dwellings on a lot.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Clause 32.04-10 - Construct a building or construct or carry out works for a use in Section 2.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Clause 52.37 (Canopy trees) - Remove, destroy or lop a canopy tree &lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;No planning permit is required for the use of land for dwellings or the two proposed shops (leasable floor area less than 150sq.m) under the MUZ1. &lt;\/p&gt;&lt;p&gt;The planning permit is attached as a separate document to this Explanatory Report. &lt;\/p&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision on whether to proceed with the draft amendment and permit application, the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of affected landowners, occupiers and relevant agencies.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Priority Projects, Department of Transport and Planning by email at&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assesssment@transport.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;development.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA2LTA1VDAzOjMyOjQ1Ljc5Mlo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0xMlQwNToxODo1OC4zODla&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:5,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTVUMDA6MTY6MTUuMDY2Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Amendment Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46797&quot;,&quot;46804&quot;,&quot;46828&quot;,&quot;46850&quot;,&quot;46851&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTZUMDI6MDA6MDYuMzA3Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Planning Permit Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46793&quot;,&quot;46795&quot;,&quot;46796&quot;,&quot;46798&quot;,&quot;46799&quot;,&quot;46800&quot;,&quot;46801&quot;,&quot;46802&quot;,&quot;46803&quot;,&quot;46805&quot;,&quot;46806&quot;,&quot;46807&quot;,&quot;46808&quot;,&quot;46829&quot;,&quot;46830&quot;,&quot;46831&quot;,&quot;46827&quot;],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&q -14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:92013,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1984,&quot;uuid&quot;:&quot;216c2f5e-1620-40d0-b31a-a4dbea28c387&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;dareC234dare1&quot;,&quot;file_name&quot;:&quot;darec234dare1_9e94.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:515274,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:89816,&quot;created_at&quot;:&quot;2026-06-05T00:37:08.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-05T00:37:09.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92013\/darec234dare1_9e94.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1979,&quot;vid&quot;:348968,&quot;title&quot;:&quot;Green Sand Recycling Pty Ltd (APP049324)&quot;,&quot;slug&quot;:&quot;green-sand-recycling-pty-ltd-app049324&quot;,&quot;summary&quot;:&quot;EPA has received a development licence application. We are seeking comments   \r\nfrom anyone who may be affected by the proposal.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;Applicant:&lt;em&gt; &lt;\/em&gt;Green Sand Recycling Pty Ltd&lt;\/p&gt;&lt;p&gt;Activity site: 68-76 Ogrady Road, Hallam VIC 3803&lt;\/p&gt;&lt;p&gt;Application number:&lt;em&gt; &lt;\/em&gt;APP049324&lt;\/p&gt;&lt;p&gt;Activity code: A13b (Waste and resource recovery - medium)&lt;\/p&gt;&lt;h3&gt;What does the application propose?&lt;\/h3&gt;&lt;p&gt;EPA has received a development licence application from Green Sand Recycling Pty Ltd. The application proposes to construct a Soil Washing Facility. The site is at 68-76 Ogrady Road, Hallam VIC 3803.&lt;\/p&gt;&lt;p&gt;The facility will process up to 750,000 tonnes per annum of clean Fill Material. The products produced are aggregates and sands which will be exported offsite.&lt;\/p&gt;&lt;p&gt;The components of the facility include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Stockpiling areas&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Soil washing plant&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Control cabin&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Static screen&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Filter press&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Thickener tank&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Water treatment plant&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Weighbridge&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Truck movement areas&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Wheel washing area&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sediment basin&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Site office and toilets&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Carparking area&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Excavator\/front-end loader&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Diesel powered generator&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;The full application can be found in the \u2018Supporting documents\u2019&amp;nbsp;section of this page.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Appendices C, H and O are commercial-in-confidence. They cannot be made public.&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAzVDA1OjM3OjM0LjIzMlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;For our translation service, please:&lt;\/p&gt;&lt;p&gt;1.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; call Translating and Interpreting Service (TIS National) on 131 450&lt;\/p&gt;&lt;p&gt;2.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; tell them the development licence application number and&lt;\/p&gt;&lt;p&gt;3.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; ask them to call EPA Victoria on 1300 372 842.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Translation and interpreting service&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA5VDAxOjMzOjA2LjY5N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;EPA invites anyone who feels they may be affected by the proposed development activities to make a submission. You must make your submission using the form on this page.&lt;\/p&gt;&lt;p&gt;Notice of this application and submission period was published on 16 June 2026 in Endeavour Hills Star Journal.&lt;\/p&gt;&lt;p&gt;EPA will consider submissions made before 11:59 pm, 8 July 2026.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period open&quot;}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0wM1QwNTozODowMi41NTVa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTBUMjM6MTk6NDguNzQzWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Development licence application&quot;,&quot;select_271&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46824&quot;],&quot;limit&quot;:&quot;200&quot;}}}],&quot;settings&quo 3:16.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-03T05:33:16.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1979,&quot;created_by_id&quot;:50096,&quot;modified_by_id&quot;:50096,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/green-sand-recycling-pty-ltd-app049324\/timeline\/37362&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:34,&quot;title&quot;:&quot;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1979,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:13,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Environment Protection Authority&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;environment-protection-authority&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Environment Protection Authority&quot;,&quot;description&quot;:&quot;&lt;p&gt;Environment Protection Authority Victoria (EPA) is Victoria\u2019s&amp;nbsp;environmental regulator.&lt;\/p&gt;&lt;p&gt;For details about the current Development Licence Applications please visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/epa-development-licence-applications\&quot; target=\&quot;_blank\&quot;&gt;EPA Development Licence Applications&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:91985,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1979,&quot;uuid&quot;:&quot;89fac812-67c9-4b01-bbe0-171c40ebacf5&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;260219 A3 GSR - Engage Vic photo&quot;,&quot;file_name&quot;:&quot;260219-a3-gsr-engage-vic-photo_4e17.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:3962704,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:89788,&quot;created_at&quot;:&quot;2026-06-03T05:38:47.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-03T05:38:50.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91985\/260219-a3-gsr-engage-vic-photo_4e17.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1975,&quot;vid&quot;:347756,&quot;title&quot;:&quot;Yurringa Energy Pty Ltd \u2013 electricity retail licence application&quot;,&quot;slug&quot;:&quot;yurringa-energy-pty-ltd-electricity-retail-licence-application&quot;,&quot;summary&quot;:&quot;The Essential Services Commission is reviewing an application from Yurringa Energy Pty Ltd for   \r\nan electricity retail licence and wants to hear from you.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;Yurringa Energy Pty Ltd has applied to the Essential Services Commission for a licence to sell electricity by retail in Victoria. &lt;\/p&gt;&lt;p&gt;We are responsible for deciding whether to grant or refuse a licence application. We invite your feedback between 10 June and 7 July 2026. The commission will make a decision on the licence application later in 2026.&lt;\/p&gt;&lt;h3&gt;How does Yurringa Energy Pty Ltd propose to use this licence?&lt;\/h3&gt;&lt;p&gt;Yurringa Energy Pty Ltd is seeking a licence to sell electricity by retail to business customers (i.e. not to residential customers). &lt;\/p&gt;&lt;p&gt;You can find more information about Yurringa\u2019s proposed retail activities in its application for an electricity retail licence.&lt;\/p&gt;&lt;h3&gt;Our role in energy licensing&lt;\/h3&gt;&lt;p&gt;A person who wants to engage in the activity of selling electricity by retail in Victoria is required to hold a licence granted by the Essential Services Commission.&lt;\/p&gt;&lt;p&gt;We are responsible for deciding whether to grant or refuse a licence application. We must have regard to our objectives when deciding whether to grant or refuse a licence application.* This includes promoting the long-term interests of Victorian consumers with respect to the price, quality and reliability of essential services.** &lt;\/p&gt;&lt;p&gt;* In accordance with section 19 of the &lt;em&gt;Electricity Industry Act 2000&lt;\/em&gt;.&lt;\/p&gt;&lt;p&gt;** Under the &lt;em&gt;Essential Services Commission Act 2001&lt;\/em&gt; and the &lt;em&gt;Electricity Industry Act 2000&lt;\/em&gt;. &lt;\/p&gt;&lt;h3&gt;How we assess licence applications&lt;\/h3&gt;&lt;p&gt;Consistent with our objectives, we will not grant an electricity retail licence unless we are satisfied that:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;the applicant has the technical capacity to comply with the conditions of the licence&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the applicant is financially viable to undertake the licensed activity&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the applicant is a \u2018fit and proper\u2019 person to hold a licence in Victoria.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can refer to our &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/sites\/default\/files\/documents\/Guideline - Applications for electricity and gas industry licences - version 1.4.2_0.pdf\&quot;&gt;Guideline: Applications for electricity and gas industry licences&lt;\/a&gt; for more information. The guideline includes information to assist people to understand our licensing process. &lt;\/p&gt;&lt;h3&gt;How to participate &lt;\/h3&gt;&lt;p&gt;We are seeking feedback from stakeholders on Yurringa Energy Pty Ltd\u2019s application that may assist us in deciding to grant or refuse this application. &lt;\/p&gt;&lt;p&gt;You may provide your feedback by:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;providing comments in the below survey; or&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;providing a submission document\/s&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can upload your submission below or send it to us via the below contact details:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Email: Licences@esc.vic.gov.au&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Mail: Essential Services Commission, Level 8, 570 Bourke Street, Melbourne Victoria 3000&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can also call us on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:03 9032 1300\&quot;&gt;03 9032 1300&lt;\/a&gt; to discuss your options.&lt;\/p&gt;&lt;p&gt;If English is not your first language, please contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131 450\&quot;&gt;131 450&lt;\/a&gt; to make your submission using an interpreter.&lt;\/p&gt;&lt;p&gt;Submissions close on 7 July 2026.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;4&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI3VDAwOjQ1OjI1LjU5Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;What will be done with the feedback? What are the next steps in the process?&lt;\/p&gt;&lt;p&gt;We will review all submissions once the consultation is completed, and your feedback will inform our consideration of the application. &lt;\/p&gt;&lt;p&gt;Yurringa Energy Pty Ltd will have the right to respond to all feedback received. This will be deidentified where requested. We will notify you if this response is made public.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,& type&quot;:null,&quot;created_at&quot;:&quot;2026-05-27T01:47:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-27T01:47:03.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1975,&quot;created_by_id&quot;:57933,&quot;modified_by_id&quot;:57933,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/yurringa-energy-pty-ltd-electricity-retail-licence-application\/timeline\/37332&quot;,&quot;summary&quot;:&quot;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:52,&quot;title&quot;:&quot;Energy&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:59:12.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1975,&quot;tag_id&quot;:52,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:12,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Essential Services Commission&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;essential-services-commission&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Essential Services Commission&quot;,&quot;description&quot;:&quot;&lt;p&gt;We promote the long-term interests of Victorian consumers with respect to the price, quality and reliability of essential services.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2274,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-02-11T02:31:43.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/essential-services-commission&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:91018,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1975,&quot;uuid&quot;:&quot;d5313269-4e90-4e46-899f-5c7a6b5489d9&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;pexels-davidmceachan-90912 900px&quot;,&quot;file_name&quot;:&quot;pexels-davidmceachan-90912-900px_4de5.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:931608,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:57933},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:88838,&quot;created_at&quot;:&quot;2026-05-27T00:36:43.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-27T00:36:44.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91018\/pexels-davidmceachan-90912-900px_4de5.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1956,&quot;vid&quot;:346669,&quot;title&quot;:&quot;Protecting your privacy in the Register of land&quot;,&quot;slug&quot;:&quot;protecting-your-privacy-in-the-register-of-land&quot;,&quot;summary&quot;:&quot;Have your say on potential privacy protections in the Register of land. \nReview the consultation paper and share your feedback by 31 July 2026.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Registrar of Titles (the Registrar) within the Department of Transport and Planning (DTP) maintains the Register of land (the Register), which is the official record of land ownership in Victoria.&lt;\/p&gt;&lt;p&gt;The Register is, and always has been, a public register that supports the efficient functioning of property transactions. A publicly searchable register of land is a fundamental element of Victoria&#039;s property system.&lt;\/p&gt;&lt;p&gt;We want to hear your views on how to balance privacy with keeping the Register open and accessible. Your feedback will help us understand how people feel about access to personal information in the Register.&lt;\/p&gt;&lt;p&gt;The consultation paper sets out specific proposals for possible changes to the ways the Register may be searched. DTP will use the feedback gathered to inform policy development relating to privacy protections in the Register of land.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAxVDA2OjQwOjEwLjYzNFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;How the Register currently works&lt;\/h3&gt;&lt;p&gt;The Register contains personal information, including the names and addresses of property owners.&lt;\/p&gt;&lt;p&gt;To search for property information, you need a unique reference (the Volume\/Folio number). If you don&#039;t know this reference, you can search the index to the Register (the Land Index) using:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;a person&#039;s name&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a property&#039;s street address&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a land description (lot or plan reference)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;These searches provide the Volume\/Folio number, which you can then use to obtain a Register Search Statement (title search) containing the full property details including owner names and addresses.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Name searches&lt;\/strong&gt; can be done online through authorised information brokers.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Address searches&lt;\/strong&gt; can be done online through the public LANDATA\u00ae web service, or through an authorised information broker.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAxVDA2OjQwOjA2LjcyNVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Why this matters&lt;\/h3&gt;&lt;p&gt;The Registrar periodically receives requests from individuals who wish to limit access to their personal information in the Register for various reasons, including personal safety concerns.&lt;\/p&gt;&lt;p&gt;Any change to how the Register can be searched could impact:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;property owners seeking privacy protection&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;conveyancers, lawyers and financial institutions conducting property transactions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;people pursuing legal matters, debt recovery, or estate administration&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the transparency and efficiency of Victoria&#039;s property market&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the balance between individual privacy and public interest in an open and transparent property market.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMDFUMDY6NDc6MjQuNTcwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Consultation paper&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46618&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAxVDA2OjM5OjU0LjU3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h2&gt;How to participate&lt;\/h2&gt;&lt;p&gt;You can get involved in this consultation in a way that suits you.&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h3&gt;Read the consultation paper available on this page&lt;\/h3&gt;&lt;p&gt;The &lt;strong&gt;consultation paper&lt;\/strong&gt; above includes detailed information about the current situation, three proposed options, and consultation questions.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Complete the online survey&lt;\/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Answer the consultation questions using the survey tool on this page.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;You can respond to all questions, or just those that are relevant to you.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;The survey takes around 10 minutes to complete.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Make a written submission&lt;\/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Upload your written submission using the survey tool on this page.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;There is no set format for submissions, but we believe you will find it useful to address the questions in the consultation paper.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Share the consultation&lt;\/h3&gt;&lt;p&gt;Share this consultation with your networks to help us reach more stakeholders.&lt;\/p&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Public consultation dates&lt;\/h3&gt;&lt;p&gt;Submissions &lt;strong&gt;open 2 June 2026&lt;\/strong&gt; and &lt;strong&gt;close at 11.59pm on Friday 31 July 2026&lt;\/strong&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA1LTI4VDIzOjQ5OjIxLjE4NVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Make a submission&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6651&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAxVDA2OjM5OjU4LjIxOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Need help?&lt;\/h3&gt;&lt;p&gt;If you have questions about the consultation process, please contact us at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:lsv.consultation@transport.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;lsv.consultation@transport.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAxVDA2OjQwOjAyLjA2OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h2&gt;Next steps&lt;\/h2&gt;&lt;p&gt;Thank you for taking the time to participate in this important consultation.&lt;\/p&gt;&lt;p&gt;We will consider all feedback received during this consultation to help inform policy decisions about privacy protections in the Register.&lt;\/p&gt;&lt;p&gt;After the consultation closes on 31 July 2026, we will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Review all submissions and feedback received&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Prepare a consultation summary document&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Make recommendations to the Minister for Planning based on your input&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;We will provide updates here on Engage Victoria and on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.land.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Land.Vic website&lt;\/a&gt; when an outcome is reached.&lt;\/p&gt;&quot;,&quot;title&quot;:null}}],&quot;date_end&quot;:&quot;2026-07-31T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;department&quot;,&quot;value&quot;:&quot;Land Services Victoria, Department of Transport and Planning&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;lsv.consultation@transport.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-05-11T07:12:52.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-01T23:08:17.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5366,&quot;team_id&quot;:21,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:42373,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:3,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/protecting-your-privacy-in-the-register-of-land&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-theme__default&quot;,&quot;static_map&quot;:null,&quot;status_label&quot;:&quot;Published&quot;,&quot;subscribe_form_schema&quot;:{&quot;subscribe&quot;:{&quot;title&quot;:&quot;Follow&quot;,&quot;description&quot;:&quot;Enter your email below for updates about the &lt;strong&gt;Protecting your privacy in the Register of land&lt;\/strong&gt; project&quot;,&quot;button_text&quot;:&quot;Follow this project&quot;},&quot;unsubscribe&quot;:{&quot;title&quot;:&quot;You are following&quot;,&quot;description&quot;:&quot;Click the unfollow button to stop receiving updates about the &lt;strong&gt;Protecting your privacy in the Register of land&lt;\/strong&gt; project.&quot;,&quot;button_text&quot;:&quot;Unfollow&quot;,&quot;footer_text&quot;:&quot;You can manage the projects you&#039;re following anytime by visiting &lt;a href=https:\/\/engage.vic.gov.au\/profile\/subscriptions&gt;Subscriptions&lt;\/a&gt; under your profile&quot;}},&quot;consult_status&quot;:{&quot;id&quot;:1,&quot;name&quot;:&quot;ope t;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:39,&quot;title&quot;:&quot;Housing and communities&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1956,&quot;tag_id&quot;:39,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1956,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:90138,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1956,&quot;uuid&quot;:&quot;28566681-c51f-44b9-aa8e-917bc6d2312a&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;LANDATA_ScreenUpdate_Aug2025-redacted&quot;,&quot;file_name&quot;:&quot;landata-screenupdate-aug2025-redacted_1bff.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:277561,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:60071},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:87978,&quot;created_at&quot;:&quot;2026-05-12T07:31:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-12T07:31:05.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/90138\/landata-screenupdate-aug2025-redacted_1bff.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1962,&quot;vid&quot;:346076,&quot;title&quot;:&quot;Victoria Police Community Sentiment Survey \u2013 2026&quot;,&quot;slug&quot;:&quot;vicpol-2026&quot;,&quot;summary&quot;:&quot;From 1 June 2026, we\u2019re asking all Victorians about your local safety concerns, and where we can focus our efforts to keep you safer.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Acknowledgement of Country&lt;\/h2&gt;&lt;p&gt;We acknowledge the Traditional Custodians of the lands on which we work and their deep and continuing connection to Country. We pay our respect to their Elders past and present.&lt;\/p&gt;&lt;h3&gt;About this survey&lt;\/h3&gt;&lt;p&gt;The annual Community Sentiment Survey provides an opportunity for all Victorians to share their safety concerns, how they would like to interact with police, and where Victoria Police can focus efforts to keep our communities safer.&lt;\/p&gt;&lt;p&gt;The survey supports the Neighbourhood Policing Framework and is for people of all backgrounds who live, work and socialise in Victoria.&lt;\/p&gt;&lt;p&gt;The survey is anonymous.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA1LTMxVDIyOjI3OjU1LjQ3M1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;cGFnZXM6MjAyNi0wNS0zMVQyMjozMToxNC42OTVa&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTMxVDIyOjI3OjUyLjYwOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Your privacy&lt;\/h3&gt;&lt;p&gt;Victoria Police is not seeking any identifying information. Data may be automatically recorded for statistical and system administration purposes. To the extent that any data could make you identifiable, Victoria Police will not attempt to identify you from such data unless required by law. Victoria Police will handle any personal information you provide under the &lt;em&gt;Privacy and Data Protection Act 2014 &lt;\/em&gt;and the &lt;em&gt;Health Records Act 2001&lt;\/em&gt;. The Victoria Police Privacy Statement can be viewed at &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.police.vic.gov.au\/privacy\&quot; target=\&quot;_blank\&quot;&gt;Privacy (police.vic.gov.au)&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Please note that this survey is not a way to report a specific crime. If you would like to report a crime, please phone 000 if it is an emergency. If it is not an emergency, call the Police Assistance Line on 131 444 or contact your local police station. You can also report anonymously to Crime Stoppers Victoria on 1800 333 000.&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTMxVDIyOjI3OjU0LjMwOFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Next steps&lt;\/h3&gt;&lt;p&gt;Your responses will help inform the initiatives Victoria Police delivers to keep you and our communities safer. This includes working with partners on local safety plans to address the issues which are most important to you.&lt;\/p&gt;&lt;p&gt;In the coming months, Victoria Police will share a summary of key findings on the Engage Victoria website. Local summaries will also be shared on &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.police.vic.gov.au\/eyewatch\&quot; target=\&quot;_blank\&quot;&gt;Victoria Police Eyewatch page&lt;\/a&gt; (Facebook) pages.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Lates
