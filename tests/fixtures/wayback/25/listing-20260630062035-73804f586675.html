uot;matomo&quot;:{&quot;url&quot;:&quot;https:\/\/engage-victoria.analytics.stack.host\/&quot;,&quot;site_id&quot;:&quot;5&quot;},&quot;strings&quot;:{&quot;loginFormErrorMessage&quot;:&quot;Due to platform improvements you may need to &lt;a href=\&quot;\/forgot-password\&quot;&gt;reset your password&lt;\/a&gt;&quot;},&quot;previewMode&quot;:{&quot;isPreview&quot;:false,&quot;versionId&quot;:-1},&quot;session&quot;:false,&quot;DistrictSurveyEmbed&quot;:{&quot;domain&quot;:&quot;https:\/\/engagevictoria.districtengage.com&quot;,&quot;footer_survey&quot;:{&quot;code&quot;:&quot;&lt;a href=\&quot;\/surveys\/secure_form\/survey\/csat-survey-engage-victoria\&quot; data-embed-url=\&quot;[DOMAIN]\/embed\/survey\/csat-survey-engage-victoria\&quot; class=\&quot;district-embed\&quot; data-width=\&quot;100%\&quot; data-height=\&quot;100%\&quot; target=\&quot;_blank\&quot;&gt;CSAT Survey Engage Victoria&lt;\/a&gt;&lt;script async src=\&quot;[DOMAIN]\/js\/embed.js\&quot; charset=\&quot;utf-8\&quot;&gt;&lt;\/script&gt;&quot;,&quot;enabled&quot;:true}},&quot;FrontendBanner&quot;:{&quot;html&quot;:&quot;&quot;,&quot;include_on_routes&quot;:[],&quot;css_class&quot;:&quot;uk-alert uk-alert-warning&quot;}},&quot;metatags&quot;:{&quot;title&quot;:&quot;Engage Victoria&quot;,&quot;meta&quot;:[{&quot;name&quot;:&quot;description&quot;,&quot;content&quot;:&quot;Engagement platform&quot;},{&quot;property&quot;:&quot;og:site_name&quot;,&quot;content&quot;:&quot;Engage Victoria&quot;},{&quot;property&quot;:&quot;og:locale&quot;,&quot;content&quot;:&quot;en_AU&quot;},{&quot;property&quot;:&quot;og:type&quot;,&quot;content&quot;:&quot;website&quot;},{&quot;name&quot;:&quot;generator&quot;,&quot;content&quot;:&quot;District Engage&quot;},{&quot;name&quot;:&quot;twitter:card&quot;,&quot;content&quot;:&quot;summary&quot;},{&quot;name&quot;:&quot;msapplication-TileColor&quot;,&quot;content&quot;:&quot;#dddddd&quot;},{&quot;name&quot;:&quot;theme-color&quot;,&quot;content&quot;:&quot;#ffffff&quot;}],&quot;links&quot;:[{&quot;rel&quot;:&quot;apple-touch-icon&quot;,&quot;sizes&quot;:&quot;120x120&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/apple-touch-icon.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;32x32&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-32x32.png&quot;},{&quot;rel&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;image\/png&quot;,&quot;sizes&quot;:&quot;16x16&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/favicon-16x16.png&quot;},{&quot;rel&quot;:&quot;manifest&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/site.webmanifest&quot;,&quot;crossorigin&quot;:&quot;use-credentials&quot;},{&quot;rel&quot;:&quot;mask-icon&quot;,&quot;color&quot;:&quot;#008099&quot;,&quot;href&quot;:&quot;\/themes\/victoria\/icons\/safari-pinned-tab.svg&quot;}]},&quot;messages&quot;:[],&quot;lang&quot;:&quot;en&quot;,&quot;meta&quot;:{&quot;current_page&quot;:1,&quot;data&quot;:[{&quot;id&quot;:1990,&quot;vid&quot;:350990,&quot;title&quot;:&quot;Draft Hume Planning Scheme Amendment C283hume&quot;,&quot;slug&quot;:&quot;draft-hume-planning-scheme-amendment-c283hume&quot;,&quot;summary&quot;:&quot;Have your say on the proposed changes to the Hume Planning Scheme to rezone part of Jacksons Hill, Sunbury.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The purpose of this consultation is to seek views on draft Planning Scheme Amendment C283hume to the Hume Planning Scheme. The Minister for Planning is considering whether to prepare, adopt and approve the amendment. This consultation is being carried out in accordance with section 20(5) of the &lt;em&gt;Planning and Environment Act 1987.&lt;\/em&gt;&lt;\/p&gt;&lt;p&gt;The amendment applies to part of the former Victoria University Sunbury Campus at 2-90 Circular Drive, Sunbury, comprising the central area generally bound by Circular Drive. The land has been declared surplus to the needs of the Victorian Government. In accordance with the &lt;em&gt;Victorian Government Land Transaction Policy &lt;\/em&gt;(2022), it must be rezoned to a non-public use before it can be sold.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The amendment will rezone the land from the Public Use Zone (PUZ) to the Mixed Use Zone (MUZ). The changes will implement the first phase of the Jacksons Hill Master Plan (2018), which identifies the subject land as a future mixed use precinct. The changes will support housing diversity and residential development that is consistent with the master plan and the existing and preferred character of the area.&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92468\/image_4e3e.png\&quot;&gt;&lt;p&gt;&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The subject land has historically been used for a range of institutional uses. It most recently operated as Victoria&amp;nbsp;University&#039;s Sunbury Campus from 1994 until 2009 before being decommissioned in 2011. The Victorian Government purchased the site in 2018. It has now been declared surplus to government needs and must be rezoned before it can be sold.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;The draft amendment proposes to make changes to the Hume Planning Scheme to implement the first phase of the Jacksons Hill Master Plan, comprising the area generally bound by Circular Drive.&lt;\/p&gt;&lt;p&gt;Draft Amendment C283hume seeks to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Rezone the subject land from the Public Use Zone \u2013 Schedule 2 (PUZ2) to the Mixed-Use Zone \u2013 Schedule 1 (MUZ1);&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Apply the Environmental Audit Overlay (EAO) to the subject land; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 72.01 (Responsible authority for administering this planning scheme) to update Map 1 to the Schedule to Clause 72.01.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;The Minister for Planning is considering exercising the powers under section 20(4) of the Act to exempt the amendment from the usual notice requirements of sections 17, 18 and 19 and preparing, adopting and approving the amendment. Before making a decision on whether to proceed&amp;nbsp;with the draft amendment, the Minister for Planning is undertaking consultation under section 20(5) of the Act to understand the views of affected landowners, occupiers and relevant public agencies.&lt;\/p&gt;&lt;p&gt;All submissions received during the consultation period will be considered by the Minister for Planning before a decision on the amendment is made.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;You can make a submission on the draft amendment via the below survey link. If you would like further information, please email Tom Gallagher, Senior Planner, Department of Transport and Planning, at&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:tom.gallaher@transport.vic.gov.au\&quot;&gt; tom&lt;\/a&gt;&lt;a class=\&quot;engage-link\&quot; title=\&quot;mailto:environment.assesssment@transport.vic.gov.au\&quot; href=\&quot;mailto:tom.gallaher@transport.vic.gov.au\&quot;&gt;.&lt;\/a&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:tom.gallaher@transport.vic.gov.au\&quot;&gt;gallagher@transport.vic.gov.au.&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMjVUMDU6MjA6NTguNzQ3Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&qu ;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:92460,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1990,&quot;uuid&quot;:&quot;a7037254-4cc3-4b7b-8673-5ed2a55799aa&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;PSAC283humepng&quot;,&quot;file_name&quot;:&quot;psac283humepng_b35a.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:744393,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:90253,&quot;created_at&quot;:&quot;2026-06-22T02:37:57.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-22T02:37:58.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92460\/psac283humepng_b35a.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1989,&quot;vid&quot;:350583,&quot;title&quot;:&quot;Draft Strathbogie Planning Scheme Amendment C93strb&quot;,&quot;slug&quot;:&quot;draft-nagambie-planning-scheme-amendment-c93strb&quot;,&quot;summary&quot;:&quot;Have your say on Draft Planning Scheme Amendment C93strb, which seeks to rezone the site adjacent to the Nagambie Wastewater Treatment Plant.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The purpose of this consultation is to seek views on the Draft Strathbogie Planning Scheme Amendment C93strb, which proposes to rezone land at 894 McDonalds Road, Nagambie from Farming Zone to Public Use Zone 1. The rezoning will facilitate ongoing and future use of the land for public utility as a component of the Nagambie Wastewater Treatment Plant.&lt;\/p&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, approve and adopt Drat Planning Scheme Amendment C93strb to the Strathbogie Planning Scheme under section 20(4) of the Planning and Environment Act 1987. The draft amendment applies to land at 894 McDonalds Road, Nagambie.&lt;\/p&gt;&lt;p&gt;Consultation is being undertaken under section 20(5) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;On the 18 March 2026, the Minister for Planning received a request from Goulburn Valley Region Water Corporation to prepare, adopt and approve an amendment to the Strathbogie Planning Scheme by exercising the powers under section 20(4) of the Planning and Environment Act 1987. The proposal seeks to rezone the land from Farming Zone to Public Use Zone 1 (Service and Utility) facilitating the use and development of the site for water storage and disposal of treated wastewater generated by the plant.&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;Draft Amendment C93strb proposes the following changes to the Strathbogie Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amend Planning Scheme Map 21_ZN to apply the Public Use Zone 1 (Clause 36.01) to the entirety of the site.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision on whether to proceed with the draft amendment and permit application, the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of affected landowners, occupiers and relevant agencies.&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Priority Projects, Department of Transport and Planning by email at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:regional.planningservices@transport.vic.gov.au\&quot;&gt;Regional Planning Services.&lt;\/a&gt; &amp;nbsp;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;number_225&quot;:&quot;2&quot;,&quot;select_223&quot;:&quot;all&quot;,&quot;select_224&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0xOVQwNjo1NzowMy44ODBa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:3,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTlUMDY6NTU6MzYuNTU2Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:3,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;items&quot;:[],&quot;limit&quot;:200}}}],&quot;settings&quot;:{&quot;type&quot;:&quot;list&quot;,&quot;title&quot;:&quot;Documents&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE5VDA1OjQwOjIzLjc0MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Next steps&lt;\/h3&gt;&lt;p&gt;If you provide a submission that&lt;strong&gt; inludes your correct contact details &lt;\/strong&gt;to this application, by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1989,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:92439,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1989,&quot;uuid&quot;:&quot;2a4db801-937f-4cca-98ff-52adaa03033e&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Nagambie&quot;,&quot;file_name&quot;:&quot;nagambie_b11e.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:534642,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:90233,&quot;created_at&quot;:&quot;2026-06-19T05:43:54.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-19T05:43:54.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92439\/nagambie_b11e.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1920,&quot;vid&quot;:350061,&quot;title&quot;:&quot;EES West package \u2013 Lindsay Island and Wallpolla Island&quot;,&quot;slug&quot;:&quot;VMFRP-SIAC-EES-West&quot;,&quot;summary&quot;:&quot;The Standing Inquiry and Advisory Committee seeks submissions to advise the Minister on the proposed Lindsay Island and Wallpolla Island Floodplain Restoration Projects&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;The Minister for Planning appointed the Victorian Murray Floodplain Restoration Project Standing Inquiry and Advisory Committee (SIAC; Committee) to inquire into, and report on, the potential environmental effects of each of the proposed nine Victorian Murray Floodplain Restoration Projects (VMFRP) that will be referred to them in four \u2018assessment packages\u2019.&lt;\/p&gt;&lt;p&gt;On 5 June 2026, the EES West assessment package was referred to the SIAC (EES West Projects). This package includes the proposed Lindsay Island Floodplain Restoration Project (Lindsay Island) and Wallpolla Island Floodplain Restoration Project (Wallpolla Island). The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46819   \&quot; target=\&quot;_blank\&quot;&gt;letter of referral&lt;\/a&gt; can be found in the Document Folder at the bottom of this page.&lt;\/p&gt;&lt;p&gt;The SIAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;consider the Environment Effects Statement (EES), the draft Planning Scheme Amendment (PSA) C119 to the Mildura Planning Scheme, and public submissions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;hold a public Hearing to hear from the Proponent and submitters who want to speak to their written submission&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide advice to the Minister about the environmental effects of both projects in the EES West assessment package.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The SIAC will follow &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46818\&quot; target=\&quot;_blank\&quot;&gt;Terms of Reference&lt;\/a&gt; approved by the Minister for Planning. The Terms of Reference set out the SIAC\u2019s scope. The Terms of Reference and &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46819\&quot; target=\&quot;_blank\&quot;&gt;letter of referral&lt;\/a&gt; for this matter can be found in the Document folder at the bottom of this page.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Standing Inquiry and Advisory Committee members&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The names of the SIAC Members who are considering the EES West package will be published here following their appointment.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTIxVDE0OjA4OjMwLjk2M1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;The Proposal&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Lindsay Island and Wallpolla Island Floodplain Restoration projects are located in north-west Victoria within the Murray-Sunset National Park in the Mildura Rural City municipality.&lt;\/p&gt;&lt;p&gt;The Lindsay Island Floodplain project is approximately 75 km north-west of Mildura and 30 km east of Renmark, South Australia. The Wallpolla Island Floodplain project is located on the southern side of the Murray River, approximately 30 km west of Mildura, and immediately downstream of the junction of the Murray and Darling Rivers.&lt;\/p&gt;&lt;p&gt;The restoration projects aim to restore more natural watering to approximately 8,950 hectares of high ecological-value Murray River floodplain.&lt;\/p&gt;&lt;p&gt;The proposed construction works would install infrastructure required to facilitate managed watering events. Once operational, these events would mimic the timing and extent of natural flood events in a controlled manner, supporting the long-term health of flood dependent plants and animals.&lt;\/p&gt;&lt;p&gt;The environmental works for these projects include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;construction of containment banks&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;large and small regulators&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;culverts&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;temporary pump infrastructure and pipeline alignments&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;upgrades to existing access tracks and new access tracks&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;a drop structure and channel&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;installation of traffic management gates (Wallawalla Causeway) for road closures during inundation events.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Lower Murray Water is the project proponent for both projects.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;View the Proposal&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;You can view and download the exhibited Environment Effects Statement (EES), draft Planning Scheme Amendment, and other related documents on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/caportal.com.au\/vmfrp\/projects\/western\&quot; target=\&quot;_blank\&quot;&gt;Proponent\u2019s website&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46872\&quot; target=\&quot;_blank\&quot;&gt;public notice&lt;\/a&gt; has more information about where you can see hard copies of the EES summary booklet and other fact sheets in person.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;The Proposal&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE1VDA0OjM1OjAzLjA0N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;6&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Projects will be open for public exhibition for 30 business days between &lt;strong&gt;Monday 22 June 2026 and 11:59pm on Friday 31 July 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You are invited to make a written submission during this time. Please use the online submission form below to send your submission.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;If you want to participate and speak at the Hearing, you must make a written submission and indicate on the submission form that you wish to be heard. The SIAC will consider all written submissions when preparing its advice to the Minister, whether or not a submitter chooses to speak.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Public exhibition&quot;}},{&quot;id&quot;:&quot;cGFnZXM6MjAyNi0wNi0xNVQwMzo1MzowMS44OTNa&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Standing Inquiry and Advisory Committee process&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;4234&quot;],&quot;limit&quot;:&quot;8&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE1VDAzOjUzOjIwLjQ5MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Directions Hearing&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The SIAC will hold a Directions Hearing at &lt;strong&gt;10:00am on Monday 17 August 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the SIAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and make arrangements for the Hearing, including the dates and format&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Hearing will be conducted and how information will be shared before the Hearing, including expert statements&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;discuss site inspections&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;consider any procedural issues&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer any questions about the SIAC process, including the Hearing.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;More information about the Directions Hearing will be published here once the details are confirmed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Hearing&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Hearing will commence in the &lt;strong&gt;week beginning Monday 14 September 2026&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for 3 to 4 weeks (as required).&lt;\/p&gt;&lt;p&gt;The Hearing gives people who indicated they wanted to be heard an opportunity to speak in support of their written submission. The Proponent (Lower Murray Water) will also speak and present expert evidence at the hearing.&lt;\/p&gt;&lt;p&gt;The Hearing is open to the public, so anyone can watch.&lt;\/p&gt;&lt;p&gt;A timetable for the Hearing will be published after the Directions Hearing.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Report&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Terms of Reference require the SIAC to submit its report to the Minister for Planning within 40 business days from the last day of its proceedings.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the SIAC\u2019s report to inform the Minister\u2019s Assessment under the&lt;em&gt; Environment Effects Act 1978&lt;\/em&gt;. This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE1VDAzOjUzOjQ1LjExOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;8&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;You can make a written submission between &lt;strong&gt;Monday 22 June 2026 and 11.59pm on Friday 31 July 2026&lt;\/strong&gt; by completing the online form below.&lt;\/p&gt;&lt;p&gt;You only need to make one submission to share all your views on the Environment Effects Statement (EES) and draft PSA.&lt;\/p&gt;&lt;p&gt;If you want to speak at the Hearing, make sure you tick the box when completing the online form.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission or would like to submit a hard copy, contact Planning Panels Victoria on 136 186 (select option 6) or email VMFRP.SIAC@transport.vic.gov.au.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy and Intellectual Property&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Your submission will be a public document. To make a submission, you must read the Privacy Collection Statement and click \u2018agree\u2019 where indicated on the online form.&lt;\/p&gt;&lt;p&gt;The Privacy Collection Statement explains how we will use your submission and any other information you provide to the SIAC, which include putting it online and providing it to the Proponent, other parties to the Hearing and to the government agencies specified in the Terms of Reference.&lt;\/p&gt;&lt;p&gt;You should not include any personal information in your submission that could identify you or other people unless you (or they) are happy for that information to be made publicly available. Examples are email addresses, phone numbers or photos of people (particularly children). You should also not include any material authored by another person unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Have your say - make a submission&quot;}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA2LTE2VDAzOjI3OjM3LjUwOFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Online submission form&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6693&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE2VDAzOjI3OjQwLjYwMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;9&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Click the \u201cstart survey\u201d button to make your submission.&lt;\/strong&gt;&lt;\/h4&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMTZUMDM6MTU6MzEuNDI2Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46817&quot;,&quot;46818&quot;,&quot;46815&quot;,&quot;46816&quot;,&quot;46819&quot;,&quot;46872&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZXZlbnRzOjIwMjYtMDYtMTBUMTI6NDQ6MjUuMTE2Wg==&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE1VDAzOjU0OjUwLjA1OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;10&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;How do I make a submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to lodge my submission online?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes, please use the online form to make your submission. You can type (or copy and paste) directly into the form or upload a file as an attachment. Accepted file types include PDF, DOC, DOCX, TXT, RTF, PNG, GIF, JPG, and JPEG.&lt;\/p&gt;&lt;p&gt;Each file must be under 20MB, and the total of all files uploaded to the form must be under 40MB.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission, please email VMFRP.SIAC@transport.vic.gov.au.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a hard copy submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Online submissions are strongly preferred. However, if you can\u2019t submit online, you can send a hard copy.&lt;\/p&gt;&lt;p&gt;A hard copy submission must be accompanied by a completed \u2018Submission Coversheet\u2019 which you can request from Planning Panels Victoria through the Customer Call Centre on 136 186 (select option 6) or by emailing VMFRP.SIAC@transport.vic.gov.au. The Submission Coversheet includes important information we need to process your submission, to enable you to participate in the SIAC process if you want to be heard, and privacy information.&lt;\/p&gt;&lt;p&gt;Make sure your submission and Submission Coversheet arrive before the exhibition period ends.&lt;\/p&gt;&lt;p&gt;Please do not email your submission directly to Planning Panels Victoria or any other party such as the Minister for Planning, the Department of Transport and Planning (DTP) Impact Assessment Unit or the Proponent. If you do, it may not be considered by the SIAC. Please use the online submission form, or if this is not possible, send a hard copy with a completed coversheet to Planning Panels Victoria.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to make separate submissions on the Environment Effects Statement (EES) and the draft PSA?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;All submissions will be treated as a submission to all the exhibited documents (the EES and the draft PSA). You don\u2019t need to make a separate submission on each document. You should include all your views about the EES and the draft PSA in one single submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;I might want legal support in making a submission or to help me during the process. What resources are available to me?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;You don\u2019t need legal support to make your submission or participate in the SIAC process, however you may choose to engage a lawyer to assist you.&lt;\/p&gt;&lt;p&gt;Foley\u2019s List barristers is offering a Legal Assistance Service that offers low-cost or no-cost legal support to eligible submitters in Planning Panel Victoria hearings.\u202f Available to individuals and community groups, the service offers legal advice and representation to help participants navigate PPV processes (subject to barrister availability). Assistance ranges from preliminary advice to full representation, with fees reduced or waived. \u202f\u202f&lt;\/p&gt;&lt;p&gt;To participate, submitters must meet eligibility criteria. More information about the Service and eligibility criteria is available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planningpanels.vic.gov.au\/guides-and-resources\/legal-assistance-service\&quot; target=\&quot;_blank\&quot;&gt;PPV website&lt;\/a&gt;, including who you need to contact at Foley\u2019s List to apply for assistance.\u202f&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a submission on behalf of a group or organisation?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. Organisations, residents, or groups of individual submitters with similar issues are encouraged to provide a single joint submission.&lt;\/p&gt;&lt;p&gt;Correspondence to organisations and residents\u2019 groups will be directed to the nominated contact person for that group.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a petition?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. Petitions will be treated as a single submission, and correspondence will only be sent to the person who organised the petition. If the organiser is not clear, it will be the first name to appear on the petition.&lt;\/p&gt;&lt;p&gt;If you want to be contacted individually about the SIAC process or want to be heard at the Hearing, you will need to make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a pro-forma submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. Submissions that have substantially the same content will be treated as pro forma submissions, and pro forma submitters who want to be heard at the Hearing will be heard as a group. If you want to be heard as an individual, you should make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;How will I know if my submission was received?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;After you click \u2018Submit\u2019, you\u2019ll see a message confirming it was lodged.&lt;\/p&gt;&lt;p&gt;If you want a copy of your submission, enter your email address and click \u2018Send me a copy\u2019. Check your spam\/junk folder if it doesn\u2019t arrive.&lt;\/p&gt;&lt;p&gt;If you don\u2019t receive the confirmation email, contact VMFRP.SIAC@transport.vic.gov.au.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I request to make a submission confidentially?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In some circumstances, you may not want your name or certain information to be published online. As detailed in the Terms of Reference, the SIAC can hear submissions or accept material on a confidential basis, provided this would be fair to the Proponent and other parties to the Hearing.&lt;\/p&gt;&lt;p&gt;If you want your name withheld, or to provide your submission or material confidentially, you must request permission from the SIAC Chair in writing through PPV and provide reasons why the SIAC should treat your submissions or material confidentially. Please contact PPV at VMFRP.SIAC@transport.vic.gov.au with these requests.&lt;\/p&gt;&lt;p&gt;The SIAC will consider your request and determine whether maintaining confidentiality would be fair to the Proponent and other parties. Even where confidentiality is granted, confidential submissions will still need to be shared with the Proponent to ensure issues raised can be appropriately considered and addressed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;What happens to my submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Will my submission be made public?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. All submissions are public documents and will be published on the Engage Victoria website.&lt;\/p&gt;&lt;p&gt;Your name, submission and other material you provide will be published online unless you ask PPV not to. Personal details like your address and phone number will be removed, but you should ensure you don\u2019t include these in the main part of your submission (only include your details in the online form or cover sheet).&lt;\/p&gt;&lt;p&gt;Please read the Privacy Collection Statement before making your submission. Don&#039;t include information that identifies other people unless they agree.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;Can I speak at the Hearing?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I have to make a submission if I want to speak and participate in the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. To speak at the Hearing, you must make a written submission during the exhibition period.&lt;\/p&gt;&lt;p&gt;You will need to tick the box on the online form to say you want to be heard. You\u2019ll also need to tell us:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how long you want to speak&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;who will represent you (you can have speak on your behalf)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;if you will call any experts in support of your submission.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you request to be heard by the SIAC, you will become a &#039;party&#039; to the Hearing. You will be given a timeslot to present in the Hearing timetable and advised of the arrangements for the SIAC process in advance of the Directions Hearing, Hearing and through any directions issued by the SIAC.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What if I don\u2019t want to speak at the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;That\u2019s fine. You don\u2019t need to speak to your written submission for it to be considered by the SIAC.&lt;\/p&gt;&lt;p&gt;If you do not want to be heard, you will not be a party to the Hearing. You will receive correspondence from the SIAC acknowledging your submission. However, you will not receive any further correspondence about the SIAC process and may not be able to submit additional information to the SIAC.&lt;\/p&gt;&lt;p&gt;You can still follow the process by checking this webpage.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE1VDA0OjE1OjE5Ljk1MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;11&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;For questions about making a submission, the Standing Inquiry and Advisory Committee (SIAC) process or Hearing, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Planning Panels Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186 (select option 6)&lt;\/p&gt;&lt;p&gt;\u2709 Email: VMFRP.SIAC@transport.vic.gov.au&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;For questions about the EES West assessment package and the proposed Lindsay Island Floodplain Restoration Project and Wallpolla Island Floodplain Restoration Project and project documentation contact: &lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Lower Murray Water&lt;\/p&gt;&lt;p&gt;\u260e Phone: 1800 808 830&lt;\/p&gt;&lt;p&gt;\u2709 Email: info@vmfrp.vic.gov.au&lt;\/p&gt;&lt;p&gt;Website: www.vmfrp.com.au&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;For questions about the Minister&#039;s Assessment and Environment Report process, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Impact Assessment Unit, Department of Transport and Planning&lt;\/p&gt;&lt;p&gt;\u2709 Email: environment.assessment@transport.vic.gov.au&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Contacts&quot;}}],&quot;date_end&quot;:&quot;2026-07-31T23:59:00&quot;,&quot;region_id&quot;:7,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Planning Panels Victoria&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;136 186 (select option 6)&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;VMFRP.SIAC@transport.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-03-12T01:05:40.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-21T14:08:34.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5036,&quot;team_id&quot;:21,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:19525,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/VMFRP-SIAC-EES-West&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-them t;:37394,&quot;vid&quot;:349067,&quot;title&quot;:&quot;Exhibition stage: Submissions&quot;,&quot;description&quot;:&quot;&lt;p&gt;The EES West assessment package, the proposed Lindsay Island Floodplain Restoration Project and Wallpolla Island Floodplain Restoration Project is on public exhibition for 30 business days. &lt;\/p&gt;&lt;p&gt;During this time, members of the public are invited to make a written submission to the Standing Inquiry and Advisory Committee (SIAC). Submissions help the SIAC understand how the EES West Projects may affect people, communities, and the environment.&lt;\/p&gt;&lt;p&gt;Submissions must be made in writing. To make a submission, use the online submission form under the Participate tab.&lt;\/p&gt;&lt;p&gt;You must make a written submission if you want to participate in the SIAC Hearing. &lt;\/p&gt;&lt;p&gt;The SIAC will consider all submissions, whether or not a submitter chooses to speak at the Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:1,&quot;date_start&quot;:&quot;Monday 22 June 2026&quot;,&quot;date_end&quot;:&quot;11:59pm on Friday 31 July 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-06-15T04:06:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T03:24:03.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1920,&quot;created_by_id&quot;:45790,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/VMFRP-SIAC-EES-West\/timeline\/37394&quot;,&quot;summary&quot;:&quot;The EES West assessment package, the proposed Lindsay Island Floodplain...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37395,&quot;vid&quot;:349069,&quot;title&quot;:&quot;Hearing stage: Directions Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Standing Inquiry and Advisory Committee (SIAC) will hold a Directions Hearing at 10:00am on Monday 17 August 2026. At the Directions Hearing, the Inquiry and Advisory Committee will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;confirm the dates and format of the Hearing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Hearing will run&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;outline how information should be shared before the Hearing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer questions about the SIAC process, including the Hearing.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The Directions Hearing helps make sure everyone is prepared and understands what to expect during the process and at the main Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:2,&quot;date_start&quot;:&quot;Monday 17 August 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-06-15T04:07:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T03:24:25.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1920,&quot;created_by_id&quot;:45790,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/VMFRP-SIAC-EES-West\/timeline\/37395&quot;,&quot;summary&quot;:&quot;The Standing Inquiry and Advisory Committee (SIAC) will hold a...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37396,&quot;vid&quot;:349070,&quot;title&quot;:&quot;Hearing stage: Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Hearing will commence in the week beginning &lt;strong&gt;Monday 14 September 2026&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for 3 to 4 weeks. &lt;\/p&gt;&lt;p&gt;The Hearing gives the Proponent and submitters who asked to be heard a chance to speak in support of their written submissions.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Week s_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:92299,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1920,&quot;uuid&quot;:&quot;e4edec75-b0a9-4596-b441-c1215eadb78a&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;VMFRP SIAC - EES West - Wallpolla Island (Snip)&quot;,&quot;file_name&quot;:&quot;vmfrp-siac-ees-west-wallpolla-island-snip_ff9e.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:532398,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:19525},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:90095,&quot;created_at&quot;:&quot;2026-06-16T00:31:49.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T00:31:50.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/92299\/vmfrp-siac-ees-west-wallpolla-island-snip_ff9e.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1943,&quot;vid&quot;:350235,&quot;title&quot;:&quot;Potential water access for Yallourn coal mine rehabilitation&quot;,&quot;slug&quot;:&quot;potential-water-access-for-yallourn-mine-rehabilitation&quot;,&quot;summary&quot;:&quot;Consultation on applications to amend an existing water entitlement and to grant a new one for Yallourn mine rehabilitation in the Latrobe Valley river system.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;In Victoria, &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/about-us\/water-entitlements-and-the-water-act\&quot; target=\&quot;_blank\&quot;&gt;entitlements&lt;\/a&gt; provide access to water under the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/water-act-1989\/141\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Water Act 1989&lt;\/em&gt; (Vic)&lt;\/a&gt;. One type is a &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/about-us\/water-entitlements-and-the-water-act\/bulk-entitlements\&quot; target=\&quot;_blank\&quot;&gt;bulk entitlement&lt;\/a&gt;. This provides a legal right to take and use water, typically a large amount.&lt;\/p&gt;&lt;p&gt;Expected closure dates for Latrobe Valley coal-fired power stations have been announced. For example, the power generator EnergyAustralia has announced that the Yallourn power station will close in 2028. The coal mine that supplies Yallourn power station is also expected to close.&lt;\/p&gt;&lt;p&gt;Mine licensees are required to rehabilitate the mines to be safe and stable for the long term. Mine licensees have said they may need water for rehabilitation.&lt;\/p&gt;&lt;p&gt;Power generators currently have access to water to run their power stations, but the entitlements that provide this water do not allow this water to be used for mine rehabilitation.&lt;\/p&gt;&lt;p&gt;Mine licensees who want water for mine rehabilitation can apply to the Minister for Water, via a process outlined in Victoria\u2019s water legislation.&lt;\/p&gt;&lt;p&gt;Any use of water for mine rehabilitation will be subject to other approval requirements (see the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/resources.vic.gov.au\/projects\/Latrobe-Valley-coal-mines-rehabilitation\&quot; target=\&quot;_blank\&quot;&gt;Latrobe Valley Regional Rehabilitation Strategy&lt;\/a&gt; for more details), so if or when the Minister approves applications for mine rehabilitation bulk entitlements, it doesn\u2019t mean that water-based mine rehabilitation will proceed.&lt;\/p&gt;&lt;p&gt;For example, Latrobe Valley mine licensees must prepare and submit Declared Mine Rehabilitation Plans. They may also be required to prepare an&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planning.vic.gov.au\/environmental-assessments\/environmental-assessment-guides\/environment-effects-statements-in-victoria#:~:text=An%20environment%20effects%20statement%20(EES)%20usually%20has:%20a%20description%20of\&quot; target=\&quot;_blank\&quot;&gt; Environment Effects Statement&lt;\/a&gt; (EES) in accordance with the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.legislation.vic.gov.au\/in-force\/acts\/environment-effects-act-1978\/026\&quot; target=\&quot;_blank\&quot;&gt;&lt;em&gt;Environment Effects Act 1978&lt;\/em&gt;&lt;\/a&gt; (Vic).&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Previous applications received and considered&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In 2023-2024, the Minister for Water received applications from AGL to amend an existing water entitlement and to grant a new water entitlement for the rehabilitation of the Loy Yang coal mine in the Latrobe Valley (&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-latrobe-mine-rehabilitation\/page\/applications\&quot; target=\&quot;_blank\&quot;&gt;Loy Yang Applications&lt;\/a&gt;). The Minister also received a separate application from Southern Rural Water to amend an existing water entitlement (&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-latrobe-mine-rehabilitation\/page\/applications\&quot; target=\&quot;_blank\&quot;&gt;Loy Yang Applications&lt;\/a&gt;).&lt;\/p&gt;&lt;p&gt;The Minister consulted the community on these applications (&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/potential-water-access-for-latrobe-mine-rehabilitation\&quot; target=\&quot;_blank\&quot;&gt;Loy Yang Consultation&lt;\/a&gt;) and received many submissions which were collated and summarised:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-latrobe-mine-rehabilitation\/page\/submissions-and-feedback-report\&quot; target=\&quot;_blank\&quot;&gt;Round 1 - Submissions received and a \u2018What We Heard\u2019 summary report on the Loy Yang Applications&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-latrobe-mine-rehabilitation\/page\/round-2-submissions-and-feedback-report\&quot; target=\&quot;_blank\&quot;&gt;Round 2 - Submissions received and a \u2018What We Heard\u2019 summary report on the economic value of water for mine rehabilitation&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;In December 2025, the Minister for Water considered all submissions when she decided on the Loy Yang Applications.&lt;\/p&gt;&lt;p&gt;The Minister approved the Loy Yang Applications.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h3&gt;New applications received&lt;\/h3&gt;&lt;p&gt;The Minister for Water has now received applications from EnergyAustralia Yallourn - to amend an existing water entitlement and to grant a new water entitlement for the rehabilitation of the Yallourn coal mine (Yallourn Applications).&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button button-secondary\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-yallourn-mine-rehabilitation\/page\/applications\&quot; target=\&quot;_blank\&quot;&gt;View applications received&lt;\/a&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--bordered\&quot;&gt;&lt;h3&gt;Notice of public consultation&lt;\/h3&gt;&lt;p&gt;The Minister for Water invites public submissions on the Yallourn Applications.&lt;\/p&gt;&lt;p&gt;In considering the EnergyAustralia Yallourn Applications, the Minister for Water must consider all relevant matters under the &lt;em&gt;Water Act 1989&lt;\/em&gt;, including all submissions and impacts on other entitlement holders and the environment.&lt;\/p&gt;&lt;p&gt;The Minister would welcome submissions on whether a water access pricing condition should be imposed on the EnergyAustralia Yallourn mine rehabilitation bulk entitlement, if granted.&lt;\/p&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE2VDAzOjU1OjQ5LjY2NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h2&gt;How to make a submission&lt;\/h2&gt;&lt;p&gt;You can comment on EnergyAustralia Yallourn\u2019s applications, including the proposal that a financial obligation \u2013 or a \u2018price\u2019 \u2013 be imposed on the bulk entitlement holder to reflect the economic value of water for mine rehabilitation, by uploading a written submission, or by filling in a survey, or both. Responses will be accepted between &lt;strong&gt;19 June 2026 and 11:59 pm Friday 17 July 2026 &lt;\/strong&gt;(a four-week period).&lt;\/p&gt;&lt;p&gt;As the Yallourn Applications relate to water access for the purpose of water-based mine rehabilitation in the Latrobe Valley, the Minister for Water has identified that the submissions received as part of the Loy Yang Consultation are a \u2018matter\u2019 that the Minister may consider for the purposes of section 40(1)(o) of the Water Act when assessing the Yallourn Applications.&lt;\/p&gt;&lt;p&gt;This means that, if you made a submission in the Loy Yang Consultation, the Minister will consider all relevant matters raised in your submission when assessing the Yallourn Applications, without you needing to re-submit your submission in this process. Note it is open to you to re-submit your previous submission(s) if you wish. You can also submit an additional submission as part of this process if you consider that there are different issues that are relevant to the Yallourn Applications (compared to the Loy Yang Applications).&lt;\/p&gt;&lt;p&gt;Before you provide your response, we encourage you to use the web links to learn more about potential water access for mine rehabilitation in the Latrobe Valley.&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; title=\&quot;Upload a written submission and\/or complete the survey\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/potential-water-access-for-yallourn-mine-rehabilitation\/survey\/6624\&quot; target=\&quot;_blank\&quot;&gt;Make a submission&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;The opportunity to make a submission closes at 11:59 pm Friday 17 July 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE2VDAyOjU3OjQ1LjU3OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;A \u2018What We Heard\u2019 report will be prepared to synthesise all written submissions and survey responses received as part of the Yallourn consultation.&lt;\/p&gt;&lt;p&gt;The Minister for Water will consider all relevant matters required under the &lt;em&gt;Water Act 1989 &lt;\/em&gt;when deciding whether to accept or refuse each Yallourn application. This will include relevant matters raised through both the Yallourn and Loy Yang consultations.&lt;\/p&gt;&lt;p&gt;The \u2018What We Heard\u2019 report will be published on this webpage. All written submissions will be published on this webpage too, unless the submitter has asked for their submission to remain \u201cprivate\u201d.&lt;\/p&gt;&lt;p&gt;To receive email updates, click on &lt;strong&gt;+ Follow&lt;\/strong&gt; at the top of this page.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTIyVDA2OjEyOjI2LjE2Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h5&gt;Regional context&lt;\/h5&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/resources.vic.gov.au\/projects\/Latrobe-Valley-coal-mines-rehabilitation\&quot; target=\&quot;_blank\&quot;&gt;Latrobe Valley Regional Rehabilitation Strategy - Resources Victoria&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/our-programs\/long-term-water-resource-assessments-and-strategies\/sustainable-water-strategies\/central-and-gipps-sws\&quot; target=\&quot;_blank\&quot;&gt;Central and Gippsland Region Sustainable Water Strategy 2022&lt;\/a&gt;&lt;\/p&gt;&lt;h5&gt;Water resources of the Latrobe River system&lt;\/h5&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/our-programs\/long-term-water-resource-assessments-and-strategies\/latrobe-valley-regional-rehabilitation-strategy\/water-in-the-latrobe-region\&quot; target=\&quot;_blank\&quot;&gt;Water in the Latrobe region&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/accounts.water.vic.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;Victorian Water Accounts&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/our-programs\/long-term-water-resource-assessments-and-strategies\/latrobe-valley-regional-rehabilitation-strategy#heading-6\&quot; target=\&quot;_blank\&quot;&gt;Discussion paper \u2013 Pricing of surface water for mine rehabilitation in the Latrobe Valley&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/our-programs\/long-term-water-resource-assessments-and-strategies\/latrobe-valley-regional-rehabilitation-strategy#heading-6\&quot; target=\&quot;_blank\&quot;&gt;Expert report - surface water for Latrobe Valley Mine Rehabilitation - determining an appropriate price for potential surface water access entitlement&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/potential-water-access-for-latrobe-mine-rehabilitation\&quot; target=\&quot;_blank\&quot;&gt;Loy Yang Consultation&lt;\/a&gt;&lt;\/p&gt;&lt;h5&gt;Bulk entitlements and system management appointments&lt;\/h5&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.water.vic.gov.au\/about-us\/water-entitlements-and-the-water-act\/bulk-entitlements\&quot; target=\&quot;_blank\&q ting&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;a href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot; class=\&quot;image-link\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89024\/image_e3ae.png\&quot; data-href=\&quot;https:\/\/www.deeca.vic.gov.au\/communities-and-regions\/community-charter\&quot;&gt;&lt;\/a&gt;&lt;p&gt;&lt;\/p&gt;&lt;a href=\&quot;https:\/\/www.deeca.vic.gov.au\/aboriginalselfdetermination\/self-determination-reform-strategy\&quot; class=\&quot;image-link\&quot;&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89025\/image_8dde.png\&quot; data-href=\&quot;https:\/\/www.deeca.vic.gov.au\/aboriginalselfdetermination\/self-determination-reform-strategy\&quot;&gt;&lt;\/a&gt;&quot;,&quot;title&quot;:null}}],&quot;date_end&quot;:&quot;2026-07-17T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;BE.applications@deeca.vic.gov.au&quot;}],&quot;palette&quot;:&quot;12&quot;,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;variant_1&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-04-17T05:39:09.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-22T06:23:35.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5408,&quot;team_id&quot;:4,&quot;created_by_id&quot;:1130,&quot;modified_by_id&quot;:53796,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/potential-water-access-for-yallourn-mine-rehabilitation&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project ons into a single department to maximise connections between the environment, community, industry, and economy.&lt;\/p&gt;&lt;p&gt;Our challenge is to improve Victoria\u2019s liveability with a population that is expected to almost double by 2050, while responsibly tackling climate change and protecting our natural environment, infrastructure, and heritage for future generations.&lt;\/p&gt;&lt;p&gt;Your contributions represent a genuine opportunity for you to influence change.&lt;\/p&gt;&lt;p&gt;We value the time you spend, and the effort you make, when your respond to our consultations. We will share the outcomes of our consultations when they are available.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1701,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-01T23:19:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-energy-environment-and-climate-action&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:90938,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1943,&quot;uuid&quot;:&quot;e8718a6d-e167-41fa-b41d-54504a6f1bfe&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Yallourn Power_005&quot;,&quot;file_name&quot;:&quot;yallourn-power-005_2616.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:780710,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:53796},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:88764,&quot;created_at&quot;:&quot;2026-05-26T03:18:06.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-26T03:18:07.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/90938\/yallourn-power-005_2616.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1980,&quot;vid&quot;:349707,&quot;title&quot;:&quot;Blue Hills Quarry Project EES Draft Scoping Requirements&quot;,&quot;slug&quot;:&quot;blue-hills-quarry-environment-effects-statement&quot;,&quot;summary&quot;:&quot;Public comment is invited on the draft Scoping Requirements for the Blue Hills Quarry Environment Effects Statement (EES).&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;Draft scoping requirements for the Blue Hills Quarry Project Environment Effects Statement (EES) have been prepared by the Department of Transport and Planning. All submissions received on the draft scoping requirements will be considered, and the EES scoping requirements will be updated, where appropriate.&lt;\/p&gt;&lt;h3&gt;Project overview&lt;\/h3&gt;&lt;p&gt;The Blue Hills Quarry is a proposed hornfels hard rock quarry located on Dja Dja Wurrung Country within the Mount Alexander Shire, approximately 25 kilometres south-west of Bendigo.&lt;\/p&gt;&lt;p&gt;The project includes a quarry, a haul road, and associated infrastructure. Establishment will require excavation, blasting and dewatering to depths of up to 90 metres below ground level. At peak operation, the quarry is expected to produce up to 500,000 tonnes per annum and operate for approximately 70 to 100 years, with an average of 60 truck movements per day.&lt;\/p&gt;&lt;p&gt;Key components and activities include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Staged development of a 34.5 ha quarry&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A 3 ha area for processing, stockpiling, a vehicle workshop and offices&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A 4.5 km access road connecting the site to Bridgewater-Maldon Road via private land&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Installation of power and water reticulation&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Progressive rehabilitation will be undertaken throughout the life of the project and completed following closure of the quarry.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Have your say by completing a submission online in the survey form or upload your submission.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA2LTAzVDA1OjU1OjIxLjgyNVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMDJUMDY6MjY6NTkuNTgwWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Draft Scoping Requirements&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTAzVDA1OjIwOjEzLjM1MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h2&gt;Next Steps&lt;\/h2&gt;&lt;p&gt;We will be reviewing all submissions received and updating the EES scoping requirements in response, where appropriate. Feedback will be provided to the Minister for Planning to consider as part of his approval of the final scoping requirements. The final version of the scoping requirements will be published online.&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&qu
