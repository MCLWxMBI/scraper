d planning application submitted&amp;nbsp;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37171,&quot;vid&quot;:341847,&quot;title&quot;:&quot;Engagement report published&quot;,&quot;description&quot;:&quot;&lt;p&gt;Consultation report published following outcomes of planning application.&amp;nbsp;&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Mid-late 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-04-23T00:39:23.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-17T22:53:05.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1932,&quot;created_by_id&quot;:53520,&quot;modified_by_id&quot;:53520,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/racecourse-road-flemington-housing\/timeline\/37171&quot;,&quot;summary&quot;:&quot;Consultation report published following outcomes of planning application.&amp;nbsp;&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:39,&quot;title&quot;:&quot;Housing and communities&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1932,&quot;tag_id&quot;:39,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:25,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Homes Victoria&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;homes-victoria&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Homes Victoria&quot;,&quot;description&quot;:&quot;&lt;p&gt;More and better homes for Victorians.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;6&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2115,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-06-17T05:00:47.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/homes-victoria&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--6&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89923,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1932,&quot;uuid&quot;:&quot;be254e5a-eda9-4845-8d03-690b083f88ab&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Racecourse Road Engage Victoria banner&quot;,&quot;file_name&quot;:&quot;racecourse-road-engage-victoria-banner_6243.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2128639,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:38866},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:87772,&quot;created_at&quot;:&quot;2026-05-11T01:03:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-11T01:03:16.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89923\/racecourse-road-engage-victoria-banner_6243.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1950,&quot;vid&quot;:341771,&quot;title&quot;:&quot;Star of the South Victorian Inquiry&quot;,&quot;slug&quot;:&quot;SOTS&quot;,&quot;summary&quot;:&quot;An Inquiry is collecting submissions to consider the environmental effects of the Victorian works of the proposed Star of the South Project on the Victorian Environment.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;The Minister for Planning (the Minister) has appointed an Inquiry (the Inquiry) to advise on the environmental effects of the Victorian works of the proposed Star of the South Project on the Victorian environment as assessed in the Victorian Environment Effects Statement (EES). The Inquiry is an independent group of experts tasked with this assessment.&lt;\/p&gt;&lt;p&gt;The Inquiry will, in line with the Inquiry\u2019s Terms of Reference:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;review the Victorian EES (covering Victorian works) and public submissions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;run a submitter conference to hear from the Proponent and submitters who want to speak to their written submission on \u2018Key Victorian Matters\u2019&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give parties the opportunity to provide further written material on \u2018Other Victorian Matters\u2019&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide advice to the Minister about the environmental effects of the Victorian works of the proposed project on the Victorian environment, on the identified relevant \u2018Key Victorian Matters\u2019 and \u2018Other Victorian Matters\u2019.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;It is not the role of the Inquiry to consider the Commonwealth Environmental Impact Statement (EIS) or Commonwealth matters of national environmental significance, under the &lt;em&gt;Environment Protection and Biodiversity Conservation Act 1999&lt;\/em&gt; (EPBC Act), whether those matters are located in Victoria or elsewhere.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Terms of Reference - \u2018Key Victorian Matters\u2019 and \u2018Other Victorian Matters\u2019&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Inquiry will follow &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45936 \&quot; target=\&quot;_blank\&quot;&gt;Terms of Reference&lt;\/a&gt; approved by the Minister for Planning. The Terms of Reference set out the Inquiry\u2019s scope (including what it can and can\u2019t consider). The&amp;nbsp;Terms of Reference can be found in the &lt;strong&gt;\u201c&lt;\/strong&gt;Documents\u201d section at the bottom of this page.&lt;\/p&gt;&lt;p&gt;The Inquiry can only consider the identified relevant \u2018Key Victorian Matters\u2019 and \u2018Other Victorian Matters\u2019 outlined in its Terms of Reference from the Minister.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Key Victorian Matters&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The \u2018Key Victorian Matters\u2019 identified in the Terms of Reference, which are associated with Victorian works that may have significant effects on the Victorian environment are:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;onshore ecology&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Victorian marine environment and marine protected areas&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;coastal processes&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Aboriginal cultural heritage&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;construction impacts confined to onshore noise and vibration, soil and waste; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the Environmental Management Framework and draft PSA to the extent relevant to the management of the matters listed above.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Other Victorian Matters&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The \u2018Other Victorian Matters\u2019 identified in the Terms of Reference which are associated with Victorian works that are less likely to have significant environmental effects on the Victorian environment, are&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;business and tourism&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;groundwater and surface water&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;social&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;traffic and transport&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;land use impacts; and&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the Environmental Management Framework and draft PSA to the extent relevant to the management of the matters listed above.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;p&gt;The Inquiry\u2019s Terms of Reference state it is to hold a submitter conference focusing only on the specific &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt;, whilst &lt;strong&gt;\u2018&lt;\/strong&gt;Other Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt; will be considered by the Inquiry on the basis of further written submissions only.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Inquiry members&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Inquiry is made up of the following members:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Lisa Kendal (Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Elizabeth McIntosh (Deputy Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;John Hartigan&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Colin McIntosh&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Cameron Miller&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&amp;nbsp;You can learn more about the members by reading their &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45806 \&quot; target=\&quot;_blank\&quot;&gt;biographies&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTE3VDE0OjA3OjIwLjYwN1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;The Proposal&lt;\/strong&gt;&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;The Proposal&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The&amp;nbsp;proposed works in Victoria associated with the&amp;nbsp;Star of the South Project&amp;nbsp;(works in Victoria) include underground cables located in Victorian waters (approximately 5.5 km offshore) and on land between Reeves Beach and Giffard (approximately 30 kilometres) in Gippsland, Victoria.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;The key components of the works in Victoria include the development of:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;up to eight offshore export cables in Victorian waters to connect the offshore wind farm (located outside of Victorian waters) to the shore crossing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;up to eight trenchless crossings for the export cables to make landfall at the shore crossing at Reeves Beach in South Gippsland; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;an underground cable system connecting the shore crossing to the proposed VicGrid connection hub.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Note: the development of the offshore wind turbines, offshore substations and inter array cables off Reeves Beach are located wholly in Commonwealth marine waters and are therefore not considered in the EES.&lt;\/p&gt;&lt;p&gt;The Proponent is Star of the South Wind Farm Pty Ltd as trustee for the Star of the South Trust.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;View the EES proposal&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;You can view and download the exhibited Victorian EES, including the draft PSA, and other related documents on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/ \&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;:&lt;\/p&gt;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45935 \&quot; target=\&quot;_blank\&quot;&gt;public notice &lt;\/a&gt;has more information about where you can view hard copies of the EES documents and project materials in person.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDA5OjA2OjUxLjc1Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Public exhibition&lt;\/strong&gt;&lt;\/h3&gt;&lt;p&gt;The Victorian EES, including the draft PSA for the Victorian works of the proposed Star of the South Project will be on public exhibition for 30 business days between &lt;strong&gt;Monday 18 May 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Monday 29 June 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You are invited to make a written submission during this time. Please use the online submission form below to submit your submission&lt;\/strong&gt;. Note that by submitting through the online form below you are only making a submission on the Victorian EES&lt;strong&gt;.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;If you want to participate in the Inquiry process (by either appearing at the submitter conference and\/or providing further written information), you must make a written submission and mark on the submission form that you want to participate. The Inquiry will consider all written submissions when preparing its advice to the Minister, in accordance with the scope of its Terms of Reference, whether or not a submitter chooses to speak.&lt;\/p&gt;&lt;h5&gt;&lt;strong&gt;Making a submission on the Commonwealth Environmental Impact Statement (EIS)&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;The Commonwealth EIS is also open for public review and comment. Submissions on the Project\u2019s Commonwealth EIS and Commonwealth matters will be collected by the Proponent through a different process. Information on the Commonwealth EIS and how to make a written submission on Commonwealth matters can be found in the public notice or on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/\&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEzVDAwOjQzOjI3LjUzMFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Directions Hearing&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Inquiry will hold a Directions Hearing at &lt;strong&gt;10:00am on Tuesday 14 July 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the Inquiry will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and organise arrangements for the submitter conference, including the dates and format&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Inquiry process will be conducted and how information will be shared before the submitter conference (including expert reports) and how parties will provide further written material on &lt;strong&gt;\u2018&lt;\/strong&gt;Other Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;discuss site inspections&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;consider any procedural issues&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer any questions about the Inquiry process, including the submitter conference.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;More information about the Directions Hearing will be published here once the details are confirmed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Submitter conference&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;A submitter conference will commence in the &lt;strong&gt;week beginning Monday 10 August 2026&lt;\/strong&gt;. Depending on how many submitters want to participate and speak, the submitter conference may run for 2 to 3 weeks. The submitter conference is open to the public, so anyone can observe.&lt;\/p&gt;&lt;p&gt;The submitter conference gives the Proponent and people who indicated they want to be heard, an opportunity to speak in support of their written submission on the &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;The submitter conference will focus on and will be structured around topics listed in the &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019.&lt;\/strong&gt; This will enable the relevant aspects of the EES and issues raised in submissions to be explored by the Inquiry, together with the submitters who want to participate and speak and the Proponent.&lt;\/p&gt;&lt;p&gt;The Inquiry\u2019s Terms of Reference outline that:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;all submissions and other material considered at the submitter conference will focus on the &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt;, including the presentation of any further evidence or expert witnesses&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u2018&lt;\/strong&gt;Other Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt; are not to be raised at the submitter conference&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the Commonwealth EIS and associated Commonwealth matters are not to be raised at the submitter conference and will not be considered by the Inquiry.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;A timetable for the submitter conference will be published after the Directions Hearing. All relevant experts and parties with an interest in a particular topic will need to attend the conference for that topic, but will not have to attend other sessions unless identified by the Inquiry.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Report&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Terms of Reference require the Inquiry to submit its report to the Minister for Planning within 40 business days of the last day of its proceedings.&lt;\/p&gt;&lt;p&gt;The Inquiry\u2019s report is to focus on the \u2018Key Victorian Matters\u2019 and address \u2018Other Victorian Matters\u2019 at a high level.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the Inquiry\u2019s report to inform the Minister\u2019s Assessment of the environmental effects of the project\u2019s Victorian works under the&lt;em&gt; Environment Effects Act 1978&lt;\/em&gt;. This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Inquiry Process&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDA5OjEyOjQ4LjY1OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;You can make a written submission on the Victorian EES, including the draft PSA between &lt;strong&gt;Monday 18 May 2026 &lt;\/strong&gt;and &lt;strong&gt;11:59pm on Monday 29 June 2026 &lt;\/strong&gt;by completing the online form below.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Note: that by submitting through this online form, you are only making a submission on the Victorian EES. &lt;\/strong&gt;More information on how to make a submission on the Commonwealth EIS can be found in the public notice and &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/ \&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;Please refer to the Inquiry\u2019s Terms of Reference for information about its scope.&lt;\/p&gt;&lt;p&gt;If you want to participate in the Inquiry process (by either appearing at the submitter conference and\/or providing further written information), make sure you tick the box when completing the online form.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission or would like to submit a hard copy, contact Planning Panels Victoria on 136 186 (select option 6) or email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Privacy and Intellectual Property&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;our submission on the Victorian EES will be a public document. To make a submission, you must read the&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45808 \&quot; target=\&quot;_blank\&quot;&gt; Privacy Collection Statement &lt;\/a&gt;and click \u2018agree\u2019 where indicated on the online form.&lt;\/p&gt;&lt;p&gt;The Privacy Collection Statement explains how we will use your submission and any other information you provide to the Inquiry, which include putting it online and providing it to the Proponent, other parties to the Inquiry process and to the government agencies specified in the Terms of Reference.&lt;\/p&gt;&lt;p&gt;You should not include any personal information in your submission that could identify you or other people unless you (or they) are happy for that information to be made publicly available. Examples are email addresses, phone numbers or photos of people (particularly children). You should also not include any material authored by another person unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Have your say - make a submission&quot;}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA1LTEwVDIzOjU3OjU3LjMwMFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Online submission form&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6572&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDA5OjEzOjIyLjYxMFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Click the \u2018Start survey\u2019 button to make your submission on the Victorian EES, including the draft PSA.&lt;\/strong&gt;&lt;\/h4&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDUtMTdUMTQ6MDU6MDMuNzgxWg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;45936&quot;,&quot;45806&quot;,&quot;45807&quot;,&quot;45808&quot;,&quot;45935&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDA5OjIxOjEyLjg1NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:10,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;How do I make a submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to lodge my EES submission online?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes, please use the online form to make your EES submission. You can type (or copy and paste) directly into the form or upload a file as an attachment. Accepted file types include PDF, DOC, DOCX, TXT, RTF, PNG, GIF, JPG, and JPEG.&lt;\/p&gt;&lt;p&gt;Each file must be under 20MB, and the total of all files uploaded to the form must be under 40MB.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a hard copy EES submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Online submissions are strongly preferred. However, if you can\u2019t submit online, you can send a hard copy.&lt;\/p&gt;&lt;p&gt;A hard copy EES submission must be accompanied by a completed \u2018Submission Coversheet\u2019 which you can request from Planning Panels Victoria through the Customer Call Centre&lt;em&gt; &lt;\/em&gt;on 136 186 (select option 6) or by emailing &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;. The Submission Coversheet includes important information we need to process your submission, and enable you to participate in the Victorian Inquiry process, and privacy information.&lt;\/p&gt;&lt;p&gt;Make sure your submission and coversheet arrive before the exhibition period ends.&lt;\/p&gt;&lt;p&gt;Please do not email your EES submission directly to Planning Panels Victoria or any other party such as the Minister for Planning, the Department of Transport and Planning (DTP) Impact Assessment Unit or the Proponent.&amp;nbsp; If you do, it may not be considered by the Inquiry.&amp;nbsp; Use the online submission form, or if this is not possible send a hard copy with a completed coversheet to Planning Panels Victoria.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to make separate submissions on the Victorian EES and the Commonwealth EIS?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. If you are looking to make a submission on the Victorian EES use the Engage Victoria online submission form. Information about how to make a submission on the Commonwealth EIS can be found in the public notice or on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/. \&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a submission on the Commonwealth EIS through the Victorian EES online form?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;No. Submissions on the Commonwealth EIS are being collected by the Proponent through a different process. Information on the Commonwealth EIS and how to make a written submission on Commonwealth matters can be found in the public notice or on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/\&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;I might want legal support in making a submission or to help me in the Inquiry process. What resources are available to me?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;You don\u2019t need legal support to make your submission or participate in the Inquiry process, however you may choose to engage a lawyer to assist you.&lt;\/p&gt;&lt;p&gt;Foley\u2019s List barristers is offering a Legal Assistance Service that offers low-cost or no-cost legal support to eligible submitters in Planning Panel Victoria hearings.\u202f Available to individuals and community groups, the service offers legal advice and representation to help participants navigate PPV processes (subject to barrister availability).&amp;nbsp;Assistance ranges from preliminary advice to full representation, with fees reduced or waived.&amp;nbsp;&amp;nbsp; \u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;To participate, submitters must meet eligibility criteria.&amp;nbsp; More information about the service and eligibility criteria is available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planningpanels.vic.gov.au\/guides-and-resources\/legal-assistance-service \&quot; target=\&quot;_blank\&quot;&gt;PPV website&lt;\/a&gt;, including who you need to contact at Foley\u2019s List to apply for assistance&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit on the EES on behalf of a group or organisation?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Organisations, residents, or groups of individual submitters with similar issues are encouraged to provide a single joint EES submission.&lt;\/p&gt;&lt;p&gt;Correspondence to organisations and residents\u2019 groups will be directed to the nominated contact person for that group.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a petition on the EES?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Petitions will be treated as a single submission, and correspondence will only be sent to the person who organised the petition.&amp;nbsp; If the organiser is not clear, it will be the first name to appear on the petition.&lt;\/p&gt;&lt;p&gt;If you want to be contacted individually about the Inquiry process or to participate in the Inquiry Process, you will need to make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a pro-forma submission on the EES?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Submissions that have substantially the same content will be treated as pro forma submissions, and pro-forma submitters who want to participate in the Inquiry process (by either appearing at the submitter conference and\/or providing further written information) will be heard as a group.&amp;nbsp; If you want to participate in the Inquiry process as an individual, you should make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;How will I know if my EES submission was received?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;After you click \u2018Submit\u2019, you\u2019ll see a message confirming it was lodged.&lt;\/p&gt;&lt;p&gt;If you want a copy of your submission, enter your email address and click \u2018Send me a copy\u2019. Check your spam\/junk folder if it doesn\u2019t arrive.&lt;\/p&gt;&lt;p&gt;If you don\u2019t receive the confirmation email, contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I request to make a EES submission confidentially?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In some circumstances, you may not want your name or certain information to be published online. As detailed in the Terms of Reference, the Inquiry can hear submissions or accept material on a confidential basis, provided this would be fair to the Proponent and other parties to the Inquiry process.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you want your name withheld, or to provide your submission or material confidentially, you must request permission from the Inquiry Chair in writing through PPV and provide reasons why the Inquiry should treat your submissions or material confidentially.&amp;nbsp; Please contact PPV at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt; with these requests.&lt;\/p&gt;&lt;p&gt;The Inquiry will consider your request and determine whether maintaining confidentiality would be fair to the Proponent and other parties.&amp;nbsp; Even where confidentiality is granted, confidential submissions will still need to be shared with the Proponent to ensure issues raised can be appropriately considered and addressed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;What happens to my EES submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Will my EES submission be made public?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. All EES submissions are public documents and will be published on the Engage Victoria website.&lt;\/p&gt;&lt;p&gt;Your name, submission and other material you provide will be published online unless you ask PPV not to (following the confidential EES submission process outlined above). Personal details like your address and phone number will be removed, but you should ensure you don\u2019t include these in the main part of your submission (only include your details in the online form or cover sheet).&lt;\/p&gt;&lt;p&gt;Please read the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45808 \&quot; target=\&quot;_blank\&quot;&gt;Privacy Collection Statement &lt;\/a&gt;before submitting. Don&#039;t include information that identifies other people unless they agree.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;Can I participate and speak in the Inquiry process?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What is the difference between a submitter conference and a hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;A &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planning.vic.gov.au\/__data\/assets\/pdf_file\/0028\/682453\/DTP0497-Ministerial-Guidelines-8th-edition-web-FA44.pdf\&quot;&gt;submitter conference&lt;\/a&gt; can be less formal than a hearing.&lt;\/p&gt;&lt;p&gt;The submitter conference:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;will provide submitters (who have indicated they want to participate in the process) with an opportunity to speak about their submission and for questions of clarification to be asked through the Inquiry Chair&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;may provide an opportunity for the Proponent and submitters to seek a resolution of some issues&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;may or may not allow for the presentation of further evidence or experts in support of a submission (as outlined in the Inquiry\u2019s Terms of Reference evidence on &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt; is allowed).&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The Inquiry\u2019s Terms of Reference outline the relevant &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt; to be considered at the submitter conference.&lt;\/p&gt;&lt;p&gt;The submitter conference will be structured around topics listed in the \u2018Key Victorian Matters\u2019. All relevant experts and parties with an interest in a particular topic need to attend the conference for that topic, but will not have to attend other sessions unless identified by the Inquiry. Depending on how the conference is structured submitters may be given an individual speaking time at the beginning and\/or end of the conference.&lt;\/p&gt;&lt;p&gt;In contrast, a hearing is for more complex matters. Hearings are more formal and will have a timetable providing time for each party to present submissions and evidence. Experts may make presentations and will be cross examined.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I have to make a EES submission if I want to speak and participate in the Inquiry process?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. To participate in the Inquiry process (by either appearing at the submitter conference and\/or providing further written information), you must make a written submission during the exhibition period.&lt;\/p&gt;&lt;p&gt;Tick the box on the online form to say you want to participate in the Inquiry process. You\u2019ll also need to tell us (if applicable):&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how long you want to speak&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;who will represent you (if you are not representing yourself)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;if you will call any experts.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you do this, you will become a &#039;party&#039; to the Inquiry process. You will be advised of the arrangements for the Inquiry process in advance of the Directions Hearing, in the lead up to the submitter conference, and through any directions issued by the Inquiry.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What if I don\u2019t want to speak?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;That\u2019s fine. You don\u2019t need to speak to your written submission for it to be considered by the Inquiry.&lt;\/p&gt;&lt;p&gt;If you do not want to participate in the Inquiry process, you will not be made a party. You will receive correspondence from the Inquiry acknowledging your written submission, and the Inquiry will still consider your submission in line with the it\u2019s Terms of Reference. However, you will not receive any further correspondence about the Inquiry process and may not be able to submit additional information to the Inquiry.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;You can still follow the process by checking this webpage.&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDA5OjIyOjAzLjU3NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:11,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;For questions about making a EES submission, the Inquiry process or Inquiry, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Planning Panels Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186 (select option 6)&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;For questions about the Star of the South Project and the Victorian Environment Effects Statement (EES) documentation contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Southerly Ten (Star of the South)&lt;\/p&gt;&lt;p&gt;\u260e Phone: 1800 340 340&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:info@southerlyten.com.au\&quot;&gt;info@southerlyten.com.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/\&quot;&gt;https:\/\/southerlyten.com.au\/project\/star-of-the-south\/&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;For questions about the Minister&#039;s Assessment and Victorian Environment Effects Statement (EES) process, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Impact Assessment Unit, Department of Transport and Planning&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assessment@transport.vic.gov.au\&quot;&gt;environment.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Contacts&quot;}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;5&quot;,&quot;type&quot;:&quot;pages&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Project pages&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;8&quot;}}}],&quot;date_end&quot;:&quot;2026-06-29T23:59:00&quot;,&quot;region_id&quot;:3,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;name&quot;,&quot;value&quot;:&quot;Planning Panels Victoria&quot;},{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;136 186 (select option 6)&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;office@planningpanels.vic.gov.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-04-29T23:51:27.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-29T23:45:17.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5300,&quot;team_id&quot;:21,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:45790,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:4,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/SOTS&quot;,&quot;model_type&quot;:&quot;project&quot;,&quot;model_type_label&quot;:&quot;Project&quot;,&quot;alert&quot;:null,&quot;theme_class&quot;:&quot;engage-project-theme__default&quot;,&quot;static_map&quot;:null,&quot;status_label&quot;:&quot;Published&quot;,&quot;subscribe_form_schema&quot;:{&quot;subscribe&quot;:{&quot;title&quot;:&quot;Follow&quot;,&quot;description&quot;:&quot;Enter your email below for updates about the &lt;strong&gt;Star of the South Victorian Inquiry&lt;\/strong&gt; project&quot;,&quot;button_text&quot;:&quot;Follow this project&quot;},&quot;unsubscribe&quot;:{&quot;title&quot;:&quot;You are following&quot;,&quot;description&quot;:&quot;Click the unfollow button to stop receiving updates about the &lt;strong&gt;Star of the South Victorian Inquiry&lt;\/strong&gt; project.&quot;,&quot;button_text&quot;:&quot;Unfollow&quot;,&quot;footer_text&quot;:&quot;You can manage the projects you&#039;re following anytime by visiting &lt;a href=https:\/\/engage.vic.gov.au\/profile\/subscriptions&gt;Subscriptions&lt;\/a&gt; under your profile&quot;}},&quot;consult_status&quot;:{&quot;id&quot;:1,&quot;name&quot;:&quot;open&quot;,&quot;label&quot;:&quot;Open for feedback&quot;},&quot;show_table_of_contents&quot;:false,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;image&quot;:{&quot;id&quot;:89914,&quot;name&quot;:&quot;SoTS IAC - Southerly Ten Hero Image_05 (preferred - on proponent documents)&quot;,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89914\/sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca.jpg&quot;,&quot;ext&quot;:&quot;jpg&quot;,&quot;size&quot;:&quot;2.47 MB&quot;,&quot;thumb&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89914\/conversions\/sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca-thumb.jpg&quot;,&quot;hero&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89914\/conversions\/sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca-hero.jpg&quot;,&quot;full&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89914\/conversions\/sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca-full.jpg&quot;},&quot;public_stages&quot;:[{&quot;id&quot;:37195,&quot;vid&quot;:340854,&quot;title&quot;:&quot;Exhibition stage: Submissions&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Victorian Environment Effects Statement (EES) for the Victorian works of the proposed Star of the South Project is on public exhibition for 30 business days.&lt;\/p&gt;&lt;p&gt;During this time, members of the public are invited to make a written submission to the Inquiry on the Victorian EES, including the draft Planning Scheme Amendment.&lt;\/p&gt;&lt;p&gt;Submissions help the Inquiry understand how the Project\u2019s Victorian works may affect people, communities, and the Victorian environment.&lt;\/p&gt;&lt;p&gt;Submissions must be made in writing. To make a submission on the EES, including the draft PSA, use the online submission form under the Participate tab.&lt;\/p&gt;&lt;p&gt;You must make a written submission if you want to participate in the Inquiry process (by either appearing at the submitter conference and\/or providing further written information).&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The Inquiry will consider all submissions, whether or not a submitter chooses to participate in the Inquiry process, in line with the Inquiry\u2019s Terms of Reference.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:1,&quot;date_start&quot;:&quot;Monday 18 May 2026 to&quot;,&quot;date_end&quot;:&quot;11:59pm on Monday 29 June 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-04-29T23:51:27.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-13T00:50:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1950,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/SOTS\/timeline\/37195&quot;,&quot;summary&quot;:&quot;The Victorian Environment Effects Statement (EES) for the Victorian works...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37213,&quot;vid&quot;:340856,&quot;title&quot;:&quot;Inquiry stage: Directions Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Inquiry will hold a Directions Hearing at &lt;strong&gt;10:00am on Tuesday 14 July 2026&lt;\/strong&gt;. At the Directions Hearing, the Inquiry will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and organise arrangements for the submitter conference, including the dates and format&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Inquiry process will be conducted and how information will be shared before the submitter conference (including expert reports) and how parties will provide further written material on &lt;strong&gt;\u2018&lt;\/strong&gt;Other Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;discuss site inspections&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;consider any procedural issues&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer any questions about the Inquiry process, including the submitter conference.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The Directions Hearing helps make sure everyone is prepared and understands what to expect during the Inquiry process.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:2,&quot;date_start&quot;:&quot;Tuesday 14 July 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-05-09T09:27:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-13T00:50:45.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1950,&quot;created_by_id&quot;:19525,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/SOTS\/timeline\/37213&quot;,&quot;summary&quot;:&quot;The Inquiry will hold a Directions Hearing at 10:00am on...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37214,&quot;vid&quot;:341006,&quot;title&quot;:&quot;Inquiry stage: Submitter conference&quot;,&quot;description&quot;:&quot;&lt;p&gt;A submitter conference will commence in the week beginning &lt;strong&gt;Monday 10 August 2026&lt;\/strong&gt;. Depending on how many submitters want to participate and speak, the submitter conference may run for 2 to 3 weeks. The submitter conference is open to the public, so anyone can observe.&lt;\/p&gt;&lt;p&gt;The submitter conference gives the Proponent and people who indicated they want to be heard, an opportunity to speak in support of their written submission on the &lt;strong&gt;\u2018&lt;\/strong&gt;Key Victorian Matters&lt;strong&gt;\u2019&lt;\/strong&gt;.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Week beginning Monday 10 August 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-05-09T09:27:53.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-13T04:35:58.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1950,&quot;created_by_id&quot;:19525,&quot;modified_by_id&quot;:42373,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/SOTS\/timeline\/37214&quot;,&quot;summary&quot;:&quot;A submitter conference will commence in the week beginning Monday...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37215,&quot;vid&quot;:340996,&quot;title&quot;:&quot;Report stage: Report and next steps&quot;,&quot;description&quot;:&quot;&lt;p&gt;Once the Inquiry process ends, the Inquiry must prepare a report for the Minister for Planning. This report will include the Inquiry\u2019s recommendations and advice on the environmental effects of the&lt;strong&gt; &lt;\/strong&gt;Victorian works of the proposed Star of the South Project on the Victorian environment in accordance with the scope of the Inquiry\u2019s Terms of Reference.&lt;\/p&gt;&lt;p&gt;The Inquiry\u2019s report is to focus on the \u2018Key Victorian Matters\u2019 and address \u2018Other Victorian Matters\u2019 at a high level.&lt;\/p&gt;&lt;p&gt;Under the Terms of Reference, the Inquiry must submit its report within 40 business days of the last day of its proceedings.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the Inquiry\u2019s report to inform the Minister\u2019s Assessment under the &lt;em&gt;Environment Effects Act 1978. &lt;\/em&gt;This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the Inquiry report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:4,&quot;date_start&quot;:&quot;August 2026&quot;,&quot;date_end&quot;:&quot;October 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-05-09T09:28:35.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-13T04:28:50.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1950,&quot;created_by_id&quot;:19525,&quot;modified_by_id&quot;:42373,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/SOTS\/timeline\/37215&quot;,&quot;summary&quot;:&quot;Once the Inquiry process ends, the Inquiry must prepare a...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;}],&quot;tags&quot;:[{&quot;id&quot;:34,&quot;title&quot;:&quot;Environment and climate action&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-20T03:58:18.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:37359,&quot;modified_by_id&quot;:37359,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1950,&quot;tag_id&quot;:34,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1950,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89914,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1950,&quot;uuid&quot;:&quot;19dee407-5722-4c92-89d2-a5463c1f5bee&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;SoTS IAC - Southerly Ten Hero Image_05 (preferred - on proponent documents)&quot;,&quot;file_name&quot;:&quot;sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:2588508,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:19525},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:87763,&quot;created_at&quot;:&quot;2026-05-09T08:40:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-09T08:40:31.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89914\/sots-iac-southerly-ten-hero-image-05-preferred-on-proponent-documents_b7ca.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1940,&quot;vid&quot;:348588,&quot;title&quot;:&quot;Planning the former Footscray Hospital Site&quot;,&quot;slug&quot;:&quot;former-footscray-hospital&quot;,&quot;summary&quot;:&quot;Have your say on the future of the former Footscray Hospital site.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The new Footscray Hospital is now open, and planning has begun for the future of the former hospital site.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Development Victoria has prepared a &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46848\&quot; target=\&quot;_blank\&quot;&gt;draft master plan&lt;\/a&gt; to create a new mixed-use precinct with housing and a new public open space.&lt;\/p&gt;&lt;p&gt;We want to understand what is important to you and the community, including your ideas to strengthen community connection, increase cycling and walking and to understand the types of experiences you would like to enjoy on the site.&lt;\/p&gt;&lt;p&gt;Proposed master plan inclusions:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Community spaces for people to come together, learn and socialise.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Diverse housing (including affordable) to support people of different ages, incomes, lifestyles and life stages.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Prioritised access for pedestrians and cyclists to support active transport.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Play spaces suited to all children.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Places to meet friends and socialise.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;For the public open space, some ideas so far include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Places to walk the dog, have a picnic or kick a footy.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Places to be physically active (running, cycling, sport).&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Places for small public events.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Gardens to visit with friends and family.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;Themes shaping the draft masterplan&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Large open space on top of the former quarry.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A well-connected site with walking and cycling paths.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Wurundendjeri Woi Wurrung Traditional Owner project principles and co-design opportunities.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Retention of existing trees.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Safe accessible public spaces.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Diverse housing including affordable housing.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h2&gt;Have your say&lt;\/h2&gt;&lt;p&gt;We want your feedback on the above and a range of other topics including:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Strengthening community connection.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Recreational activities and experiences.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Facilities to support public use.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Once finalised, the master plan will guide long-term development, while we continue working with the community to design open space for local residents and the broader Footscray community.&amp;nbsp;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA2LTE0VDIzOjQ5OjA0LjgwOFo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Complete the online survey&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6532&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot m_properties&quot;:{&quot;user_id&quot;:60981},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:86881,&quot;created_at&quot;:&quot;2026-04-16T06:48:34.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-16T06:48:36.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89012\/footcray-19-002-1_eca0.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1942,&quot;vid&quot;:348493,&quot;title&quot;:&quot;Train and Tram Zone Activity Centres: Inner Melbourne&quot;,&quot;slug&quot;:&quot;inner-melbourne-train-and-tram-zone&quot;,&quot;summary&quot;:&quot;Contribute to how we plan for new homes in inner Melbourne&quot;,&quot;description&quot;:&quot;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/simplifiedchinese\&quot; target=\&quot;_blank\&quot;&gt;Simplified Chinese | \u7b80\u4f53\u4e2d\u6587&lt;\/a&gt; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/traditionalchinese\&quot; target=\&quot;_blank\&quot;&gt;Traditional Chinese | \u7e41\u9ad4\u4e2d\u6587&lt;\/a&gt; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/vietnamese\&quot; target=\&quot;_blank\&quot;&gt;Vietnamese | Ti\u1ebfng Vi\u1ec7t&lt;\/a&gt; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/korean\&quot; target=\&quot;_blank\&quot;&gt;Korean | \ud55c\uad6d\uc5b4 &lt;\/a&gt; &lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/greek\&quot; target=\&quot;_blank\&quot;&gt;Greek | \u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Every Victorian deserves the choice of a well-designed home in a place they feel connected to - a place where they can live, work, and thrive.&lt;\/p&gt;&lt;p&gt;That\u2019s why we\u2019re planning for more homes in train and tram zone activity centres, close to public transport, jobs, local services, and green open spaces - places that make day-to-day life easier, more convenient, and more sustainable.&lt;\/p&gt;&lt;p&gt;Two of these centres are in inner Melbourne, covering the City of Melbourne and the City of Yarra. Inner Melbourne has some of the best access to transport, jobs and everyday needs in Victoria, as well as our world-famous sporting, dining and entertainment scene.&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h5&gt;We asked for your help to identify and plan for great places for more homes in inner Melbourne. Consultation for the Inner Melbourne Train and Tram Zone is now closed.&lt;\/h5&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:3,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTE0VDIzOjEwOjQxLjA1Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;We invited contributions in two ways:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;By sharing your expertise on inner Melbourne using the map below&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;By answering three short questions about what you think is important when planning for new homes.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;title&quot;:&quot;How to participate&quot;}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfZW1iZWQ6MjAyNi0wNi0xMlQwNToyODowOS41MzZa&quot;,&quot;type&quot;:&quot;participate_embed&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:null,&quot;survey&quot;:6547}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTEyVDA1OjMyOjQ3Ljk2N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;7&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/inner-melbourne-train-and-tram-zone\/page\/privacy-collection-notice\&quot; target=\&quot;_blank\&quot;&gt;Click here to read the privacy collection notice for this project.&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;The privacy collection notice explains how the Department of Transport and Planning handles the information we receive when you participate in the survey.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA2LTEyVDA1OjMyOjIwLjA2Mlo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6539&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTEyVDA1OjMwOjM0LjAwOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The feedback from this consultation will be considered by the Department of Transport and Planning and councils, and may inform future planning in inner Melbourne.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you would like to learn more about train and tram zone activity centres, visit our website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planning.vic.gov.au\/guides-and-resources\/strategies-and-initiatives\/train-and-tram-zone-activity-centres\&quot;&gt;Train and Tram Zone Activity Centres Program&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA0LTI3VDAyOjI3OjIxLjc3Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;hr&gt;&lt;h2&gt;&lt;strong&gt;More about planning for inner Melbourne&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;Inner Melbourne is already built up, and in many places, benefits from zoning allowing thousands of homes. But there are still under-utilised and under-zoned pockets that could provide more homes and opportunities for Victorians.&lt;\/p&gt;&lt;p&gt;New planning controls are needed to support more homes in inner Melbourne, and the Department of Transport and Planning, the City of Melbourne, and City of Yarra are working to deliver them.&lt;\/p&gt;&lt;p&gt;As part of the Train and Tram Zone Activity Centres Program, we have created a purpose-built new planning control called the &lt;strong&gt;Built Form Overlay&lt;\/strong&gt;. The Built Form Overlay sets building height and design controls, and it introduces a streamlined approval process for new homes.&lt;\/p&gt;&lt;p&gt;The City of Melbourne and City of Yarra have undertaken significant work to plan for more people to live in inner Melbourne. Our planning will build on the council\u2019s work and apply the Built Form Overlay to appropriate locations, to help get more homes built faster in the places people want to live.&lt;\/p&gt;&lt;h4&gt;&lt;strong&gt;Current projects&lt;\/strong&gt;&lt;\/h4&gt;&lt;p&gt;The first locations we are planning for in inner Melbourne are:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Macaulay, along the Upfield line in North Melbourne and Kensington&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Fitzroy and Collingwood, including Brunswick Street, Gertrude Street, Smith Street, and Victoria Parade&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Richmond, along Bridge Road and Victoria Street&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Alphington, along Heidelberg Road&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The City of Melbourne and City of Yarra have already developed draft plans for these locations, with proposed new building heights and design controls. We\u2019re picking up these plans and delivering them using our Built Form Overlay.&lt;\/p&gt;&lt;p&gt;To find out more about our current projects, visit our website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planning.vic.gov.au\/guides-and-resources\/strategies-and-initiatives\/train-and-tram-zone-activity-centres\/inner-melbourne-train-and-tram-zone\&quot; target=\&quot;_blank\&quot;&gt;Inner Melbourne Train and Tram Zone&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA0LTIyVDA2OjA4OjU2LjY0NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;5&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;hr&gt;&lt;h4&gt;Acknowledgement of Country&lt;\/h4&gt;&lt;p&gt;We proudly acknowledge the First Peoples of Victoria. We acknowledge their ongoing strength in practising the world\u2019s oldest living culture. We acknowledge the Traditional Owners\u2019 lands, waters and skies on which we live and work. We also pay our respects to their Elders past and present.&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-06-14T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;activity.centres@transport.vic.gov.au&quot;}],&quot;palette&quot;:&quot;14&quot;,&quot;hero_color&quot;:&quot;#d3daec&quot;,&quot;theme&quot;:&quot;variant_1&quot;,&quot;participation_moderation_type&quot;:2,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-04-17T00:31:40.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-14T23:10:49.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5132,&quot;team_id&quot;:21,&quot;created_by_id&quot;:9140,&
