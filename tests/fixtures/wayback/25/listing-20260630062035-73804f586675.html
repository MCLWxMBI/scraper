ing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Victoria Police&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Working to keep our community safe&lt;\/h2&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1975,&quot;created_at&quot;:&quot;2021-12-14T02:10:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-03-09T01:28:36.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/victoria-police&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:90603,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1962,&quot;uuid&quot;:&quot;04226d2f-4638-4e37-a53f-2477be1b8073&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;112247&quot;,&quot;file_name&quot;:&quot;112247_1ae9.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:6084870,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:20430},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:88433,&quot;created_at&quot;:&quot;2026-05-19T22:59:13.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-19T22:59:17.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/90603\/112247_1ae9.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1974,&quot;vid&quot;:350593,&quot;title&quot;:&quot;Draft Yarra Planning Scheme Amendment C336yarra&quot;,&quot;slug&quot;:&quot;draft-yarra-planning-scheme-amendment-c336yarra&quot;,&quot;summary&quot;:&quot;Have your say on Draft Planning Scheme Amendment C336yarra, which seeks to facilitate the use and development of an apartment building.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The purpose of this consultation is to seek views on the Draft Yarra Planning Scheme Amendment C336yarra, which seeks to facilitate the use and development of an apartment building via an incorporated document and application of the Specific Controls Overlay under the Yarra Planning Scheme. The amendment would approve the use and development of the land for accommodation (dwellings) by or on behalf of VACCHO, where accommodation is otherwise prohibited in the Commercial 2 Zone.&lt;\/p&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, approve and adopt Draft Planning Scheme Amendment C336yarra to the Yarra Planning Scheme under section 20(4) of the Planning and Environment Act 1987.&lt;strong&gt; &lt;\/strong&gt;The draft amendment applies to land at 22-50 Sackville Street, Collingwood.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;Consultation is being undertaken under section 20(5) of the&amp;nbsp;Planning and Environment Act 1987.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;On 13 May 2026, the Minister for Planning received a request from Victorian Aboriginal Community Controlled Health Organisation (VACCHO) to prepare, adopt and approve an amendment to the Yarra Planning Scheme by exercising the powers under section 20(4) of the Planning and Environment Act 1987.    &lt;\/p&gt;&lt;p&gt;The amendment seeks to facilitate the use and development of an apartment building via an incorporated document and application of the Specific Controls Overlay. The amendment would approve the use and development of the land for accommodation (dwellings) by or on behalf of VACCHO, where accommodation is otherwise prohibited in the Commercial 2 Zone. The development would deliver 100% social and affordable housing and be funded under the Housing Australia Future Fund, including culturally appropriate accommodation for First Nations peoples, and would be co-located with VACCHO\u2019s existing head office at 17\/23 Sackville Street, Collingwood.   The amendment would allow for the land to be used and developed in accordance with the draft incorporated document, Victorian Aboriginal Community Controlled Health Organisation Sackville Street Properties, Department of Transport and Planning, May 2026.&lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;Draft Amendment C336yarra proposes to make the following changes to the Yarra Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amends the Schedule to Clause 45.12 \u2013 \u2018Specific Controls Overlay\u2019 to introduce the associated Incorporated Document titled &lt;em&gt;Victorian Aboriginal Community Controlled Health Organisation Sackville Street Properties, Department of Transport and Planning, May 2026&lt;\/em&gt;.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends the Schedule to Clause 51.01 \u2013 Specific Sites and Exclusions\u2019 to insert incorporated document titled &lt;em&gt;Victorian Aboriginal Community Controlled Health Organisation Sackville Street Properties, Department of Transport and Planning, May 2026&lt;\/em&gt;.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends the Schedule to Clause 72.03 \u2013 \u2018What does this Planning Scheme consist of?\u2019 to include an amended Planning Scheme Map No. 6SCO.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends the Schedule to Clause 72.04 \u2013 \u2018Incorporated documents\u2019&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amends Planning Scheme Map No. 06SCO to apply the SCOXX to the land.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to proceed with the proposed Draft Amendment, the Minister for Planning is undertaking consultation under section 20(5) of the&amp;nbsp;Planning and Environment Act 1987&amp;nbsp;to understand the views of affected parties.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister may decide to refer this matter to the Priority Projects Standing Advisory Committee for further advice before deciding about whether to prepare, adopt and approve the draft amendment and draft planning permit. If you make a submission, you will be informed if the matter is referred to the Priority Projects Standing Advisory Committee.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;More information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact Priority Projects, Department of Transport and Planning by email at&amp;nbsp;&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assesssment@transport.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt;development.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;4&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI2VDAwOjU0OjMxLjA3MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:2,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;Next steps&lt;\/h3&gt;&lt;p&gt;If you provide a submission that&lt;strong&gt; inludes your correc heme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:90868,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1974,&quot;uuid&quot;:&quot;3ee0ac7f-2306-4415-81b6-e17722039e54&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;DraftYarraPSAC336yarra&quot;,&quot;file_name&quot;:&quot;draftyarrapsac336yarra_bbcd.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:1781776,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:88694,&quot;created_at&quot;:&quot;2026-05-25T04:41:38.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-25T04:41:39.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/90868\/draftyarrapsac336yarra_bbcd.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1952,&quot;vid&quot;:351151,&quot;title&quot;:&quot;2027 Victorian Transmission Plan&quot;,&quot;slug&quot;:&quot;2027-victorian-transmission-plan&quot;,&quot;summary&quot;:&quot;VicGrid is inviting feedback on the long-term plan for renewable energy zones and transmission   \r\ninfrastructure to meet Victoria\u2019s future needs.&quot;,&quot;description&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&lt;div class=\&quot;calloutbox calloutbox--primary\&quot;&gt;&lt;h3&gt;Overview&lt;\/h3&gt;&lt;p&gt;VicGrid has started planning for the next &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;Victorian Transmission Plan&lt;\/a&gt; by releasing the draft 2026 Victorian Transmission Plan Guidelines. This document will guide the development of the 2027 Victorian Transmission Plan, which will take a 25-year view of the state\u2019s transmission and renewable energy generation needs.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The recently declared &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/renewable-energy-zones\&quot;&gt;renewable energy zones&lt;\/a&gt; will serve as a basis for the 2027 plan. As part of the proposed methodology, we will look at whether they can meet Victoria\u2019s future energy needs and, if required, identify potential locations for further zones.&lt;\/p&gt;&lt;p&gt;We recognise renewable energy zones proposed in the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2025-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2025 Victorian Transmission Plan&lt;\/a&gt; were recently formally declared and this evolving environment can be challenging, particularly for those directly affected.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;At the same time, we must continue to plan proactively for the long-term and keep pace with growing demand.&lt;\/p&gt;&lt;p&gt;We are committed to balancing these priorities and progressing necessary planning while continuing to hear from communities about their views and priorities.&lt;\/p&gt;&lt;p&gt;We are now inviting submissions on the draft guidelines to understand community and industry views and help ensure the final guidelines are clear and effective.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDIyOjQzOjM5LjU1Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;VicGrid is inviting feedback on the &lt;strong&gt;draft 2026 Victorian Transmission Plan Guidelines&lt;\/strong&gt; to understand community and industry views and help make sure the final guidelines are clear and effective.&lt;\/p&gt;&lt;p&gt;The guidelines will set out how VicGrid will prepare the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2027-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2027 Victorian Transmission Plan&lt;\/a&gt;, and the role of community and industry engagement.&lt;\/p&gt;&lt;p&gt;Before making a submission, please read the draft guidelines and the summary document.&lt;\/p&gt;&lt;p&gt;To provide feedback:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/2027-victorian-transmission-plan\/survey\/6649#sub-nav\&quot;&gt;Upload a submission&lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Call us on 1800 418 341 from 9 am to 5 pm, Monday to Friday (except public holidays)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Email us at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:enquiries@vicgrid.com.au\&quot;&gt;enquiries@vicgrid.com.au&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Submissions close on Friday 26 June 2026 at 11:59 pm AEST.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;How to participate&quot;}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMDFUMjM6Mzc6MjEuNDc0Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;select_165&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46337&quot;,&quot;46338&quot;,&quot;46339&quot;,&quot;46672&quot;,&quot;46670&quot;,&quot;46671&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDEwOjU5OjUxLjM4Nlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;Victorian Transmission&amp;nbsp;Plan&lt;\/a&gt;&amp;nbsp;will&amp;nbsp;outline how&amp;nbsp;renewable energy generation, storage and transmission infrastructure&amp;nbsp;should be developed over&amp;nbsp;the next 25&amp;nbsp;years,&amp;nbsp;including the priority transmission projects needed in the first 10 years.&amp;nbsp;The Victorian Transmission Plan Guidelines outline how&amp;nbsp;VicGrid&amp;nbsp;will&amp;nbsp;prepare the&amp;nbsp;plan, including&amp;nbsp;how we will:&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Determine&amp;nbsp;how much energy Victoria needs&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Assess if the declared renewable energy zones&amp;nbsp;can accommodate&amp;nbsp;Victoria&#039;s future energy needs&amp;nbsp;and, if&amp;nbsp;required,&amp;nbsp;identify&amp;nbsp;potential new areas for investigation&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Identify&amp;nbsp;what new or upgraded transmission infrastructure&amp;nbsp;is needed and where&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Partner with Traditional Owners and engage with landholders,\u202fcommunities\u202fand industry on the development of the plan&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Each time&amp;nbsp;VicGrid&amp;nbsp;updates the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;Victorian Transmission Plan&lt;\/a&gt;, we will prepare and consult on&amp;nbsp;updated&amp;nbsp;guidelines.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We are inviting submissions on the draft 2026 Victorian Transmission Plan Guidelinesto understand community, Traditional Owner&amp;nbsp;and industry views and help ensure the final guidelines are clear and effective.\u202f&amp;nbsp;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;What are the Victorian Transmission Plan Guidelines?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDEwOjU5OjQ4LjIyOVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2025-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;VicGrid\u2019s website&lt;\/a&gt; to read documents from the &lt;strong&gt;2025 Victorian Transmission Plan&lt;\/strong&gt;, including:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;2025 Victorian Transmission Plan&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;2024 Victorian Transmission Plan Guidelines&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Draft Victorian Transmission Plan Guidelines Final Engagement Report&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Frequently asked questions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Appendixes&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;title&quot;:&quot;Previous consultation&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDEwOjU5OjUwLjQxNFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The 2026 Guidelines have been refined from the 2024 Guidelines and the&amp;nbsp;methodology&amp;nbsp;used to develop the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2025-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2025 Victorian Transmission Plan&lt;\/a&gt;.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Updates have been made to reflect the extended planning period, declared REZs and proposed transmission projects, and a focus on improved clarity and adaptability. The approach&amp;nbsp;remains&amp;nbsp;scenario\u2011based&amp;nbsp;and probabilistic, drawing on energy market modelling, power system&amp;nbsp;analysis&amp;nbsp;and strategic&amp;nbsp;land\u2011use&amp;nbsp;analysis.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;A key change is the starting point. Rather than beginning with a broad&amp;nbsp;study\u2011area&amp;nbsp;assessment, the updated&amp;nbsp;methodology&amp;nbsp;now uses declared REZs and transmission projects&amp;nbsp;identified&amp;nbsp;in the 2025 VTP as a starting point.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We are using energy market modelling with refreshed inputs and assumptions to understand how Victoria\u2019s energy needs and locations for renewable generation may have shifted.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We will evaluate if declared REZs can meet Victoria\u2019s future energy&amp;nbsp;needs, before&amp;nbsp;the development of the generation resource plan. The latter stages&amp;nbsp;comprise&amp;nbsp;the identification and assessment of candidate development pathways and confirmation of&amp;nbsp;an optimal&amp;nbsp;pathway using established tools, with refinements informed by lessons learned.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;How are the 2026 Guidelines different to the 2024 Guidelines?&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDEwOjU5OjE0LjIwM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Once the consultation period ends, VicGrid will review and analyse all of the feedback received. We\u2019ll also report back about what we heard and share how feedback will be addressed in the guidelines and during development of the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2027-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2027 Victorian Transmission Plan&lt;\/a&gt;.&lt;\/p&gt;&lt;p&gt;As&amp;nbsp;we&amp;nbsp;develop the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2027-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2027 Victorian Transmission Plan&lt;\/a&gt;,&amp;nbsp;we will assess whether the declared renewable energy zones can meet Victoria&#039;s energy needs over the next 25 years.&amp;nbsp;This may mean we&amp;nbsp;identify&amp;nbsp;the need for&amp;nbsp;additional&amp;nbsp;zones.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Where we identify the need for new areas, we will undertake targeted consultation with the local community and industry on factors that could influence the suitability of the area for development.&lt;\/p&gt;&lt;p&gt;Then there will be further opportunities for communities and industry to provide feedback on a draft of the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\/2027-victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;2027 Victorian Transmission Plan&lt;\/a&gt;. The plan will be finalised and released by 31 July 2027.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNS0yOFQxMToxODozNi43Nzla&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:6,&quot;children&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDExOjU0OjM4LjYwMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Privacy Collection Statement&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;This privacy collection statement explains how VicGrid handles any personal information we receive if you engage with us about the draft renewable energy zone orders.&lt;\/p&gt;&lt;p&gt;VicGrid is committed to handling personal information in accordance with the Information Privacy Principles in the Privacy and Data Protection Act 2014 (Vic).&amp;nbsp; VicGrid may use any personal information provided to us to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;record and assess your feedback;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;communicate with you about your feedback, or your requests to meet with us;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;inform decisions about the draft renewable energy zone orders;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;produce a public engagement report to provide transparency to communities about what we heard through feedback; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;shape decisions about future policies that interact with and are related to the renewable energy zones, including new network access and connection arrangements, renewable energy zone development and future updates to the Victorian Transmission Plan.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Your contact details may also be used by VicGrid to survey you about your experience with VicGrid.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;VicGrid may disclose your personal information to our consultants and service providers for the above purposes.&amp;nbsp; We may also disclose information you have provided in de-identified form to the Victorian Minister for Energy and Resources, the Minister\u2019s staff and third parties selected by the State to build and operate the transmission infrastructure. &amp;nbsp;If you have given your consent, information you have provided may be published in de-identified form in our public engagement report.\u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You are not required to disclose your personal information to VicGrid. &amp;nbsp;However, if we cannot collect your personal information, we may not be able to respond to your requests or discuss your feedback with you.&lt;\/p&gt;&lt;p&gt;To discuss any privacy concerns, or request to access or correct the personal information VicGrid holds about you, please contact the VicGrid Victorian Transmission Plan team at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:enquiries@vicgrid.com.au\&quot; target=\&quot;_blank\&quot;&gt;enquiries@vicgrid.com.au&lt;\/a&gt; or on 1800 418 341.&amp;nbsp; VicGrid will generally provide you with access to the personal information we hold about you, subject to some exceptions under law.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Privacy Collection Statement&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDExOjIzOjEwLjE5NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;calloutbox calloutbox--secondary\&quot;&gt;&lt;h4&gt;Accessibility&lt;\/h4&gt;&lt;p&gt;If you are deaf or have a hearing or speech impairment, visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.accesshub.gov.au\/about-the-nrs\&quot; target=\&quot;_blank\&quot;&gt;National Relay Service&lt;\/a&gt; or call 133 677.&lt;\/p&gt;&lt;p&gt;If you need help with translating and interpreting, visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot; target=\&quot;_blank\&quot;&gt;TIS National&lt;\/a&gt; or call 131 450.&lt;\/p&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Accessibility&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI4VDExOjIzOjA2LjM4MVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:7,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/86138\/aboriginal-tsi-flgs_0c9c.png\&quot; alt=\&quot;Aboriginal and Torres Strait Islander flags\&quot;&gt;&lt;h4&gt;Acknowledgment of Traditional Owners&lt;\/h4&gt;&lt;p&gt;We acknowledge and respect Victorian Traditional Owners as the original custodians of Victoria\u2019s land and waters, their unique ability to care for Country and deep spiritual connection to it. We honour Elders past and present whose knowledge and wisdom has ensured the continuation of culture and traditional practices.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Acknowledgment of Traditional Owners&quot;}}],&quot;settings&quot;:{&quot;type&quot;:&quot;list&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-06-26T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;1800 418 341&quot;},{&quot;type&quot;:&quot;address&quot;,&quot;value&quot;:&quot;VicGrid PO Box 500, East Melbourne VIC 8002&quot;},{&quot;type&quot;:&quot;web&quot;,&quot;value&quot;:&quot;https:\/\/www.vicgrid.com.au\/&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;enquiries@vicgrid.com.au&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-05-05T00:53:40.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-29T02:51:33.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5351,&quot;team_id&quot;:66,&quot;created_by_id&quot;:59622,&quot;modified_by_id&quot;:59460,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:7,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/2027-victorian-transmission-plan&quot;,&quot;model_type&quot;:&quot;project&quo g and increasingly unreliable coal-fired power stations close, they\u2019re being replaced by renewable energy sources. Our energy grid needs to change to carry this new renewable power across the state to Victorian homes and businesses. &lt;\/p&gt;&lt;p&gt;VicGrid is working to make sure this change delivers the safe, reliable and affordable power Victoria needs for the future. It is also making sure local communities have a say and can share in the benefits of the energy transition. &lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/\&quot; target=\&quot;_blank\&quot;&gt;Visit VicGrid&lt;\/a&gt;&lt;br&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/renewable-energy-zones\&quot; target=\&quot;_blank\&quot;&gt;Learn more about renewable energy zones&lt;\/a&gt;&lt;br&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/www.vicgrid.com.au\/transmission-planning\/victorian-transmission-plan\&quot; target=\&quot;_blank\&quot;&gt;Learn more about the Victorian Transmission Plan&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:3508,&quot;created_at&quot;:&quot;2024-06-18T04:09:55.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-04T01:14:54.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/vicgrid&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__default&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:91201,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1952,&quot;uuid&quot;:&quot;756fb1f9-00e0-4a62-8b51-e7b8df83a894&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;20250515_ Draft VTP cover image&quot;,&quot;file_name&quot;:&quot;20250515-draft-vtp-cover-image_e24c.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:603125,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59460},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:89021,&quot;created_at&quot;:&quot;2026-05-28T04:15:00.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-28T04:15:02.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91201\/20250515-draft-vtp-cover-image_e24c.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1957,&quot;vid&quot;:344278,&quot;title&quot;:&quot;Hazelwood BESS Line Co \u2013 transmission licence application&quot;,&quot;slug&quot;:&quot;hazelwood-bess-line-co-transmission-licence-application&quot;,&quot;summary&quot;:&quot;The Essential Services Commission is reviewing an application from Hazelwood BESS Line Co for   \r\nan electricity transmission licence and wants to hear from you.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;Hazelwood BESS Line Co Pty Ltd (HBESS Line Co) has applied to the Essential Services Commission for an electricity transmission licence in Victoria.&lt;\/p&gt;&lt;p&gt;We are responsible for deciding whether to grant or refuse a licence application. We invite your feedback between 27 May and 24 June 2026. The commission will make a decision on the licence application later in 2026.&lt;\/p&gt;&lt;h3&gt;How does HBESS Line Co propose to use this licence?&lt;\/h3&gt;&lt;p&gt;HBESS Line Co is seeking a licence to transmit electricity through Hazelwood BESS Transmission Line, including its connection and extension assets, located in Hazelwood, Victoria.&lt;\/p&gt;&lt;p&gt;You can find more information about HBESS Line Co\u2019s transmission project relating to the Hazelwood BESS Transmission Line in its application for an electricity transmission licence.&lt;\/p&gt;&lt;h3&gt;Our role in energy licensing&lt;\/h3&gt;&lt;p&gt;A person who wants to engage in the activity of transmitting electricity in Victoria is required to hold a licence granted by the Essential Services Commission.&lt;\/p&gt;&lt;p&gt;We are responsible for deciding whether to grant or refuse a licence application. We must have regard to our objectives when deciding whether to grant or refuse a licence application.* This includes promoting the long-term interests of Victorian consumers with respect to the price, quality and reliability of essential services.** &lt;\/p&gt;&lt;p&gt;* In accordance with section 19 of the Electricity Industry Act 2000.&lt;\/p&gt;&lt;p&gt;** Under the Essential Services Commission Act 2001 and the Electricity Industry Act 2000. &lt;\/p&gt;&lt;h3&gt;How we assess licence applications&lt;\/h3&gt;&lt;p&gt;Consistent with our objectives, we will not grant a transmission licence unless we are satisfied that: &lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;the applicant has the technical capacity to comply with the conditions of the licence; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;the applicant is a \u2018fit and proper\u2019 person to hold a licence in Victoria.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can refer to our &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.esc.vic.gov.au\/electricity-and-gas\/licences-exemptions-and-trial-waivers\/electricity-and-gas-licences\/apply-electricity-or-gas-licence\&quot;&gt;Guideline: Applications for electricity and gas industry licences for more information. The guideline includes information&lt;\/a&gt; to assist people to understand our licensing process.&lt;\/p&gt;&lt;h3&gt;How to participate &lt;\/h3&gt;&lt;p&gt;We are seeking feedback from stakeholders on HBESS Line Co\u2019s application that may assist us in deciding to grant or refuse this application. &lt;\/p&gt;&lt;p&gt;You may provide your feedback by:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;providing comments in the below survey; or&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;providing a submission document\/s&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can upload your submission below or send it to us via the below contact details:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:Licences@esc.vic.gov.au \&quot;&gt;Licences@esc.vic.gov.au &lt;\/a&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Mail: Essential Services Commission, Level 8, 570 Bourke Street, Melbourne Victoria 3000&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can also call us on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:03 9032 1300\&quot;&gt;03 9032 1300&lt;\/a&gt; to discuss your options.&lt;\/p&gt;&lt;p&gt;If English is not your first language, please contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.tisnational.gov.au\/\&quot;&gt;TIS National&lt;\/a&gt; on &lt;a class=\&quot;engage-link\&quot; href=\&quot;tel:131 450\&quot;&gt;131 450&lt;\/a&gt; to make your submission using an interpreter.&lt;\/p&gt;&lt;p&gt;Submission close on&lt;strong&gt; 24 June 2026&lt;\/strong&gt;.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:1,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;4&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;1&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;, t;li&gt;&lt;p&gt;Consolidating the operating yards and the lot at the rear of site into a single activity site.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Installing 1x Offline Zorba Sorting system&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Installing 1x fixed unit pre-shredder&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Relocating equipment to maximise operational efficiency.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Installing 1x Water treatment plant&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Installing 1x truck wash station&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;The full application can be found in the \u2018&lt;em&gt;Supporting documents\u2019&lt;\/em&gt;&amp;nbsp;section of this page. Appendix D is not published here as it contains commercial-in-confidence information.&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTIxVDIzOjAzOjE4LjU4NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The submission period for this development licence application has now closed.&lt;\/p&gt;&lt;p&gt;EPA received 30 submissions during this period.&lt;\/p&gt;&lt;p&gt;This included:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;26 objection(s)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;4 supporting the application with conditions&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;EPA reviews all submissions as part of the assessment process.\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You can view the submissions in the &#039;Supporting documents&#039; section on this page.&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Submission period closed&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTIxVDIzOjAzOjI4LjE5N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;: ons please visit &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/epa-development-licence-applications\&quot; target=\&quot;_blank\&quot;&gt;EPA Development Licence Applications&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;3&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:1711,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-11T05:28:59.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/environment-protection-authority&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--3&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:90604,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1964,&quot;uuid&quot;:&quot;589e7db8-b8bb-4be9-9038-e96802c6b1a9&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Manhari-engage-vic&quot;,&quot;file_name&quot;:&quot;manhari-engage-vic_ea2e.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:382349,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:50096},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:88434,&quot;created_at&quot;:&quot;2026-05-20T03:26:46.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-20T03:26:48.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/90604\/manhari-engage-vic_ea2e.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1885,&quot;vid&quot;:351125,&quot;title&quot;:&quot;Proposed amendments to the VICSES disciplinary framework&quot;,&quot;slug&quot;:&quot;amending-vicses-regulations&quot;,&quot;summary&quot;:&quot;Have your say about proposed amendments to the Victoria State Emergency Service (VICSES) Regulations 2017.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;In 2022\u201323, the Victoria State Emergency Service (VICSES) engaged the Victorian Equal Opportunity and Human Rights Commission to support the organisation in strengthening its prevention of and response to bullying, sexual harassment, discrimination and victimisation. This support included consultation with employees and volunteer members, and facilitating the preparation of an action plan with VICSES senior leadership.&lt;\/p&gt;&lt;p&gt;A key action from this plan was to review the Victoria State Emergency Service Regulations&amp;nbsp;2017 to encompass a grievance\/complaint handling process that enables VICSES to respond to complaints effectively and fairly. This will include improvements to the disciplinary process to allow for more timely outcomes in relation to harmful behaviour.&lt;\/p&gt;&lt;h2&gt;Proposed changes&lt;\/h2&gt;&lt;p&gt;The proposed changes address this action and aim to improve the current process to:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;better support the health, safety and wellbeing of members involved in disciplinary processes&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;enable more timely resolution of disciplinary processes&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;enable greater flexibility in the process\u2019 administration&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;make the process more streamlined and easier to understand.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;A high-level summary of the proposed regulation changes can be found in the \u2018Explanation of proposed amendments to VICSES Regulations\u2019 overview in the document section below. The full proposed regulation changes can also be found in the documents section below.&lt;\/p&gt;&lt;h2&gt;How to have your say&lt;\/h2&gt;&lt;p&gt;Share your thoughts on the proposed changes, including how they support the health and safety of members, and how they improve the disciplinary process.&lt;\/p&gt;&lt;p&gt;Your feedback will help ensure that the proposed changes reflect the needs of VICSES members and will inform the final Regulations.&lt;\/p&gt;&lt;p&gt;Submit your feedback using the button below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA1LTEzVDA1OjEzOjE5LjE5M1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Participate&quot;,&quot;select_49&quot;:&quot;custom&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6306&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;4&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;images&quot;:[],&quot;number_139&quot;:&quot;200&quot;,&quot;select_137&quot;:&quot;all&quot;,&quot;select_138&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEzVDA1OjE0OjEzLjU2Mlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;Emergency Management Victoria (EMV) is committed to protecting personal information provided by you in accordance with Victoria\u2019s privacy laws.&lt;\/p&gt;&lt;p&gt;You\u202fare not required to\u202fprovide any personal\u202finformation\u202fto make a submission on the draft amending regulations.\u202f&lt;\/p&gt;&lt;p&gt;If you provide your name and contact details, EMV may use them to seek clarification on your submission or to respond to your questions. If you choose to give your contact details, please only include your name and email address. Do not give any other personal details that belong to you or anyone else.\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;EMV may share your submission, including any personal details contained in it, with our employees, contractors, Ministers and Cabinet Committees, and others who may need access to it as part of their duties, or as otherwise required by law.\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We will not use your personal\u202finformation\u202ffor any other purpose. We will handle it\u202fin accordance with\u202fthe requirements in the &lt;em&gt;Privacy and Data Protection Act 2014&lt;\/em&gt; and the\u202f&lt;em&gt;Public Records Act 1973&lt;\/em&gt;.\u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you choose to give personal\u202finformation, you may access the\u202finformation\u202fwe hold about you by making a\u202f&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.justice.vic.gov.au\/freedom-of-information\&quot; target=\&quot;_blank\&quot;&gt;Freedom of\u202fInformation\u202frequest\u202fvia the Department of Justice and Community Safety website&lt;\/a&gt;.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;For further information on how your personal information is handled please review the privacy policies of &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.emv.vic.gov.au\/privacy\&quot; target=\&quot;_blank\&quot;&gt;EMV&lt;\/a&gt; and &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/privacy-policy\&quot; target=\&quot;_ ed_at&quot;:null,&quot;url&quot;:&quot;\/department-of-justice-and-community-safety&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:86591,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1885,&quot;uuid&quot;:&quot;af11043a-e56a-482e-8046-9d30d7b49924&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Proposed amendments to the VICSES disciplinary framework consultation banner&quot;,&quot;file_name&quot;:&quot;proposed-amendments-to-the-vicses-disciplinary-framework-consultation-banner_de35.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:254848,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:59662},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:84516,&quot;created_at&quot;:&quot;2026-01-29T03:04:32.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-29T03:04:33.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/86591\/proposed-amendments-to-the-vicses-disciplinary-framework-consultation-banner_de35.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1953,&quot;vid&quot;:349709,&quot;title&quot;:&quot;Draft Darebin Planning Scheme Amendment C232dare \u2013 Bell Station&quot;,&quot;slug&quot;:&quot;draft-darebin-planning-scheme-amendment-c232dare-bell-station&quot;,&quot;summary&quot;:&quot;Have your say on Draft Planning Scheme Amendment C232dare, which proposes planning controls to guide future redevelopment of land at Bell Station, Preston.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Purpose&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering to prepare, approve and adopt Draft Planning Scheme Amendment C232dare to the Darebin Planning Scheme which relates to surplus government land within the Bell Railway Station precinct in Preston. The land has been identified by the State Government as an Integrated Development Opportunity (IDO) Site following the removal of the Bell Street level crossing and the completion of the new Bell Station as part of the Victorian Government\u2019s level crossing removal program. Consultation is being undertaken under section 20(5) of the Planning and Environment Act 1987.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The Bell Station IDO Site comprises a substantial parcel of vacant land located immediately adjacent to the station and the Mernda rail corridor. The land is currently zoned predominantly Transport Zone 1 (State Transport Infrastructure), with a smaller area zoned Housing Choice and Transport Zone, which reflects its former and ongoing relationship with transport infrastructure. A planning scheme amendment is required to facilitate the future redevelopment of the site.&lt;\/p&gt;&lt;p&gt;The draft Planning Scheme Amendment proposes to rezone the land to the Mixed Use Zone, apply Specific Controls Overlay Schedule 7 (Bell Station Integrated Development Opportunity Site), and introduce the Bell Station Integrated Development Opportunity Site Incorporated Document. Together, these controls establish a master-planned framework to guide the future use and development of the land for medium- to high-density housing and complementary uses in a location with excellent access to public transport, services, and the Preston (High Street) Activity Centre.&lt;\/p&gt;&lt;p&gt;Development of the site will be guided by an approved Master Plan and staged detailed development documentation to be approved by the Minister for Planning. Any use or development carried out in accordance with the Incorporated Document would not require a planning permit while the Incorporated Document remains in effect. The amendment is intended to support the delivery of housing, including affordable housing, and to contribute to broader urban renewal outcomes within the Bell Station precinct&lt;\/p&gt;&lt;p&gt;The master plan associated with the proposed amendment seeks to provide mixed-use and residential development, including four buildings between 4 and 13 storeys in height, including landscaped open space breaks, a central public park and a landscaped corridor along the adjoining rail line with bicycle and pedestrian paths.   &lt;\/p&gt;&lt;h3&gt;What the draft amendment does&lt;\/h3&gt;&lt;p&gt;The draft amendment proposes following changes to the Darebin Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Rezone the land from part Transport Zone 1 and part Housing Choice and Transport Zone to the Mixed Use Zone; &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Apply Specific Controls Overlay \u2013 Schedule 7 (SCO7 \u2013 Bell Station Integrated Development Opportunity Site); &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Introduce the Bell Station Integrated Development Opportunity Site Incorporated Document to guide the use and development of the land; and &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clauses 72.01 to include the Minister for Planning as the Responsible Authority for the land; &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the schedules 72.03 and 72.04 to give effect to the amendment and Incorporated Document.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before deciding whether to proceed with the proposed amendment and planning permit, the Minister for Planning is undertaking consultation under section 20(5) of the Planning and Environment Act 1987 to understand the views of affected parties. &lt;\/p&gt;&lt;p&gt;Consultation responses will be reviewed by the Department of Transport and Planning during the planning assessment stage of the amendment and permit.&lt;\/p&gt;&lt;h3&gt;More Information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further please contact Development Assessment, Department of Transport and Planning on &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:development.assessment@transport.vic.gov.au\&quot;&gt;development.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide a submission using the survey form below.&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA1LTA3VDA0OjI1OjM3Ljg0M1o=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNS0yMFQwNToyMDozMS40MDNa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:3,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDUtMjBUMDQ6NTA6NDQuODM5Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Amendment documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46093&quot;,&quot;46094&quot;,&quot;46095&quot;,&quot;46098&quot;,&quot;46099&quot;,&quot;46100&quot;],&quot;limit&quot;:200}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDUtMjBUMDQ6NTE6NTYuNjY0Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:4,&quot;children&quot;:[],&quot;settings&quot;:{&quot;title&quot;:&quot;Plans and reports&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;46 t;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89885,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1953,&quot;uuid&quot;:&quot;1cd16cec-d648-4318-b128-b6fcc1343fbc&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;C232dare&quot;,&quot;file_name&quot;:&quot;c232dare_5bb7.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:71781,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:9140},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:87734,&quot;created_at&quot;:&quot;2026-05-07T04:26:49.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-07T04:26:50.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89885\/c232dare_5bb7.jpg&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1932,&quot;vid&quot;:347588,&quot;title&quot;:&quot;Racecourse Road, Flemington housing&quot;,&quot;slug&quot;:&quot;racecourse-road-flemington-housing&quot;,&quot;summary&quot;:&quot;We asked people living and working near Racecourse Road in Flemington for feedback. Your feedback will help us finalise our designs for the new homes.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&amp;nbsp;&lt;\/h2&gt;&lt;p&gt;This project is part of the Victorian Government\u2019s High-rise Redevelopment Program. It is the third project in the Flemington housing precinct following the Victoria Street and Holland Court housing developments.&lt;\/p&gt;&lt;p&gt;We\u2019ll deliver the project in partnership with Building Communities.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The project will deliver 2 new buildings:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Debneys Park building (Building 4CD)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Racecourse Road building (Building 3BC)&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The new homes will be all electric and energy efficient. Each building will have resident spaces including a podium rooftop featuring landscaped communal open space and productive garden plots.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;New pedestrian and bike pathways and roads will be created to connect residents with the surrounding neighbourhood.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;You can learn more about the Racecourse Road, Flemington project on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;http:\/\/www.homes.vic.gov.au\/projects\/racecourse-road-flemington\&quot;&gt;Homes Victoria webpage&lt;\/a&gt;.&lt;\/p&gt;&lt;h3&gt;Debneys Park (Building 4CD)&amp;nbsp;&lt;\/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Between 6 and 26 storeys&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;More than 400 social homes (one-, 2-, 3-, 4- and 5- bedrooms)&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Multipurpose community rooms&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Mixed use spaces for retail, a cafe or health services&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Office for an onsite community housing provider&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Racecourse Road building (Building 3BC)&amp;nbsp;&amp;nbsp;&lt;\/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Between 20 and 36 storeys&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;More than 400 homes (one-, 2-, 3- and 4-bedrooms)&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Space for a new supermarket&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Commercial spaces for a caf\u00e9 or shops&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNi0wOFQwMToxMzo0NC43MTZa&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:4,&quot;children&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA4VDAxOjE0OjQ1Ljg2MFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;We asked residents, property owners, the community, council and other stakeholders to review the proposed plans for the Racecourse Road, Flemington project and submit feedback. Our consultation was open from Monday 18 May until 11:59 pm on Sunday 7 June 2026.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;p&gt;We asked your thoughts on the following themes:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;New buildings and homes&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Creating a welcoming and secure neighbourhood&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Moving around the Flemington housing precinct&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Resident and community spaces.&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/project\/racecourse-road-flemington-housing\/page\/proposed-development-plans\&quot; target=\&quot;_blank\&quot;&gt;Explore the proposed development plans&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;During the consultation period, we held:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Two&amp;nbsp;community drop-in sessions&amp;nbsp;on&amp;nbsp;Saturday&amp;nbsp;23&amp;nbsp;May&amp;nbsp;and&amp;nbsp;Tuesday 26 May&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Two&amp;nbsp;targeted&amp;nbsp;resident drop-in sessions on&amp;nbsp;Friday 29 May and Wednesday 3 June&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Six&amp;nbsp;meetings with stakeholders held in person and online.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can also view the project\u2019s timeline on our Homes Victoria webpage.&lt;\/p&gt;&lt;p&gt;&lt;a class=\&quot;button\&quot; href=\&quot;https:\/\/www.homes.vic.gov.au\/projects\/racecourse-road-flemington\&quot; target=\&quot;_blank\&quot;&gt;Visit Homes Victoria&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;May - June 2026&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA4VDAxOjE0OjA0LjYxMVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;The Racecourse Road project has been informed by previous years of consultation to plan the Flemington precinct:&amp;nbsp;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Consultations to inform the planning of the Victoria street project between 2016 and 2021.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Community engagement to plan the overall Flemington precinct in 2022.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Holland Court project community consultations held in 2023.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Visioning engagement to inform the redevelopment of tower sites at 12 Holland Court and 120 Racecourse Road and the broader precinct held in 2024.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;We want to thank everyone that participated in these consultations.&amp;nbsp;&lt;\/strong&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Previous engagement&quot;}}],&quot;settings&quot;:{&quot;type&quot;:&quot;tabs&quot;,&quot;title&quot;:&quot;Engagement so far&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA2LTA4VDAxOjE1OjA4LjMyNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;At the end of the community consultation period, building communities will collate and analyse community feedback and produce a report. The report will summarise all community feedback received and how it has been considered and responded to.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The outcomes of consultation report will form part of the planning application that will be submitted to the Minister for Planning for approval.&lt;\/p&gt;&lt;p&gt;Please note that this consultation process will be carried out under clause 52.20 of the Moonee Valley planning scheme. This process is exempt from standard notice and appeals processes.&lt;\/p&gt;&lt;p&gt;After the outcome of the planning application has been determined, we will publish the outcomes of consultation report on this webpage and notify the community.&amp;nbsp;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Next steps&quot;}}],&quot;date_end&quot;:&quot;2026-06-07T23:59:00&quot;,&quot;region_id&quot;:null,&quot;location_name&quot;:null,&quot;location_geo&quot;:null,&quot;contact_details&quot;:[{&quot;type&quot;:&quot;phone&quot;,&quot;value&quot;:&quot;1300 870 250&quot;},{&quot;type&quot;:&quot;email&quot;,&quot;value&quot;:&quot;flemington@homes.vic.gov.au&quot;},{&quot;type&quot;:&quot;web&quot;,&quot;value&quot;:&quot;https:\/\/www.homes.vic.gov.au\/projects\/racecourse-road-flemington&quot;}],&quot;palette&quot;:null,&quot;hero_color&quot;:null,&quot;theme&quot;:&quot;default&quot;,&quot;participation_moderation_type&quot;:1,&quot;participation_default_status&quot;:4,&quot;data&quot;:{&quot;show_table_of_contents&quot;:false},&quot;visibility_restricted&quot;:false,&quot;password&quot;:null,&quot;created_at&quot;:&quot;2026-04-07T01:57:40.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-22T23:03:36.000000Z&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;deleted_at&quot;:null,&quot;report_id&quot;:5095,&quot;team_id&quot;:25,&quot;created_by_id&quot;:20430,&quot;modified_by_id&quot;:53520,&quot;followers_enabled&quot;:true,&quot;public_stages_count&quot;:3,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/raceco
