39,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}},{&quot;id&quot;:43,&quot;title&quot;:&quot;Planning&quot;,&quot;description&quot;:null,&quot;created_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-01-28T12:36:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;created_by_id&quot;:1,&quot;modified_by_id&quot;:1,&quot;model_type&quot;:&quot;tag&quot;,&quot;model_type_label&quot;:&quot;Tag&quot;,&quot;pivot&quot;:{&quot;tagables_id&quot;:1942,&quot;tag_id&quot;:43,&quot;tagables_type&quot;:&quot;App\\Models\\Project&quot;}}],&quot;team&quot;:{&quot;id&quot;:21,&quot;user_id&quot;:1,&quot;name&quot;:&quot;Department of Transport and Planning&quot;,&quot;personal_team&quot;:false,&quot;slug&quot;:&quot;department-of-transport-and-planning&quot;,&quot;landing_enabled&quot;:true,&quot;landing_theme&quot;:&quot;variant_1&quot;,&quot;slogan&quot;:&quot;Department of Transport and Planning&quot;,&quot;description&quot;:&quot;&lt;p&gt;Department of Transport and Planning plans, builds and operates an integrated, sustainable and safe transport system for Australia&#039;s fastest-growing state.&lt;\/p&gt;&quot;,&quot;blocks&quot;:null,&quot;palette&quot;:&quot;2&quot;,&quot;type&quot;:&quot;department&quot;,&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;report_id&quot;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89132,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1942,&quot;uuid&quot;:&quot;0848b8f5-4518-40e4-81a1-c71750086300&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;ACP EV Banner&quot;,&quot;file_name&quot;:&quot;acp-ev-banner_9bdb.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:152056,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:55601},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:86993,&quot;created_at&quot;:&quot;2026-04-24T04:52:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-24T04:52:12.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89132\/acp-ev-banner_9bdb.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1941,&quot;vid&quot;:351276,&quot;title&quot;:&quot;Vopak Victoria Energy Terminal Inquiry and Advisory Committee&quot;,&quot;slug&quot;:&quot;Vopak-IAC&quot;,&quot;summary&quot;:&quot;An Inquiry and Advisory Committee is collecting submissions to consider the environmental effects of the proposed Vopak Victoria Energy Terminal Link Project.&quot;,&quot;description&quot;:&quot;&lt;h2&gt;&lt;strong&gt;Overview&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;The Minister for Planning (the Minister) will appoint a joint Inquiry and Advisory Committee (IAC) to advise on the environmental effects of the proposed works for the Vopak Victoria Energy Terminal Project (the Project). The IAC is an independent group of experts tasked with this assessment.&lt;\/p&gt;&lt;p&gt;The IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;review the Environment Effects Statement (EES), draft Planning Scheme Amendment (PSA) C490ggee to the Geelong Planning Scheme, EPA development licence application and public submissions&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;hold a public Hearing to hear from the Proponent and submitters who want to speak to their written submission&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide advice to the Minister about the environmental effects of the project and the draft PSA; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;provide recommendations to inform the Environment Protection Authority\u2019s (EPA) consideration of the development licence application under the &lt;em&gt;Environment Protection Act 2017.&lt;\/em&gt;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The IAC will follow Terms of Reference approved by the Minister for Planning. The Terms of Reference will set out the IAC\u2019s scope (including what they can and can\u2019t consider). The&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45934\&quot; target=\&quot;_blank\&quot;&gt;&amp;nbsp;Terms of Reference&amp;nbsp;&lt;\/a&gt;can be found in the Document section at the bottom of this page.&lt;\/p&gt;&lt;p&gt;The IAC may also be separately appointed as a panel by the Minister for Energy and Resources under the &lt;em&gt;Pipelines Act 2005&lt;\/em&gt; to consider and advise on the pipeline licence application and submissions that relate to the pipeline licence application. If appointed as a Panel, the members must act in accordance with the requirements of the Pipelines Act and its instrument of appointment.&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Inquiry and Advisory Committee members&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC members who will consider this matter are:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Sarah Raso (Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;William (Bill) O\u2019Neil (Deputy Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sophie Osborn (Deputy Chair)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Paula Bradshaw&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Sandra Brizga&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Ian Hamm&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;You can learn more about the members by reading their &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/46745\&quot; target=\&quot;_blank\&quot;&gt;biographies&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:1,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA0LTIzVDA5OjEwOjU5LjMwNlo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:5,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;The Proposal&lt;\/strong&gt;&lt;\/h3&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;The Proposal&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Vopak Victoria Energy Terminal Project (the project) proposes building and operating a floating liquefied natural gas (LNG) import terminal in Port Phillip Bay, approximately 20 kilometres offshore and east from Avalon.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;The project involves using a&amp;nbsp;vessel&amp;nbsp;known as a Floating Storage Regasification Unit (FSRU) to receive LNG from LNG carriers and converting it into natural gas. The natural gas is then transferred to shore through an underwater and underground pipeline to a gas receiving station (GRS) for processing before it is supplied into the existing Victorian gas transmission system.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;&lt;em&gt;&amp;nbsp;&lt;\/em&gt;The key components of the project include the development of:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;An FSRU that is moored at the marine terminal receives LNG from carriers, stores it and converts it from a liquified state to a gas using an open loop process. LNG carriers would temporarily moor alongside the FSRU to transfer LNG to the FSRU. &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A marine terminal located in Port Phillip Bay that contains infrastructure to enable the FSRU to be moored and transfer LNG to the shore. &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Subsea HV cables to supply power to the FSRU would be buried below the seabed. &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A high-pressure subsea gas pipeline to convey natural gas to the shoreline. The gas pipeline crosses under the shoreline and continues wholly underground to convey gas to the gas receiving station. &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A gas receiving station, where nitrogen and odorant would be added to the natural gas to meet AEMO gas quality specification. &amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;A gas connection point between the gas receiving station and the South West Pipeline to supply natural gas to the Victorian Transmission System.\u202f&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;An electrical power supply, including underground HV power cables, a project substation and a terminal station.&amp;nbsp;&amp;nbsp;&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The marine terminal would&amp;nbsp;operate&amp;nbsp;for&amp;nbsp;a minimum of&amp;nbsp;10 years.&lt;\/p&gt;&lt;p&gt;Vopak Victoria Energy Terminal Pty Ltd (Vopak) is the Proponent.&lt;\/p&gt;&lt;p&gt;A more detailed description of the project can be found in the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45906\&quot; target=\&quot;_blank\&quot;&gt;public notice&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h5&gt;&lt;strong&gt;View the proposal&lt;\/strong&gt;&lt;\/h5&gt;&lt;p&gt;You can view and download the exhibited EES, draft PSA, EPA development licence application and pipeline licence application, and other related documents on the Proponent\u2019s website &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/victoriaenergyterminal.com.au\/ees \&quot; target=\&quot;_blank\&quot;&gt;here&lt;\/a&gt;:&lt;\/p&gt;&lt;p&gt;The&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45906\&quot; target=\&quot;_blank\&quot;&gt; public notice&lt;\/a&gt; has more information about where you can see hard copies of the Environment Effects Statement summary report in person.&lt;\/p&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDAyOjAzOjEzLjYzM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:6,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h3&gt;&lt;strong&gt;Public exhibition&lt;\/strong&gt;&lt;\/h3&gt;&lt;p&gt;The Project will be open for public exhibition for 30 business days between &lt;strong&gt;Thursday 14 May 2026 &lt;\/strong&gt;and &lt;strong&gt;11.59pm on Friday 26 June 2026&lt;\/strong&gt;.&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;You are invited to make a written submission during this time. Please use the online submission form below to send your submission.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;If you want to participate and speak at the Hearing, you must make a written submission and indicate on the submission form that you wish to be heard. The Inquiry and Advisory Committee will consider all written submissions when preparing its advice, in accordance with the scope of the IAC\u2019s Terms of Reference, whether or not a submitter chooses to speak.&lt;\/p&gt;&quot;,&quot;title&quot;:null}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTE1VDA5OjAzOjAyLjQ1N1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:8,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Directions Hearing&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The IAC will hold a Directions Hearing at &lt;strong&gt;10.00am on Monday 13 July 2026.&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;At the Directions Hearing, the IAC will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;discuss and organise arrangements for the Hearing, including the dates and format&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Hearing will be conducted and how information will be shared before the Hearing, including expert reports&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;discuss site inspections&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;consider any procedural issues&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer any questions about the IAC process, including the Hearing.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;More information about the Directions Hearing will be published here once the details are confirmed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Hearing&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Hearing will commence indicatively on&lt;em&gt; &lt;\/em&gt;&lt;strong&gt;Monday 10 August 2026&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for 3 to 4 weeks.&lt;\/p&gt;&lt;p&gt;The Hearing gives people who indicated they wanted to be heard an opportunity to speak in support of their written submission. The Proponent (Vopak) will also speak and present expert evidence at the hearing.&lt;\/p&gt;&lt;p&gt;The Hearing is open to the public, so anyone can watch.&lt;\/p&gt;&lt;p&gt;A timetable for the Hearing will be published after the Directions Hearing.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details engage-details engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Report&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;The Inquiry and Advisory Committee must prepare a report for the Minister for Planning. This report will include the Inquiry and Advisory Committee\u2019s recommendations and advice about the environmental effects of the Project and the draft PSA in accordance with the scope of the IAC\u2019s Terms of Reference. It will also provide recommendations to inform the Environment Protection Authority\u2019s (EPA) consideration of the development licence application.&lt;\/p&gt;&lt;p&gt;The Terms of Reference require the IAC to submit its report to the Minister for Planning within 30 business days after the last day of its proceedings.&lt;\/p&gt;&lt;p&gt;The Minister for Planning will use the IAC\u2019s report to inform the Minister\u2019s Assessment under the &lt;em&gt;Environment Effects Act 1978&lt;\/em&gt; of the environmental effects of the project&lt;em&gt;. &lt;\/em&gt;This Assessment will be considered by the statutory decision makers for the project.&lt;\/p&gt;&lt;p&gt;The Minister will decide if and when the Inquiry and Advisory Committee report will be made publicly available. If released, the report will be published online.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Inquiry and Advisory Committee process&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTEyVDAyOjE5OjA5LjY0OVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:9,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;You can make a written submission between &lt;strong&gt;Thursday 14 May 2026 &lt;\/strong&gt;and &lt;strong&gt;11.59pm on Friday 26 June 2026 &lt;\/strong&gt;by completing the online form below.&lt;\/p&gt;&lt;p&gt;You only need to make one submission to share all your views on the EES, draft PSA, EPA development licence application and pipeline licence application.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;Please refer to the IAC\u2019s Terms of Reference for information about the scope of its role.&lt;\/p&gt;&lt;p&gt;If you want to speak at the Hearing, make sure you tick the box when completing the online form.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission or would like to submit a hard copy, contact Planning Panels Victoria on 136 186 (select option 6) or email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;&lt;strong&gt;Privacy and Intellectual Property&lt;\/strong&gt;&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Your submission will be a public document. To make a submission, you must read the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45421\&quot; target=\&quot;_blank\&quot;&gt;Privacy Collection Statement&lt;\/a&gt; and click \u2018agree\u2019 where indicated on the online form.&lt;\/p&gt;&lt;p&gt;The Privacy Collection Statement explains how we will use your submission and any other information you provide to the IAC, which include putting it online and providing it to the Proponent, other parties to the Hearing and to the government agencies specified in the Terms of Reference.&lt;\/p&gt;&lt;p&gt;You should not include any personal information in your submission that could identify you or other people unless you (or they) are happy for that information to be made publicly available. Examples are email addresses, phone numbers or photos of people (particularly children). You should also not include any material authored by another person unless you have their consent.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Have your say - make a submission&quot;}},{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA0LTIzVDEwOjIxOjUyLjExMVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Online submission form&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;6556&quot;],&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA0LTIzVDA5OjIwOjEwLjIxM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:10,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Click the \u2018Start survey\u2019 button to make your submission.&lt;\/strong&gt;&lt;\/h4&gt;&quot;,&quot;title&quot;:null,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDYtMDRUMDM6MzM6NDIuNzY3Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Documents&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;45934&quot;,&quot;45421&quot;,&quot;45422&quot;,&quot;45906&quot;,&quot;46745&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTA4VDExOjQxOjI2Ljk5OFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:11,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;h4&gt;&lt;strong&gt;How do I make a submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to lodge my submission online?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes, please use the online form to make your submission. You can type (or copy and paste) directly into the form or upload a file as an attachment. Accepted file types include PDF, DOC, DOCX, TXT, RTF, PNG, GIF, JPG, and JPEG.&lt;\/p&gt;&lt;p&gt;Each file must be under 20MB, and the total of all files uploaded to the form must be under 40MB.&lt;\/p&gt;&lt;p&gt;If you need help lodging your submission, please email &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I make a hard copy submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Online submissions are strongly preferred. However, if you can\u2019t submit online, you can send a hard copy.&lt;\/p&gt;&lt;p&gt;A hard copy submission must be accompanied by a completed \u2018Submission Coversheet\u2019 which you can request from Planning Panels Victoria through the Customer Call Centre&lt;em&gt; &lt;\/em&gt;on 136 186 (select option 6) or by emailing &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;. The Submission Coversheet includes important information we need to process your submission, enable you to participate in the IAC process if you want to be heard, and privacy information.&lt;\/p&gt;&lt;p&gt;Make sure your submission and coversheet arrive before the exhibition period ends.&lt;\/p&gt;&lt;p&gt;Please do not email your submission directly to Planning Panels Victoria or any other party such as the Minister for Planning, the Department of Transport and Planning (DTP) Impact Assessment Unit, Department of Energy, Environment and Climate Action (DEECA) Energy Infrastructure Regulation, the EPA or the Proponent.&amp;nbsp; If you do, it may not be considered by the IAC.&amp;nbsp; Use the online submission form, or if this is not possible send a hard copy with a completed coversheet to Planning Panels Victoria.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;I might want legal support in making a submission or to help me in this EES process. What resources are available to me?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;You don\u2019t need legal support to make your submission or participate in the IAC process, however you may choose to engage a lawyer to assist you.&lt;\/p&gt;&lt;p&gt;Foley\u2019s List barristers is offering a Legal Assistance Service that offers low-cost or no-cost legal support to eligible submitters in Planning Panel Victoria hearings.\u202f Available to individuals and community groups, the service offers legal advice and representation to help participants navigate PPV processes (subject to barrister availability).&amp;nbsp; Assistance ranges from preliminary advice to full representation, with fees reduced or waived.&amp;nbsp;&amp;nbsp; \u202f\u202f&amp;nbsp;&lt;\/p&gt;&lt;p&gt;To participate, submitters must meet eligibility criteria.&amp;nbsp; More information about the Service and eligibility criteria is available on the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/www.planningpanels.vic.gov.au\/guides-and-resources\/legal-assistance-service \&quot; target=\&quot;_blank\&quot;&gt;PPV website&lt;\/a&gt;, including who you need to contact at Foley\u2019s List to apply for assistance.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit on behalf of a group or organisation?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Organisations, residents, or groups of individual submitters with similar issues are encouraged to provide a single joint submission.&lt;\/p&gt;&lt;p&gt;Correspondence to organisations and residents\u2019 groups will be directed to the nominated contact person for that group.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a petition?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Petitions will be treated as a single submission, and correspondence will only be sent to the person who organised the petition.&amp;nbsp; If the organiser is not clear, it will be the first name to appear on the petition.&lt;\/p&gt;&lt;p&gt;If you want to be contacted individually about the IAC process or want to be heard at the Hearing, you will need to make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I submit a pro-forma submission?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes.&amp;nbsp; Submissions that have substantially the same content will be treated as pro forma submissions, and pro forma submitters who want to be heard at the Hearing will be heard as a group.&amp;nbsp; If you want to be heard as an individual, you should make your own individual submission.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I need to make separate submissions on the EES, draft PSA, EPA development licence application or pipeline licence application?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;All submissions will be treated as a submission to all the exhibited documents (the EES, draft PSA EPA development licence application or pipeline licence application).&amp;nbsp; You don\u2019t need to make a separate submission on each document. You should include all your views about the project and its effects in one single submission.&amp;nbsp;&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;How will I know if my submission was received?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;After you click \u2018Submit\u2019, you\u2019ll see a message confirming it was lodged.&lt;\/p&gt;&lt;p&gt;If you want a copy of your submission, enter your email address and click \u2018Send me a copy\u2019. Check your spam\/junk folder if it doesn\u2019t arrive.&lt;\/p&gt;&lt;p&gt;If you don\u2019t receive the confirmation email, contact &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Can I request to make a submission confidentially?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;In some circumstances, you may not want your name or certain information to be published online. As detailed in the Terms of Reference, the IAC can hear submissions or accept material on a confidential basis, provided this would be fair to the Proponent and other parties to the Hearing.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;If you want your name withheld, or to provide your submission or material confidentially, you must request permission from the IAC Chair in writing through PPV and provide reasons why the IAC should treat your submissions or material confidentially.&amp;nbsp; Please contact PPV at &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt; with these requests.&lt;\/p&gt;&lt;p&gt;The IAC will consider your request and determine whether maintaining confidentiality would be fair to the Proponent and other parties.&amp;nbsp; Even where confidentiality is granted, confidential submissions will still need to be shared with the Proponent to ensure issues raised can be appropriately considered and addressed.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;What happens to my submission?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Will my submission be made public?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. All submissions are public documents and will be published on the Engage Victoria website.&lt;\/p&gt;&lt;p&gt;Your name, submission and other material you provide will be published online unless you ask PPV not to. Personal details like your address and phone number will be removed, but you should ensure you don\u2019t include these in the main part of your submission (only include your details in the online form or cover sheet).&lt;\/p&gt;&lt;p&gt;Please read the&lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/engage.vic.gov.au\/download\/document\/45421 \&quot; target=\&quot;_blank\&quot;&gt; Privacy Collection Statement &lt;\/a&gt;before submitting. Don&#039;t include information that identifies other people unless they agree.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&lt;h4&gt;&lt;strong&gt;Can I speak at the Hearing?&lt;\/strong&gt;&lt;\/h4&gt;&lt;div class=\&quot;engage-accordion engage-accordion engage-accordion\&quot;&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;Do I have to make a submission if I want to speak and participate in the Hearing?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;Yes. To speak at the Hearing, you must make a written submission during the exhibition period.&lt;\/p&gt;&lt;p&gt;Tick the box on the online form to say you want to be heard. You\u2019ll also need to tell us:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;how long you want to speak&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;who will represent you (or someone else)&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;if you will call any expert witnesses in support of your submission.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;If you do this, you will become a &#039;party&#039; to the Hearing. You will be given a timeslot to present in the Hearing timetable and advised of the arrangements for the IAC process in advance of the Directions Hearing, Hearing and through any Directions issued by the IAC.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;details class=\&quot;engage-details engage-details details\&quot;&gt;&lt;summary class=\&quot;details__summary\&quot;&gt;What if I don\u2019t want to speak?&lt;\/summary&gt;&lt;div class=\&quot;details__content\&quot;&gt;&lt;p&gt;That\u2019s fine. You don\u2019t need to speak to your written submission for it to be considered by the IAC.&lt;\/p&gt;&lt;p&gt;If you do not want to be heard, you will not be a party to the Hearing. You will receive correspondence from the IAC acknowledging your submission. However, you will not receive any further correspondence about the IAC process and may not be able to submit additional information to the IAC.&lt;\/p&gt;&lt;p&gt;You can still follow the process by checking this webpage.&lt;\/p&gt;&lt;\/div&gt;&lt;\/details&gt;&lt;\/div&gt;&quot;,&quot;title&quot;:&quot;Frequently Asked Questions&quot;}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA0LTI3VDA4OjA1OjU4LjA2NVo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:12,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;&lt;strong&gt;For questions about making a submission, the Inquiry and Advisory Committee (IAC) process or Hearing, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Planning Panels Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186 (select option 6)&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:office@planningpanels.vic.gov.au\&quot;&gt;office@planningpanels.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Vopak Victoria Energy Terminal Project and the Environment Effects Statement (EES), draft PSA, EPA development licence application and pipeline licence application documentation contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Vopak Australia Pty Ltd (Vopak)&lt;\/p&gt;&lt;p&gt;\u260e Phone: 1800 1VOPAK (1800 186 725)&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:info@vopakvicenergy.com.au\&quot;&gt;info@vopakvicenergy.com.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Website: &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/victoriaenergyterminal.com.au\/ees\&quot;&gt;https:\/\/victoriaenergyterminal.com.au\/ees&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the Minister&#039;s Assessment and Environment Effects Statement (EES) process, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Impact Assessment Unit, Department of Transport and Planning&lt;\/p&gt;&lt;p&gt;\u260e Phone: (03) 8622 7633&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:environment.assessment@transport.vic.gov.au\&quot;&gt;environment.assessment@transport.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the EPA development licence application, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Permissions, EPA Victoria&lt;\/p&gt;&lt;p&gt;\u260e Phone: 1300 372 842&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:permissioning.engagement@epa.vic.gov.au\&quot;&gt;permissioning.engagement@epa.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;For questions about the pipeline licence application, contact:&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;Pipeline Regulation, DEECA&lt;\/p&gt;&lt;p&gt;\u260e Phone: 136 186&lt;\/p&gt;&lt;p&gt;\u2709 Email: &lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:pipeline.regulation@deeca.vic.gov.au\&quot;&gt;pipeline.regulation@deeca.vic.gov.au&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Contacts&quot;}},{&quot;id&quot;:&quot;2&quot;,&quot;type&quot;:&quot;events&quot;,&quot;weight&quot;:&quot;1&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest events&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;oldest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;3&quot;,&quot;type&quot;:&quot;updates&quot;,&quot;weight&quot;:&quot;2&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Latest updates&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:  Committee on the Environment Effects Statement (EES), draft Planning Scheme Amendment, EPA development licence application and pipeline licence application.&lt;\/p&gt;&lt;p&gt;Submissions help the Inquiry and Advisory Committee (IAC) understand how the Project may affect people, communities, and the environment.&lt;\/p&gt;&lt;p&gt;Submissions must be made in writing. To make a submission, use the online submission form under the Participate tab.&lt;\/p&gt;&lt;p&gt;You must make a written submission if you want to participate in the IAC Hearing.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The IAC will consider all submissions, whether or not a submitter chooses to speak at the Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:1,&quot;date_start&quot;:&quot;Thursday 14 May 2026&quot;,&quot;date_end&quot;:&quot;11.59pm on Friday 26 June 2026&quot;,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-04-16T03:27:50.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-12T03:35:39.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1941,&quot;created_by_id&quot;:9140,&quot;modified_by_id&quot;:42373,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Vopak-IAC\/timeline\/37145&quot;,&quot;summary&quot;:&quot;The Vopak Victoria Energy Terminal Project is on public exhibition...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37175,&quot;vid&quot;:340075,&quot;title&quot;:&quot;Hearing stage: Directions Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Inquiry and Advisory Committee will hold a Directions Hearing on &lt;strong&gt;Monday 13 July 2026&lt;\/strong&gt;. At the Directions Hearing, the Inquiry and Advisory Committee will:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;confirm the dates and format of the Hearing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;give directions about how the Hearing will run&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;outline how information should be shared before the Hearing&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;answer questions about the Inquiry and Advisory Committee process, including the Hearing.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;The Directions Hearing helps make sure everyone is prepared and understands what to expect during the process and at the main Hearing.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:2,&quot;date_start&quot;:&quot;Monday 13 July 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-04-23T09:33:28.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-05-08T11:44:19.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;project_id&quot;:1941,&quot;created_by_id&quot;:19525,&quot;modified_by_id&quot;:19525,&quot;url&quot;:&quot;https:\/\/engage.vic.gov.au\/project\/Vopak-IAC\/timeline\/37175&quot;,&quot;summary&quot;:&quot;The Inquiry and Advisory Committee will hold a Directions Hearing...&quot;,&quot;model_type&quot;:&quot;stage&quot;,&quot;model_type_label&quot;:&quot;Stage&quot;},{&quot;id&quot;:37176,&quot;vid&quot;:340374,&quot;title&quot;:&quot;Hearing stage: Hearing&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Hearing will commence indicatively on&lt;em&gt; &lt;\/em&gt;&lt;strong&gt;Monday 10 August 2026&lt;\/strong&gt;. Depending on how many submitters want to speak, the Hearing may run for 3 to 4 weeks.&lt;\/p&gt;&lt;p&gt;The Hearing gives the Proponent and submitters who asked to be heard a chance to speak in support of their written submissions.&lt;\/p&gt;&quot;,&quot;status&quot;:1,&quot;weight&quot;:3,&quot;date_start&quot;:&quot;Commence indicatively on Monday 10 August 2026&quot;,&quot;date_end&quot;:null,&quot;data&quot;:[],&quot;blocks&quot;:[],&quot;seed_id&quot;:null,&quot;seed_type&quot;:null,&quot;created_at&quot;:&quot;2026-04-23T09:33:51.000000Z&quot;,&quot;updated_at&quot;:&q t;:2091,&quot;created_at&quot;:&quot;2021-12-14T02:10:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-01-13T00:18:24.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;url&quot;:&quot;\/department-of-transport-and-planning&quot;,&quot;landing_theme_class&quot;:&quot;engage-landing-theme__variant_1&quot;,&quot;palette_class&quot;:&quot;engage-palette--theme--2&quot;,&quot;model_type&quot;:&quot;team&quot;},&quot;images&quot;:[{&quot;id&quot;:89117,&quot;model_type&quot;:&quot;App\\Models\\Project&quot;,&quot;model_id&quot;:1941,&quot;uuid&quot;:&quot;4e83db34-b176-447a-90fe-1ddae069ff6d&quot;,&quot;collection_name&quot;:&quot;images&quot;,&quot;name&quot;:&quot;Vopak EES IAC - EngageVic-Pic-2&quot;,&quot;file_name&quot;:&quot;vopak-ees-iac-engagevic-pic-2_6177.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;disk&quot;:&quot;media&quot;,&quot;conversions_disk&quot;:&quot;media&quot;,&quot;size&quot;:1134837,&quot;manipulations&quot;:[],&quot;custom_properties&quot;:{&quot;user_id&quot;:19525},&quot;generated_conversions&quot;:{&quot;full&quot;:true,&quot;hero&quot;:true,&quot;logo&quot;:true,&quot;thumb&quot;:true},&quot;responsive_images&quot;:[],&quot;order_column&quot;:86982,&quot;created_at&quot;:&quot;2026-04-23T08:54:27.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-23T08:54:28.000000Z&quot;,&quot;original_url&quot;:&quot;https:\/\/engage.vic.gov.au\/storage\/media\/89117\/vopak-ees-iac-engagevic-pic-2_6177.png&quot;,&quot;preview_url&quot;:&quot;&quot;}]},{&quot;id&quot;:1951,&quot;vid&quot;:346812,&quot;title&quot;:&quot;Draft Mornington Peninsula Planning Scheme Amendment C316morn&quot;,&quot;slug&quot;:&quot;draft-mornington-peninsula-planning-scheme-amendment-c316morn&quot;,&quot;summary&quot;:&quot;Have your say on Draft Mornington Peninsula Planning Scheme Amendment C316morn&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Overview&lt;\/h2&gt;&lt;p&gt;The Minister for Planning is considering whether to prepare, approve and adopt Draft Mornington Peninsula Planning Scheme Amendment C316morn to the Mornington Peninsula Planning Scheme under section 20(4) of the Planning and Environment Act 1987.&lt;strong&gt; &lt;\/strong&gt;The draft amendment applies to land at 160 Sandy Road, Fingal (Lot 2 on Plan of Subdivision 439263T).&lt;\/p&gt;&lt;p&gt;&amp;nbsp;Consultation is being undertaken under section 20(5) of the&amp;nbsp;&lt;em&gt;Planning and Environment Act 1987&lt;\/em&gt;.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;The purpose of the consultation is to seek the views of owners and occupiers of nearby properties and relevant government agencies about Draft Mornington Peninsula Planning Scheme Amendment C316morn.&lt;\/p&gt;&lt;h3&gt;Background&lt;\/h3&gt;&lt;p&gt;The Minister for Planning has received a request from Planning Property Partners Ltd on behalf of FE St Andrews Pty Ltd for accelerated planning assessment via the Development Facilitation Program. The Development Facilitation Program&amp;nbsp;is an assessment pathway for priority projects in identified sectors to inject investment into the Victorian economy, keep people in jobs and create homes for people. All applications lodged to the DFP will be determined by the Minister for Planning or the Department of Transport and Planning under delegation.&lt;\/p&gt;&lt;h3&gt;What the draft Amendment does&lt;\/h3&gt;&lt;p&gt;&lt;strong&gt;The draft amendment seeks to &lt;\/strong&gt;apply Specific Controls Overlay \u2013 Schedule 14 and introduce an Incorporated Document&lt;em&gt;: St Andrews Beach Brewery, 160 Sandy Road, Fingal (Department of Transport and Planning, May 2026) &lt;\/em&gt;into the Mornington Peninsular Planning Scheme. &lt;em&gt;&amp;nbsp;&lt;\/em&gt;&lt;\/p&gt;&lt;p&gt;Specifically, the draft amendment proposes to make the following changes to the Mornington Peninsula Planning Scheme:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Amend Planning Scheme Map No. 35 to apply Specific Controls Overlay \u2013 Schedule 14.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 45.12 (Specific Controls Overlay) to introduce an Incorporated Document.&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Amend the Schedule to Clause 72.04 (Incorporated Documents) to introduce an Incorporated Document.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;What the draft Incorporated Document does&lt;\/h3&gt;&lt;p&gt;The Draft Incorporated Document&lt;em&gt; \u2018St Andrews Beach Brewery, 160 Sandy Road, Fingal (Department of Transport and Planning, May 2026)\u2019 &lt;\/em&gt;would facilitate the expansion of the existing St Andrews Beach Brewery, Fingal to include:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Replaces existing Planning Permit No. P16\/1112.08 for the Brewery and Primary Produce Sales on the land; &lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Use and development of the Brewery to operate as a Restaurant, Function Centre &amp;amp; Live Music Venue with extended operating hours;&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Introduction of a 10-hole Golf Course and Mini Golf Facility (Outdoor Recreation Facility);&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Introduction of 30 Group Accommodation Units; and&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;Removal of native vegetation.&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h3&gt;Consultation&lt;\/h3&gt;&lt;p&gt;Before making a decision about whether to proceed with the proposed Draft Amendment, the Minister for Planning is undertaking consultation under section 20(5) of the&amp;nbsp;&lt;em&gt;Planning and Environment Act 1987&lt;\/em&gt;&amp;nbsp;to understand the views of affected parties.&amp;nbsp;&lt;\/p&gt;&lt;p&gt;Following the consultation period, the Minister may decide to refer this matter to the Priority Projects Standing Advisory Committee for further advice before deciding about whether to prepare, adopt and approve the draft amendment. If you make a submission, you will be informed if the matter is referred to the Priority Projects Standing Advisory Committee.&amp;nbsp;&lt;\/p&gt;&lt;h3&gt;More Information&lt;\/h3&gt;&lt;p&gt;If you would like to discuss this matter further, please contact&lt;a class=\&quot;engage-link\&quot; href=\&quot;mailto:development.assessment@transport.vic.gov.au\&quot; target=\&quot;_blank\&quot;&gt; Development Assessment&lt;\/a&gt;, Department of Transport and Planning.&lt;\/p&gt;&lt;h3&gt;How to participate&lt;\/h3&gt;&lt;p&gt;Provide a submission using the survey form below&lt;\/p&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:2,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;cGFydGljaXBhdGVfbGlzdDoyMDI2LTA0LTMwVDAyOjEyOjI0LjUzNVo=&quot;,&quot;type&quot;:&quot;participate_list&quot;,&quot;weight&quot;:&quot;0&quot;,&quot;settings&quot;:{&quot;title&quot;:null,&quot;images&quot;:[],&quot;number_280&quot;:&quot;2&quot;,&quot;number_402&quot;:&quot;2&quot;,&quot;select_278&quot;:&quot;all&quot;,&quot;select_279&quot;:&quot;latest&quot;,&quot;select_400&quot;:&quot;all&quot;,&quot;select_401&quot;:&quot;latest&quot;,&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;all&quot;,&quot;limit&quot;:&quot;2&quot;}}},{&quot;id&quot;:&quot;Z3JvdXA6MjAyNi0wNS0wNlQwNTo1OTozMC41MTha&quot;,&quot;type&quot;:&quot;group&quot;,&quot;weight&quot;:4,&quot;children&quot;:[{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDUtMDZUMDU6NTk6MzIuNzE2Wg==&quot;,&quot;type&quot;:&quot;documents&quot;,&quot;weight&quot;:&quot;3&quot;,&quot;settings&quot;:{&quot;title&quot;:&quot;Amendment Documents&quot;,&quot;images&quot;:[],&quot;relationship&quot;:{&quot;sort&quot;:&quot;latest&quot;,&quot;type&quot;:&quot;custom&quot;,&quot;items&quot;:[&quot;45701&quot;,&quot;45702&quot;,&quot;45724&quot;,&quot;45725&quot;,&quot;45726&quot;,&quot;45727&quot;,&quot;45730&quot;,&quot;45749&quot;],&quot;limit&quot;:&quot;200&quot;}}},{&quot;id&quot;:&quot;ZG9jdW1lbnRzOjIwMjYtMDUtMjZUMDU6MjI6NTEuNDIwWg==&quot;,&quot;type&quot;:&q ays Road and Pattersons Road intersection in Clyde.&lt;\/p&gt;&lt;p&gt;The upgrade will replace the existing roundabout with traffic lights to improve safety.&lt;\/p&gt;&lt;img src=\&quot;https:\/\/engage.vic.gov.au\/storage\/media\/91692\/10104-bbrd-bccfw-project-overview-map-print-web_6f93.jpg\&quot; alt=\&quot;Map of the proposed intersection upgrade\&quot;&gt;&quot;,&quot;description_collapsed&quot;:false,&quot;status&quot;:1,&quot;consultation_status&quot;:2,&quot;current_stage&quot;:3,&quot;meta_tags&quot;:null,&quot;blocks&quot;:[{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTI5VDA2OjI1OjI1LjAzM1o=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:1,&quot;children&quot;:[],&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;From 8 to 31 May 2026, we asked for your views on safety, traffic flow and how you use the intersection.&lt;\/p&gt;&lt;p&gt;Thank you to everyone who took the time to provide feedback by commenting on the interactive map, taking our quick polls or chatting with the project team in person.&lt;\/p&gt;&lt;p&gt;We&#039;ll share a summary of feedback received later this year.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;Community feedback&quot;,&quot;images&quot;:[]}},{&quot;id&quot;:&quot;aHRtbDoyMDI2LTA1LTAxVDAyOjM2OjM1LjI5NFo=&quot;,&quot;type&quot;:&quot;html&quot;,&quot;weight&quot;:&quot;4&quot;,&quot;settings&quot;:{&quot;html&quot;:&quot;&lt;p&gt;For more information, visit the &lt;a class=\&quot;engage-link\&quot; href=\&quot;https:\/\/bigbuild.vic.gov.au\/projects\/roads\/berwick-cranbourne-road-clyde-five-ways-road-and-pattersons-road-intersection-upgrade\&quot; target=\&quot;_blank\&quot;&gt;Berwick-Cranbourne Road, Clyde-Five Ways Road and Pattersons Road Intersection Upgrade page&lt;\/a&gt; on Victoria\u2019s Big Build website.&lt;\/p&gt;&quot;,&quot;title&quot;:&quot;More information&quot;,&quot;images&quot;:[]}}],&quot;date_end&quot;:&quot;2026-05-31T23:59:00&quot;,&quot;region_id&quot;:8,&quot;location_name&quot;:null,&quot;loc
